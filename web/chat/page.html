<script>
  /* The workspace's colours before anything paints: the one the address asks
     for, or else the one this tab last opened. An address with an empty w asks
     for a workspace by name, in Tasu's own greys. */
  /* Light, dark, or as the device is set: chosen in Settings, kept in this browser. The page always wears one of the two, so
     the dark colours are written once; with no choice made, it follows the device, and changes with it. */
  (function(){
    const sys = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    const pick = () => { try { const t = localStorage.getItem("octopus.theme"); if (t === "light" || t === "dark") return t; } catch {} return sys && sys.matches ? "dark" : "light"; };
    document.documentElement.dataset.theme = pick();
    try { sys.addEventListener("change", () => { document.documentElement.dataset.theme = pick(); }); } catch {}
  })();
  try {
    const q = new URLSearchParams(location.search);
    const s = (q.has("w") ? q.get("w") : sessionStorage.getItem("octopus.space") || "").toLowerCase();
    if (/^[a-z0-9][a-z0-9-]{1,31}$/.test(s)) {
      document.documentElement.dataset.space = s;
      /* A workspace with a look of its own: the colours it last wore here. In the dark its page colours stay out, and its accent is
         the colour itself, which reads on a dark page. */
      const look = JSON.parse(localStorage.getItem("octopus.look." + s) || "null");
      const t = document.documentElement.dataset.theme;
      const dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      const PAGE = ["--bg", "--surface-2", "--surface-3", "--line", "--line-2", "--accent"];
      if (look) for (const k in look) if (!dark || !PAGE.includes(k)) document.documentElement.style.setProperty(k, look[k]);
      if (look && dark && look["--accent-fill"]) document.documentElement.style.setProperty("--accent", look["--accent-fill"]);
    }
  } catch {}
</script>

          <button class="side-plus" id="newBrain" type="button" title="New folder" aria-label="New folder"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
        </div>

      </section>

            </button>
