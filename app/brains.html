<title>Octopus Brains</title>
<meta name="description" content="Every public Octopus brain. Search by subject, open one to see the ideas it holds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27%23d97757%27 fill-rule=%27evenodd%27%3E%3Cpath d=%27M5 14a7 7 0 0 1 14 0q-1.75 2.7-3.5 0q-1.75 2.7-3.5 0q-1.75 2.7-3.5 0q-1.75 2.7-3.5 0ZM9.7 12a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4ZM14.3 12a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4Z%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/octopus.css">

<script>window.OCTOPUS_API = "https://uncommon-wolf-174.eu-west-1.convex.site";</script>

<style>
  main{ padding-block:40px 72px; }
  h1.hero{ font-size:clamp(27px,5vw,38px); }

  /* search */
  .find{
    display:flex; align-items:center; gap:9px; margin-top:24px; max-width:460px;
    border:1px solid var(--line-2); border-radius:10px; background:var(--surface);
    padding:0 13px; transition:border-color .15s var(--ease);
  }
  .find:focus-within{ border-color:var(--accent-fill); }
  .find svg{ width:15px; height:15px; color:var(--ink-4); flex-shrink:0; }
  .find input{
    flex:1; min-width:0; border:none; background:none; color:var(--ink);
    font:400 15px/1 var(--sans); padding:13px 0;
  }
  .find input::placeholder{ color:var(--ink-4); }
  .find button{ color:var(--ink-4); font:400 17px/1 var(--sans); padding:4px; }
  .find button:hover{ color:var(--accent); }
  .count{ margin-top:11px; font:400 11.5px/1 var(--mono); color:var(--ink-3); }

  /* the list */
  .list{ margin-top:22px; display:grid; gap:9px; }
  .row{
    border:1px solid var(--line); border-radius:11px; background:var(--surface);
    overflow:hidden; transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .row:hover{ border-color:var(--line-2); }
  .row.open{ border-color:var(--accent-line); box-shadow:var(--shadow); }
  .row > button{
    width:100%; text-align:left; padding:15px 17px;
    display:grid; grid-template-columns:1fr auto; gap:4px 14px; align-items:center;
  }
  .row .nm{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .row .nm b{ font:600 16.5px/1.3 var(--sans); letter-spacing:-.012em; color:var(--ink); }
  .tp{
    font:400 9px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase;
    padding:3px 5px; border-radius:3px; flex-shrink:0;
    color:var(--accent); background:var(--accent-soft);
  }
  .tp.person{ color:var(--ink-3); background:var(--surface-3); }
  .row .sc{
    grid-column:1; font-size:14px; line-height:1.45; color:var(--ink-3);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .row .side{
    grid-row:1 / span 2; grid-column:2; display:flex; align-items:center; gap:11px;
    font:400 10.5px/1 var(--mono); color:var(--ink-3); white-space:nowrap;
  }
  .row .chev{ font-size:9px; color:var(--ink-4); transition:transform .18s var(--ease); }
  .row.open .chev{ transform:rotate(180deg); color:var(--accent); }

  .body{ border-top:1px solid var(--line); padding:14px 17px 16px; }
  .body .full{ font-size:14.5px; line-height:1.55; color:var(--ink-2); margin-bottom:14px; }
  .body .lab{
    font:500 10px/1.6 var(--mono); letter-spacing:.07em; text-transform:uppercase;
    color:var(--ink-3); margin-bottom:6px;
  }
  .body ol{ list-style:none; }
  .body li{ padding:6px 0; border-bottom:1px solid var(--line); }
  .body li:last-child{ border-bottom:none; }
  .body .ti{ display:flex; gap:9px; align-items:baseline; }
  .body .i{ font:400 10px/1.7 var(--mono); color:var(--ink-4); flex-shrink:0; }
  .body .t{ font:500 14px/1.45 var(--sans); color:var(--ink); }
  .body .ln{ font-size:13px; line-height:1.5; color:var(--ink-3); padding-left:19px; margin-top:1px; }
  .body .none{ font-size:13.5px; color:var(--ink-3); }
  mark{ background:var(--accent-soft); color:var(--accent); border-radius:2px; padding:0 1px; }
  .state{ margin-top:22px; font-size:15px; color:var(--ink-3); }
</style>

<header class="top"><div class="wrap">
  <span class="mark"><svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M5 14a7 7 0 0 1 14 0q-1.75 2.7-3.5 0q-1.75 2.7-3.5 0q-1.75 2.7-3.5 0q-1.75 2.7-3.5 0ZM9.7 12a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4ZM14.3 12a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4Z"/></svg></span>
  <a class="wordmark" href="/" style="color:var(--ink)">Octopus</a>
  <nav class="links">
    <a href="/brains" aria-current="page">Brains</a>
    <a href="/mcp">MCP</a>
    <a href="https://github.com/jlasne/brain">Source</a>
    <a href="/chat" class="cta">Open the app</a>
  </nav>
</div></header>

<main><div class="wrap">
  <h1 class="hero">Brains you can read.</h1>
  <p class="lede">Each one covers a single subject and states what belongs in it. Open a brain to see the
    ideas it holds.</p>

  <div class="find">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
    <input id="q" type="search" placeholder="Search subjects and ideas" autocomplete="off" spellcheck="false">
    <button id="clear" hidden aria-label="Clear">&times;</button>
  </div>
  <div class="count" id="count"></div>

  <div class="list" id="list"></div>
  <p class="state" id="state" hidden></p>
</div></main>

<footer class="bot"><div class="wrap">
  <span style="margin:0">Octopus</span>
  <span id="foot">public brains only</span>
</div></footer>

<script>
  const $ = id => document.getElementById(id);
  const el = (t,c,x) => { const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; };
  const pad2 = n => String(n).padStart(2,"0");
  const esc = s => String(s??"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
  const norm = s => String(s??"").toLowerCase();

  let BRAINS = [], CONCEPTS = [], openSlug = null, query = "";

  /* Wrap every hit so the reason a row survived the filter is visible. */
  function hl(str, words){
    let out = esc(str);
    for (const w of words){
      if (!w) continue;
      out = out.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "gi"), "<mark>$1</mark>");
    }
    return out;
  }

  function matches(b, words){
    if (!words.length) return true;
    const own = CONCEPTS.filter(c => c.brain === b.slug);
    const hay = norm([b.name, b.scope, b.type,
      own.map(c => c.title + " " + (c.summaryLine||"") + " " + (c.position||"")).join(" ")].join(" "));
    return words.every(w => hay.includes(w));
  }

  function draw(){
    const words = norm(query).split(/\s+/).filter(Boolean);
    const shown = BRAINS.filter(b => matches(b, words));
    const list = $("list"); list.innerHTML = "";

    $("count").textContent = words.length
      ? `${shown.length} of ${BRAINS.length} brains`
      : `${BRAINS.length} brain${BRAINS.length===1?"":"s"}`;
    $("clear").hidden = !query;

    if (!shown.length){
      $("state").textContent = `Nothing matches "${query}". Try one word, or a subject.`;
      $("state").hidden = false;
      return;
    }
    $("state").hidden = true;

    for (const b of shown){
      const own = CONCEPTS.filter(c => c.brain === b.slug).sort((x,y)=>(x.n||0)-(y.n||0));
      const open = openSlug === b.slug;
      const row = el("div","row" + (open ? " open" : ""));

      const head = document.createElement("button");
      head.setAttribute("aria-expanded", String(open));
      const nm = el("div","nm");
      const nb = document.createElement("b"); nb.innerHTML = hl(b.name, words);
      nm.append(nb, el("span","tp "+(b.type==="person"?"person":"subject"), b.type));
      const sc = el("div","sc"); sc.innerHTML = hl(b.scope || "no scope line", words);
      const side = el("div","side");
      side.append(el("span",null,`${own.length} · ${b.sources||0}`), el("span","chev","▾"));
      head.append(nm, sc, side);
      head.title = `${own.length} concept${own.length===1?"":"s"}, ${b.sources||0} source${(b.sources||0)===1?"":"s"}`;
      head.onclick = () => { openSlug = open ? null : b.slug; draw(); };
      row.append(head);

      if (open){
        const body = el("div","body");
        const full = el("div","full"); full.innerHTML = hl(b.scope || "no scope line", words);
        body.append(full);
        body.append(el("div","lab",
          `${own.length} concept${own.length===1?"":"s"} · ${b.sources||0} source${(b.sources||0)===1?"":"s"}` +
          ((b.sources||0) < 10 ? " · small brain" : "")));
        if (!own.length) body.append(el("div","none","Nothing yet. This brain is waiting for its first source."));
        else {
          const ol = document.createElement("ol");
          own.forEach((c,i) => {
            const li = document.createElement("li");
            const ti = el("div","ti");
            const t = el("span","t"); t.innerHTML = hl(c.title, words);
            ti.append(el("span","i",pad2(c.n || i+1)), t);
            li.append(ti);
            const line = c.summaryLine || c.position || "";
            if (line){ const d = el("div","ln"); d.innerHTML = hl(line, words); li.append(d); }
            ol.append(li);
          });
          body.append(ol);
        }
        row.append(body);
      }
      list.append(row);
    }
  }

  $("q").addEventListener("input", e => { query = e.target.value; draw(); });
  $("clear").onclick = () => { query = ""; $("q").value = ""; $("q").focus(); draw(); };

  (async () => {
    try {
      const r = await fetch(window.OCTOPUS_API + "/api/public/brains");
      if (!r.ok) throw new Error("the server answered " + r.status);
      const d = await r.json();
      BRAINS = d.brains || []; CONCEPTS = d.concepts || [];
    } catch (e) {
      $("state").textContent = "The brains did not load. " + (e.message || "no answer") + ". Reload in a moment.";
      $("state").hidden = false;
      return;
    }
    if (!BRAINS.length){
      $("state").textContent = "Every brain is private right now, so this list is empty.";
      $("state").hidden = false;
      return;
    }
    const sources = BRAINS.reduce((n,b) => n + (b.sources||0), 0);
    $("foot").textContent = `${BRAINS.length} brains · ${CONCEPTS.length} concepts · ${sources} sources`;
    draw();
  })();
</script>
