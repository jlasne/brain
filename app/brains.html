<title>Octopus Brains</title>
<meta name="description" content="Every public Octopus brain. Search by subject, open one to see the ideas it holds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27%23d97757%27 fill-rule=%27evenodd%27%3E%3Cpath d=%27M5 14a7 7 0 0 1 14 0q-1.75 2.7-3.5 0q-1.75 2.7-3.5 0q-1.75 2.7-3.5 0q-1.75 2.7-3.5 0ZM9.7 12a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4ZM14.3 12a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4Z%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/octopus.css">

<script>window.OCTOPUS_API = "https://uncommon-wolf-174.eu-west-1.convex.site";</script>

<style>
  main{ padding-block:36px 72px; }
  .wrap{ max-width:1040px; }
  h1.hero{ font-size:clamp(26px,4.6vw,36px); }
  .tally{
    margin-top:10px; font:400 13px/1.6 var(--mono); color:var(--ink-3);
  }
  .tally b{ color:var(--accent); font-weight:500; }

  /* search */
  .find{
    display:flex; align-items:center; gap:9px; margin-top:20px; max-width:420px;
    border:1px solid var(--line-2); border-radius:10px; background:var(--surface);
    padding:0 12px; transition:border-color .15s var(--ease);
  }
  .find:focus-within{ border-color:var(--accent-fill); }
  .find svg{ width:14px; height:14px; color:var(--ink-4); flex-shrink:0; }
  .find input{
    flex:1; min-width:0; border:none; background:none; color:var(--ink);
    font:400 14.5px/1 var(--sans); padding:11px 0;
  }
  .find input::placeholder{ color:var(--ink-4); }
  .find button{ color:var(--ink-4); font:400 17px/1 var(--sans); padding:4px; }
  .find button:hover{ color:var(--accent); }

  /* the dense grid */
  .grid2{
    margin-top:18px; display:grid; gap:8px;
    grid-template-columns:repeat(auto-fill,minmax(212px,1fr));
  }
  .tile{
    display:flex; align-items:center; gap:11px; text-align:left; width:100%;
    border:1px solid var(--line); border-radius:10px; background:var(--surface);
    padding:11px 12px;
    transition:border-color .14s var(--ease), background .14s var(--ease), transform .14s var(--ease);
  }
  .tile:hover{ border-color:var(--accent-line); transform:translateY(-1px); }
  .tile.on{ border-color:var(--accent-fill); background:var(--accent-soft); }
  .glyph{
    width:34px; height:34px; border-radius:8px; flex-shrink:0;
    display:grid; place-items:center;
    font:600 15px/1 var(--sans); color:var(--accent); background:var(--accent-soft);
  }
  .tile.on .glyph{ background:var(--surface); }
  .tile .txt{ min-width:0; }
  .tile .nm{
    font:600 14.5px/1.3 var(--sans); letter-spacing:-.01em; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .tile .mt{ margin-top:3px; font:400 10.5px/1.3 var(--mono); color:var(--ink-3); }
  .tile .mt .op{ color:var(--good); }
  .tile .mt .sm{ color:var(--accent); }

  /* the panel that opens under the grid */
  .panel{
    margin-top:16px; border:1px solid var(--accent-line); border-radius:12px;
    background:var(--surface); box-shadow:var(--shadow); overflow:hidden;
  }
  .panel .ph{ padding:16px 18px 14px; border-bottom:1px solid var(--line); }
  .panel .ph .r1{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .panel .ph h2{ margin:0; font:600 19px/1.25 var(--sans); letter-spacing:-.018em; color:var(--ink); }
  .tp{
    font:400 9px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase;
    padding:3px 5px; border-radius:3px; flex-shrink:0;
    color:var(--accent); background:var(--accent-soft);
  }
  .tp.person{ color:var(--ink-3); background:var(--surface-3); }
  .tp.feed{ color:var(--good); background:rgba(63,125,92,.12); }
  .panel .ph .close{ margin-left:auto; color:var(--ink-3); font:400 19px/1 var(--sans); }
  .panel .ph .close:hover{ color:var(--accent); }
  .panel .ph .sc{ margin-top:9px; font-size:14.5px; line-height:1.55; color:var(--ink-2); max-width:70ch; }
  .panel .ph .ct{ margin-top:10px; font:400 10.5px/1 var(--mono); color:var(--ink-3); }
  .panel .pb{ padding:12px 18px 16px; }
  .panel .lab{
    font:500 10px/1.6 var(--mono); letter-spacing:.07em; text-transform:uppercase;
    color:var(--ink-3); margin-bottom:6px;
  }
  .panel ol{ list-style:none; }
  .panel li{ padding:7px 0; border-bottom:1px solid var(--line); }
  .panel li:last-child{ border-bottom:none; }
  .panel .ti{ display:flex; gap:9px; align-items:baseline; }
  .panel .i{ font:400 10px/1.7 var(--mono); color:var(--ink-4); flex-shrink:0; }
  .panel .t{ font:500 14.5px/1.45 var(--sans); color:var(--ink); }
  .panel .ln{ font-size:13.5px; line-height:1.5; color:var(--ink-3); padding-left:19px; margin-top:1px; }
  .panel .none{ font-size:13.5px; color:var(--ink-3); }

  mark{ background:var(--accent-soft); color:var(--accent); border-radius:2px; padding:0 1px; }
  .state{ margin-top:20px; font-size:15px; color:var(--ink-3); }
  footer.bot .wrap{ justify-content:space-between; }
</style>

<header class="top"><div class="wrap">
  <span class="mark"><svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M5 14a7 7 0 0 1 14 0q-1.75 2.7-3.5 0q-1.75 2.7-3.5 0q-1.75 2.7-3.5 0q-1.75 2.7-3.5 0ZM9.7 12a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4ZM14.3 12a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4Z"/></svg></span>
  <a class="wordmark" href="/" style="color:var(--ink)">Octopus</a>
  <nav class="links">
    <a href="/brains" aria-current="page">Brains</a>
    <a href="/mcp">MCP</a>
    <a href="/chat" class="cta">Open the app</a>
  </nav>
</div></header>

<main><div class="wrap">
  <h1 class="hero">Specialised knowledge, published.</h1>
  <div class="tally" id="tally">loading</div>

  <div class="find">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
    <input id="q" type="search" placeholder="Search subjects and ideas" autocomplete="off" spellcheck="false">
    <button id="clear" hidden aria-label="Clear">&times;</button>
  </div>

  <div class="grid2" id="grid"></div>
  <div id="slot"></div>
  <p class="state" id="state" hidden></p>
</div></main>

<footer class="bot"><div class="wrap">
  <span style="margin:0">Octopus</span>
  <span id="foot">public brains only</span>
</div></footer>

<script>
  const $ = id => document.getElementById(id);
  const el = (t,c,x) => { const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; };
  const pad2 = n => String(n).padStart(2,"0");
  const esc = s => String(s??"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
  const norm = s => String(s??"").toLowerCase();

  let BRAINS = [], CONCEPTS = [], openSlug = null, query = "";

  /* Mark the hits, so the reason a tile survived the filter is visible. */
  function hl(str, words){
    let out = esc(str);
    for (const w of words){
      if (!w) continue;
      out = out.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "gi"), "<mark>$1</mark>");
    }
    return out;
  }

  const own = slug => CONCEPTS.filter(c => c.brain === slug).sort((x,y)=>(x.n||0)-(y.n||0));

  function matches(b, words){
    if (!words.length) return true;
    const hay = norm([b.name, b.scope, b.type,
      own(b.slug).map(c => `${c.title} ${c.summaryLine||""} ${c.position||""}`).join(" ")].join(" "));
    return words.every(w => hay.includes(w));
  }

  function panel(b, words){
    const cs = own(b.slug);
    const p = el("div","panel");
    const h = el("div","ph");
    const r1 = el("div","r1");
    const h2 = document.createElement("h2"); h2.innerHTML = hl(b.name, words);
    r1.append(h2, el("span","tp "+(b.type==="person"?"person":"subject"), b.type));
    if (b.open) r1.append(el("span","tp feed","anyone can feed"));
    const x = el("button","close","\u00d7"); x.setAttribute("aria-label","Close");
    x.onclick = () => { openSlug = null; draw(); };
    r1.append(x);
    const sc = el("div","sc"); sc.innerHTML = hl(b.scope || "no scope line", words);
    h.append(r1, sc);
    h.append(el("div","ct",
      `${cs.length} concept${cs.length===1?"":"s"} · ${b.sources||0} source${(b.sources||0)===1?"":"s"}` +
      ((b.sources||0) < 10 ? " · small brain" : "")));
    p.append(h);

    const pb = el("div","pb");
    pb.append(el("div","lab","What it holds"));
    if (!cs.length) pb.append(el("div","none","Nothing yet. This brain is waiting for its first source."));
    else {
      const ol = document.createElement("ol");
      cs.forEach((c,i) => {
        const li = document.createElement("li");
        const ti = el("div","ti");
        const t = el("span","t"); t.innerHTML = hl(c.title, words);
        ti.append(el("span","i",pad2(c.n || i+1)), t);
        li.append(ti);
        const line = c.summaryLine || c.position || "";
        if (line){ const d = el("div","ln"); d.innerHTML = hl(line, words); li.append(d); }
        ol.append(li);
      });
      pb.append(ol);
    }
    p.append(pb);
    return p;
  }

  function draw(){
    const words = norm(query).split(/\s+/).filter(Boolean);
    const shown = BRAINS.filter(b => matches(b, words));
    const grid = $("grid"), slot = $("slot");
    grid.innerHTML = ""; slot.innerHTML = "";
    $("clear").hidden = !query;

    const ideas = CONCEPTS.length;
    const sources = BRAINS.reduce((n,b) => n + (b.sources||0), 0);
    $("tally").innerHTML = words.length
      ? `<b>${shown.length}</b> of ${BRAINS.length} brains match`
      : `<b>${ideas}</b> ideas · <b>${sources}</b> sources read · across <b>${BRAINS.length}</b> brains`;

    if (!shown.length){
      $("state").textContent = `Nothing matches "${query}". Try one word, or a subject.`;
      $("state").hidden = false;
      return;
    }
    $("state").hidden = true;

    /* A closed tile carries three facts. Everything else waits for a click. */
    for (const b of shown){
      const cs = own(b.slug);
      const t = document.createElement("button");
      t.className = "tile" + (openSlug === b.slug ? " on" : "");
      t.append(el("div","glyph",(b.name||"?").trim().charAt(0).toUpperCase()));
      const txt = el("div","txt");
      const nm = el("div","nm"); nm.innerHTML = hl(b.name, words);
      const mt = el("div","mt");
      mt.append(el("span",null,`${cs.length} idea${cs.length===1?"":"s"} · `));
      mt.append(el("span",(b.sources||0) < 10 ? "sm" : null, `${b.sources||0} source${(b.sources||0)===1?"":"s"}`));
      if (b.open) mt.append(el("span","op"," · open"));
      txt.append(nm, mt);
      t.append(txt);
      t.title = b.scope || "";
      t.onclick = () => { openSlug = openSlug === b.slug ? null : b.slug; draw(); };
      grid.append(t);
    }

    const sel = shown.find(b => b.slug === openSlug);
    if (sel) slot.append(panel(sel, words));
  }

  $("q").addEventListener("input", e => { query = e.target.value; draw(); });
  $("clear").onclick = () => { query = ""; $("q").value = ""; $("q").focus(); draw(); };

  (async () => {
    try {
      const r = await fetch(window.OCTOPUS_API + "/api/public/brains");
      if (!r.ok) throw new Error("the server answered " + r.status);
      const d = await r.json();
      BRAINS = d.brains || []; CONCEPTS = d.concepts || [];
    } catch (e) {
      $("tally").textContent = "";
      $("state").textContent = "The brains did not load. " + (e.message || "no answer") + ". Reload in a moment.";
      $("state").hidden = false;
      return;
    }
    if (!BRAINS.length){
      $("tally").textContent = "";
      $("state").textContent = "No brains exist yet.";
      $("state").hidden = false;
      return;
    }
    $("foot").textContent = `${BRAINS.length} brains, all readable`;
    draw();
  })();
</script>
