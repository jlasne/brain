              <button data-v="educational" role="radio" title="Educational: terms defined, mechanism built, one worked example" aria-label="Educational">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5C5.5 4 8.5 4 12 6c3.5-2 6.5-2 9-.5V19c-2.5-1.5-5.5-1.5-9 .5-3.5-2-6.5-2-9-.5z"/><path d="M12 6v13.5"/></svg><span>Educational</span></button>
              <button data-v="learning" role="radio" title="Learning: no answer given, steps and hints to reach it yourself" aria-label="Learning">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.1V16h5v-.1c0-.8.4-1.6 1.1-2.1A6 6 0 0 0 12 3z"/></svg><span>Learning</span></button>
            </div>
          </div>
          <button class="fresh" id="memBtn" hidden title="Paste or drop what another assistant knows about you">Add memory</button>
          <button class="fresh" id="freshBtn" hidden title="Keep this chat in the list and start a new one">New chat</button>
        </div>
        <div class="box">
          <!-- A drop is two things: where it comes from, and what it says. They
               were one box, and a link pasted alone read as a source with no
               content. Named separately, each one says what it wants. -->
          <div class="dropsrc" id="srcLine" hidden>
            <label for="srcInput">Source</label>
            <input id="srcInput" type="text" autocomplete="off" spellcheck="false"
                   placeholder="The link, or where it comes from">
          </div>
          <textarea id="input" rows="1" placeholder="Ask anything your folders have read."></textarea>
          <input type="file" id="fileIn" hidden
                 accept=".pdf,.txt,.md,.markdown,.text,.docx,application/pdf,text/plain,text/markdown,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
          <div class="tbar">
            <span class="t" id="tHint"></span>
            <div class="tools">
              <button class="paste" id="fileBtn" hidden title="Read a PDF, a Word file or a text file into the content">+ document</button>
            </div>
            <button class="mic" id="micBtn" type="button" aria-label="Talk" aria-pressed="false" title="Talk instead of typing">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="1.75" width="5" height="8" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2"/></svg>
            </button>
            <button class="send" id="send" disabled aria-label="Send">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M8 3L4 7M8 3l4 4"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="foot-note" id="footNote"></div>
    </div>
  </main>
</div>
<script>
(() => {
"use strict";

const API = window.OCTOPUS_API;
const TOKEN_KEY = "octopus.token.v1";
/* A workspace's own model key, in a workspace made on the visitor's key. It
   is kept in this browser, one per workspace, until Sign out forgets it. It
   travels only with the calls that spend a model, and the server keeps no
   copy of it. */
const MODEL_CALLS = new Set(["/api/ask", "/api/onepager", "/api/personal/remember", "/api/conflicts", "/api/conflicts/settle",
  "/api/drop/read", "/api/drop/plan", "/api/drop/merge", "/api/drop/settle"]);

const S = {
  token: null, brains: [], concepts: [], sources: [], model: "", pick: "",
  mode: "ask", scope: "all", into: [], busy: false, pendingCard: null, chunk: 18000,
  /* The folders ticked in the side panel to chat in. None asks them all. */
  picks: [],
  /* Full lists every folder in the side panel; limited, the default, shows
     Chats and Projects only. The workspace's choice, from Settings. */
  full: false,
  /* The last few turns of the current thread. It travels with each question so
     a follow-up means something, and it is never written down: closing the tab
     ends it. */
  thread: [],
  /* The saved conversations, and the one on screen. Each question joins it. */
  chats: [], chatId: null,
  /* Each brain's health out of 10, and the concepts with an open conflict. */
  health: {}, conflicted: new Set(),
  /* The demo, or a workspace on the visitor's own key. */
  demo: false, byok: false,
  /* The workspace's own look, as saved, and the logo on the page now. */
  brand: null, logo: null,
  level: "normal",
  /* Which space this session reads, and what it calls itself. The passphrase at
     the door decided it, and the app only reports it. */
  space: document.documentElement.dataset.space || "", spaceName: "Brain",
};

/* The level is a per-browser convenience, so a blocked or cleared store just
   falls back to normal. */
const LEVELS = ["normal","educational","learning"];
try { const v = localStorage.getItem("octopus.level"); if (LEVELS.includes(v)) S.level = v; } catch {}
const saveLevel = () => { try { localStorage.setItem("octopus.level", S.level); } catch {} };

/* The model this browser asks for. Empty means the one the server runs. Your
   key pays for it, so the choice sits with whoever holds the key. */
const PICK_KEY = "octopus.model";
try { S.pick = localStorage.getItem(PICK_KEY) || ""; } catch {}
const savePick = () => { try { S.pick ? localStorage.setItem(PICK_KEY, S.pick) : localStorage.removeItem(PICK_KEY); } catch {} };

/* Folded nav, remembered. A blocked store just leaves it open. */
let navOpen = true;
try { navOpen = localStorage.getItem("octopus.nav") !== "closed"; } catch {}
function paintNav(){
  $("app").classList.toggle("nav-closed", !navOpen);
  try { localStorage.setItem("octopus.nav", navOpen ? "open" : "closed"); } catch {}
}


const $ = id => document.getElementById(id);
const el = (t,c,txt) => { const n=document.createElement(t); if(c)n.className=c; if(txt!=null)n.textContent=txt; return n; };
const esc = s => String(s??"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const slug = s => String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48)||"item";
/** A short fingerprint of a text. */
const fnv = t => {
  let h = 0x811c9dc5;
  for (let i = 0; i < t.length; i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(36);
};
/* A concept's id. A long title keeps its first 41 characters and a short
   hash of the rest, so two ideas that open the same way stay two concepts.
   Same rule as the server's conceptSlug. */
const conceptSlug = t => {
  const full = String(t ?? "").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "item";
  if (full.length <= 48) return full;
  let h = 0x811c9dc5;
  for (let i = 0; i < full.length; i++){ h ^= full.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return `${full.slice(0, 41).replace(/-+$/,"")}-${h.toString(36).padStart(6,"0").slice(-6)}`;
};
const pad2 = n => String(n).padStart(2,"0");
const today = () => new Date().toISOString().slice(0,10);
const rich = t => esc(t).split(/\n{2,}/).map(p =>
  "<p>" + p.replace(/\n/g,"<br>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>") + "</p>").join("");

/* every call to the server goes through here, carrying the session token */
async function api(path, body = {}) {
  let r;
  const ctl = new AbortController();
  const cap = setTimeout(() => ctl.abort(), 180000);   // a read can think for a while
  try {
    r = await fetch(API + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: S.token, ...(S.pick && !S.demo ? { model: S.pick } : {}),
        ...(S.byok && MODEL_CALLS.has(path) && myKey() ? { key: myKey() } : {}), ...body }),
      signal: ctl.signal,
    });
  } catch (e) {
    throw new Error(e?.name === "AbortError"
      ? "That call ran past 3 minutes with no answer. Try a shorter source."
      : "The server did not answer. Check your connection.");
  } finally { clearTimeout(cap); }
  if (r.status === 401) {
    sessionStorage.removeItem(TOKEN_KEY);
    location.replace("/chat?w=" + encodeURIComponent(S.space || "")); throw new Error("locked");
  }
  const d = await r.json().catch(() => ({ error: "the server sent something unreadable" }));
  if (d.error) throw new Error(d.error);
  return d;
}

/**
 * A call that writes nothing, tried up to three times.
 *
 * Reading and planning a long document is about 40 calls. One busy model or
 * one dropped connection among them used to throw the whole reading away.
 */
/**
 * The model ran out of time on a job this big. The same call again runs out
 * the same way, so the caller splits the job in two instead of retrying it.
 */
const tooBig = e => /still\s(thinking|writing)|sent nothing for|too big for one call|cut off by the token budget|ran past 3 minutes/i
  .test(String(e?.message || ""));

async function apiRetry(path, body = {}, opts = {}){
  for (let n = 1; ; n++){
    try { return await api(path, body); }
    catch (e) {
      /* A job too big for one call goes back to be split, not sent again. */
      if (opts.split && tooBig(e)) throw e;
      const passing = /did not answer|unreachable|ran past|timed out|still\s(thinking|writing)|429|rate limit|overloaded|busy|50[0-9]|temporar|unreadable|cut off/i
        .test(e.message);
      if (!passing || n >= 3 || e.message === "locked") throw e;
      await new Promise(ok => setTimeout(ok, n * 2500));
    }
  }
}

/* ============ the gate ============ */
const MARK = document.querySelector(".brand .mark").innerHTML;

const SPACE_KEY = "octopus.space";
const KNOWN_NAMES = { octopus: "Octopus", squidgy: "Squidgy", demo: "Demo" };
const titleCase = slug => slug.split("-").filter(Boolean).map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(" ");
const cap = t => String(t || "").charAt(0).toUpperCase() + String(t || "").slice(1);

/**
 * The workspace this address asks for: /chat?w=octopus. An empty w asks for
 * one by name. With no w at all the tab keeps what it holds, so null.
 */
function askedSpace(){
  let q;
  try { q = new URLSearchParams(location.search); } catch { return null; }
  if (!q.has("w")) return null;
  const w = (q.get("w") || "").trim().toLowerCase();
  return /^[a-z0-9][a-z0-9-]{1,31}$/.test(w) ? w : "";
}

/** A call made before there is a session: the passphrase, or the demo. */
async function openCall(path, body = {}){
  let r;
  try {
    r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  } catch { throw new Error("The server did not answer. Check your connection."); }
  const d = await r.json().catch(() => ({ error: "the server sent something unreadable" }));
  if (d.error) throw new Error(cap(d.error));
  return d;
}

/**
 * The passphrase, on top of the workspace.
 *
 * The page paints the workspace the address names, in its own colours and
 * mark, blurred, with one card over it: the passphrase, or the name and the
 * passphrase for a workspace made on the landing. The demo needs neither and
 * opens straight away.
 */
function gateScreen(w, st = {}){
  if (w) { S.space = w; S.spaceName = KNOWN_NAMES[w] || titleCase(w); paintSpace(); renderZero(); }
  if (w === "demo") { demoDoor(st); return; }
  $("app").classList.add("locked");
  /* Only the owner's two doors report whether they have a passphrase yet. */
  const shut = !!w && st.gates && st.gates[w] === false;
  const veil = el("div", "veil gate-veil");
  veil.innerHTML = `
    <form class="sheet wsgate" id="wsGate" role="dialog" aria-modal="true" aria-labelledby="gateH" novalidate>
      <header>
        <img class="gmk" id="gateMark" src="${esc(markOf())}" alt="">
        <h3 id="gateH">${w ? esc(S.spaceName) : "Open your workspace"}</h3>
        <p>${w ? "Enter the passphrase to open this workspace." : "The name and the passphrase you chose when you made it."}</p>
      </header>
      <div class="f">
        ${w ? `<input type="text" name="username" autocomplete="username" value="${esc(w)}" hidden>`
            : `<label for="gName">Workspace name</label><input id="gName" autocomplete="username" maxlength="60" spellcheck="false"><div style="height:14px"></div>`}
        <label for="gPass">Passphrase</label>
        <input id="gPass" type="password" autocomplete="current-password" spellcheck="false">
        <p class="hint gmsg" id="gMsg" role="alert">${shut ? "Shut until its owner sets a passphrase." : ""}</p>
      </div>
      <footer><a class="ghost" href="/">All workspaces</a><button class="go" id="gGo" type="submit">Enter</button></footer>
    </form>`;
  document.body.append(veil);
  if (w) openCall("/api/brand/public", { space: w }).then(r => {
    if (r.name) { S.spaceName = r.name; veil.querySelector("#gateH").textContent = r.name; }
    applyLook(r.brand || null);
  }).catch(() => {});
  const pass = veil.querySelector("#gPass"), name = veil.querySelector("#gName");
  const msg = veil.querySelector("#gMsg"), go = veil.querySelector("#gGo");
  setTimeout(() => (name || pass).focus(), 60);
  veil.querySelector("form").addEventListener("submit", async ev => {
    ev.preventDefault();
    if (name && name.value.trim().length < 2) { msg.textContent = "Type the workspace's name."; name.focus(); return; }
    if (pass.value.length < 8) { msg.textContent = "A passphrase runs 8 characters or more."; pass.focus(); return; }
    go.disabled = true; msg.textContent = "Checking";
    let d;
    try { d = await openCall("/api/unlock", name ? { name: name.value.trim(), pass: pass.value } : { space: w, pass: pass.value }); }
    catch (e) { go.disabled = false; pass.value = ""; pass.focus(); msg.textContent = e.message; return; }
    sessionStorage.setItem(TOKEN_KEY, d.token);
    S.token = d.token;
    veil.remove(); $("app").classList.remove("locked");
    try { await open(); } catch (e) { deadScreen(e.message); }
  });
}

/** The demo, from its own address: a fresh visitor session, no passphrase. */
async function demoDoor(st){
  try {
    if (st.demo === false) throw new Error("The demo opens soon.");
    const d = await openCall("/api/demo");
    sessionStorage.setItem(TOKEN_KEY, d.token);
    S.token = d.token;
    await open();
  } catch (e) { deadScreen(e.message); }
}

/** Same modal shape when the deployment itself is unreachable. */
function deadScreen(why) {
  $("app").classList.add("locked");
  const veil = el("div","veil");
  veil.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <header>
        <div class="mk" aria-hidden="true">${MARK}</div>
        <h3>The server is not answering</h3>
        <p>Octopus reaches a Convex deployment for every read and every model call. This one stayed quiet.</p>
      </header>
      <div class="f"><div class="closest" style="margin:0"><b>What came back</b><div>${esc(why)}</div></div></div>
      <footer><button class="go" id="again">Try again</button></footer>
    </div>`;
  document.body.append(veil);
  veil.querySelector("#again").onclick = () => location.reload();
}

/* ============ boot ============ */
(async () => {
  render(); sizeBox();                       // the shell paints straight away
  const w = askedSpace(), held = sessionStorage.getItem(SPACE_KEY) || "";
  if (S.space) { S.spaceName = KNOWN_NAMES[S.space] || titleCase(S.space); paintSpace(); }
  let saved = sessionStorage.getItem(TOKEN_KEY);
  /* An address that names another workspace than the one this tab holds
     opens that one, behind its own passphrase. */
  if (saved && w !== null && w !== held) {
    sessionStorage.removeItem(TOKEN_KEY); saved = null;
  }
  if (saved) {
    S.token = saved;
    try { await open(); return; }
    catch (_) {
      sessionStorage.removeItem(TOKEN_KEY);
      S.token = null;
    }
  }
  /* A reachability probe first, so an unreachable deployment says so rather
     than asking for a passphrase it cannot check. */
  let st;
  try { st = await api("/api/status"); }
  catch (e) { deadScreen(e.message); return; }
  gateScreen(w ?? (S.space || ""), st);
})();

async function open(){ await refresh(); sizeBox(); $("input").focus(); }

async function refresh(){
  const d = await api("/api/state");
  S.brains = d.brains || []; S.concepts = d.concepts || []; S.sources = d.sources || [];
  S.model = d.model || ""; S.chunk = d.chunk || 18000;
  if (d.space){ S.space = d.space; S.spaceName = d.spaceName || d.space; paintSpace(); }
  S.demo = !!d.demo; S.byok = !!d.byok;
  S.full = d.full === true;
  /* Limited has no folder list to tick, so a question reads all of them or the one picked below. */
  if (!S.full && S.picks.length > 1) setPicks([]);
  applyLook(d.brand || null);
  paintWorkspace();
  render();
  /* The rings and the chat list follow, so the brains never wait on them. */
  loadHealth(); loadChats();
}

/** Each brain's health, then the rings repaint, and an open map with them. */
var mapRepaint = null;
async function loadHealth(){
  try {
    const d = await api("/api/health");
    S.health = Object.fromEntries((d.health || []).map(h => [h.slug, h]));
    S.conflicted = new Set(d.conflicted || []);
  } catch { return; }
  renderSide();
  if (mapRepaint) mapRepaint();
}
async function loadChats(){
  try { S.chats = (await api("/api/chats")).chats || []; } catch { return; }
  renderChats();
}

/* ============ render ============ */
const conceptsOf = b => S.concepts.filter(c => c.brain === b).sort((x,y)=>(x.n||0)-(y.n||0));
const sourcesOf  = b => S.sources.filter(s => (s.brains||[]).includes(b));

function render(){ renderSide(); renderScope(); renderComposer(); renderZero(); }

/**
 * Which space this is, said once and shown everywhere.
 *
 * The attribute on <html> carries the tint, so one line retints every button and
 * rule in the app. The name and the mark follow it. A mark with no file yet
 * leaves the Octopus one in place rather than a gap.
 */
/* ============ a workspace's own look ============ */
/**
 * A logo and two colours, set in Setup. The accent paints what the brand
 * colour paints; its text and button shades are derived from it, darkened
 * toward the night navy until they read at 4.5:1. The page colour is kept
 * light, so every text colour on it still reads.
 */
const LOOK_VARS = ["--bg", "--surface-2", "--surface-3", "--line", "--line-2", "--accent", "--accent-fill", "--accent-solid",
  "--accent-on", "--accent-soft", "--accent-line", "--mark"];
const NAVY = [5, 11, 22], WHITE = [255, 255, 255];
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgbHex = c => "#" + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
const cssRgb = t => { const m = String(t).match(/\d+(\.\d+)?/g); return m && m.length >= 3 ? m.slice(0, 3).map(Number) : null; };
const toRgb = t => /^\s*#[0-9a-f]{6}\s*$/i.test(t) ? hexRgb(t.trim()) : cssRgb(t);
const luma = c => { const [r, g, b] = c.map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; };
const ratio = (a, b) => { const x = luma(a), y = luma(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const mixRgb = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
function darkenTo(c, on, want){ let x = c; for (let t = .04; t <= 1 && ratio(x, on) < want; t += .04) x = mixRgb(c, NAVY, t); return x; }
function lightenTo(c, min){ let x = c; for (let t = .02; t <= 1 && luma(x) < min; t += .02) x = mixRgb(c, WHITE, t); return x; }

/** The CSS variables a look sets, measured against the page it lands on. */
function lookVars(look){
  const v = {};
  if (!look) return v;
  const page = look.bg ? lightenTo(hexRgb(look.bg), .78)
    : toRgb(getComputedStyle(document.documentElement).getPropertyValue("--bg")) || [245, 245, 245];
  const side = mixRgb(page, NAVY, .06);
  if (look.bg) Object.assign(v, { "--bg": rgbHex(page), "--surface-2": rgbHex(side), "--surface-3": rgbHex(mixRgb(page, NAVY, .11)),
    "--line": rgbHex(mixRgb(page, NAVY, .09)), "--line-2": rgbHex(mixRgb(page, NAVY, .19)) });
  if (look.accent) {
    const a = hexRgb(look.accent);
    Object.assign(v, { "--accent-fill": rgbHex(a), "--accent-solid": rgbHex(darkenTo(a, WHITE, 4.5)), "--accent-on": "#ffffff",
      "--accent": rgbHex(darkenTo(a, side, 4.5)), "--accent-soft": `rgba(${a.join(",")},.12)`, "--accent-line": `rgba(${a.join(",")},.40)` });
  }
  if (look.logo) v["--mark"] = `url("${look.logo}")`;
  return v;
}

/**
 * Wear a look, or the workspace's default with none. A preview is not kept;
 * a saved look is remembered in this browser, so the next visit paints in it.
 */
function applyLook(look, opts = {}){
  const root = document.documentElement;
  for (const k of LOOK_VARS) root.style.removeProperty(k);
  if (!opts.preview) S.brand = look || null;
  const vars = lookVars(look);
  for (const [k, val] of Object.entries(vars)) root.style.setProperty(k, val);
  root.dataset.logo = look?.logo ? "1" : "";
  S.logo = look?.logo || null;
  if (!opts.preview) {
    try { Object.keys(vars).length ? localStorage.setItem("octopus.look." + S.space, JSON.stringify(vars)) : localStorage.removeItem("octopus.look." + S.space); } catch {}
  }
  paintSpace();
  renderZero();
}

/** A picked file, drawn onto 128 pixels a side and kept as a PNG. */
async function toLogo(file){
  if (!file) throw new Error("No file was picked.");
  if (file.size > 5e6) throw new Error("That image is over 5 MB. Pick a smaller one.");
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("That file is not an image this browser can read.")); i.src = url; });
    const side = 128, c = document.createElement("canvas");
    c.width = c.height = side;
    const w0 = img.naturalWidth || side, h0 = img.naturalHeight || side, k = Math.min(side / w0, side / h0);
    c.getContext("2d").drawImage(img, (side - w0 * k) / 2, (side - h0 * k) / 2, w0 * k, h0 * k);
    const out = c.toDataURL("image/png");
    if (out.length > 200000) throw new Error("That logo holds too much detail to keep. Try a simpler one.");
    return out;
  } finally { URL.revokeObjectURL(url); }
}

/** The workspace's mark: its own logo, the octopus, the dog's head, or Brain's. */
function markOf(){
  if (S.logo) return S.logo;
  return S.space === "octopus" ? "/brand/logo-mark.png" : S.space === "squidgy" ? "/brand/squidgy-icon.png" : "/brand/brain.svg";
}

function paintSpace(){

/**
 * The brains, grouped and ranked.
 *
 * A person and a subject are different questions, so they sit apart. Inside a
 * group the fullest brain leads, counted by positions first and sources second,
 * because that is the one worth opening. Creation order said nothing about
 * which brain you want.
 */
const weight = b => conceptsOf(b.slug).length * 1000 + sourcesOf(b.slug).length;
function grouped(){
  const of = t => ordered().filter(b => b.type !== "personal" && (b.type === "person" ? "person" : "subject") === t);
  return [{ head: "People", rows: of("person") }, { head: "Subjects", rows: of("subject") }]
    .filter(g => g.rows.length);
}
/** Every brain in one list, the fullest first. An icon tells a person from a subject. */
/* Personal brains lead: they are yours, and the list's first stop. */
const ordered = () => [...S.brains].sort((x, y) => (y.type === "personal") - (x.type === "personal") || weight(y) - weight(x) || x.name.localeCompare(y.name));
const BRAIN_ICON = {
  personal: `<svg class="b-ic" viewBox="0 0 24 24" role="img" aria-label="Personal"><title>Personal</title><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>`,
  person: `<svg class="b-ic" viewBox="0 0 24 24" role="img" aria-label="Person"><title>Person</title><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.6 7-5.6s6.2 2 7 5.6"/></svg>`,
  subject: `<svg class="b-ic" viewBox="0 0 24 24" role="img" aria-label="Subject"><title>Subject</title><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/></svg>`,
};
const brainIcon = b => { const w = el("span","b-ico"); w.innerHTML = BRAIN_ICON[b.type === "person" || b.type === "personal" ? b.type : "subject"]; return w.firstChild; };
/* A personal brain: a chat that files what its owner says. Only its own chat reads it. */
function isPersonal(slug){ return S.brains.find(b => b.slug === slug)?.type === "personal"; }
/** A brain shared into this workspace to be read, never fed: the demo's view of one. */
function readOnly(b){ return !!b && (b.viewers || []).includes(S.space); }
/* Into a personal chat or out of one, the thread starts fresh: the two never share a chat. */
function crossing(to){ if (S.chatId && isPersonal(to) !== isPersonal(S.scope)) newChat(); }
/**
 * The folders ticked to chat in. None asks them all, one reads as that
 * folder, and two or more travel as a list. A drop feeds the ones it may.
 */
function setPicks(list){
  const ok = new Set(S.brains.filter(b => b.type !== "personal").map(b => b.slug));
  S.picks = [...new Set(list)].filter(x => ok.has(x));
  S.scope = S.picks.length === 1 ? S.picks[0] : "all";
  S.into = S.picks.filter(x => !readOnly(S.brains.find(b => b.slug === x)));
}
/** The ticked folders by name: "Wealth and Charles Gave", or "4 folders" past three. */
function picksName(){
  const n = S.picks.map(x => S.brains.find(b => b.slug === x)?.name || x);
  return n.length > 3 ? `${n.length} folders` : n.length > 1 ? `${n.slice(0, -1).join(", ")} and ${n[n.length - 1]}` : n[0] || "";
}
const shared = () => S.brains.filter(b => b.type !== "personal");

/* Clicking a row ticks that folder to chat in, and several can be ticked: the
   question reads those alone. A second click unticks it. A personal folder is
   a chat of its own, so its row opens that chat. Open and edit sit on the row
   you point at. */
const TICK_SVG = `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 5 8.6l4.5-5"/></svg>`;
function brainRow(b){
  const self = b.type === "personal";
  const on = self ? S.scope === b.slug : S.picks.includes(b.slug);
  const home = b.space || "octopus", label = x => x.charAt(0).toUpperCase() + x.slice(1);
  const out = [...(b.shared || []), ...(b.viewers || [])].map(label), from = home !== S.space ? label(home) : "";
  const row = el("button","brain-row" + (on ? " on" : "") + (self ? " self" : "") + (out.length || from ? " shared" : ""));
  if (!self) row.setAttribute("aria-pressed", String(on));
  const ideas = conceptsOf(b.slug).length, read = sourcesOf(b.slug).length;
  /* The score stands for what the brain holds, so the row shows the ring and
     leaves the counts to its title. */
  const tick = el("span","tick");
  tick.append(brainIcon(b));
  if (!self){ const box = el("span","tbox"); box.innerHTML = TICK_SVG; tick.append(box); }
  row.append(tick, el("span","nm",b.name));
  const h = S.health[b.slug];
  if (h) row.append(healthRing(h, b));
  row.title = b.type === "personal" ? `Personal, alpha: it files what you say in its chat, dated. Only that chat reads it.\n${ideas} notes`
    : `${b.scope || "no scope line"}\n${ideas} concepts, ${read} sources` +
      (from ? `\nShared with this workspace from ${from}${readOnly(b) ? ". Read only here" : ""}` : out.length ? `\nShared with ${out.join(", ")}` : "");
  row.onclick = () => {
    if (self){
      crossing(on ? "all" : b.slug);
      if (on) setPicks([]); else { S.picks = []; S.scope = b.slug; S.into = []; }
      /* A personal chat is one folder, so on a phone the drawer closes on it. */
      if (!on) closeSide();
    } else {
      crossing("all");
      setPicks(on ? S.picks.filter(x => x !== b.slug) : [...S.picks, b.slug]);
    }
    render();
  };
  /* One control on the row, so a click anywhere else ticks it. Its name and
     scope are edited from the folder it opens. */
  const op = el("span","ed op","open");
  op.title = "See what this folder holds";
  op.onclick = e => { e.stopPropagation(); openBrainView(b); };
  row.append(op);
  return row;
}

/* ---- which workspace this is ---- */

/** The owner's two workspaces: the only ones with mail, the connector and transcripts to spare. */
function ownerWs(){ return !S.demo && !S.byok && (S.space === "octopus" || S.space === "squidgy"); }
/** A workspace's own key lives in this browser only, one per workspace. */
function myKey(){ try { return localStorage.getItem("octopus.key." + S.space) || ""; } catch { return ""; } }
function setMyKey(k){ try { localStorage.setItem("octopus.key." + S.space, k); } catch {} }

/**
 * What changes with the workspace: the demo says what it is and keeps its
 * brains' shape as it is; a workspace on its own key asks for the key once.

/* ---- the two folding groups ---- */
/* Read on first use: the sidebar can paint before this part of the script has run. */
function folds(){

/* ---- chats ---- */
/* A chat asked one folder, several joined by commas, or all of them. */
function brainLabel(slug){
  if (!slug || slug === "all") return "All folders";
  return String(slug).split(",").map(x => S.brains.find(b => b.slug === x)?.name || x).join(", ");
}
var chatMsgTimer = 0;
function chatMsg(t){
  const m = $("chatMsg"); m.textContent = t; m.hidden = !t;
  clearTimeout(chatMsgTimer);
  if (t) chatMsgTimer = setTimeout(() => { m.hidden = true; }, 5000);
}
const PIN_SVG = `<svg class="pin" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3l6 6-3 1-4 4 1 5-2 2-4.5-4.5L3 22l-1-1 5.5-5.5L3 11l2-2 5 1 4-4z"/></svg>`;

function chatRow(c){
  const on = S.chatId === c.id;
  const row = el("div","chat-row" + (on ? " on" : "") + (c.pinned ? " pinned" : ""));
  row.tabIndex = 0; row.setAttribute("role","button");
  if (c.pinned){ const p = el("span"); p.innerHTML = PIN_SVG; row.append(p.firstChild); }
  const main = el("span","cm");
  main.append(el("span","nm",c.title),
    el("span","cb",`${brainLabel(c.brain)} \u00b7 ${c.turns} question${c.turns === 1 ? "" : "s"}`));
  row.append(main);
  row.title = c.title;
  const open = () => { if (S.chatId !== c.id) openChat(c.id); else closeSide(); };
  row.onclick = open;
  row.onkeydown = e => { if (e.key === "Enter" && e.target === row) open(); };

  const more = el("button","more","\u22ef");
  more.title = "Pin, rename or delete"; more.setAttribute("aria-label", `Pin, rename or delete "${c.title}"`);
  more.setAttribute("aria-haspopup","menu"); more.setAttribute("aria-expanded","false");
  more.onclick = e => { e.stopPropagation(); chatMenu ? closeChatMenu() : openChatMenu(c, more); };
  row.append(more);
  return row;
}

/**
 * The menu behind a chat's one button: pin or unpin, rename, delete. Delete
 * asks once more in the menu itself, then goes.
 */
var chatMenu = null;
function closeChatMenu(){
  if (!chatMenu) return;
  chatMenu.anchor.setAttribute("aria-expanded","false");
  document.removeEventListener("pointerdown", chatMenu.outside, true);
  document.removeEventListener("keydown", chatMenu.key, true);
  chatMenu.box.remove(); chatMenu = null;
}
function openChatMenu(c, anchor){
  closeChatMenu();
  const box = el("div","chat-menu"); box.setAttribute("role","menu");
  const item = (label, cls, fn) => {
    const b = el("button","cm-it" + (cls ? " " + cls : ""), label);
    b.setAttribute("role","menuitem");
    b.onclick = e => { e.stopPropagation(); fn(b); };
    box.append(b); return b;
  };
  item(c.pinned ? "Unpin" : "Pin", "", async () => {
    closeChatMenu();
    try {
      const r = await api("/api/chats/edit", { id: c.id, pinned: !c.pinned });
      if (r.error) throw new Error(r.error);
      loadChats();
    } catch (e) { chatMsg(e.message); }
  });
  item("Rename", "", () => { closeChatMenu(); renameChat(c); });
  item("Delete", "del", async b => {
    if (!b.classList.contains("sure")){ b.classList.add("sure"); b.textContent = "Sure? Delete"; return; }
    closeChatMenu();
    try {
      const r = await api("/api/chats/edit", { id: c.id, remove: true });
      if (r.error) throw new Error(r.error);
      if (S.chatId === c.id) newChat();
      loadChats();
    } catch (e) { chatMsg(e.message); }
  });
  document.body.append(box);
  /* Under the button, kept on screen. */
  const r = anchor.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
  box.style.top = (r.bottom + 4 + h > innerHeight - 8 ? Math.max(8, r.top - h - 4) : r.bottom + 4) + "px";
  const outside = e => { if (!box.contains(e.target) && e.target !== anchor) closeChatMenu(); };
  const key = e => { if (e.key === "Escape"){ e.stopPropagation(); closeChatMenu(); anchor.focus(); } };
  document.addEventListener("pointerdown", outside, true);
  document.addEventListener("keydown", key, true);
  anchor.setAttribute("aria-expanded","true");
  chatMenu = { box, anchor, outside, key };
  box.querySelector(".cm-it").focus();
}

function renderChats(){
  closeChatMenu();
  const box = $("chats"); box.innerHTML = "";
  $("ccount").textContent = S.chats.length || "";
  if (!S.chats.length){ box.append(el("div","empty-side","No chat yet. Ask a question and it lands here.")); return; }
  for (const c of S.chats) box.append(chatRow(c));
}

/** A clean screen, and the next question starts a new chat. */
function newChat(){
  S.thread = []; S.chatId = null;
  $("thread").innerHTML = "";
  render(); renderChats();
}

/** A saved chat back on screen, ready to continue on the brain it asked. */
async function openChat(id){
  closeSide();
  let c;
  try { c = (await api("/api/chats/get", { id })).chat; }
  catch (e) { chatMsg(e.message); loadChats(); return; }
  if (!c) return;
  S.chatId = c.id;
  const asked = String(c.brain || "").split(",").filter(x => S.brains.some(b => b.slug === x));
  if (asked.length === 1 && isPersonal(asked[0])){ S.picks = []; S.scope = asked[0]; S.into = []; }
  else setPicks(asked);
  if (S.mode !== "ask"){ S.mode = "ask"; [...$("mode").children].forEach(x => x.classList.toggle("on", x.dataset.m === "ask")); }
  $("thread").innerHTML = "";
  for (const t of c.turns || []){
    says(t.q);
    push("ai", body => showAnswer(body, t, t.q, S.scope));
  }
  S.thread = (c.turns || []).slice(-6).map(t => ({ q: t.q, a: String(t.a ?? "") }));
  render(); renderChats(); bottom();
}

function renameChat(c){
  const veil = el("div","veil");
  veil.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <header><h3>Rename the chat</h3></header>
      <div class="f"><label for="rnT">Name</label><input id="rnT" class="pick" maxlength="80"></div>
      <div class="f"><div id="rnMsg" class="bad" role="alert"></div></div>
      <footer><button class="ghost" id="rnNo">Cancel</button><button class="go" id="rnGo">Save</button></footer>
    </div>`;
  document.body.append(veil);
  const t = veil.querySelector("#rnT"); t.value = c.title; t.focus(); t.select();
  const shut = () => veil.remove();
  veil.querySelector("#rnNo").onclick = shut;
  veil.onclick = e => { if (e.target === veil) shut(); };
  const save = async () => {
    const title = t.value.trim();

    try {

/* ---- health ---- */
function healthTone(x){ return x >= 7 ? "h-hi" : x >= 4 ? "h-mid" : "h-lo"; }
function fmtScore(x){ return Number.isInteger(x) ? String(x) : x.toFixed(1); }
/** The ring on a brain row: it fills with the score, and opens the breakdown. */
function healthRing(h, b){
  const r = el("span","hring");
  const C = 2 * Math.PI * 9, fill = Math.max(0, Math.min(1, h.score / 10)) * C;
  r.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><circle class="tr" cx="12" cy="12" r="9"/>
    <circle class="ar ${healthTone(h.score)}" cx="12" cy="12" r="9" stroke-dasharray="${fill.toFixed(2)} ${C.toFixed(2)}"/>
    <text x="12" y="12.4">${fmtScore(h.score)}</text></svg>`;
  r.title = `Health ${fmtScore(h.score)}/10 against the best brain. ${h.best}`;
  r.setAttribute("role","button"); r.setAttribute("aria-label", `Health of ${b.name}: ${fmtScore(h.score)} out of 10`);
  r.onclick = e => { e.stopPropagation(); openHealthSheet(b); };
  return r;
}

/**
 * The four parts of a brain's score, each against the best brain on it, and
 * the move that closes the widest gap.
 */
function openHealthSheet(b){
  const h = S.health[b.slug]; if (!h) return;
  closeSide();
  const veil = el("div","veil");
  const NAMES = { variety: "Variety", depth: "Depth", fresh: "Freshness", conflicts: "Conflicts" };
  const lead = Object.values(S.health).find(x => x.top);
  const leadName = lead ? (S.brains.find(x => x.slug === lead.slug)?.name || lead.slug) : "";
  veil.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <header><h3>${esc(b.name)}: ${fmtScore(h.score)}/10</h3>
        <p>${h.top ? "The best brain here. Every other score is measured against it."
                   : `Measured against the best brain${leadName ? `, ${esc(leadName)},` : ""} which reads 10.`}</p></header>
      <div class="f" id="hbParts"></div>
      <div class="f"><div class="hb-best"><b>Best move</b>${esc(h.best)}</div></div>
      <footer>${h.open ? `<button class="ghost" id="hbSettle">Settle conflicts</button>` : ""}<button class="ghost" id="hbOpen">Open the brain</button><button class="go" id="hbDone">Done</button></footer>
    </div>`;
  document.body.append(veil);

      ? `<div class="hb-top">${NAMES[k]}<span>${p.pct}% of the best</span></div>
         <div class="hb-bar"><i class="${healthTone(p.pct / 10)}" style="width:${p.pct}%"></i></div>
         <div class="hb-say">${esc(p.say)}</div>`

  }

  const shut = () => { document.removeEventListener("keydown", onKey); veil.remove(); };
  document.addEventListener("keydown", onKey);
  veil.querySelector("#hbDone").onclick = shut;
  veil.onclick = e => { if (e.target === veil) shut(); };
  veil.querySelector("#hbOpen").onclick = () => { shut(); openBrainView(b); };
  const st = veil.querySelector("#hbSettle");
  if (st) st.onclick = () => { shut(); settleFrom(null, b.slug); };
}

/**
 * The conflict deck, opened from the map or a health sheet: this concept's
 * clashes first, or this brain's.
 */
async function settleFrom(id, brain){
  let r;
  try { r = await api("/api/conflicts", {}); } catch (e) { chatMsg(e.message); return; }
  const list = (r.conflicts || []).slice();
  const rank = c => (id && c.id === id) ? 2 : (brain && c.brain === brain) ? 1 : 0;
  list.sort((x, y) => rank(y) - rank(x));
  if (!list.length){ loadHealth(); return; }
  openConflictDeck(list, r.others || 0);
}

/**
 * Every folder, in three groups: this workspace's own, then the ones another
 * workspace lets you ask and drop into, then the ones you may only ask. A

/** The model in use, as Setup names it: short on the button, whole in its title. */

    val: live ? live.split("/").pop() : "default",

/**
 * Everything about one brain, in one place: what it is called, and the line

 *
 * A new name moves the slug, and the slug is how concepts, source rows and
 * counted candidates find their brain. The server moves all three in one write

function openBrainSheet(b){
  closeSide();
  const veil = el("div","veil");
  veil.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <header><h3>${esc(b.name)}</h3>
      <p>The scope line is the only test of what belongs inside. Change it and the next drop is judged
        against the new line.</p></header>
      <div class="f"><label for="rName">Name</label><input id="rName" autocomplete="off"></div>
      <div class="f"><label for="rScope">Scope, in one line</label><textarea id="rScope"></textarea></div>
      <div class="f"><div id="rMsg" class="bad" role="alert"></div></div>
      <footer><button class="ghost" id="rCancel">Cancel</button><button class="go" id="rSave">Save</button></footer>
    </div>`;
  document.body.append(veil);
  const nameI = veil.querySelector("#rName"), scopeI = veil.querySelector("#rScope"),
        msg = veil.querySelector("#rMsg"), save = veil.querySelector("#rSave");
  nameI.value = b.name || ""; scopeI.value = b.scope || "";
  const shut = () => veil.remove();
  veil.querySelector("#rCancel").onclick = shut;
  veil.onclick = e => { if(e.target===veil) shut(); };
  setTimeout(()=>nameI.focus(),30);

  save.onclick = async () => {
    const nm = nameI.value.trim(), sc = scopeI.value.trim();
    if (nm.length < 2){ msg.className="bad"; msg.textContent="give a name of at least 2 characters"; nameI.focus(); return; }
    save.disabled = true; msg.className="spin"; msg.textContent = "Saving";
    try {
      const r = await api("/api/brain/rename", { slug: b.slug, name: nm, scope: sc });
      if (r.error) throw new Error(r.error);
      shut(); await refresh();
      if (S.scope === b.slug) S.scope = r.slug;
      S.into = S.into.map(x => x === b.slug ? r.slug : x);
      render();
      const m = r.moved || {};
      push("ai", x => { x.innerHTML = rich(
        (r.name !== b.name
          ? `**${esc(b.name)}** is now **${esc(r.name)}**, at \`${esc(r.slug)}\`.` +
            (r.slug !== b.slug
              ? ` Moved with it: ${m.concepts||0} concepts and ${m.sources||0} sources.`
              : "")
          : `**${esc(r.name)}** saved.`) +
        `\n\nScope: ${esc(r.scope || sc)}`); });
    } catch(e){ save.disabled=false; msg.className="bad"; msg.textContent = e.message; }
  };
}

/** The picker's face: the space's mark, where it goes, and to which brain. */
function renderScope(){
  if (!S.brains.some(b => b.slug === S.scope)) S.scope = "all";
  /* The ticks follow a folder picked anywhere else: a reopened chat, a new
     folder, Ask about it. Two or more ticked ask with the scope at "all". */
  S.picks = S.picks.filter(x => S.brains.some(b => b.slug === x && b.type !== "personal"));
  if (isPersonal(S.scope)) S.picks = [];
  else if (S.scope !== "all") S.picks = [S.scope];
  else if (S.picks.length === 1) S.picks = [];
  S.into = S.into.filter(x => S.brains.some(b => b.slug === x) && !isPersonal(x) && !readOnly(S.brains.find(b => b.slug === x)));
  if (isPersonal(S.scope) && S.mode === "drop") S.mode = "ask";
  const drop = S.mode === "drop";
  const nameOf = x => S.brains.find(b => b.slug === x)?.name || x;
  /* Asking across every brain needs no label: the name says it. */
  $("scopeLabel").textContent = drop ? "Into" : isPersonal(S.scope) ? "Chat with" : "";
  /* A drop can feed several brains: the first by name, then how many more. */
  $("scopeVal").textContent = drop
    ? (!S.into.length ? "Suggest for me" : S.into.length === 1 ? nameOf(S.into[0]) : `${nameOf(S.into[0])} +${S.into.length - 1}`)
    : S.picks.length > 1 ? `${nameOf(S.picks[0])} +${S.picks.length - 1}`
    : S.scope === "all" ? "All folders" : nameOf(S.scope);

  if (mark && $("scopeMark").getAttribute("src") !== mark) $("scopeMark").src = mark;
  if (pickMenu) fillPick();
}

/* The picker's menu, drawn on the page itself so the scrolling bar of a phone
   never clips it, and placed above the button, since the box sits low. */
var pickMenu = null;   // var, not let: render() runs before this line is reached
function fillPick(){
  const m = pickMenu, drop = S.mode === "drop";

  const isOn = slug => drop ? (slug === "all" ? !S.into.length : S.into.includes(slug))

        closePick(); render(); $("input").focus(); return;
      }

function renderComposer(){
  [...$("mode").children].forEach(x => x.classList.toggle("on", x.dataset.m === S.mode));
  /* A personal brain is a chat: no Drop, no levels, and a way to bring in
     what another assistant already knows about you. */
  const mine = S.mode === "ask" && isPersonal(S.scope);
  $("mode").hidden = mine;
  $("memBtn").hidden = !mine || S.demo;
  /* It appears once there is something to forget. */
  $("freshBtn").hidden = S.mode !== "ask" || !S.thread.length;
  const drop = S.mode==="drop";
  $("srcLine").hidden = !drop;
  $("input").placeholder = drop
    ? "Paste the text or the transcript here, or add a document. Leave it empty when the source is a link."
    : mine ? "Tell it anything: a plan, a decision, an idea. Or ask what you said."
    : S.picks.length > 1 ? `Ask ${picksName()}.`
    : S.scope==="all" ? "Ask anything your folders have read."
                      : "Ask " + (S.brains.find(b=>b.slug===S.scope)?.name || "this folder") + ".";
  $("levelWrap").hidden = drop || mine;
  for (const x of $("level").children){
    const on = x.dataset.v === S.level;
    x.classList.toggle("on", on); x.setAttribute("aria-checked", on ? "true" : "false");
  }
  $("fileBtn").hidden = !drop;
  /* The mic is for asking and talking. A drop takes a source, not a voice. */
  $("micBtn").hidden = drop;
  if (drop && S.listening) stopVoice();
  $("footNote").textContent = mine
    ? "Personal, alpha: your words are filed as dated notes. It calls your other folders when they help, and only this chat reads it."
    : drop
    ? "The source gets read once, then you reply to one card."
    : S.level==="educational" ? "Educational: terms defined, mechanism built, one worked example."
    : S.level==="learning" ? "Learning: no answer given. Steps and hints to reach it yourself."
    : "Normal: the answer carries the numbers. Sources sit on one line underneath.";

  const t = $("input").value.trim();
  const src = drop ? $("srcInput").value.trim() : "";
  /* A drop needs something to read: content, a pasted transcript, or a link
     the server can open. A source named with neither is a title and nothing
     else, so the button stays off and the hint says what is missing. */
  const ready = hasContent(src, t);
  $("send").disabled = S.busy || (drop ? !ready : !t);
  $("tHint").textContent = S.busy ? "working" : drop ? dropHint(src, t)
    : S.listening ? "Listening. Tap the mic to stop." : (S.voiceHint || "");

/* Declarations, not consts: renderComposer runs once before this line is
   reached, when the shell paints ahead of the first state call. */
function linkIn(s){ return /https?:\/\/\S+/i.test(s || ""); }
function hasContent(src, content){
  return !!(content || linkIn(src) || linkIn(content));
}

/**
 * What the drop still needs, in one line.
 *
 * It says the next move rather than the rule, because the rule only matters at
 * the moment a field is empty.
 */
function dropHint(src, content){
  if (!src && !content) return "";
  if (!src && content) return "name the source, so a repeat is caught later";
  if (hasContent(src, content)) return linkIn(src) && !content
    ? "the link gets opened, video or article" : "";
  return "paste what it says, drop a document, or give a link";
}

/**
 * The octopus's loop, see-through on the page.
 *
 * The WebM carries its transparency in 270 KB. Safari and every iPhone
 * browser play WebM without that transparency, a black square, so they get
 * the animated WebP instead. Asked for less motion, it stays still.
 */
function octopusLoop(){
  const ua = navigator.userAgent;
  const webkit = /iPhone|iPad|iPod/.test(ua) || (/Safari\//.test(ua) && !/Chrome|Chromium|Edg|OPR|Firefox/.test(ua));
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return `<img class="zero-mark" src="/brand/logo-mark.png" alt="">`;
  return webkit
    ? `<img class="zero-loop" src="/brand/octopus-loop.webp" alt="">`
    : `<video class="zero-loop" src="/brand/octopus-loop.webm" autoplay loop muted playsinline disablepictureinpicture aria-hidden="true"></video>`;
}

function renderZero(){
  const th = $("thread");
  /* The shell paints before the state call says which space this is, so an
     empty state drawn for the wrong space is replaced rather than kept. */
  const old = th.querySelector(".zero");
  const mark = markOf(), logo = !!S.logo, ex = examples();
  if (old && (old.dataset.space !== S.space || old.dataset.mark !== mark || old.dataset.ex !== ex.join("|"))) old.remove();
  if (th.children.length) return;
  const z = el("div","zero");
  z.dataset.space = S.space; z.dataset.mark = mark; z.dataset.ex = ex.join("|");
  z.innerHTML = `
    ${S.space === "octopus" && !logo ? octopusLoop() : `<img class="zero-mark" src="${esc(S.space === "squidgy" && !logo ? "/brand/squidgy-mark.png" : mark)}" alt="">`}
    <h2>A folder that gets smarter every time you feed it.</h2>
    <p class="lede">Feed it any source and it reads the whole thing, files each idea under the right subject, flags every claim that clashes with what you already hold, then answers from dated evidence.</p>`;
  if (ex.length){
    const t = el("div","try"); t.append(el("b",null,"Try"));
    for (const q of ex){ const b = el("button",null,q); b.type = "button"; b.onclick = () => { $("input").value = q; go(); }; t.append(b); }

/**
 * Three questions the brains on screen can answer: the concept with the most
 * sources in each of the three fullest shared brains. A personal chat gets none.
 */
function examples(){
  if (S.mode !== "ask" || isPersonal(S.scope)) return [];
  const pool = S.brains.filter(b => b.type !== "personal" && (S.scope === "all" || b.slug === S.scope));
  const out = [];
  for (const b of [...pool].sort((x, y) => conceptsOf(y.slug).length - conceptsOf(x.slug).length)){
    const top = conceptsOf(b.slug).slice().sort((x, y) => (y.src || 0) - (x.src || 0) || (y.ev || 0) - (x.ev || 0))[0];
    if (top) out.push(`What does ${b.name} hold on ${top.title.replace(/\.$/, "").replace(/^[A-Z](?![A-Z])/, m => m.toLowerCase())}?`);
    if (out.length === 3) break;
  }
  return out;
}

const clearZero = () => $("thread").querySelector(".zero")?.remove();
const bottom = () => { const t=$("thread"); t.scrollTop = t.scrollHeight; };

function push(kind, build){
  clearZero();
  const wrap = el("div","msg "+(kind==="me"?"me":"ai"));

/* What the space's mascot is up to while an answer is on its way, with the
   step it stands for in brackets. The lines follow an answer's order, one
   every 2.4 seconds: the titles are searched, matched, the concepts read,
   the evidence weighed, the answer written. A long wait alternates the last
   two, which is where a long answer spends its time. */
const WAITING = {
  octopus: [
    ["Octopus is reaching into every brain...", "searching"],
    ["Octopus is feeling for the right concepts...", "matching"],
    ["Eight arms, sorting the notes...", "reading"],
    ["Octopus is untangling the answer...", "weighing"],
    ["Octopus is inking the key points...", "writing"],
  ],
  squidgy: [
    ["Squidgy is sniffing around...", "searching"],
    ["Squidgy picked up a scent...", "matching"],
    ["Squidgy is digging through the notes...", "reading"],
    ["Squidgy is fetching the best bits...", "weighing"],
    ["Squidgy is wagging, almost there...", "writing"],
  ],
};

/* Any other workspace waits in its own name. */
const waitingFor = name => [
  [`${name} is searching every title...`, "searching"],
  [`${name} is matching the concepts...`, "matching"],
  [`${name} is reading the notes...`, "reading"],
  [`${name} is weighing the evidence...`, "weighing"],
  [`${name} is writing the answer...`, "writing"],
];

/**
 * The turning mark and a line. Without a label, the line is the mascot's,
 * and it changes while the wait lasts. A drop's steps pass their own label,
 * because "part 3 of 8" says more than a joke.
 */
/**
 * The browser tab says what a drop is doing, so a long one can run while
 * another tab is open: "Reading 3 of 8 · Octopus". A card or a store that
 * lands while the tab is hidden says so until the tab is looked at.
 */
function tabTitle(step){ document.title = step ? `${step} \u00b7 ${S.spaceName}` : S.spaceName; }
function tabStep(label){
  const t = String(label || ""), n = t.match(/(\d+) of (\d+)/), of = n ? ` ${n[1]} of ${n[2]}` : "";
  const step = /^Checking for a repeat/.test(t) ? "Checking"
    : /^Opening the link/.test(t) ? "Opening"
    : /^Reading/.test(t) ? "Reading" + of
    : /^Comparing against/.test(t) ? "Filing" + of
    : /^Rewriting the positions/.test(t) ? "Storing" + of : "";
  if (step) tabTitle(step);
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && /^(Card ready|Stored) /.test(document.title)) tabTitle("");
});

function thinking(label){
  tabStep(label);
  return push("ai", b => {
    const t = el("div","thinking"), mark = el("span","spinner");
    mark.setAttribute("aria-hidden", "true");
    t.setAttribute("role", "status");
    const line = el("span","tl",label||"Thinking");
    t.append(mark, line);
    b.append(t);
    const lines = !label && (WAITING[S.space] || waitingFor(S.spaceName));
    if (lines){
      const show = i => { line.textContent = lines[i][0] + " "; line.append(el("span","act",`(${lines[i][1]})`)); };
      let i = 0;
      show(i);
      const timer = setInterval(() => {
        /* The wait ended when the line left the page. */
        if (!line.isConnected || t.dataset.fixed){ clearInterval(timer); return; }
        i = i < lines.length - 1 ? i + 1 : lines.length - 2;
        show(i);
      }, 2400);
    }
  });
}
function setThinking(body, label){
  tabStep(label);
  const t = body.querySelector(".thinking");
  const s = body.querySelector(".thinking .tl");
  if (t) t.dataset.fixed = "1";
  if (s) s.textContent = label;
}

/* Talk instead of typing. The browser's own speech service listens: Safari
   on iPhone, iPad and Mac, Chrome and Edge. It is free and needs no key.
   Where a browser has none, the mic says how to dictate with the system's
   own, which every phone and computer carries. */
const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, voiceBase = "";
function systemDictation(){
  const ua = navigator.userAgent;
  if (/iPhone|iPad|iPod|Android/.test(ua)) return "Tap the mic on your keyboard to talk.";
  if (/Mac/.test(ua)) return "No voice input in this browser. Press Fn twice to dictate, or open it in Safari or Chrome.";
  if (/Windows/.test(ua)) return "No voice input in this browser. Press Windows + H to dictate, or open it in Chrome or Edge.";
  return "No voice input in this browser. Open it in Chrome or Safari.";
}
function renderMic(){
  const m = $("micBtn");
  m.classList.toggle("on", !!S.listening);
  m.setAttribute("aria-pressed", S.listening ? "true" : "false");
  m.setAttribute("aria-label", S.listening ? "Stop talking" : "Talk");
}
function startVoice(){
  if (!Speech){ S.voiceHint = systemDictation(); renderComposer(); $("input").focus(); return; }
  const r = new Speech();
  r.lang = navigator.language || "en-US";
  r.interimResults = true;
  r.continuous = true;
  /* What was typed stays; the words spoken follow it. */
  const typed = $("input").value.replace(/\s+$/, "");
  voiceBase = typed ? typed + " " : "";
  r.onresult = e => {
    if (!S.listening) return;
    let said = "";
    for (const x of e.results) said += x[0].transcript;
    $("input").value = voiceBase + said.replace(/^\s+/, "");
    sizeBox(); renderComposer();
  };
  r.onerror = e => {
    const why = e.error;
    S.voiceHint = why === "not-allowed" || why === "service-not-allowed" ? "Allow the microphone for this site, then tap the mic again."
      : why === "network" ? "Voice input needs a connection."
      : why === "no-speech" || why === "aborted" ? "" : "Voice input stopped. Tap the mic to try again.";
  };
  r.onend = () => {
    if (rec === r) rec = null;
    if (S.listening){ S.listening = false; renderMic(); renderComposer(); $("input").focus(); }
  };
  try { r.start(); } catch { return; }
  rec = r; S.listening = true; S.voiceHint = ""; renderMic(); renderComposer();
}
function stopVoice(){ try { rec?.stop(); } catch { /* it had stopped already */ } }

  takeDocument(f);
};

   document goes. */
$("input").addEventListener("dragover", e => { e.preventDefault(); });
$("input").addEventListener("drop", e => {

  if (!f) return;
  e.preventDefault();
  if (S.mode !== "drop"){ S.mode = "drop"; [...$("mode").children].forEach(x => x.classList.toggle("on", x.dataset.m==="drop")); renderScope(); }
  takeDocument(f);
});
/* The portable form of the brains: one markdown file, downloaded. */
window.octopusExport = exportAll;

$("lockBtn").onclick = async () => {

/**
 * The map: every brain an arm of the octopus.
 *
 * Arms run out from the space's mark, one per brain, each with its health
 * ring at the tip. Its concepts are the suckers, bigger when more sources
 * stand behind them. Ink lines join concepts linked across two brains. A red
 * dot is an open conflict, and a tap takes it to the swipe deck. A sucker
 * opens its concept. Drag to move, wheel or pinch to zoom; tap an arm to
 * light it and its links.
 */
async function openMap(){
  const veil = el("div","veil map-veil");
  veil.innerHTML = `
    <div class="mapbox" role="dialog" aria-modal="true" aria-label="Map of the brains">
      <header class="mp-h"><b>Map</b><span class="mp-n" id="mpN"></span>
        <div class="mp-zoom"><button id="mpIn" aria-label="Zoom in">+</button><button id="mpOut" aria-label="Zoom out">&minus;</button><button id="mpFit">Fit</button></div>
        <button class="dk-x" id="mpX" aria-label="Close">&times;</button></header>
      <div class="mp-stage" id="mpStage"><div class="hint" style="padding:20px">Drawing the octopus</div></div>
      <div class="mp-key">Arm: a brain, its health at the tip. Sucker: a concept, bigger with more sources. Line: a link between two brains. Red dot: an open conflict, tap it to settle.</div>
    </div>`;
  document.body.append(veil);
  const stage = veil.querySelector("#mpStage");
  const onKey = e => { if (e.key === "Escape" && veil === [...document.querySelectorAll(".veil")].pop()) shut(); };
  const shut = () => { document.removeEventListener("keydown", onKey); mapRepaint = null; veil.remove(); };
  document.addEventListener("keydown", onKey);
  veil.querySelector("#mpX").onclick = shut;

  let links = [];
  try { links = (await api("/api/map", {})).links || []; } catch { links = []; }
  if (!veil.isConnected) return;

  const NS = "http://www.w3.org/2000/svg";
  const mk = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.append(n);
    return n;
  };
  const svg = mk("svg", { role: "img", "aria-label": "Every brain as an arm of the octopus" });
  let vb = null, fit = null, focus = null;
  const setVb = () => svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);

  const draw = () => {
    svg.innerHTML = "";
    const brains = ordered().filter(b => b.type !== "personal"), n = brains.length;
    const root = mk("g", {}, svg);
    if (!n){ stage.innerHTML = `<div class="hint" style="padding:20px">No brain yet. Create one and it grows an arm.</div>`; return; }
    const CX = 500, CY = 500, R0 = 78, L = 360;
    const linkG = mk("g", {}, root), armG = mk("g", {}, root), skG = mk("g", {}, root), tipG = mk("g", {}, root);
    const at = {}, byBrain = {};
    brains.forEach((b, i) => {
      /* Every arm curls the same way, so the tips stay evenly spaced. */
      const ang = (-90 + i * 360 / n) * Math.PI / 180, curl = 0.42;
      const pt = t => { const r = R0 + L * t, th = ang + curl * t * t; return [CX + r * Math.cos(th), CY + r * Math.sin(th)]; };
      const nrm = t => { const [x1, y1] = pt(t), [x2, y2] = pt(Math.min(1, t + 0.01)); const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1; return [-dy / d, dx / d]; };
      const w = t => 30 * (1 - t) + 7;
      /* The arm: a band that thins to its tip. */
      const left = [], right = [];
      for (let t = 0; t <= 1.0001; t += 0.04){
        const [x, y] = pt(t), [nx, ny] = nrm(t), h = w(t) / 2;
        left.push(`${(x + nx * h).toFixed(1)},${(y + ny * h).toFixed(1)}`);
        right.unshift(`${(x - nx * h).toFixed(1)},${(y - ny * h).toFixed(1)}`);
      }
      const arm = mk("path", { d: `M${left.join("L")}L${right.join("L")}Z`, class: "mp-arm" + (b.type === "person" ? " person" : ""), "data-b": b.slug }, armG);
      mk("title", {}, arm).textContent = b.name;

      /* The suckers, two rows once an arm holds many. */
      const cs = conceptsOf(b.slug), k = cs.length, rows = k > 18 ? 2 : 1, m = Math.max(1, Math.ceil(k / rows));
      const rMax = Math.max(1.6, Math.min(7, (L * 0.9 / m) * 0.42));
      byBrain[b.slug] = [];
      cs.forEach((c, j) => {
        const row = rows === 2 ? j % 2 : 0, idx = rows === 2 ? Math.floor(j / 2) : j;
        const t = 0.06 + 0.9 * (idx + 0.5) / m;
        const [x, y] = pt(t), [nx, ny] = nrm(t), off = rows === 2 ? (row ? 1 : -1) * w(t) * 0.24 : 0;
        const px = x + nx * off, py = y + ny * off;
        const r = Math.min(rMax, 1.8 + 1.4 * Math.sqrt(Math.max(1, c.src || 0)));
        const id = `${c.brain}/${c.slug}`;
        at[id] = [px, py];
        const sk = mk("circle", { cx: px.toFixed(1), cy: py.toFixed(1), r: r.toFixed(1), class: "mp-sk", "data-id": id, "data-b": b.slug }, skG);
        mk("title", {}, sk).textContent = `${c.title}\n${c.src || 0} source${c.src === 1 ? "" : "s"} \u00b7 ${b.name}`;
        sk.addEventListener("click", e => { e.stopPropagation(); openBrainView(b, id); });
        sk.addEventListener("mouseenter", () => hot(id, true));
        sk.addEventListener("mouseleave", () => hot(id, false));
        byBrain[b.slug].push(sk);
        if (S.conflicted.has(id)){
          /* On the rim, so the sucker under it can still be pointed at. */
          const dr = Math.max(3.6, r * 0.6), off = (r + dr * 0.35) * 0.707;
          const cf = mk("circle", { cx: (px + off).toFixed(1), cy: (py - off).toFixed(1), r: dr.toFixed(1), class: "mp-cf", "data-id": id }, skG);
          mk("title", {}, cf).textContent = `Open conflict on ${c.title}. Tap to settle it.`;
          cf.addEventListener("click", e => { e.stopPropagation(); settleFrom(id, b.slug); });
        }
      });

      /* The tip: the health ring and the name. */
      const th = ang + curl, rr = R0 + L + 24, tx = CX + rr * Math.cos(th), ty = CY + rr * Math.sin(th);
      const h = S.health[b.slug];
      const tip = mk("g", { transform: `translate(${tx.toFixed(1)} ${ty.toFixed(1)})` }, tipG);
      mk("circle", { r: 13, class: "tr", style: "fill:var(--surface);stroke:var(--line-2);stroke-width:3" }, tip);
      if (h){
        const C = 2 * Math.PI * 13;
        mk("circle", { r: 13, class: healthTone(h.score), style: "fill:none;stroke-width:3;stroke-linecap:round",
          "stroke-dasharray": `${(h.score / 10 * C).toFixed(2)} ${C.toFixed(2)}`, transform: "rotate(-90)" }, tip);
        mk("text", { class: "mp-sub", "text-anchor": "middle", "dominant-baseline": "central", style: "font-weight:600;fill:var(--ink-2)" }, tip).textContent = fmtScore(h.score);
        tip.style.cursor = "pointer";
        tip.addEventListener("click", e => { e.stopPropagation(); openHealthSheet(b); });
      }
      const cos = Math.cos(th), sin = Math.sin(th);
      const anchor = cos > 0.35 ? "start" : cos < -0.35 ? "end" : "middle";
      const lx = anchor === "start" ? 19 : anchor === "end" ? -19 : 0, ly = anchor === "middle" ? (sin > 0 ? 30 : -24) : 0;
      const name = mk("text", { x: lx, y: ly, class: "mp-name", "text-anchor": anchor, "dominant-baseline": "central" }, tip);
      name.textContent = b.name;
      name.addEventListener("click", e => { e.stopPropagation(); openBrainView(b); });
      mk("text", { x: lx, y: ly + 15, class: "mp-sub", "text-anchor": anchor, "dominant-baseline": "central" }, tip)
        .textContent = `${k} concept${k === 1 ? "" : "s"}`;
    });

    /* Ink between brains, bowed through the body. */
    let drawn = 0;
    for (const [a, b] of links){
      const p = at[a], q = at[b];
      if (!p || !q) continue;
      const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      const cx = mx + (CX - mx) * 0.55, cy = my + (CY - my) * 0.55;
      mk("path", { d: `M${p[0].toFixed(1)},${p[1].toFixed(1)}Q${cx.toFixed(1)},${cy.toFixed(1)} ${q[0].toFixed(1)},${q[1].toFixed(1)}`,
        class: "mp-link", "data-a": a, "data-b": b }, linkG);
      drawn++;
    }

    /* The head: the space's own mark. */
    mk("circle", { cx: CX, cy: CY, r: R0, class: "mp-head" }, root);
    mk("image", { href: $("spaceMark").getAttribute("src") || "/brand/logo-mark.png", x: CX - R0 * 0.78, y: CY - R0 * 0.78,
      width: R0 * 1.56, height: R0 * 1.56 }, root);

    const nCs = brains.reduce((t, b) => t + conceptsOf(b.slug).length, 0);
    veil.querySelector("#mpN").textContent = `${n} brain${n === 1 ? "" : "s"} \u00b7 ${nCs} concepts \u00b7 ${drawn} link${drawn === 1 ? "" : "s"} between brains \u00b7 ${S.conflicted.size} with an open conflict`;
    if (!svg.isConnected){ stage.innerHTML = ""; stage.append(svg); }
    const bb = root.getBBox(), pad = 24;
    fit = { x: bb.x - pad, y: bb.y - pad, w: bb.width + pad * 2, h: bb.height + pad * 2 };
    if (!vb) vb = { ...fit };
    setVb(); paintFocus();
  };

  /* A pointed sucker, or a tapped arm, lights its links. */
  const hot = (id, on) => {
    svg.querySelectorAll(`.mp-link[data-a="${CSS.escape(id)}"], .mp-link[data-b="${CSS.escape(id)}"]`).forEach(l => l.classList.toggle("hot", on));
  };
  const paintFocus = () => {
    svg.classList.toggle("focus", !!focus);
    svg.querySelectorAll(".mp-arm, .mp-sk").forEach(x => x.classList.toggle("hot", !!focus && x.dataset.b === focus));
    svg.querySelectorAll(".mp-link").forEach(l => l.classList.toggle("hot",
      !!focus && (l.dataset.a.split("/")[0] === focus || l.dataset.b.split("/")[0] === focus)));
  };

  /* Move and zoom: drag the background, the wheel, two fingers, or the buttons. */
  const toSvg = (cx, cy) => { const r = svg.getBoundingClientRect(); return [vb.x + (cx - r.left) / r.width * vb.w, vb.y + (cy - r.top) / r.height * vb.h]; };
  const zoom = (f, cx, cy) => {
    const r = svg.getBoundingClientRect();
    const [px, py] = cx == null ? [vb.x + vb.w / 2, vb.y + vb.h / 2] : toSvg(cx, cy);
    const w = Math.max(fit.w / 8, Math.min(fit.w * 2, vb.w / f)), h = w * vb.h / vb.w;
    const rx = cx == null ? 0.5 : (cx - r.left) / r.width, ry = cy == null ? 0.5 : (cy - r.top) / r.height;
    vb = { x: px - rx * w, y: py - ry * h, w, h }; setVb();
  };
  svg.addEventListener("wheel", e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY); }, { passive: false });
  /* A press that barely moves is a tap: on an arm it lights that brain, on
     the background it clears the light. */
  const pts = new Map(); let last = null, pinch = null, start = null, downOn = null;
  svg.addEventListener("pointerdown", e => {
    if (e.target.closest(".mp-sk, .mp-cf, .mp-name") || e.target.closest("g[transform]")?.querySelector(".mp-name")) return;
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    svg.setPointerCapture(e.pointerId); svg.classList.add("panning");
    last = [e.clientX, e.clientY]; start = [e.clientX, e.clientY]; downOn = e.target;
    if (pts.size === 2){ const [a, b] = [...pts.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); }
  });
  svg.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2 && pinch){
      const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      zoom(d / pinch, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); pinch = d; return;
    }
    const r = svg.getBoundingClientRect();
    vb.x -= (e.clientX - last[0]) / r.width * vb.w; vb.y -= (e.clientY - last[1]) / r.height * vb.h;
    last = [e.clientX, e.clientY];
    setVb();
  });
  const up = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
    if (pts.size) return;
    svg.classList.remove("panning");
    if (e.type === "pointerup" && start && Math.hypot(e.clientX - start[0], e.clientY - start[1]) < 5){
      const arm = downOn?.closest?.(".mp-arm");
      focus = arm ? (focus === arm.dataset.b ? null : arm.dataset.b) : null;
      paintFocus();
    }
    start = null; downOn = null;
  };
  svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
  veil.querySelector("#mpIn").onclick = () => zoom(1.3);
  veil.querySelector("#mpOut").onclick = () => zoom(1 / 1.3);
  veil.querySelector("#mpFit").onclick = () => { vb = { ...fit }; setVb(); };

  stage.innerHTML = ""; stage.append(svg);
  draw();
  /* A settled conflict or a new ring redraws the map where it stands. */
  mapRepaint = () => { if (veil.isConnected) draw(); };
}

/**
 * The conflict deck: one open clash at a time, settled with a swipe.
 *
 * Left keeps A, right keeps B, up says both hold, down leaves it for later.
 * The arrow keys and the four buttons do the same. A ruling waits 4 seconds
 * before it is sent, so Undo can take it back; closing the deck sends what is
 * waiting at once. A ruling rewrites the position, which takes a model call,
 * so rewrites run behind the next card. Two rulings on one concept run one
 * after the other, each on the position the one before it wrote.
 */
function openConflictDeck(list, others){
  const UNDO_MS = 4000;
  const brainName = slug => S.brains.find(x => x.slug === slug)?.name || slug;
  const veil = el("div","veil deck-veil");
  veil.innerHTML = `
    <div class="deck" role="dialog" aria-modal="true" aria-label="Open conflicts">
      <header class="dk-h"><b>Open conflicts</b><span class="dk-n" id="dkN"></span>
        <button class="dk-x" id="dkX" aria-label="Close">&times;</button></header>
      <div class="dk-stage" id="dkStage"></div>
      <div class="dk-acts" id="dkActs">
        <button class="ghost" data-p="a">&larr; A holds</button>
        <button class="ghost" data-p="both">&uarr; Both hold</button>
        <button class="ghost" data-p="later">&darr; Later</button>
        <button class="ghost" data-p="b">B holds &rarr;</button>
      </div>
      <div class="dk-foot"><span class="dk-toast" id="dkToast">Swipe toward the side that holds. Up: both hold. Down: later.</span>
        <button class="mini" id="dkUndo" hidden>Undo</button><span class="dk-state" id="dkState"></span></div>
    </div>`;
  document.body.append(veil);
  const $d = id => veil.querySelector("#" + id);
  const stage = $d("dkStage"), toast = $d("dkToast"), undoB = $d("dkUndo"), stateL = $d("dkState");

  let pile = list.slice(), later = [], done = 0, total = list.length;
  let running = 0, card = null, closed = false;
  const waiting = [];            // rulings inside their undo window
  const chains = new Map();      // one rewrite at a time per concept

  const say = (t, bad) => { toast.textContent = t; toast.className = "dk-toast" + (bad ? " bad" : ""); };
  const paintState = () => {
    stateL.textContent = [done ? `${done} settled` : "", running ? `${running} rewriting` : ""].filter(Boolean).join(" \u00b7 ");
  };

  /* ---- sending a ruling ---- */
  const send = r => {
    running++; paintState();
    const prev = chains.get(r.c.id) || Promise.resolve();
    const next = prev.then(async () => {
      try {
        const x = await api("/api/conflicts/settle", { id: r.c.id, a: r.c.a, b: r.c.b, pick: r.pick });
        if (x.error || x.ok === false) throw new Error(x.error || x.why);
        done++;
      } catch (e) {
        /* Back in the pile, so a failed ruling is never lost. */
        pile.push(r.c); total++;
        if (!closed){ say(`Not settled: ${e.message}. "${r.c.title}" is back in the pile.`, true); if (!card) show(); }
      } finally { running--; paintState(); if (!closed && !card && !pile.length) show(); }
    });
    chains.set(r.c.id, next);
  };
  const flush = () => { while (waiting.length){ const r = waiting.shift(); clearTimeout(r.t); send(r); } undoB.hidden = true; };

  const LABEL = { a: "A holds", b: "B holds", both: "Both hold", later: "Later" };
  const rule = pick => {
    if (!card) return;
    const c = pile.shift();
    fly(pick);
    if (pick === "later"){
      later.push(c);
      say(`"${c.title}" is left for later.`);
    } else {
      const r = { c, pick };
      r.t = setTimeout(() => {
        const i = waiting.indexOf(r); if (i < 0) return;
        waiting.splice(i, 1); send(r);
        if (!waiting.length) undoB.hidden = true;
      }, UNDO_MS);
      waiting.push(r);
      say(`${LABEL[pick]}: ${c.title}.`);
      undoB.hidden = false;
    }
    setTimeout(show, 180);
  };
  undoB.onclick = () => {
    const r = waiting.pop(); if (!r) return;
    clearTimeout(r.t);
    pile.unshift(r.c);
    if (card){ card.remove(); card = null; }
    undoB.hidden = !waiting.length;
    say(`Taken back: ${r.c.title}.`);
    show();
  };

  /* ---- the card ---- */
  const fly = pick => {
    if (!card) return;
    const c = card; card = null;
    c.classList.add("gone");
    const [x, y] = { a: [-1, 0], b: [1, 0], both: [0, -1], later: [0, 1] }[pick];
    c.style.transform = `translate(${x * 120}%, ${y * 120}%) rotate(${x * 14}deg)`;
    c.style.opacity = "0";
    setTimeout(() => c.remove(), 260);
  };
  const show = () => {
    if (closed) return;
    stage.querySelectorAll(".dk-card:not(.gone), .dk-done").forEach(n => { if (n !== card) n.remove(); });
    if (card) return;
    const c = pile[0];
    $d("dkActs").hidden = !c;
    $d("dkN").textContent = c ? `${total - pile.length - later.length + 1} of ${total}` : "";
    if (!c){
      const end = el("div","dk-done");
      end.append(el("b",null, running ? "Rewriting the last ones" : later.length ? "The rest is for later" : "All settled"));
      end.append(el("p",null, [done ? `${done} settled.` : "", running ? `${running} still rewriting: they finish on their own.` : "",
        later.length ? `${later.length} left for later.` : "", others ? `${others} more add detail rather than contradict.` : ""].filter(Boolean).join(" ")));
      if (later.length){
        const again = el("button","go", `Go through the ${later.length} again`);
        again.id = "dkAgain";
        again.onclick = () => { pile = later; later = []; total = pile.length; show(); };
        end.append(again);
      }
      const close = el("button","ghost","Close"); close.style.marginLeft = "8px";
      close.onclick = shut;
      end.append(close);
      stage.append(end);
      return;
    }
    const n = el("div","dk-card");
    n.innerHTML = `<span class="dk-brain">${esc(brainName(c.brain))}</span><h4>${esc(c.title)}</h4>
      <div class="dk-sides">
        <div class="dk-side" data-s="a"><span class="dk-tag">&larr; A</span><p>${esc(c.a)}</p><time>${esc(c.aDate || "undated")}</time></div>
        <div class="dk-side" data-s="b"><span class="dk-tag">B &rarr;</span><p>${esc(c.b)}</p><time>${esc(c.bDate || "undated")}</time></div>
      </div>
      ${c.why ? `<div class="dk-why">They differ because ${esc(c.why.replace(/^[A-Z]/, m => m.toLowerCase()))}</div>` : ""}
      <div class="dk-stamp"></div>`;
    drag(n);
    stage.append(n); card = n;
  };

  /* ---- the swipe ---- */
  const intent = (dx, dy) => Math.abs(dx) > Math.abs(dy)
    ? (dx < -30 ? "a" : dx > 30 ? "b" : "")
    : (dy < -30 ? "both" : dy > 30 ? "later" : "");
  const drag = n => {
    let x0 = 0, y0 = 0, on = false;
    const lit = p => {
      n.querySelectorAll(".dk-side").forEach(s => s.classList.toggle("lit", s.dataset.s === p || p === "both"));
      const st = n.querySelector(".dk-stamp");
      st.textContent = p ? LABEL[p] : ""; st.style.opacity = p ? "1" : "0";
    };
    n.addEventListener("pointerdown", e => {
      if (e.button) return;
      on = true; x0 = e.clientX; y0 = e.clientY;
      n.setPointerCapture(e.pointerId); n.classList.add("drag");
    });
    n.addEventListener("pointermove", e => {
      if (!on) return;
      const dx = e.clientX - x0, dy = e.clientY - y0;
      n.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 22}deg)`;
      lit(intent(dx, dy));
    });
    const end = e => {
      if (!on) return;
      on = false; n.classList.remove("drag");
      const dx = e.clientX - x0, dy = e.clientY - y0, p = intent(dx, dy);
      const far = Math.abs(dx) > 90 || Math.abs(dy) > 80;
      if (p && far && card === n) rule(p);
      else { n.style.transform = ""; lit(""); }
    };
    n.addEventListener("pointerup", end);
    n.addEventListener("pointercancel", end);
  };

  /* ---- keys, buttons, closing ---- */
  $d("dkActs").onclick = e => { const b = e.target.closest("button[data-p]"); if (b) rule(b.dataset.p); };
  const KEYS = { ArrowLeft: "a", ArrowRight: "b", ArrowUp: "both", ArrowDown: "later" };
  const onKey = e => {
    if (e.key === "Escape"){ shut(); return; }
    if ((e.key === "z" || e.key === "Z") && !undoB.hidden){ undoB.click(); return; }
    if (KEYS[e.key]){ e.preventDefault(); rule(KEYS[e.key]); }
  };
  function shut(){
    if (closed) return;
    flush(); closed = true;
    document.removeEventListener("keydown", onKey);
    veil.remove();
    Promise.all([...chains.values()]).then(() => { if (done) refresh(); });
  }
  document.addEventListener("keydown", onKey);
  $d("dkX").onclick = shut;
  paintState(); show();
}

  passGo.onclick = async () => {
    passMsg.className = "hint";
    if (!passCur.value) { passMsg.textContent = "Type your current passphrase first."; return passCur.focus(); }

      passCur.value = ""; passNew.value = "";

        chip.disabled = true; shareMsg.textContent = "Saving";
        try {
          paintShare(await api("/api/share", { brain: b.slug, to: t.slug, on: !on }));

  /* ---- open conflicts: only the real contradictions, each one settled here ---- */
  const cfSlot = veil.querySelector("#cfSlot"), cfCount = veil.querySelector("#cfCount");
  const brainName = slug => S.brains.find(x => x.slug === slug)?.name || slug;
  let left = 0, others = 0, openList = [];
  const paintCount = () => { cfCount.textContent = left ? String(left) : ""; };
  const none = () => el("div","hint", others
    ? `None to settle. ${others} recorded clash${others === 1 ? " adds" : "es add"} detail rather than contradict${others === 1 ? "s" : ""}, so ${others === 1 ? "it stays" : "they stay"} off this list.`

  const conflictRow = c => {
    const box = el("div","cf-item");

      openList = openList.filter(x => x !== c);
      box.querySelectorAll("button").forEach(x => x.disabled = true);
      btn.textContent = pick === "both" ? "Clearing" : "Rewriting";

        box.classList.add("done");
        box.append(el("b",null,c.title), el("div","hint", pick === "both"

        left--; paintCount();
        const deck = cfSlot.querySelector("#cfDeck");
        if (deck){ if (left) deck.textContent = `Review one by one: ${left}`; else deck.remove(); }
        if (!left) cfSlot.append(none());
