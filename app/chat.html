</style>
<h1>${esc(page.title)}</h1>${page.line ? `<p class="sub">${esc(page.line)}</p>` : ""}${li}
<p class="foot">${esc(page.foot || "")}</p>`);
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 300);
}

/* ============ a document ============ */

/**
 * Where the two readers come from.
 *
 * Both load only when a file of that kind is chosen, so opening the app costs
 * neither of them. Pinned by version, because a moving "latest" would change
 * what runs here without a commit.
 */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/";
const MAMMOTH = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.12.3/mammoth.browser.min.js";
const MAMMOTH_SRI = "sha512-qTj3l2ESCbkowLBjKi71BxzAnyTRiVjSRpmOuCrwFu07hPPKmBLm4d3N0hYxTNep5bP1sqTbt0FhNVWlJZ1vBA==";

/**
 * A PDF, as text with its lines kept.
 *
 * The line breaks matter. A transcript once arrived as one 34,000 character
 * line and the read came back with nothing, because a wall of words carries no
 * shape to extract. pdf.js marks the end of each line, so each one survives.
 */
async function pdfText(file, say){
  const pdfjs = await import(PDFJS + "pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.mjs";
  const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for (let n = 1; n <= doc.numPages; n++){
    say(`Reading page ${n} of ${doc.numPages}`);
    const page = await doc.getPage(n);
    const c = await page.getTextContent();
    pages.push(c.items.map(i => (i.str || "") + (i.hasEOL ? "\n" : "")).join("").trim());
  }
  return pages.filter(Boolean).join("\n\n");
}

/** A Word file. mammoth carries no types, so it goes in as a plain script. */
async function docxText(file){
  if (!window.mammoth){
    await new Promise((ok, no) => {
      const t = document.createElement("script");
      /* The file cdnjs published, byte for byte, or nothing runs. */
      t.integrity = MAMMOTH_SRI; t.crossOrigin = "anonymous";
      t.src = MAMMOTH; t.onload = ok;
      t.onerror = () => no(new Error("the Word reader did not load. Check the connection."));
      document.head.append(t);
    });
  }
  const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
  return String(r?.value ?? "").trim();
}

/**
 * A dropped document becomes the content.
 *
 * PDF, Word, and anything that is already text. The file itself is never
 * uploaded: it is read in this tab, and only the extraction ever reaches a
 * brain, which is the same rule a pasted transcript follows.
 */
async function readDocument(file){
  const name = file.name || "document";
  const ext = name.toLowerCase().split(".").pop();
  const big = Math.round(file.size / 1024);
  if (file.size > 30 * 1024 * 1024) throw new Error(`${name} is ${big}KB. 30MB is the ceiling.`);

  const btn = $("fileBtn");
  const say = t => { btn.textContent = t; };
  say("Reading");
  try {
    if (ext === "pdf") return { name, text: await pdfText(file, say) };
    if (ext === "docx") return { name, text: await docxText(file) };
    if (["txt", "md", "markdown", "text", "csv", "srt", "vtt"].includes(ext) || file.type.startsWith("text/")) {
      return { name, text: (await file.text()).trim() };
    }
    throw new Error(`${name} is a .${ext}. PDF, Word, and text files are read here.`);
  } finally {
    say("+ document");
  }
}

/** The chosen file fills the content, and names the source when nothing has. */
async function takeDocument(file){
  if (!file) return;
  let got;
  try { got = await readDocument(file); }
  catch (e) {
    dpush("ai", b => { b.innerHTML = rich("**That document did not open.** " + esc(e.message)); });
    dbottom(); return;
  }
  if (!got.text){
    dpush("ai", b => { b.innerHTML = rich(
      `**${esc(got.name)} gave no text.** A scanned PDF holds pictures of words, so it needs the text pasted instead.`); });
    dbottom(); return;
  }
  $("input").value = got.text;
  if (!$("srcInput").value.trim()) $("srcInput").value = got.name;
  sizeBox(); renderComposer();
  const n = (got.text.match(/\S+/g)||[]).length.toLocaleString();
  dpush("ai", b => { b.innerHTML = rich(
    `**${esc(got.name)}** read, ${n} words. It sits in the content box. Send it when the source line is right.`); });
  dbottom();
}


/* ============ go ============ */
async function go(){
  if (S.mode === "drop" ? S.dropBusy : chatBusy()) return;
  /* Late words from the mic would land in the box after it was cleared. */
  if (S.listening){ S.listening = false; stopVoice(); renderMic(); }
  const text = $("input").value.trim();
  const src = $("srcInput").value.trim();
  if (S.mode === "drop" ? !hasContent(src, text) : !text) return;
  $("input").value = ""; sizeBox();
  if (S.mode === "drop") $("srcInput").value = "";
  /* A question asked from an open folder starts a chat on that folder. */
  if (S.mode !== "drop" && S.folder){ S.folder = null; if (S.chatId) newChat(); else renderView(); }
  /* A drop runs on, whatever is on screen: one at a time, and the chat stays free. */
  const drop = S.mode === "drop";
  if (drop){ S.dropBusy = true; dropState("running", src || text.slice(0, 80)); }
  renderComposer();
  try { drop ? await doDrop(src, text) : await doAsk(text); }
  finally {
    if (drop){ S.dropBusy = false; dropSettled(); }
    renderComposer();
    /* A drop that ended without a card leaves no step running. */
    if (!S.dropBusy && !S.pendingCard && !/^Card ready /.test(document.title)) tabTitle("");
  }
}

/* ---------- ask ---------- */
async function doAsk(q, again){
  /* Try again sends the same message into the message that failed. */
  if (!again) says(q);
  if (!S.brains.length){
    push("ai", b => { b.innerHTML = rich("No brains exist yet, so there is nothing to read. Create one, drop a few sources, then ask again."); });
    return;
  }
  /* It runs on if another chat, a folder or Drop opens: the answer lands in
     its own chat, and the inbox says it is there. */
  const about = S.concept, scope = S.scope, picks = S.picks.slice();
  const asked = about ? about.brain : picks.length > 1 ? picks.join(",") : scope;
  const job = addJob(q, about);
  if (again){ again.innerHTML = ""; thinkInto(again); job.body = again; } else job.body = thinking();
  try {
    /* "chat" files the turn in the chat on screen, or starts one. A chat
       about one concept sends that concept alone. */
    const r = await api("/api/ask", about
      ? { q, concept: about.id, history: S.thread.slice(-4), chat: S.chatId }
      : { q, brain: scope, ...(picks.length > 1 ? { brains: picks } : {}), level: S.level, history: S.thread.slice(-4), chat: S.chatId });
    const here = landed(job, r);
    if (job.body.isConnected){ job.body.innerHTML = ""; showAnswer(job.body, r, q, asked); }
    if (r.interview && isPersonal(scope)) S.iv[scope] = r.interview;
    if ((r.filed && (r.filed.new || r.filed.updated)) || r.changed) refresh().catch(() => {});
    /* Six turns is what a thread of follow-ups runs to before the subject has
       moved anyway. Only the last four travel. */
    if (here){
      S.thread.push({ q, a: String(r.answer ?? "") });
      if (S.thread.length > 6) S.thread = S.thread.slice(-6);
    }
    endJob(job, true);
    renderComposer();
    if (here) bottom();
  } catch(e){
    const where = about ? "chat about one concept" : isPersonal(scope) ? (S.iv[scope]?.on ? "interview" : "personal chat") : "chat";
    if (job.body.isConnected) fail(job.body, e.message, { q, where, scope,
      retry: () => { if (chatBusy()) return; doAsk(q, job.body).finally(renderComposer); renderComposer(); } });
    job.error = e.message; endJob(job, false); renderComposer();
  }
}
/**
 * An answer on screen, live or from a saved chat: the small-brain note, the
 * answer and its two actions.
 */
function showAnswer(body, r, q, asked){
  if (r.sources > 0 && r.sources < 10)
    body.append(el("div","smallbrain",`Small brain: ${r.sources} source${r.sources===1?"":"s"} behind this`));
  const out = el("div"); out.innerHTML = splitAnswer(r.answer ?? r.a ?? ""); body.append(out);
  /* Two small actions: the answer to the clipboard, or the same question
     as a one-pager. */
  const text = String(r.answer ?? r.a ?? "");
  const acts = el("div","ans-acts");
  const cp = el("button","mini","Copy");
  cp.onclick = async () => {
    try { await navigator.clipboard.writeText(text); cp.textContent = "Copied"; }
    catch { cp.textContent = "Blocked"; }
    setTimeout(() => { cp.textContent = "Copy"; }, 1600);
  };
  const pg = el("button","mini","One-pager from this");
  pg.onclick = () => openPagerSheet({ q, pick: asked });
  /* A chat about one concept: what it wrote to it, and the way to it. */
  if (r.changed){
    const f = el("div","filed", changedLine(r.changed));
    const id = typeof r.concept === "string" ? r.concept : r.concept?.id;
    const fb = id && S.brains.find(x => x.slug === id.split("/")[0]);
    if (fb){
      const op = el("button","mini keep","Open it"); op.type = "button";
      op.onclick = () => openFolder(fb, id);
      f.append(op);
    }
    body.append(f);
  }
  if (r.concept){ acts.append(cp); body.append(acts); return; }
  if (r.filed){
    const line = filedLine(r.filed);
    if (line){
      const f = el("div","filed",line); f.title = (r.filed.titles || []).join(", ");
      /* Not filed: one tap files the message again, people and all. */
      if (r.filed.failed && q && isPersonal(asked) && !S.demo){
        const keep = el("button","mini keep","Keep it"); keep.type = "button";
        keep.onclick = async () => {
          keep.disabled = true; keep.textContent = "Filing";
          try {
            const res = await api("/api/personal/remember", { brain: asked, text: q, kind: "chat" });
            f.textContent = filedLine(res.filed || {}) || "Nothing in it to file.";
            f.classList.add("kept");
            refresh().catch(() => {});
          } catch (e) { keep.disabled = false; keep.textContent = "Try again"; keep.title = e.message; }
        };
        f.append(keep);
      }
      body.append(f);
    }
    const call = calledLine(r.called);
    if (call) body.append(el("div","filed called",call));
    acts.append(cp);
  } else acts.append(cp, pg);
  body.append(acts);
}

/** What a chat about one concept wrote to it, in a few words. */
function changedLine(c){
  const parts = [c.summary ? "card rewritten" : "",
    c.added ? `${c.added} line${c.added === 1 ? "" : "s"} added` : "",
    c.removed ? `${c.removed} taken out` : ""].filter(Boolean);
  return `Saved to ${c.title}${parts.length ? ": " + parts.join(" · ") : ""}`;
}

/** The other brains a personal reply reached for on its own, or nothing. */
function calledLine(names){
  const n = (Array.isArray(names) ? names : []).map(String).filter(Boolean);
  if (!n.length) return "";
  return n.length === 1 ? `Called your ${n[0]} brain` : `Called your ${n.slice(0, -1).join(", ")} and ${n[n.length - 1]} brains`;
}

/** What a personal reply filed, in a few words, or nothing when it filed nothing. */
function filedLine(f){
  if (f.failed) return "Not filed this time. Say it again to keep it.";
  const n = f.new || 0, u = f.updated || 0;
  const news = n ? `${n} new note${n === 1 ? "" : "s"}` : "", ups = u ? `${u} note${u === 1 ? "" : "s"} updated` : "";
  const notes = [news, ups].filter(Boolean).join(", ");
  /* The people it heard about, each on their own card. */
  const ppl = [...new Set((f.people || []).map(String))];
  const who = ppl.length > 3 ? `${ppl.slice(0, 3).join(", ")} and ${ppl.length - 3} more` : ppl.join(", ");
  const parts = [notes, who ? `Contact${ppl.length === 1 ? "" : "s"}: ${who}` : ""].filter(Boolean);
  return parts.length ? "Filed: " + parts.join(" · ") : "";
}

/* ============ the interview ============
   A personal brain asks too: one question at a time, from 335 in 17
   chapters, each answer filed as notes like any message. The strip above the
   chat bar starts it, shows where it stands, and stops it. */

/** Where a personal brain's interview stands, read again from the server. */
async function loadIv(slug){
  try {
    const r = await api("/api/interview", { brain: slug });
    S.iv[slug] = r.interview; S.ivFull[slug] = r;
    paintIv();
    return r;
  } catch { return null; }
}

function paintIv(){
  const bar = $("ivBar"); if (!bar) return;
  /* A press on the strip keeps the field's focus: a blur would fold the bar
     and move the strip out from under the pointer before the click lands. */
  if (!bar.dataset.held){ bar.dataset.held = "1"; bar.addEventListener("mousedown", e => { if (e.target.closest("button")) e.preventDefault(); }); }
  const slug = S.scope;
  const show = S.mode === "ask" && isPersonal(slug) && !S.demo && !S.folder && !S.concept;
  bar.hidden = !show;
  if (!show) return;
  if (!(slug in S.iv)){ S.iv[slug] = null; loadIv(slug); }
  const iv = S.iv[slug];
  /* The bar repaints on every focus change: a strip rebuilt under a click
     would lose it, so it is drawn again only when what it says changes. */
  const busy = chatBusy();
  const key = JSON.stringify([slug, !!iv?.on, iv?.pct, iv?.seen, iv?.chapter?.at, busy]);
  if (bar.dataset.key === key && bar.children.length) return;
  bar.dataset.key = key;
  bar.innerHTML = "";
  bar.classList.toggle("on", !!iv?.on);
  if (iv?.on){
    const ch = iv.chapter;
    const live = el("span","iv-live");
    live.append(el("i","iv-dot"), el("b",null,"Interview"));
    if (ch) live.append(el("span","iv-at",`${ch.title} · ${Math.min(ch.at + 1, ch.total)} of ${ch.total}`));
    const track = el("span","iv-track"); const fill = el("i"); fill.style.width = `${Math.max(2, iv.pct)}%`; track.append(fill);
    track.title = `Your twin is ${iv.pct}% complete`;
    const skip = el("button","iv-b","Skip"); skip.type = "button"; skip.id = "ivSkip"; skip.disabled = busy;
    skip.title = "Pass this question";
    skip.onclick = () => { if (chatBusy()) return; $("input").value = "skip"; go(); };
    const stop = el("button","iv-b stop","Stop"); stop.type = "button"; stop.id = "ivStop"; stop.disabled = busy;
    stop.title = "Pause the interview. It picks up where you left off.";
    stop.onclick = () => stopInterview(slug);
    bar.append(live, track, skip, stop);
  } else {
    const goB = el("button","iv-go"); goB.type = "button"; goB.id = "ivGo"; goB.disabled = busy;
    goB.title = "It asks you questions, one at a time, to know you better. Stop any time.";
    goB.innerHTML = IC_IV;
    goB.append(el("span",null, iv?.seen ? "Resume the interview" : "Interview me"));
    if (iv) goB.append(el("small",null,`twin ${iv.pct}%`));
    goB.onclick = () => startInterview(slug);
    bar.append(goB);
  }
}

/** On, in the chat on screen, and its next question. */
async function startInterview(slug){
  if (chatBusy() || !isPersonal(slug)) return;
  if (S.scope !== slug){ crossing(slug); S.picks = []; S.scope = slug; S.into = []; }
  S.mode = "ask"; S.folder = null; S.concept = null;
  render();
  const job = addJob("", null, "Picking a question");
  job.body = thinking(job.label);
  renderComposer();
  try {
    const r = await api("/api/interview", { action: "start", brain: slug, chat: S.chatId, history: S.thread.slice(-4) });
    const here = landed(job, r);
    if (job.body.isConnected){ job.body.innerHTML = ""; showAnswer(job.body, r, "", slug); }
    if (r.interview) S.iv[slug] = r.interview;
    if (here){
      S.thread.push({ q: "", a: String(r.answer ?? "") });
      if (S.thread.length > 6) S.thread = S.thread.slice(-6);
    }
    endJob(job, true);
  } catch (e) {
    if (job.body.isConnected){ job.body.innerHTML = ""; job.body.append(el("div","err", e.message)); }
    job.error = e.message; endJob(job, false);
  } finally {
    renderComposer(); bottom(); $("input").focus();
  }
}

/** Paused where it stands, with no model call. */
async function stopInterview(slug){
  if (chatBusy()) return;
  try {
    const r = await api("/api/interview", { action: "stop", brain: slug });
    S.iv[slug] = r.interview; S.ivFull[slug] = r;
    push("ai", b => { b.append(el("div","iv-note", r.answer || "Paused.")); });
  } catch (e) { push("ai", b => { b.append(el("div","err", e.message)); }); }
  renderComposer(); bottom();
}

/**
 * The answer arrives as one sentence per line, which is what the prompt asks
 * for. Each line becomes its own block, so the gap between sentences is a
 * setting rather than whatever a line break happens to give.
 *
 * A blank line in the answer starts a new group, with a wider gap.
 */
function splitAnswer(t){
  const m = String(t).match(/\n\s*(Sources:[^\n]*)\s*$/i);
  const body = m ? String(t).slice(0, m.index) : String(t);
  const html = body.split(/\n{2,}/).map(group =>
    `<div class="para">` +
    group.split("\n").map(l => l.trim()).filter(Boolean)
      .map(l => `<p class="ln">${esc(l).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")}</p>`)
      .join("") + `</div>`).filter(x => x !== `<div class="para"></div>`).join("");
  return html + (m ? `<div class="srcline">${esc(m[1])}</div>` : "");
}

/* ---------- drop ---------- */
async function doDrop(src, content, again){
  /* The link decides whether the source can be opened, and it is what catches a
     repeat later. It is read from the source line, or from the content when the
     content opens with it, the way a pasted transcript does. A link deeper in a
     document, a licence or a footnote, is not the document. */
  const link = (src.match(/https?:\/\/\S+/)||[])[0] || (content.match(/^\s*(https?:\/\/\S+)/)||[])[1] || "";
  let bodyTxt = content || null;
  const said = src || link || content.slice(0, 120);
  const words = t => (t.match(/\S+/g)||[]).length.toLocaleString();
  if (!again) dsays(said, content ? `${words(content)} words` : null);

  if (!S.brains.length){
    dpush("ai", b => { b.innerHTML = rich("Create a brain first. A source needs a scope to be filed against."); });
    return;
  }

  let chk;
  const body = dthinking("Checking for a repeat");
  /* With no link, the source is its name and a fingerprint of its text: the
     same document dropped twice is caught, two documents named alike are not. */
  const fp = bodyTxt ? "#" + fnv(bodyTxt) : "";
  try { chk = await api("/api/drop/check", { link, text: [src, fp].filter(Boolean).join(" ") || content }); }
  catch(e){ fail(body, e.message); return; }

  /* Already held somewhere. That is worth knowing, not a reason to stop: the
     same source often belongs in a second brain. Reusing the extraction it
     already gave up means the second filing reads nothing. */
  if (chk.duplicate && !again){
    const names = (chk.brains||[]).map(x => S.brains.find(y=>y.slug===x)?.name || x);
    body.innerHTML = "";
    body.innerHTML = rich(
      `**Already stored** as \`${esc(chk.sid)}\`, filed ${esc(chk.date||"earlier")} into ` +
      `**${esc(names.join(", ")||"no brain")}**.\n\n` +
      `Filing it into another brain reuses what it already gave up, so nothing gets read twice.`);
    const row = el("div"); row.style.cssText = "display:flex;gap:8px;margin-top:14px";
    const go = el("button","go","File it elsewhere");
    const no = el("button","ghost","Stop");
    no.onclick = () => {
      row.remove(); dropState(null);
      dpush("ai", b => { b.innerHTML = rich("Stopped. Nothing was read and no position moved."); });
    };
    go.onclick = async () => {
      go.disabled = no.disabled = true; row.remove();
      dropState("running");
      const b2 = dthinking("Reading back what it already gave up");
      try {
        let got;
        try { got = await api("/api/drop/again", { sid: chk.sid }); }
        catch(e){ fail(b2, e.message); return; }
        if (got.error){ fail(b2, got.error); return; }
        await planAndCard(b2, chk.sid, chk.link || link, got.ext, 0, chk.brains || []);
      } finally { dropSettled(); }
    };
    /* A source filed under older rules, or filed thinly, deserves a second
       read into the same brain. It needs the text, which a link fetches again
       and pasted text or a document still holds. */
    const redo = el("button","ghost","Read it again here");
    redo.title = "Reads the source again with the current rules and files it into the brain you picked.";
    const text = bodyTxt;
    redo.onclick = async () => {
      row.remove();
      if (S.dropBusy) return;
      S.dropBusy = true; dropState("running", src || said); renderComposer();
      try { await doDrop(src, text || "", true); }
      finally { S.dropBusy = false; dropSettled(); renderComposer(); }
    };
    row.append(go, redo, no); body.append(row);
    return;
  }

  /* A link and no content. The server opens the page, or fetches the transcript
     when it is a video, so pasting is only needed when the text sits somewhere a
     fetch cannot reach. The duplicate check already ran, so a repeat costs
     nothing here. */
  if (!bodyTxt && !link){
    body.innerHTML = "";
    body.innerHTML = rich(
      "**That source has no content.** A link gets opened for you, video or article. " +
      "Anything else needs the text pasted, or a document dropped in.");
    return;
  }
  if (!bodyTxt){
    setThinking(body, "Opening the link");
    let got;
    try { got = await api("/api/fetch", { url: link }); }
    catch(e){ got = { error: e.message }; }

    if (got && got.text){
      bodyTxt = got.text;
    } else {
      body.innerHTML = "";
      body.innerHTML = rich(`**That page needs pasting.** ${esc((got && got.error) || "It gave nothing back.")}`);
      const go = el("button","go","Paste the text");
      go.style.marginTop = "12px"; go.onclick = pasteHere; body.append(go);
      return;
    }
  }

  const CH = S.chunk, chunks = [];
  for (let i=0; i<bodyTxt.length; i+=CH) chunks.push(bodyTxt.slice(i,i+CH));
  /* The passes are independent, so three run at once, the way storing does.
     A 500 page document is about 67 passes: under 20 minutes this way, near an
     hour one at a time. Each part keeps its place, so the order holds. */
  const parts = new Array(chunks.length);
  let nextRead = 0, readDone = 0, readErr = null;
  setThinking(body, chunks.length>1 ? `Reading, pass 0 of ${chunks.length}` : "Reading the source");
  /* A pass the model runs out of time on is read again as two halves, cut at a
     paragraph or a sentence, and the halves read as one part. */
  const readText = async (text, i) => {
    try { return (await apiRetry("/api/drop/read", { chunk: text, part: i+1, total: chunks.length }, { split: true })).part || {}; }
    catch (e) {
      if (!tooBig(e) || text.length < 3000) throw e;
      const mid = text.length >> 1;
      const at = [text.lastIndexOf("\n\n", mid + 2000), text.lastIndexOf(". ", mid + 2000)].find(x => x > mid - 2000) ?? mid;
      const cut = at > 0 ? at + 1 : mid;
      const [a, b] = [await readText(text.slice(0, cut), i), await readText(text.slice(cut), i)];
      return { ...b, ...a, topics: [...(a.topics || []), ...(b.topics || [])],
               quotes: [...(a.quotes || []), ...(b.quotes || [])], thin: [...(a.thin || []), ...(b.thin || [])] };
    }
  };
  const reader = async () => {
    while (nextRead < chunks.length && !readErr){
      const i = nextRead++;
      try {
        parts[i] = await readText(chunks[i], i);
        if (chunks.length > 1) setThinking(body, `Reading, pass ${++readDone} of ${chunks.length}`);
      } catch(e){ readErr = readErr || e; }
    }
  };
  await Promise.all(Array.from({ length: Math.min(3, chunks.length) }, reader));
  if (readErr){ fail(body, readErr.message); return; }

  const ext = {
    title: parts.find(p=>p.title)?.title || src || link || "Untitled source",
    author: parts.find(p=>p.author)?.author || "",
    date: parts.find(p=>p.date)?.date || "",
    /* What the passes agreed the source is: study material or an argument. */
    kind: (() => {
      const n = { study: 0, argument: 0 };
      for (const p of parts) if (n[p.kind] !== undefined) n[p.kind]++;
      return n.study || n.argument ? (n.study >= n.argument ? "study" : "argument") : "";
    })(),
    topics: parts.flatMap(p=>p.topics||[]),
    quotes: parts.flatMap(p=>p.quotes||[]),
    thin: parts.flatMap(p=>p.thin||[]),
  };
  /* A YouTube video is filed under its channel, whoever speaks in it. */
  if (chk.channel) ext.author = chk.channel;

  /* An extraction with no topics means the read came back empty, which is a
     different thing from a source that holds nothing. Left alone, the plan runs
     on nothing and the card reads "nothing new", which blames the source. */
  if (!ext.topics.length){
    body.innerHTML = "";
    body.innerHTML = rich(
      `**The read came back empty.** ${Math.round(bodyTxt.length/1000)}k characters went in and no topic came out.\n\n` +
      `Auto-captions with no punctuation are the usual cause. Paste the transcript from the video's own panel, which carries line breaks.`);
    const go = el("button","go","Paste the text");
    go.style.marginTop = "12px"; go.onclick = pasteHere; body.append(go);
    return;
  }

  await planAndCard(body, chk.sid, link, ext, bodyTxt.length);
}

/**
 * The plan and the card, from an extraction however it arrived: read just now,
 * or reused from a source already stored.
 *
 * `held` names the brains that already carry it, which the plan leaves out so
 * it proposes somewhere new rather than rewriting positions with a source they
 * already hold.
 */
/* ============ long sources, in batches ============ */

/* One model call per request, and each call has to finish inside the server's
   150 second deadline. A 229 topic document planned in one call was cut to its
   first 30,000 characters, and 36 positions rewritten in one call ran out of
   time. Both now go in batches, sized from what was measured. */
const PLAN_TOPICS = 25, PLAN_CHARS = 20000;
const STORE_BATCH = 8, STORE_PARALLEL = 3;
/* Parts of a long source planned at the same time, after the first. */
const PLAN_PARALLEL = 3;

const topicText = t => `### ${t.topic}\n${(t.ideas||[]).join("\n")}\n${(t.data||[]).join("\n")}`;

/** The topics, cut into batches the plan reads whole. */
function topicBatches(topics){
  const out = []; let cur = [], size = 0;
  for (const t of topics){
    const n = topicText(t).length;
    if (cur.length && (cur.length >= PLAN_TOPICS || size + n > PLAN_CHARS)){ out.push(cur); cur = []; size = 0; }
    cur.push(t); size += n;
  }
  if (cur.length) out.push(cur);
  return out.length ? out : [[]];
}

const unitKey = (brain, title) => `${brain}/${conceptSlug(title)}`;

/**
 * The whole source planned, a batch at a time, merged into one plan.
 *
 * Batches run in order, and each sees the titles proposed before it, so an
 * idea that recurs through the document is filed under one name.
 */
async function planAll(ext, held, progress){
  /* A stored extraction keeps its kind with the note's findings. */
  if (!ext.kind && ext.findings && ext.findings.kind) ext = { ...ext, kind: ext.findings.kind };
  const batches = topicBatches(ext.topics || []);
  const merged = { brains: [], matched: [], candidates: [], new: [], echo: [], conflicts: [] };
  const seenM = new Set(), seenC = new Set(), seenX = new Set();
  const addMatched = m => {
    const had = merged.matched.find(x => x.conceptId === m.conceptId);
    if (!had){ seenM.add(m.conceptId); merged.matched.push({ ...m }); return; }
    if (m.whatItAdds) had.whatItAdds = `${had.whatItAdds || ""} ${m.whatItAdds}`.trim().slice(0, 600);
    if (m.related) had.related = [...new Set([...(had.related || []), ...m.related])];
  };
  const heldConcept = (brain, title) => {
    const id = conceptSlug(title), t = String(title || "").trim().toLowerCase();
    return S.concepts.find(x => x.brain === brain && (x.slug === id || String(x.title || "").trim().toLowerCase() === t));
  };
  /* A part the model runs out of time on is planned again as two halves, and
     both plans are absorbed. */
  const planOne = i => planTopics(batches[i]);
  const planTopics = topics => planCall(topics).then(p => [p]).catch(async e => {
    if (!tooBig(e) || topics.length < 2) throw e;
    const h = Math.ceil(topics.length / 2);
    return [...await planTopics(topics.slice(0, h)), ...await planTopics(topics.slice(h))];
  });
  const planCall = topics => apiRetry("/api/drop/plan", {
      ext: { ...ext, topics },
      /* Several brains ticked: the plan feeds each one. None: it picks. */
      ...(S.into.length > 1 ? { brains: S.into } : { brain: S.into[0] || "all" }),
      ...(held && held.length ? { exclude: held } : {}),
      ...(merged.candidates.length ? { proposed: merged.candidates.map(c => `${c.brain} | ${c.title}`) } : {}),
    }, { split: true }).then(r => r.plan || {});
  const absorb = p => {
    for (const b of p.brains || []) if (!merged.brains.includes(b)) merged.brains.push(b);
    for (const m of p.matched || []) addMatched(m);
    for (const c of p.candidates || []){
      /* A "new" idea the brain already holds under that title is a match: filed
         as a candidate, it reached the same concept twice and one write lost
         the other's evidence. */
      const known = heldConcept(c.brain, c.title);
      if (known){ addMatched({ conceptId: `${known.brain}/${known.slug}`, brain: known.brain, whatItAdds: c.why, related: c.related }); continue; }
      const k = unitKey(c.brain, c.title);
      if (seenM.has(k)){ addMatched({ conceptId: k, whatItAdds: c.why, related: c.related }); continue; }
      if (seenC.has(k)){
        /* Proposed again by a later batch: what that batch saw joins it. */
        const had = merged.candidates.find(x => unitKey(x.brain, x.title) === k);
        if (had && c.why) had.why = `${had.why || ""} ${c.why}`.trim().slice(0, 600);
        if (had && c.related) had.related = [...new Set([...(had.related || []), ...c.related])];
        continue;
      }
      seenC.add(k); merged.candidates.push({ ...c });
    }
    merged.new.push(...(p.new || []));
    merged.echo.push(...(p.echo || []));
    for (const x of p.conflicts || []){
      const k = `${x.conceptId || `${x.brain}/${x.concept}`}|${x.says || ""}`;
      if (seenX.has(k)) continue;
      seenX.add(k); merged.conflicts.push(x);
    }
  };

  /* The first part alone, so its titles are the vocabulary the others reuse.
     Then three parts at a time, each seeing every title proposed before its
     group: a 207 page source plans in about a third of the time. */
  let done = 0;
  const tick = () => { if (batches.length > 1) progress(++done, batches.length); };
  for (const p of await planOne(0)) absorb(p);
  tick();
  for (let i = 1; i < batches.length; i += PLAN_PARALLEL){
    const group = await Promise.all(batches.slice(i, i + PLAN_PARALLEL).map((_, k) => planOne(i + k).then(p => { tick(); return p; })));
    for (const ps of group) for (const p of ps) absorb(p);
  }

  /* Parts planned side by side cannot see each other's titles, and a part
     can propose a new concept for an idea a folder holds in other words or in
     another language. One call reads the new titles beside the closest ones
     held: twins fold into one, an idea already held joins its concept, and a
     title not in English gets its English one. If it fails, nothing changes. */
  if (merged.candidates.length){
    try {
      const sent = merged.candidates.slice();
      const r = await api("/api/drop/merge", {
        candidates: sent.map(c => ({ brain: c.brain, title: c.title, why: c.why || "" })) });
      /* Where a title went: another title, or a concept already held. */
      const to = new Map();
      const point = (x, where) => {
        for (const k of [`${x.brain}/${x.title}`, x.title, `${x.brain}/${conceptSlug(x.title)}`]) to.set(k, where);
      };
      const gone = new Set();
      for (const g of r.same || []){
        const keep = sent[g[0]];
        if (!keep) continue;
        for (const j of g.slice(1)){
          const x = sent[j];
          if (!x || x === keep || x.brain !== keep.brain || gone.has(x)) continue;
          keep.why = `${keep.why || ""} ${x.why || ""}`.trim().slice(0, 600);
          keep.related = [...new Set([...(keep.related || []), ...(x.related || [])])];
          gone.add(x); point(x, `${keep.brain}/${keep.title}`);
        }
      }
      for (const { i, id } of r.into || []){
        const x = sent[i];
        if (!x || gone.has(x) || !S.concepts.some(c => `${c.brain}/${c.slug}` === id)) continue;
        addMatched({ conceptId: id, brain: x.brain, whatItAdds: x.why, related: x.related });
        gone.add(x); point(x, id);
      }
      for (const { i, title } of r.english || []){
        const x = sent[i];
        if (!x || gone.has(x)) continue;
        /* The English title may already be a concept, or another new one. */
        const known = heldConcept(x.brain, title);
        const twin = merged.candidates.find(c => c !== x && !gone.has(c) && unitKey(c.brain, c.title) === unitKey(x.brain, title));
        if (known){
          addMatched({ conceptId: `${known.brain}/${known.slug}`, brain: known.brain, whatItAdds: x.why, related: x.related });
          gone.add(x); point(x, `${known.brain}/${known.slug}`);
        } else if (twin){
          twin.why = `${twin.why || ""} ${x.why || ""}`.trim().slice(0, 600);
          twin.related = [...new Set([...(twin.related || []), ...(x.related || [])])];
          gone.add(x); point(x, `${twin.brain}/${twin.title}`);
        } else {
          point(x, `${x.brain}/${title}`);
          x.title = title;
        }
      }
      if (to.size){
        /* Links that named an old title now name where it went, so none
           points at a concept that will never exist. */
        const remap = l => [...new Set((l || []).map(r => to.get(r) ?? r))];
        merged.candidates = merged.candidates.filter(c => !gone.has(c));
        for (const c of merged.candidates) if (c.related) c.related = remap(c.related);
        for (const m of merged.matched) if (m.related) m.related = remap(m.related);
      }
    } catch (_) {}
  }

  /* A ruling only lands on a concept this drop rewrites, so every concept a
     conflict names is rewritten. */
  for (const x of merged.conflicts){
    const c = x.conceptId && S.concepts.find(y => `${y.brain}/${y.slug}` === x.conceptId);
    if (c && !seenM.has(x.conceptId)) addMatched({ conceptId: x.conceptId, brain: c.brain, whatItAdds: x.says || "" });
  }
  return merged;
}

/**
 * Store a drop, a part at a time, in one press.
 *
 * What is stored is tracked by concept, not by part, so a part the model runs
 * out of time on is split in two and both halves go on their own, down to one
 * concept, with nothing written twice. A press after a real failure picks up
 * where the last one stopped.
 */
async function storeAll(pc, progress){
  const plan = pc.plan;
  const keyOf = u => u.matched ? "m:" + u.matched.conceptId : "c:" + unitKey(u.candidate.brain, u.candidate.title);
  const units = [
    ...(plan.matched || []).map(m => ({ matched: m })),
    ...(plan.candidates || []).map(c => ({ candidate: c })),
  ];
  pc.done = pc.done || new Set();
  pc.written = pc.written || new Set();
  const earlier = units.filter(u => pc.done.has(keyOf(u))).length;
  const todo = units.filter(u => !pc.done.has(keyOf(u)));
  const queue = [];
  for (let i = 0; i < todo.length; i += STORE_BATCH) queue.push(todo.slice(i, i + STORE_BATCH));
  /* A plan with nothing to rewrite still stores its source and its note. */
  if (!queue.length && !pc.noted) queue.push([]);
  let total = queue.length, stored = 0;

  /* The source's text travels once. The first part carries it and the whole
     plan, and the server keeps both with the source's note; the other parts
     send their slice and the server reads the text back from the note. */
  const slim = { title: pc.ext.title, author: pc.ext.author, date: pc.ext.date, kind: pc.ext.kind };
  /* A note keeps 500 passages at most, to fit a database row. A longer source
     sends its text with every part, so no part reads a note cut short. */
  const every = (pc.ext.topics || []).length > 450;
  const body = (part, whole) => {
    whole = whole || every || pc.sendAll;
    return {
      sid: pc.sid, link: pc.link, linkLater: true,
      ext: whole ? pc.ext : slim,
      plan: { brains: plan.brains, conflicts: plan.conflicts, new: [], echo: [],
              matched: part.filter(u => u.matched).map(u => u.matched),
              candidates: part.filter(u => u.candidate).map(u => u.candidate) },
      ...(whole ? { fullPlan: plan } : {}),
      choices: pc.choices,
    };
  };

  const results = [];
  const send = async part => {
    const whole = !pc.noted;
    try {
      const r = await apiRetry("/api/drop/settle", body(part, whole), { split: true });
      results.push(r);
      for (const u of part) pc.done.add(keyOf(u));
      for (const id of r.written || []) pc.written.add(id);
      if (whole) pc.noted = true;
      /* The note kept fewer passages than the source has: the other parts send
         the text themselves rather than read a note cut short. */
      if (whole && r.noteTopics != null && r.noteTopics < (pc.ext.topics || []).length) pc.sendAll = true;
      progress(++stored, total);
    } catch (e) {
      if (!tooBig(e) || part.length < 2) throw e;
      /* Too big for one call: two halves, the first carrying the note if it
         is not written yet. */
      const h = Math.ceil(part.length / 2);
      total++;
      await send(part.slice(0, h));
      await send(part.slice(h));
    }
  };

  /* A part that fails for another reason does not stop the others. It gets
     one more try once they are in, and only then does the press end short. */
  let failed = null;
  const again = [];
  /* The first part alone, so the note exists before any part reads it. */
  if (!pc.noted && queue.length){
    const first = queue.shift();
    try { await send(first); }
    catch (e) { failed = e; again.push(first); }
  }
  const worker = async () => {
    while (queue.length){
      const part = queue.shift();
      try { await send(part); }
      catch (e) { failed = e; again.push(part); }
    }
  };
  /* Without the note, a part cannot read the source back, so the rest waits. */
  if (pc.noted) await Promise.all(Array.from({ length: Math.min(STORE_PARALLEL, queue.length) }, worker));
  if (again.length){
    failed = null;
    for (const part of again.concat(pc.noted ? [] : queue.splice(0))){
      try { await send(part); } catch (e) { failed = e; }
    }
  }
  if (failed){
    const left = units.filter(u => !pc.done.has(keyOf(u))).length;
    const err = new Error(`${units.length - left} of ${units.length} concepts are stored. ${failed.message} ` +
      `Press Store it again to finish: what is stored is not repeated.`);
    err.partial = true; throw err;
  }
  /* A concept a rewrite reply left out was stored with its claim as its
     position. Its real one is written now, eight to a request. */
  const unwritten = [...new Set(results.flatMap(r => r.unwritten || []))];
  for (let i = 0; i < unwritten.length; i += 8){
    try { await api("/api/concept/rederive", { ids: unwritten.slice(i, i + 8) }); } catch (_) {}
  }
  /* Linking runs once, in the background, over everything this drop wrote. */
  try { await api("/api/drop/link", { sid: pc.sid, ids: [...pc.written] }); } catch (_) {}
  const last = results[results.length - 1] || {};
  /* What the server wrote, not what the plan hoped for. A resumed store counts
     the concepts that landed earlier from the plan, since their answers are gone. */
  return {
    sid: last.sid || pc.sid, brains: last.brains || plan.brains,
    counts: { new: (plan.new || []).length, echo: (plan.echo || []).length },
    positions: results.reduce((n, r) => n + (r.positions || 0), 0) + earlier,
    missed: results.flatMap(r => r.missed || []),
  };
}

async function planAndCard(body, sid, link, ext, len, held){
  setThinking(body, "Comparing against what you hold");
  let plan;
  try {
    plan = await planAll(ext, held, (i, n) => setThinking(body,
      `Comparing against what you hold, part ${i} of ${n}`));
  } catch(e){ fail(body, e.message); return; }

  /* A plan that files nothing anywhere is a failed read, not an empty source.
     Rendering the card would offer Store it on a source that touches no
     position, and the store would refuse. Say what happened instead. */
  const lands = (plan.matched||[]).length + (plan.candidates||[]).length + (plan.new||[]).length;
  if (!lands){
    body.innerHTML = "";
    body.innerHTML = rich(
      `**The plan found nothing to file.** ${len ? `${Math.round(len/1000)}k characters were read` : "The stored extraction was reused"}, ` +
      `and no concept, candidate or new claim came back.\n\n` +
      `An auto-caption with no punctuation is the usual cause. Paste the transcript from the video's own panel, which carries sentences.`);
    const go = el("button","go","Paste the text");
    go.style.marginTop = "12px"; go.onclick = pasteHere; body.append(go);
    S.pendingCard = null; renderComposer();
    return;
  }

  /* Position-changing clashes lead, nuance follows. Both get a say, because
     you are the one who holds these positions. */
  const decide = [...(plan.conflicts||[]).filter(c=>c.kind==="flip"),
                  ...(plan.conflicts||[]).filter(c=>c.kind!=="flip")];
  const pc = { sid, link, ext, plan, choices:{}, byKey:{}, len };
  S.pendingCard = pc; renderComposer();
  dropState("card", ext.title);
  tabTitle(document.hidden ? "Card ready" : "");

  body.innerHTML = "";
  body.append(buildCard(pc, decide));

  /* How the source was read, which decided the grain. The AI picks it from
     the source itself: every rule its own concept for study material, ideas
     rather than passages for an argument. */
  const kind = ext.kind || (ext.findings && ext.findings.kind) || "";
  const topics = (ext.topics||[]).length;
  const filed = (plan.matched||[]).length + (plan.candidates||[]).length;
  if (topics >= 3){
    const how = kind === "study" ? "Read as study material: one concept per rule, formula and method."
      : kind === "argument" ? "Read as an argument: passages making the same point share one concept."
      : "";
    body.append(el("div","coverage",
      `${how}${how ? " " : ""}${topics} passage${topics === 1 ? "" : "s"} read, filed into ${filed} concept${filed === 1 ? "" : "s"}.`));
  }
  dbottom();
}

/* A source is stored under a named author. The same test the server holds:
   an empty name, or "unknown" and its kin, is no author. */
const knownAuthor = a => {
  const t = String(a ?? "").trim();
  return t.length >= 2 && !/^(unknown|inconnu|anonymous|anonyme|n\/?a|none|null|undefined|not found|\?+|-+)\b/i.test(t);
};

/** The authors the given brains already hold, the most frequent first. */
function authorsIn(slugs){
  const n = new Map();
  for (const s of S.sources){
    if (!(s.brains || []).some(b => slugs.includes(b)) || !knownAuthor(s.author)) continue;
    const a = String(s.author).trim();
    n.set(a, (n.get(a) || 0) + 1);
  }
  return [...n].sort((x, y) => y[1] - x[1] || x[0].localeCompare(y[0])).map(x => x[0]).slice(0, 40);
}

/* The decision travels under the concept it concerns, never under a position
   number, because the rewriter reads it per concept. */
const ckey = (c, i) => c.conceptId || (c.brain && c.concept ? c.brain+"/"+c.concept : c.concept) || ("c"+i);

function buildCard(pc, decide){
  const { sid, ext, plan } = pc;
  const card = el("div","card");
  const top = el("div","card-top");
  top.append(el("span","id",sid),
    el("span","meta",[ext.date,
      pc.len ? Math.round(pc.len/1000)+"k chars" : "read already"].filter(Boolean).join(" · ")));
  card.append(top);

  const dl = el("dl","card-grid");
  const row = (k,node) => { dl.append(el("dt",null,k)); const d=el("dd"); d.append(node); dl.append(d); };

  /* The author the reading found, filled in. When it found none, the person
     picks one of the authors these brains already hold, or writes a new
     name. Nothing is stored without one. */
  const who = el("div","author");
  const whoIn = el("input");
  whoIn.id = "cardAuthor"; whoIn.autocomplete = "off"; whoIn.spellcheck = false;
  whoIn.placeholder = "Who wrote or said it";
  whoIn.value = knownAuthor(ext.author) ? String(ext.author).trim() : "";
  whoIn.oninput = () => whoIn.classList.remove("bad");
  const known = whoIn.value ? [] : authorsIn(plan.brains || []);
  let whoPick = null;
  if (known.length){
    whoPick = el("select");
    whoPick.id = "cardAuthorPick";
    whoPick.append(Object.assign(el("option",null,"Pick the author"), { value: "", disabled: true, selected: true }));
    for (const a of known) whoPick.append(Object.assign(el("option",null,a), { value: a }));
    whoPick.append(Object.assign(el("option",null,"Someone else..."), { value: "__other__" }));
    whoIn.hidden = true;
    whoPick.onchange = () => {
      whoPick.classList.remove("bad");
      const other = whoPick.value === "__other__";
      whoIn.hidden = !other;
      whoIn.value = other ? "" : whoPick.value;
      if (other) whoIn.focus();
    };
    who.append(whoPick);
  }
  const whoHint = el("div","author-hint", whoIn.value
    ? (/youtu\.?be/.test(pc.link || "") ? "The YouTube channel. Rewrite it if it is wrong." : "Found in the source. Rewrite it if it is wrong.")
    : known.length ? "The source names no one. Pick who wrote or said it, or someone else."
    : "The source names no one. Write who wrote or said it.");
  who.append(whoIn, whoHint);
  row("Author", who);

  row("Goes to", el("span",null,
    (plan.brains||[]).map(x => { const b=S.brains.find(y=>y.slug===x); return b?`${b.name} (${b.type})`:x; }).join(" · ") || "no brain matched"));

  const cc = el("div","chips");
  (plan.matched||[]).forEach(m => {
    const c = S.concepts.find(x => `${x.brain}/${x.slug}` === m.conceptId);
    cc.append(el("span","chip", c?c.title:String(m.conceptId||"").split("/").pop()));
  });
  /* A candidate is a concept the brain does not hold yet. It becomes one when
     the drop is stored. */
  (plan.candidates||[]).forEach(m => cc.append(el("span","chip cand","+ "+m.title)));
  if (!cc.children.length) cc.append(el("span","chip none","none"));
  const cbox = el("div");
  cbox.append(cc);
  if ((plan.candidates||[]).length)
    cbox.append(el("div","chip-note", "Orange ones are new here. Each becomes a position when you store it."));
  row("Concepts", cbox);

  const nu = el("ul");
  (plan.new||[]).slice(0,3).forEach(x => nu.append(el("li",null,"· "+x)));
  if (!(plan.new||[]).length) nu.append(el("li","none","nothing new"));
  else if ((plan.new||[]).length>3) nu.append(el("li","none",`and ${plan.new.length-3} more`));
  row(`New ${(plan.new||[]).length||""}`, nu);

  const eu = el("ul");
  (plan.echo||[]).slice(0,3).forEach(x => eu.append(el("li",null,`· ${x.claim} — repeats ${x.repeatsSource||"an earlier source"}`)));
  if (!(plan.echo||[]).length) eu.append(el("li","none","none"));
  row(`Echoes ${(plan.echo||[]).length||""}`, eu);

  card.append(dl);

  if (decide.length){
    const wrap = el("div","conflicts");
    decide.forEach((c,i) => {
      const key = ckey(c,i);
      const f = el("div","cf"); f.append(el("span","n",String(i+1)));
      const r = el("div");
      r.append(el("div","cn", c.concept + (c.brain ? "  ·  "+(S.brains.find(b=>b.slug===c.brain)?.name||c.brain) : "")));
      r.append(el("div", c.kind==="flip" ? "kind big" : "kind",
        c.kind==="flip" ? "changes the position"
        : c.kind==="drift" ? "same person, later view"
        : "adds nuance, position holds"));
      const mk = (lab,val,date) => { const d=el("div","side"); d.append(el("span",null,lab), document.createTextNode(String(val||"") + (date?`, ${date}`:""))); return d; };
      r.append(mk("new", c.says, c.saysDate), mk("stored", c.stored, c.storedDate));
      if (c.why) r.append(el("div","why","They differ because "+c.why));
      const opts = el("div","opts");
      [["both","keep both"],["new","new wins"],["old","mine wins"],["skip","reject source"]].forEach(([v,lab]) => {
        const o = el("button","opt"+(v==="both"?" dflt on":""), lab);
        o.onclick = () => { pc.choices[key]=v; [...opts.children].forEach(x=>x.classList.remove("on")); o.classList.add("on"); };
        opts.append(o);
      });
      pc.choices[key] = "both";
      pc.byKey[key] = c;
      r.append(opts); f.append(r); wrap.append(f);
    });
    card.append(wrap);
  }

  const foot = el("div","card-foot");
  /* A caveat IS a contradiction, it just does not change a position. Saying
     "no conflict" while one sits above the line reads as a lie. */
  foot.append(el("span","hint", decide.length
    ? `${decide.length} contradiction${decide.length===1?"":"s"} to settle. Silence keeps both, so a long list costs you nothing.`
    : "Nothing here contradicts what you hold."));
  const skip = el("button","ghost","Reject source");
  const ok   = el("button","go","Store it");
  skip.onclick = () => { card.remove(); S.pendingCard=null; dropState(null);
    dpush("ai", b => { b.innerHTML = rich("Rejected. Nothing was stored and no position moved."); }); };
  ok.onclick = async () => {
    const author = whoIn.value.trim();
    if (!knownAuthor(author)){
      const field = whoIn.hidden && whoPick ? whoPick : whoIn;
      field.classList.add("bad");
      whoHint.textContent = whoIn.hidden ? "Pick the author first. Nothing is stored without one."
        : "Write the author first. Nothing is stored without one.";
      field.focus();
      return;
    }
    pc.ext.author = author;
    ok.disabled = skip.disabled = true; ok.textContent = "Storing";
    if (Object.values(pc.choices).includes("skip")){
      card.remove(); S.pendingCard=null; dropState(null);
      dpush("ai", b => { b.innerHTML = rich("Rejected on a conflict. Nothing was stored and no position moved."); });
      return;
    }
    dropState("storing");
    const b2 = dthinking("Rewriting the positions it touched");
    try {
      const r = await storeAll(pc, (i, n) => { if (n > 1) setThinking(b2, `Rewriting the positions it touched, part ${i} of ${n}`); });
      card.remove(); await refresh();
      tabTitle(document.hidden ? "Stored" : "");
      b2.innerHTML = "";
      b2.append(receipt(r, pc));
      dbottom();
      S.pendingCard = null;
      dropState("stored");
    } catch(e){
      ok.disabled = skip.disabled = false; ok.textContent = "Store it";
      dropState("card");
      /* Part of a long source may already be in: the card stays, and pressing
         Store it again finishes the rest. */
      if (e.partial){ b2.innerHTML = rich("**Part of it is stored.** " + esc(e.message)); await refresh(); }
      else fail(b2, e.message);
    }
  };
  foot.append(skip, ok); card.append(foot);
  return card;
}

function receipt(r, pc){
  const names = (r.brains||[]).map(x => S.brains.find(b=>b.slug===x)?.name || x).join(", ") || "none";
  const ch = Object.values(pc.choices||{});
  const flipped = ch.filter(x=>x==="new").length, both = ch.filter(x=>x==="both").length;
  const open = Object.entries(pc.choices||{}).filter(([,v])=>v==="both")
    .map(([k]) => (pc.byKey||{})[k]?.concept).filter(Boolean);
  const d = el("div","receipt");
  d.innerHTML =
`Stored <span class="v">${esc(r.sid)}</span>. Brains <span class="v">${esc(names)}</span>.
Rewritten: <span class="v">${r.positions}</span> position${r.positions===1?"":"s"}
<span class="v">${r.counts?.new ?? 0}</span> new · <span class="v">${r.counts?.echo ?? 0}</span> echoes · <span class="v">${flipped}</span> flipped · <span class="v">${both}</span> kept both
Open conflicts: <span class="v">${esc(open.join(", ")||"none")}</span>`;
  /* A match the server could not find is said, never dropped quietly. */
  if ((r.missed||[]).length){
    d.innerHTML += `\nNot filed: <span class="v">${esc(r.missed.join(", "))}</span>. Those concepts no longer exist under that id.`;
  }

  return d;
}

/* ============ export ============ */
async function exportAll(){
  /* The app holds names and summary lines. The whole concepts are read here,
     brain by brain, only when an export is asked for. */
  const whole = {};
  for (const b of S.brains){
    try {
      const all = []; let cursor = null;
      do {
        const r = await api("/api/export", { brain: b.slug, cursor });
        all.push(...(r.concepts || [])); cursor = r.next || null;
      } while (cursor);
      whole[b.slug] = all.sort((x,y)=>(x.n||0)-(y.n||0));
    }
    catch (_) { whole[b.slug] = conceptsOf(b.slug); }
  }
  const out = ["# MAP\n\n| Brain | Type | Concepts | Scope |\n|---|---|---|---|"];
  for (const b of S.brains) out.push(`| brain-${b.type}-${b.slug} | ${b.type} | ${conceptsOf(b.slug).length} | ${b.scope} |`);
  out.push("\n# SOURCES\n\n| Id | Date | Author | Link | Brains |\n|---|---|---|---|---|");
  for (const s of S.sources) out.push(`| ${s.sid} | ${s.date||""} | ${s.author||""} | ${s.link||""} | ${(s.brains||[]).join(", ")} |`);
  for (const b of S.brains){
    out.push(`\n# brain-${b.type}-${b.slug}/SUMMARY.md\n\n**Scope:** ${b.scope}\n`);
    for (const c of whole[b.slug]) out.push(`- ${c.title}: ${c.summaryLine||c.position||"no position yet"}. \`${pad2(c.n||1)}-${c.slug||conceptSlug(c.title)}.md\``);
    for (const c of whole[b.slug]){
      out.push(`\n## brain-${b.type}-${b.slug}/${pad2(c.n||1)}-${c.slug||conceptSlug(c.title)}.md\n`);
      out.push(`### Position\n\n${c.position||"none yet"}\n`);
      out.push(`### Evidence\n\n${(c.evidence||[]).map(e=>`- ${e.date||"?"}, ${e.author||"?"}: ${e.claim||""}`).join("\n")||"- none"}\n`);
      out.push(`### Data\n\n${(c.data||[]).map(x=>"- "+x).join("\n")||"- none"}\n`);
      out.push(`### Open conflicts\n\n${(c.conflicts||[]).map(x=>`- ${x.a} (${x.aDate}) against ${x.b} (${x.bDate}). They differ because ${x.why}.`).join("\n")||"- none"}\n`);
      out.push(`### Sources\n\n${(c.sources||[]).map(x=>"- `notes/"+x+".md`").join("\n")||"- none"}\n`);
      out.push(`### Updated\n\n${c.updated||""}\n`);
    }
  }
  const md = out.join("\n");
  const name = `${(S.spaceName || "brains").toLowerCase()}-brains-${new Date().toISOString().slice(0,10)}.md`;
  const url = URL.createObjectURL(new Blob([md], { type: "text/markdown" }));
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  push("ai", b => { b.innerHTML = rich(
    `**Exported** \`${esc(name)}\`: ${S.brains.length} brain${S.brains.length===1?"":"s"}, ` +
    `${S.concepts.length} concept${S.concepts.length===1?"":"s"}, ${S.sources.length} source${S.sources.length===1?"":"s"}, ` +
    `${Math.round(md.length/1000)}k characters of markdown.`); });
  bottom();
}

})();
</script>
