    shareTo.innerHTML = "";
    for (const t of r.targets){
      const o = el("option", null, t.mode === "read" ? `${t.name} (read only)` : t.name); o.value = t.slug; shareTo.append(o);
    }
    if (r.targets.some(t => t.slug === was)) shareTo.value = was;
    const n = r.brains.filter(b => b.to.length).length;
    shareCount.textContent = n ? `${n} shared` : "";
    paintRows();
  };
  const paintRows = () => {
    const r = shareData, t = r.targets.find(x => x.slug === shareTo.value);
    shareSlot.innerHTML = "";
    shareNote.textContent = !t ? "There is no other workspace to share with." : t.mode === "read"
      ? `Everyone who opens ${t.name} can read the brains you share there. Nobody there can change them.`
      : `${t.name} can read these brains and feed them. A drop there fills them here too.`;
    if (t && !r.brains.length) shareSlot.append(el("div","hint","No brain here to share yet."));
    for (const b of t ? r.brains : []){
      const on = b.to.includes(t.slug);
      const row = el("div","sh-row");
      row.append(el("span","sh-name",b.name));
      const chip = el("button","sh-chip" + (on ? " on" : ""), on ? "Shared" : "Share");
      chip.type = "button"; chip.setAttribute("aria-pressed", on ? "true" : "false");
      chip.setAttribute("aria-label", `${on ? "Stop sharing" : "Share"} ${b.name} with ${t.name}`);
      chip.onclick = async () => {
        chip.disabled = true; shareMsg.textContent = "Saving";
        try {
          paintShare(await api("/api/share", { brain: b.slug, to: t.slug, on: !on }));
          shareMsg.textContent = on ? `${b.name} is no longer in ${t.name}.`
            : t.mode === "read" ? `${b.name} is now readable in ${t.name}.` : `${b.name} is now in ${t.name} too. A drop in either fills both.`;
          refresh().catch(() => {});
        } catch (e) { chip.disabled = false; shareMsg.textContent = e.message; }
      };
      row.append(chip); shareSlot.append(row);
    }
    if (r.joined.length){
      shareSlot.append(el("div","sh-sub","Shared with this workspace"));
      for (const b of r.joined){
        const row = el("div","sh-row");
        row.append(el("span","sh-name",b.name), el("span","sh-from",`from ${b.fromName}${b.readOnly ? ", read only" : ""}`));
        const leave = el("button","mini","Leave it");
        leave.type = "button";
        leave.onclick = async () => {
          leave.disabled = true; shareMsg.textContent = "Leaving";
          try {
            paintShare(await api("/api/share", { brain: b.slug, leave: true }));
            shareMsg.textContent = `${b.name} is no longer in this workspace. It stays in ${b.fromName}.`;
            if (S.scope === b.slug) S.scope = "all";
            refresh().catch(() => {});
          } catch (e) { leave.disabled = false; shareMsg.textContent = e.message; }
        };
        row.append(leave); shareSlot.append(row);
      }
    }
  };
  shareTo.onchange = () => { shareMsg.textContent = ""; paintRows(); };
  if (ownerWs()) api("/api/share", {}).then(paintShare).catch(e => { shareSlot.innerHTML = ""; shareMsg.textContent = e.message; });

  /* ---- the model and the export ---- */
  veil.querySelector("#setModel").hidden = S.demo;
  veil.querySelector("#setModel").onclick = () => { shut(); openModelSheet("chat"); };
  veil.querySelector("#setMap").onclick = () => { shut(); openMap(); };
  veil.querySelector("#setTidy").hidden = S.demo;
  /* Languages: saved for the workspace on a tap. */
  const langSeg = (id, key, def, said) => {
    const seg = veil.querySelector("#" + id), msg = veil.querySelector("#langMsg");
    const paint = () => { for (const x of seg.children){ const on = x.dataset.v === (S.models?.[key] || def); x.classList.toggle("on", on); x.setAttribute("aria-checked", String(on)); } };
    seg.closest(".lang-row").hidden = key === "voice" && !(window.SpeechRecognition || window.webkitSpeechRecognition);
    paint();
    seg.onclick = async e => {
      const x = e.target.closest("button[data-v]");
      if (!x || x.dataset.v === (S.models?.[key] || def)) return;
      msg.textContent = "Saving";
      try {
        const r = await api("/api/models", { [key]: x.dataset.v || null });
        S.models = { ...(S.models || {}), reply: r.reply, voice: r.voice };
        paint(); msg.textContent = said(x.dataset.v);
      } catch (err) { msg.textContent = err.message; }
    };
  };
  langSeg("langReply", "reply", "same", v => v === "en" ? "Saved. Answers come back in English." : "Saved. Answers come back in the language you write in.");
  langSeg("langVoice", "voice", "", v => v ? `Saved. The mic listens in ${(VOICE_LANGS.find(x => x[0] === v) || [])[2] || v}, on every device of this workspace.`
    : "Saved. The mic listens in your browser's language.");
  veil.querySelector("#setTidy").onclick = () => { shut(); openTidyAll(); };
  const exp = veil.querySelector("#setExport");
  exp.onclick = async () => {
    const v = exp.querySelector(".val");
    v.textContent = "reading"; exp.disabled = true;
    try { await exportAll(); v.textContent = "downloaded"; }
    catch (e) { v.textContent = "failed"; msg.className = "bad"; msg.textContent = e.message; }
    finally { exp.disabled = false; setTimeout(() => { v.textContent = "markdown"; }, 2000); }
  };

  /* ---- open conflicts: only the real contradictions, each one settled here ---- */
  const cfSlot = veil.querySelector("#cfSlot"), cfCount = veil.querySelector("#cfCount");
  const brainName = slug => S.brains.find(x => x.slug === slug)?.name || slug;
  let left = 0, others = 0, openList = [];
  const paintCount = () => { cfCount.textContent = left ? String(left) : ""; };
  const none = () => el("div","hint", others
    ? `None to settle. ${others} recorded clash${others === 1 ? " adds" : "es add"} detail rather than contradict${others === 1 ? "s" : ""}, so ${others === 1 ? "it stays" : "they stay"} off this list.`
    : "None to settle.");
  const conflictRow = c => {
    const box = el("div","cf-item");
    const top = el("div","cf-top");
    top.append(el("b",null,c.title), el("span","cf-brain",brainName(c.brain)));
    box.append(top);
    const settle = async (pick, btn) => {
      openList = openList.filter(x => x !== c);
      box.querySelectorAll("button").forEach(x => x.disabled = true);
      btn.textContent = pick === "both" ? "Clearing" : "Rewriting";
      try {
        const r = await api("/api/conflicts/settle", { id: c.id, a: c.a, b: c.b, pick });
        if (r.error || r.ok === false) throw new Error(r.error || r.why);
        box.innerHTML = "";
        box.classList.add("done");
        box.append(el("b",null,c.title), el("div","hint", pick === "both"
          ? "Both hold. It is off the list, and the position is as it was."
          : `Settled. The position now reads: ${r.summaryLine || r.position}`));
        left--; paintCount();
        const deck = cfSlot.querySelector("#cfDeck");
        if (deck){ if (left) deck.textContent = `Review one by one: ${left}`; else deck.remove(); }
        if (!left) cfSlot.append(none());
        refresh();
      } catch (e) {
        openList.push(c);
        box.querySelectorAll("button").forEach(x => x.disabled = false);
        btn.textContent = pick === "both" ? "Both hold" : "This holds";
        /* On the card itself: the sheet's own line sits out of sight, and the
           button only went back to what it said, so a failure looked like nothing. */
        let err = box.querySelector(".cf-err");
        if (!err){ err = el("div","cf-err bad"); err.setAttribute("role","alert"); box.append(err); }
        err.textContent = `Not settled: ${e.message}`;
      }
    };
    for (const [pick, claim, date] of [["a", c.a, c.aDate], ["b", c.b, c.bDate]]){
      const side = el("div","cf-side");
      side.append(el("div","cf-claim", claim), el("div","cf-date", date || "undated"));
      const go = el("button","ghost cf-go","This holds");
      go.onclick = () => settle(pick, go);
      side.append(go);
      box.append(side);
    }
    if (c.why) box.append(el("div","cf-why", "They differ because " + c.why.replace(/^[A-Z]/, m => m.toLowerCase())));
    const both = el("button","mini","Both hold");
    both.onclick = () => settle("both", both);
    box.append(both);
    return box;
  };
  cfSlot.innerHTML = `<div class="hint">Checking</div>`;
  api("/api/conflicts", {}).then(r => {
    cfSlot.innerHTML = "";
    const list = r.conflicts || [];
    left = list.length; others = r.others || 0; paintCount();
    if (!list.length){ cfSlot.append(none()); return; }
    /* One at a time, full screen: the quick way through a long list. */
    openList = list.slice();
    const deck = el("button","go cf-deck-go", `Review one by one: ${list.length}`);
    deck.id = "cfDeck";
    deck.onclick = () => { shut(); openConflictDeck(openList.slice(), others); };
    cfSlot.append(deck);
    for (const c of list) cfSlot.append(conflictRow(c));
    if (others) cfSlot.append(el("div","hint", `${others} more add detail rather than contradict, so they are not listed.`));
  }).catch(e => { cfSlot.innerHTML = `<div class="hint">${esc(e.message)}</div>`; });

  /* ---- the address ---- */
  const paint = (st) => {
    slot.innerHTML = st.has ? `
      <div class="urlbox"><input id="mcpFeed" readonly spellcheck="false" value="${esc(location.origin + "/mcp/v0?k=" + st.token)}"><button id="mcpFeedCopy">Copy</button></div>
      <div class="hint">Made ${esc(st.made || "earlier")}. Paste it into Claude, ChatGPT or any MCP client.
        Keep it private: whoever holds it can read and feed every ${esc(S.spaceName)} brain. The thinking
        runs on that client's own model, so nothing is spent here.</div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button class="ghost" id="mcpNew">Replace it</button>
        <button class="ghost" id="mcpOff">Turn it off</button>
      </div>`
    : `
      <div class="hint">No address yet. Make one and your own Claude or ChatGPT can read the
        ${esc(S.spaceName)} brains and drop sources into them. Every step runs on that client's model, so
        it spends nothing here.</div>
      <div style="margin-top:10px"><button class="ghost" id="mcpMake">Make the ${esc(S.spaceName)} address</button></div>`;

    const copy = veil.querySelector("#mcpFeedCopy");
    if (copy) copyTo(copy, veil.querySelector("#mcpFeed"));
    const act = async (body, note) => {
      msg.className="spin"; msg.textContent = "Saving";
      try { const r = await api("/api/account/mcp", body);
        if (r.error) throw new Error(r.error);
        /* A success note is not an alert, so it reads at hint size. */
        msg.className="hint"; msg.textContent = note; paint(r);
      } catch(e){ msg.className="bad"; msg.textContent = e.message; }
    };
    const mk = veil.querySelector("#mcpMake") || veil.querySelector("#mcpNew");
    if (mk) mk.onclick = () => act({ make: true }, "Address ready. Paste it into your client.");
    const off = veil.querySelector("#mcpOff");
    if (off) off.onclick = () => act({ forget: true }, "Turned off. A client holding it can no longer feed.");
  };

  /* ---- your own key, in a workspace that runs on one ---- */
  const kIn = veil.querySelector("#ownKey"), kMsg = veil.querySelector("#ownKeyMsg");
  if (S.byok){
    kIn.value = myKey();
    kMsg.textContent = myKey() ? "Saved in this browser." : "No key in this browser yet: asking and dropping need one.";
    const saveKey = () => {
      const k = kIn.value.trim();
      if (!/^sk-or-[A-Za-z0-9_-]{20,200}$/.test(k)){ kMsg.textContent = "That is not an OpenRouter key. It starts with sk-or-"; return; }
      setMyKey(k); kMsg.textContent = "Saved in this browser.";
    };
    veil.querySelector("#ownKeySave").onclick = saveKey;
    kIn.onkeydown = e => { if (e.key === "Enter") saveKey(); };
  }

  /* The connector and the transcript service are the owner's. */
  if (!ownerWs()) return;
  slot.innerHTML = `<div class="hint">Checking</div>`;
  try { paint(await api("/api/account/mcp", {})); }
  catch(e){ slot.innerHTML = `<div class="hint">${esc(e.message)}</div>`; }

  /* ---- what the transcript service has cost ---- */
  const use = veil.querySelector("#useSlot");
  use.innerHTML = `<div class="hint">Checking</div>`;
  try { use.innerHTML = usageLines(await api("/api/usage", { days: 30 })); }
  catch(e){ use.innerHTML = `<div class="hint">${esc(e.message)}</div>`; }
}

/**
 * Two counts, because they answer different questions.
 *
 * The vendor's is the one the quota is measured against, so it decides when to
 * start pasting instead. The local one is the pace Octopus itself runs at over
 * the last 30 days, which is what says whether the quota will hold.
 */
function usageLines(u){
  if (!u.configured){
    return `<div class="hint">No transcript service is set, so a video link asks you to paste.
      <a href="/doc">How to turn it on</a>.</div>`;
  }
  const m = u.mine || {}, p = u.plan;
  const mine = `<div class="meter">${m.got || 0} fetched through Octopus in the last ${m.days || 30} days` +
    (m.failed ? `, ${m.failed} asked you to paste` : "") + `.</div>`;

  if (!p){
    return `<div class="hint bad-ish">The service did not report its own count: ${esc(u.why || "no reason given")}</div>` + mine;
  }
  const left = Math.max((p.max || 0) - (p.used || 0), 0);
  const pct = p.max ? Math.min(Math.round((p.used / p.max) * 100), 100) : 0;
  const tight = p.max && left <= Math.max(Math.ceil(p.max * 0.15), 5);
  return `
    <div class="bar"><i style="width:${pct}%" class="${tight?"tight":""}"></i></div>
    <div class="meter"><b>${p.used}</b> of <b>${p.max}</b> credits used this billing period
      &middot; ${esc(p.name)} plan${u.mode === "auto" ? " &middot; generating when captions are missing" : ""}</div>
    ${mine}
    ${tight ? `<div class="hint" style="color:var(--accent)">${left} left. Paste transcripts until it resets.</div>` : ""}`;
}

/* Clipboard access can be refused, so leaving the text selected is the fallback. */
function copyTo(btn, input){
  btn.onclick = async () => {
    input.select();
    try { await navigator.clipboard.writeText(input.value); btn.textContent = "Copied"; }
    catch { btn.textContent = "Press copy"; }
    setTimeout(() => { btn.textContent = "Copy"; }, 1600);
  };
}

/**
 * The model list comes from OpenRouter itself, so the prices shown are the ones
 * that get billed. Only models that accept a JSON response format are offered,
 * because every drop asks for JSON and the rest fail on the first call.
 *
 * Fetched once per tab. A failed fetch leaves the text field, which still works.
 */
let MODELS = null;
async function models(){
  if (MODELS) return MODELS;
  const r = await fetch("https://openrouter.ai/api/v1/models");
  if (!r.ok) throw new Error("OpenRouter did not answer with its model list");
  const d = await r.json();
  MODELS = (d.data || [])
    .filter(m => (m.supported_parameters || []).includes("response_format"))
    .map(m => ({
      id: m.id, name: m.name || m.id,
      inp: Number(m.pricing?.prompt || 0) * 1e6,
      out: Number(m.pricing?.completion || 0) * 1e6,
      ctx: Number(m.context_length || 0),
    }))
    /* A negative price means the router decides at call time, so no number can
       be shown. Those rows would read as "$-1000000 in". */
    .filter(m => m.inp >= 0 && m.out >= 0)
    .sort((a, b) => (a.inp + a.out) - (b.inp + b.out));
  return MODELS;
}

const money = n => n === 0 ? "free" : n < 1 ? "$" + n.toFixed(3).replace(/0+$/,"").replace(/\.$/,"") : "$" + n.toFixed(2);
const ctxOf = n => n >= 1000000 ? Math.round(n/1000000) + "M" : n >= 1000 ? Math.round(n/1000) + "k" : String(n);

/**
 * Pick a model for the whole workspace: the chat's, which also reads Drop and
 * writes one-pagers, or the projects'. Use the default goes back to the one
 * this deployment runs for it.
 */
function openModelSheet(which = "chat"){
  closeSide();
  const proj = which === "project";
  const def = S.models?.[which + "Default"] || (proj ? "" : S.model);
  const veil = el("div","veil");
  veil.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <header><h3>${proj ? "Project model" : "Model"}</h3>
      <p>${proj ? "The model that answers in a project's chat and builds its page, the rebuilds after a drop included."
                : "The model that answers in the chat, reads and files what you drop, and writes one-pagers."}
      It applies to everyone in this workspace. ${S.byok ? "Your own key pays for every call." : "This deployment's key pays for every call."}
      Prices are per million tokens, read from OpenRouter.</p></header>
      <div class="f"><label for="mQ">Search</label><input id="mQ" autocomplete="off" spellcheck="false" placeholder="claude, gemini, free, ...">
        <div class="mlist" id="mList"><div class="mnone">Loading the list</div></div>
      </div>
      <div class="f"><div id="mMsg" class="bad" role="alert"></div></div>
      <footer>
        <button class="ghost" id="mReset">Use the default</button>
        <button class="ghost" id="mCancel">Cancel</button>
        <button class="go" id="mSave">Use this one</button>
      </footer>
    </div>`;
  document.body.append(veil);
  const q = veil.querySelector("#mQ"), list = veil.querySelector("#mList"),
        msg = veil.querySelector("#mMsg"), save = veil.querySelector("#mSave");
  const shut = () => veil.remove();
  veil.querySelector("#mCancel").onclick = shut;
  veil.onclick = e => { if(e.target===veil) shut(); };

  let chosen = S.models?.[which] || def || "";
  let all = [];

  const paint = () => {
    const t = q.value.trim().toLowerCase();
    /* Cheapest first, with the one this deployment runs pinned to the top, so
       the list opens on the model you are already paying for. */
    const hits = (t ? all.filter(m => m.id.toLowerCase().includes(t) || m.name.toLowerCase().includes(t)
                                      || (t === "free" && m.inp === 0 && m.out === 0))
                    : [...all.filter(m => m.id === def), ...all.filter(m => m.id !== def)]).slice(0, 120);
    list.innerHTML = "";
    if (!hits.length){ list.append(el("div","mnone", all.length ? "No model matches that." : "The list did not load. Nothing to pick from.")); return; }
    for (const m of hits){
      const row = el("button","mrow" + (m.id === chosen ? " on" : ""));
      row.append(el("b",null,m.name));
      row.append(el("span",null,
        `${m.id}  ·  ${money(m.inp)} in / ${money(m.out)} out per M  ·  ${ctxOf(m.ctx)} ctx` +
        (m.id === def ? "  ·  default" : "")));
      row.onclick = () => { chosen = m.id; paint(); };
      list.append(row);
    }
  };
  q.oninput = paint;

  models().then(ms => { all = ms; paint(); setTimeout(()=>q.focus(),30); })
    .catch(e => { msg.className="bad"; msg.textContent = e.message; list.innerHTML = ""; list.append(el("div","mnone","The list did not load.")); });

  /* Saved for the workspace, then Settings opens again on the new pick. */
  const keep = async model => {
    save.disabled = true; msg.textContent = "";
    let r;
    try { r = await api("/api/models", { [which]: model }); }
    catch (e) { save.disabled = false; msg.className = "bad"; msg.textContent = e.message; return; }
    S.models = { ...(S.models || {}), chat: r.chat, project: r.project, ...(r.reply ? { reply: r.reply, voice: r.voice } : {}) };
    S.model = r.chat;
    shut(); render(); openSetupSheet();
  };
  veil.querySelector("#mReset").onclick = () => keep(null);
  save.onclick = () => {
    if (!chosen){ msg.className="bad"; msg.textContent="pick one from the list"; return; }
    keep(chosen === def ? null : chosen);
  };
}

/**
 * A new folder. A folder is fed by Drop from sources, and one switch says it
 * holds one person's view: answers then name that person, and a change of
 * mind is logged as a later view instead of a clash. A personal folder is fed
 * by what you say in its chat, and only that chat reads it.
 */
const KIND_ICON = {
  folder: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.2h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>`,
  personal: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>`,
};
function openSheet(name, scope, type){
  closeSide();
  const veil = el("div","veil");
  veil.innerHTML = `
    <div class="sheet roomy" role="dialog" aria-modal="true" aria-labelledby="bTitle">
      <header><h3 id="bTitle">New folder</h3></header>
      <div class="f"><div class="kind" id="bType" role="radiogroup" aria-label="Kind of folder">
        <button type="button" role="radio" data-t="folder"><span class="k-ic">${KIND_ICON.folder}</span><span><b>Folder</b><small>Fed by Drop, from sources</small></span></button>
        <button type="button" role="radio" data-t="personal"><span class="k-ic me">${KIND_ICON.personal}</span><span><b>Personal</b><small>Fed by what you say</small></span></button>
      </div></div>
      <div class="f"><label for="bName">Name</label><input id="bName" autocomplete="off"></div>
      <div class="f" id="bScopeF"><label for="bScope">What it covers, in one line</label><textarea id="bScope"></textarea>
        <div class="hint">Drop reads this line to decide what goes in, so make it specific.</div></div>
      <label class="switch-row" id="bPersonF"><input type="checkbox" id="bPerson" role="switch"><span class="sw" aria-hidden="true"></span>
        <span><b>One person's view</b><small>Answers name this person all the way through. When they change their mind, it is logged as a later view, with nothing for you to rule.</small></span></label>
      <div class="f" id="bMineF" hidden>
        <div class="mine-note">You talk to it, and it files what you say as dated notes, in your words. It can call your other folders.
          <b>Only its own chat reads it.</b></div>
        <label for="bMem" style="margin-top:14px">What it should know about you <span class="optl">(optional)</span></label>
        <textarea id="bMem" placeholder="Paste what another assistant knows about you, or your notes."></textarea></div>
      <div id="closestSlot"></div>
      <footer><button class="ghost" id="bCancel">Cancel</button><button class="go" id="bMake">Create folder</button></footer>
    </div>`;
  document.body.append(veil);
  const nameI = veil.querySelector("#bName"), scopeI = veil.querySelector("#bScope"),
        personI = veil.querySelector("#bPerson"), memI = veil.querySelector("#bMem"), btn = veil.querySelector("#bMake");
  nameI.value = name||""; scopeI.value = scope||"";
  /* Who may feed a folder is not asked: the passphrase feeds every folder, and
     a folder is made closed to other accounts, which is the server's default. */
  let kind = type === "personal" ? "personal" : "folder";
  personI.checked = type === "person";
  const label = () => kind === "personal" ? "Create personal folder" : "Create folder";
  const paint = () => {
    [...veil.querySelectorAll("#bType button")].forEach(b => { const on = b.dataset.t === kind; b.classList.toggle("on", on); b.setAttribute("aria-checked", String(on)); });
    veil.querySelector("#bScopeF").hidden = kind === "personal";
    veil.querySelector("#bPersonF").hidden = kind === "personal";
    veil.querySelector("#bPersonF").classList.toggle("on", personI.checked);
    veil.querySelector("#bMineF").hidden = kind !== "personal";
    if (kind === "personal" && !nameI.value.trim()) nameI.value = "Me";
    if (!btn.disabled) btn.textContent = label();
  };
  paint();
  veil.querySelector("#bType").onclick = e => { const b=e.target.closest("button"); if(b){ kind=b.dataset.t; confirmed = false; veil.querySelector("#closestSlot").innerHTML = ""; paint(); } };
  personI.onchange = paint;

/**
 * Add memory: what another assistant knows about you, pasted or dropped in.
 * It is cut into pieces of about 6,000 characters on paragraph breaks, and
 * each piece is filed like a message, one call at a time.
 */
function memPieces(t, max = 6000){
  const out = []; let cur = "";
  for (const para of String(t).replace(/\r/g, "").split(/\n{2,}/)){
    let p = para.trim();
    if (!p) continue;
    while (p.length > max){
      const cut = Math.max(p.lastIndexOf(". ", max), p.lastIndexOf("\n", max), p.lastIndexOf(" ", max), Math.floor(max / 2));
      if (cur){ out.push(cur); cur = ""; }
      out.push(p.slice(0, cut + 1).trim()); p = p.slice(cut + 1).trim();
    }
    if (cur && cur.length + p.length + 2 > max){ out.push(cur); cur = ""; }
    cur = cur ? cur + "\n\n" + p : p;
  }
  if (cur) out.push(cur);
  return out;
}

function nearest(scope){
  const stop = new Set("the a an and or of for my own to in on with about from at by as is are".split(" "));
  const w = new Set((scope.toLowerCase().match(/[a-z]{3,}/g)||[]).filter(x=>!stop.has(x)));
  let best=null, bestN=0;
  for (const b of S.brains){
    const o = new Set((String(b.scope||"").toLowerCase().match(/[a-z]{3,}/g)||[]).filter(x=>!stop.has(x)));
    let n=0; for (const x of w) if (o.has(x)) n++;
    if (n>bestN){ bestN=n; best=b; }
  }
  return bestN>=2 ? best : null;
}

const FILE_SECTIONS = [["identity","Identity"], ["contact","Contact details"], ["you","You and them"], ["work","Work"], ["tastes","Tastes and character"], ["other","Other"]];
function fileDay(d, noYear){
  const s = String(d || "");
  const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const m = s.match(/^(\d{4})(?:-(\d{2})(?:-(\d{2}))?)?$/);
  if (!m) return s;
  const [, y, mo, da] = m;
  if (!mo) return y;
  const month = M[Number(mo) - 1] || mo;
  if (!da) return noYear ? month : `${month} ${y}`;
  return noYear ? `${Number(da)} ${month}` : `${Number(da)} ${month} ${y}`;
}

  const topLine = el("p","fv-topline"); topLine.hidden = true;
  let topic = null;
  /* A personal folder holds notes and contacts: one card per person, tagged. */
  let tab = self && openId && cs.find(c => `${c.brain}/${c.slug}` === openId)?.tag === "contact" ? "people" : "notes";
  const tabs = el("div","fv-tabs"); tabs.hidden = !self;
  const scan = el("div","fv-scan"); scan.hidden = true;
  const isPerson = c => c.tag === "contact";
  const inTab = list0 => self ? list0.filter(c => (tab === "people") === isPerson(c)) : list0;
  const paintTabs = () => {
    tabs.innerHTML = "";
    for (const [k, label] of [["notes","Notes"], ["people","People"]]){
      const n = cs.filter(c => (k === "people") === isPerson(c)).length;
      const x = el("button","fv-tab" + (tab === k ? " on" : "")); x.type = "button"; x.id = k === "people" ? "fvPeople" : "fvNotes";
      x.append(label, el("i",null,String(n)));
      x.onclick = () => { tab = k; f.value = ""; f.placeholder = k === "people" ? "Filter people" : "Filter notes"; paintTabs(); paint(); paintScan(); };
      tabs.append(x);
    }
  };
  /* The people already in older notes, found once on a click. */
  const paintScan = () => {
    const plain = cs.filter(c => !isPerson(c)).length, bare = cs.filter(c => isPerson(c) && !c.full).length;
    scan.hidden = !self || S.demo || tab !== "people" || (!plain && !bare);
    if (scan.hidden || scan.dataset.busy) return;
    scan.innerHTML = "";
    const go2 = el("button","mini", plain ? "Find people in my notes" : "Build full files"); go2.type = "button"; go2.id = "fvScan";
    go2.title = plain ? `Reads your ${plain} notes once and gives each person they mention a file` : `Writes a full file for the ${bare} people who have only a card`;
    const say = el("span","fv-scan-say");
    go2.onclick = async () => {
      scan.dataset.busy = "1"; go2.disabled = true;
      let at = 0, found = new Set();
      try {
        for (let i = 0; plain && i < 100; i++){
          say.textContent = `Reading your notes${at ? `: ${at} read` : ""}`;
          const r = await api("/api/personal/people", { brain: b.slug, at });
          for (const x of r.filed?.people || []) found.add(x);
          say.textContent = `${r.read} of ${r.total} notes read · ${found.size} contact${found.size === 1 ? "" : "s"}`;
          if (r.next == null) break;
          at = r.next;
        }
        /* Then every person with only a card gets a full file, 5 at a time. */
        for (let i = 0; i < 200; i++){
          say.textContent = `Building full files${found.size ? ` · ${found.size} people so far` : ""}`;
          const r = await api("/api/personal/people", { brain: b.slug, phase: "files" });
          for (const x of r.filed?.people || []) found.add(x);
          if (r.next == null) break;
          say.textContent = `Building full files · ${r.left} to go`;
        }
        delete scan.dataset.busy;
        await reload();
        say.textContent = `Done: ${found.size} ${found.size === 1 ? "person" : "people"} filed.`;
        go2.remove(); scan.hidden = false;
      } catch (e) { delete scan.dataset.busy; go2.disabled = false; say.textContent = e.message; }
    };
    scan.append(go2, say);
  };
  if (self) paintTabs();
  list.append(tabs, f, scan, tops, topLine, rows);
  if (!self) api("/api/topics", { brain: b.slug }).then(r => {
    const list2 = (r.topics || []).filter(t => t.members.length);
    if (!list2.length || S.folder !== b.slug) return;
    tops.hidden = false;
    const chip = (t, label) => {
      const x = el("button","fv-top" + (t === topic ? " on" : "")); x.type = "button";
      x.append(label); if (t) x.append(el("i",null,String(t.members.length)));
      x.onclick = () => { topic = t; paintTops(); paint(); };
      return x;
    };
    const paintTops = () => {
      tops.innerHTML = "";
      tops.append(chip(null, "All"));
      for (const t of list2) tops.append(chip(t, t.title));
      topLine.hidden = !topic; topLine.textContent = topic ? topic.summary : "";
    };
    paintTops();
  }).catch(() => {});
  const doc = el("div","fv-doc");
  cols.append(list, doc);
  fv.append(head, cols);

  let openNow = null;
  const paint = () => {
    rows.innerHTML = "";
    const q = f.value.trim().toLowerCase();
    const base = inTab(topic ? cs.filter(c => topic.members.includes(`${c.brain}/${c.slug}`)) : cs);
    const shown = q ? base.filter(c => (c.title + " " + (c.summaryLine || "") + " " + (c.aliases || []).join(" ")).toLowerCase().includes(q)) : base;
    if (!shown.length){ rows.append(el("div","fv-none", q ? "Nothing matches that."
      : self && tab === "people" ? "No contact yet. Talk about someone and they get a card here."
      : cs.length ? "No concept matches that." : self ? "Nothing yet. Talk to it and it files what you say." : "Nothing yet. Drop a source to feed it.")); return; }
    for (const c of shown){
      const id = `${c.brain}/${c.slug}`;
      const r = el("button","fv-row" + (id === openNow ? " on" : "")); r.type = "button"; r.dataset.id = id;
      r.append(el("b",null,c.title));
      if (c.summaryLine) r.append(el("span",null,c.summaryLine));
      r.append(el("small",null, isPerson(c)
        ? `${c.ev || 0} mention${c.ev === 1 ? "" : "s"}${c.seen ? " · seen " + fileDay(c.seen) : c.updated ? " · last " + dayOf(c.updated) : ""}`
        : `${c.src || 0} source${c.src === 1 ? "" : "s"}${c.updated ? " · " + dayOf(c.updated) : ""}`));
      r.onclick = () => show(id);
      rows.append(r);
    }
  };
  f.oninput = paint;

  const nameOf = slug => S.brains.find(x => x.slug === slug)?.name || slug;
  /* A concept of this folder opens here; one of another folder opens there. */
  const go = r => { const rb = r.split("/")[0]; if (rb === b.slug) show(r); else openFolder(S.brains.find(x => x.slug === rb), r); };
  const show = async id => {
    openNow = id;
    for (const r of rows.children) r.classList?.toggle("on", r.dataset?.id === id);
    cols.classList.add("reading");
    doc.innerHTML = ""; doc.scrollTop = 0;
    const inner = el("div","fv-in"); doc.append(inner);
    const back = el("button","fv-back", self ? (tab === "people" ? "← All people" : "← All notes") : "← All concepts"); back.type = "button";
    back.onclick = () => { cols.classList.remove("reading"); openNow = null; paint(); };
    inner.append(back, el("div","fv-none","Opening"));
    let c, insights = [], linkedFrom = [], raw = null;
    try { const got = await api("/api/concept", { id }); c = got.concept; insights = got.insights || []; linkedFrom = got.linkedFrom || []; raw = got.raw || null; }
    catch (e) { inner.lastChild.textContent = e.message; return; }
    if (openNow !== id || S.folder !== b.slug) return;
    if (!c){ inner.lastChild.textContent = "This concept is no longer here."; return; }
    inner.lastChild.remove();
    const person = c.tag === "contact";
    inner.append(el("div","fv-eye",`${person ? "Contact" : self ? "Note" : "Concept"} · ${b.name}`), el("h1",null,c.title));
    if (person && (c.aliases || []).length) inner.append(el("p","fv-aka",`Also: ${c.aliases.join(", ")}`));
    if (person){
      const n = (c.evidence || []).length, last = (c.evidence || []).map(e => e.date || "").sort().pop();
      inner.append(el("p","pf-meta", [c.file?.seen ? `Last seen ${fileDay(c.file.seen)}` : "", last ? `last mentioned ${fileDay(last)}` : "",
        `${n} mention${n === 1 ? "" : "s"}`].filter(Boolean).join(" · ")));
    }
    inner.append(el("p","fv-pos", c.position || c.summaryLine || "No position yet."));
    /* A person's card is yours to correct: edit it, or merge it with the
       card of the same person under another name. */
    if (person && !S.demo){
      const acts = el("div","ct-acts");
      const ed = el("button","mini","Edit"); ed.type = "button"; ed.id = "ctEdit";
      const mg = el("button","mini","Merge with another card"); mg.type = "button"; mg.id = "ctMerge";
      const pick = el("div","ct-pick"); pick.hidden = true;
      ed.onclick = () => editCard(c, id);
      mg.onclick = () => { pick.hidden = !pick.hidden; if (!pick.hidden) mergePick(pick, c, id); };
      acts.append(ed, mg); inner.append(acts, pick);
    }
    if (person){ personFile(inner, c, id, linkedFrom); rawNotes(inner, raw); }
    /* What to read first, from its "needs" links. */
    const first = needsOf(c);
    if (first.length){
      const lf = el("div","fv-first"); lf.append(el("span",null,"Learn first"));
      for (const r of first){ const card = cardById(r); const ch = el("button","vw-link", card.title); ch.type = "button"; ch.onclick = () => go(r); lf.append(ch); }
      inner.append(lf);
    }
    const ev = (c.evidence || []).slice().sort((x, y) => (x.rollup ? 1 : 0) - (y.rollup ? 1 : 0) || String(y.date || y.to || "").localeCompare(String(x.date || x.to || "")));
    /* A person's own words sit folded under the file; a concept's evidence is its body. */
    const evBox = person ? el("details","pf-said") : inner;
    if (person){ const sm = el("summary"); sm.id = "pfSaid"; sm.append(`Each mention in one line · ${ev.length}`); evBox.append(sm); inner.append(evBox); }
    else inner.append(el("h4",null, ev.length ? `Evidence, newest first (${ev.length})` : "Evidence"));
    if (!ev.length) evBox.append(el("div","fv-li","None yet."));
    for (const e of ev){
      const row = el("div","fv-ev");
      row.append(el("time",null, e.rollup ? `${e.from || ""}${e.to && e.to !== e.from ? " to " + e.to : ""}` : (e.date || "")));
      const d = el("div");
      if (!e.rollup && e.author){ d.append(el("b",null,e.author + ". ")); }
      d.append(e.claim || "");
      /* Kept in English: their own words beside it, as they said them. */
      if (e.orig) d.append(el("span","ev-orig", e.orig));
      row.append(d); evBox.append(row);
    }
    if ((c.data || []).length){
      inner.append(el("h4",null,"Figures"));
      for (const x of c.data) inner.append(el("div","fv-li",x));
    }
    if ((c.conflicts || []).length){
      inner.append(el("h4",null,"Open clashes"));
      for (const x of c.conflicts) inner.append(el("div","fv-li",`${x.a || ""} (${x.aDate || "?"}) against ${x.b || ""} (${x.bDate || "?"})${x.why ? ". " + x.why : ""}`));
    }
    if ((c.related || []).length){
      inner.append(el("h4",null,"Linked to"));
      const d = el("div","fv-links");
      for (const r of c.related) d.append(linkChip(c, r, go, nameOf));
      inner.append(d);
    }
    /* What reading this one opens: the concepts that need it first. */
    const opens = unlocksOf(id);
    if (opens.length){
      inner.append(el("h4",null,"Read it before"));
      const d = el("div","fv-links");
      for (const x of opens.slice(0, 12)){
        const chip = el("button","vw-link"); chip.type = "button";
        chip.append(el("i","lk-needs","then"), x.title + (x.brain !== c.brain ? ` · ${nameOf(x.brain)}` : ""));
        chip.onclick = () => go(`${x.brain}/${x.slug}`);
        d.append(chip);
      }
      inner.append(d);
    }
    if (insights.length){ inner.append(el("h4",null,"What follows")); inner.append(insightsBlock(insights, id, go, nameOf)); }
    const srcs = (c.sources || []).map(sid => S.sources.find(x => x.sid === sid)).filter(Boolean);
    if (srcs.length){
      inner.append(el("h4",null,`Sources (${(c.sources || []).length})`));
      for (const x of srcs.slice(-12).reverse()) inner.append(el("div","fv-li",`${x.date || ""} · ${x.title || x.sid}${x.author ? " · " + x.author : ""}`));
    }
    const a2 = el("div","fv-acts2");
    /* A chat on this one alone. In the personal folder, what you tell it changes it. */
    const askIt = el("button","fresh","Chat about it"); askIt.type = "button"; askIt.id = "fvAsk";
    askIt.title = self ? "A chat on this one alone. A fact or a correction you give is written to it." : "A chat that reads this concept alone";
    askIt.onclick = () => chatAbout({ id, title: c.title, brain: b.slug, personal: !!self });
    a2.append(askIt, el("span","fv-upd", c.updated ? `Updated ${c.updated}` : ""));
    inner.append(a2);
  };

  /**
   * A person's file under the summary: what is still open, the facts by
   * section with the ones that no longer hold, the people linked both ways,
   * and the history, year by year, newest first. A line that is wrong comes
   * out with its ×; a promise kept is ticked.
   */
  const personFile = (inner, c, id, linkedFrom) => {
    const f = c.file;
    if (!f){
      inner.append(el("p","tw-key","This card has no full file yet. In People, Build full files writes one from everything you said about them."));
      return;
    }
    const fix = (part, key, extra) => api("/api/personal/contact", { action: "part", id, part, key, ...(extra || {}) })
      .then(() => show(id)).catch(e => alert2(e.message));
    const alert2 = msg => inner.prepend(el("div","fv-li bad",msg));
    const cut = (part, key, what) => { const x = el("button","pf-x","×"); x.type = "button"; x.title = `Take out ${what}`; x.setAttribute("aria-label", `Take out ${what}`);
      x.onclick = () => fix(part, key); return x; };

    const open = (f.open || []).filter(x => !x.done);
    if (open.length){
      const box = el("section","pf-open"); box.append(el("h4",null,`Still open (${open.length})`));
      for (const x of open){
        const r = el("div","pf-orow");
        const tick = el("button","pf-tick"); tick.type = "button"; tick.title = "Done"; tick.setAttribute("aria-label", `Mark done: ${x.t}`);
        tick.onclick = () => fix("open", x.k, { done: true });
        r.append(tick, el("span",null,x.t), el("time",null,`since ${fileDay(x.at)}`));
        box.append(r);
      }
      inner.append(box);
    }

    for (const [key, name] of FILE_SECTIONS){
      const facts = (f.facts || []).filter(x => x.s === key);
      if (!facts.length) continue;
      const sec = el("section","pf-sec"); sec.append(el("h4",null,name));
      const now = facts.filter(x => !x.until), past = facts.filter(x => x.until);
      for (const x of now){
        const r = el("div","pf-fact");
        r.append(el("span","pf-l",x.l), el("span","pf-v", x.v + (x.since ? ` (since ${fileDay(x.since)})` : "")), cut("fact", x.k, x.l));
        const before = past.filter(y => y.l.toLowerCase() === x.l.toLowerCase());
        if (before.length) r.append(el("span","pf-was", "Before: " + before.map(y => `${y.v} (until ${fileDay(y.until)})`).join("; ")));
        sec.append(r);
      }
      for (const y of past.filter(y => !now.some(x => x.l.toLowerCase() === y.l.toLowerCase()))){
        const r = el("div","pf-fact gone");
        r.append(el("span","pf-l",y.l), el("span","pf-v",`${y.v} (until ${fileDay(y.until)})`), cut("fact", y.k, y.l));
        sec.append(r);
      }
      inner.append(sec);
    }

    const people = cs.filter(x => x.tag === "contact");
    const find = n => people.find(x => [x.title, ...(x.aliases || [])].some(t => String(t).toLowerCase() === String(n).toLowerCase()));
    if ((f.links || []).length || linkedFrom.length){
      const sec = el("section","pf-sec"); sec.append(el("h4",null,"Their people"));
      const row = el("div","fv-links");
      for (const x of f.links || []){
        const p = find(x.n);
        const chip = el("button","vw-link pf-link"); chip.type = "button";
        chip.append(x.n, x.r ? el("i",null,x.r) : "");
        if (p) chip.onclick = () => show(`${p.brain}/${p.slug}`); else chip.disabled = true;
        row.append(chip);
      }
      for (const x of linkedFrom.filter(x => !(f.links || []).some(l => find(l.n) && `${find(l.n).brain}/${find(l.n).slug}` === x.id))){
        const chip = el("button","vw-link pf-link"); chip.type = "button";
        chip.append(x.title, el("i",null, x.rel || "linked"));
        chip.onclick = () => show(x.id);
        row.append(chip);
      }
      sec.append(row); inner.append(sec);
    }

    const evs = (f.events || []);
    const hist = el("section","pf-hist"); hist.id = "pfHist";
    hist.append(el("h4",null, evs.length ? `History (${evs.length})` : "History"));
    if (!evs.length) hist.append(el("div","fv-li","Nothing told yet. Every moment you mention lands here, dated."));
    let year = "";
    for (const x of evs){
      const y = String(x.d).slice(0, 4);
      if (y !== year){ year = y; hist.append(el("div","pf-year",y)); }
      const r = el("div","pf-ev" + (x.seen ? " seen" : ""));
      const when = el("time",null, fileDay(x.d, true)); if (x.seen) when.title = "You were together";
      r.append(when, el("p",null,x.t), cut("event", x.k, "this moment"));
      hist.append(r);
    }
    inner.append(hist);
  };

  /**
   * Everything you said about a person, word for word and dated, newest
   * first, under their history: the raw material the file is written from,
   * in the language you said it.
   */
  const rawNotes = (inner, raw) => {
    const rn = raw?.notes || [], KIND = { chat: "Chat", interview: "Interview", import: "Imported" };
    const box = el("section","pf-raw"); box.id = "pfRaw";
    box.append(el("h4",null, raw?.total ? `Raw notes (${raw.total})` : "Raw notes"));
    if (!rn.length) box.append(el("div","fv-li","Every message where you talk about them lands here, as you typed it."));
    for (const x of rn){
      const r = el("div","pf-rn");
      const top = el("div","pf-rh"); top.append(el("time",null, fileDay(x.date)), el("span","pf-kind", KIND[x.kind] || x.kind));
      r.append(top);
      if (x.asked) r.append(el("p","pf-asked", x.asked));
      r.append(el("p","pf-rt", x.text));
      box.append(r);
    }
    if (raw?.total > rn.length) box.append(el("div","fv-li",`The newest ${rn.length} of ${raw.total} are shown.`));
    inner.append(box);
  };

  /** A person's card, by hand: name, other names, line and card. */
  const editCard = (c, id) => {
    openNow = id;
    doc.innerHTML = ""; doc.scrollTop = 0;
    const inner = el("div","fv-in ct-form"); inner.id = "ctForm"; doc.append(inner);
    const back = el("button","fv-back","← Back to the card"); back.type = "button"; back.onclick = () => show(id);
    inner.append(back, el("div","fv-eye",`Edit contact · ${b.name}`), el("h1",null,c.title));
    const field = (label, node) => { const l = el("label","ts-q"); l.append(el("span",null,label), node); inner.append(l); return node; };
    const name = field("Name", el("input")); name.id = "ctName"; name.value = c.title; name.maxLength = 80;
    const aka = field("Other names, with a comma between", el("input")); aka.id = "ctAka"; aka.value = (c.aliases || []).join(", ");
    const line = field("Who they are to you, in one line", el("input")); line.id = "ctLine"; line.value = c.summaryLine || ""; line.maxLength = 200;
    const card = field("The card", el("textarea")); card.id = "ctPos"; card.rows = 9; card.value = c.position || "";
    const say = el("span","ts-say"); say.setAttribute("role","status");
    const save = el("button","go","Save"); save.type = "button"; save.id = "ctSave";
    const no = el("button","ghost","Cancel"); no.type = "button"; no.onclick = () => show(id);
    save.onclick = async () => {
      save.disabled = true; say.textContent = "Saving"; say.className = "ts-say";
      try {
        await api("/api/personal/contact", { action: "edit", id, title: name.value.trim(), position: card.value,
          summaryLine: line.value.trim(), aliases: aka.value.split(",").map(x => x.trim()).filter(Boolean) });
        await reload(); show(id);
      } catch (e) { save.disabled = false; say.textContent = e.message; say.className = "ts-say bad"; }
    };
    const row = el("div","tw-acts"); row.append(save, no, say); inner.append(row);
    name.focus();
  };

  /** The other cards, to pick the one that is the same person. */
  const mergePick = (pick, c, id) => {
    pick.innerHTML = "";
    const others = cs.filter(x => x.tag === "contact" && `${x.brain}/${x.slug}` !== id);
    if (!others.length){ pick.append(el("p","tw-key","No other card to merge with yet.")); return; }
    pick.append(el("p","tw-key",`Pick the card that is the same person as ${c.title}. Its mentions and names join this card, and the card is written again as one.`));
    const q = el("input","fv-filter ct-find"); q.placeholder = "Find a person"; q.id = "ctFind";
    const list = el("div","ct-list");
    const paintList = () => {
      list.innerHTML = "";
      const t = q.value.trim().toLowerCase();
      for (const x of others.filter(x => !t || (x.title + " " + (x.aliases || []).join(" ") + " " + (x.summaryLine || "")).toLowerCase().includes(t)).slice(0, 30)){
        const r = el("div","ct-row");
        const who2 = el("div"); who2.append(el("b",null,x.title)); if (x.summaryLine) who2.append(el("span",null,x.summaryLine));
        const go2 = el("button","mini","Merge into this card"); go2.type = "button"; go2.dataset.id = `${x.brain}/${x.slug}`;
        let armed = false;
        go2.onclick = async () => {
          if (!armed){ armed = true; go2.textContent = `Yes, ${x.title} is ${c.title}`; go2.classList.add("armed"); return; }
          go2.disabled = true; go2.textContent = "Merging";
          try {
            const res = await api("/api/personal/contact", { action: "merge", into: id, from: [`${x.brain}/${x.slug}`] });
            await reload(); await show(id);
            if (!res.rewritten) doc.querySelector(".fv-in")?.append(el("p","tw-key","Merged. The two cards' text sits side by side until you edit it."));
          } catch (e) { go2.disabled = false; go2.textContent = e.message; }
        };
        r.append(who2, go2); list.append(r);
      }
      if (!list.children.length) list.append(el("p","tw-key","No card matches that."));
    };
    q.oninput = paintList;
    pick.append(q, list); paintList();
  };

  /* After a join, a rename or a position written, the list reads the
     workspace again, and the open pane stays where it is. */
  const reload = async () => {
    try { await refresh(); } catch (_) {}
    if (S.folder !== b.slug) return;
    cs = sorted(); if (self) paintTabs(); paint();
  };

  /** The learning path: the concepts in the order to read them, a step at a time. */
  const pathPane = () => {
    openNow = null; paint();
    cols.classList.add("reading");
    doc.innerHTML = ""; doc.scrollTop = 0;
    const inner = el("div","fv-in lp"); inner.id = "pathPane"; doc.append(inner);
    const back = el("button","fv-back","← All concepts"); back.type = "button";
    back.onclick = () => { cols.classList.remove("reading"); paint(); };
    const steps = learningPath(b.slug), n = steps.reduce((t, x) => t + x.length, 0);

/**
 * One folder's tidy findings, as cards that each wait for their own click:
 * concepts filed twice, titles not in English, concepts with no position.
 * Returns what Apply all runs: each merge into the title ticked, each rename
 * as written, and the positions, every one skipped once done.
 */
function tidyCards(inner, r, onChange, tally = {}){
  const runs = [];
  const add = (k, n = 1) => { tally[k] = (tally[k] || 0) + n; };
  /* Concepts folded into another by a merge here: a rename or a position
     asked for one of them has nothing left to change. */
  const gone = new Set();
  const sec = (title, sub) => { inner.append(el("h4",null,title)); if (sub) inner.append(el("p","td-sub",sub)); };

  if (r.same.length){
    sec(`Filed twice · ${r.same.length}`, "The same idea under two titles. Merge keeps the title you pick, joins the evidence, and writes the position again.");
    for (const g of r.same){
      const card = el("div","td-card");
      const name = `keep-${Math.random().toString(36).slice(2)}`;
      g.forEach((c, i) => {
        const row = el("label","td-opt");
        const rb = el("input"); rb.type = "radio"; rb.name = name; rb.value = c.id; rb.checked = i === 0;
        const t = el("div"); t.append(el("b",null,c.title), el("span",null,c.line || "No position yet."), el("small",null,`${c.ev} evidence`));
        row.append(rb, t); card.append(row);
      });
      const acts = el("div","td-acts");
      const go = el("button","td-go","Merge"); go.type = "button";
      const no = el("button","td-no","Keep apart"); no.type = "button";
      const say = el("span","td-say");
      acts.append(go, no, say); card.append(acts);
      no.onclick = () => card.classList.add("gone");
      const merge = async () => {
        if (card.classList.contains("done") || card.classList.contains("gone")) return true;
        const keep = card.querySelector("input:checked")?.value || g[0].id;
        go.disabled = no.disabled = true; say.className = "td-say spin"; say.textContent = "Merging";
        try {
          const from = g.map(c => c.id).filter(id => id !== keep);
          const m = await api("/api/concept/merge", { into: keep, from });
          from.forEach(id => gone.add(id)); add("merged");
          say.className = "td-say ok";
          say.textContent = `Merged into ${g.find(c => c.id === keep)?.title || keep}${m.rewritten ? ", position written again" : ""}.`;
          card.classList.add("done");
          return true;
        } catch (e) { go.disabled = no.disabled = false; say.className = "td-say bad"; say.textContent = e.message; return false; }
      };
      go.onclick = async () => { if (await merge()) onChange(); };
      runs.push(merge);
      inner.append(card);
    }
  }

  if (r.english.length){
    sec(`Not in English · ${r.english.length}`, "The title changes; the concept, its evidence and its links stay.");
    const card = el("div","td-card");
    const rows2 = r.english.map(c => {
      const row = el("div","td-ren");
      const old = el("s",null,c.title);
      const inp = el("input","td-in"); inp.value = c.to; inp.setAttribute("aria-label",`New title for ${c.title}`);
      const go = el("button","td-go","Rename"); go.type = "button";
      const say = el("span","td-say");
      row.append(old, inp, go, say); card.append(row);
      const run = async () => {
        const title = inp.value.trim();
        if (title.length < 3 || row.classList.contains("done")) return true;
        if (gone.has(c.id)){ row.classList.add("done"); say.className = "td-say ok"; say.textContent = "Merged into another"; return true; }
        go.disabled = true; say.className = "td-say spin"; say.textContent = "";
        try { await api("/api/concept/rename", { id: c.id, title }); row.classList.add("done"); say.className = "td-say ok"; say.textContent = "Renamed"; add("renamed"); return true; }
        catch (e) { go.disabled = false; say.className = "td-say bad"; say.textContent = e.message; return false; }
      };
      go.onclick = async () => { if (await run()) onChange(); };
      return run;
    });
    if (rows2.length > 1){
      const all = el("button","td-go td-all",`Rename all ${rows2.length}`); all.type = "button";
      all.onclick = async () => { all.disabled = true; for (const run of rows2) await run(); onChange(); };
      card.append(all);
    }
    runs.push(...rows2);
    inner.append(card);
  }

  if (r.blank.length){
    sec(`No position · ${r.blank.length}`, "Each holds evidence but no view. The position is written from the evidence it already has.");
    const card = el("div","td-card");
    for (const c of r.blank) card.append(el("div","td-li",c.title));
    const go = el("button","td-go",`Write ${r.blank.length} position${r.blank.length === 1 ? "" : "s"}`); go.type = "button";
    const say = el("span","td-say");
    const acts = el("div","td-acts"); acts.append(go, say); card.append(acts);
    const write = async () => {
      if (card.classList.contains("done")) return true;
      go.disabled = true;
      const ids = r.blank.map(c => c.id).filter(id => !gone.has(id));
      let done = 0;
      for (let i = 0; i < ids.length; i += 8){
        say.className = "td-say spin"; say.textContent = `${done} of ${ids.length}`;
        try { done += ((await api("/api/concept/rederive", { ids: ids.slice(i, i + 8) })).written || []).length; }
        catch (e) { say.className = "td-say bad"; say.textContent = e.message; go.disabled = false; return false; }
      }
      say.className = "td-say ok"; say.textContent = `${done} of ${ids.length} written.`;
      card.classList.add("done"); add("written", done);
      return true;
    };
    go.onclick = async () => { if (await write()) onChange(); };
    runs.push(write);
    inner.append(card);
  }
  return runs;
}

/** How many findings a tidy read holds. */
const tidyCount = r => r.same.length + r.english.length + r.blank.length;

/**
 * Tidy every folder at once, from Settings, with no click per finding: each
 * folder is read, then its twins merge into the clearest title, its titles
 * go into English and its empty positions are written from the evidence held.
 * Three folders at a time, each one's steps in order. Every step shows what
 * it did, and one that fails says why and keeps its button.
 */
function openTidyAll(){
  const folders = S.brains.filter(b => b.type !== "personal" && !readOnly(b) && conceptsOf(b.slug).length > 1)
    .sort((x, y) => conceptsOf(y.slug).length - conceptsOf(x.slug).length);
  const veil = el("div","veil");
  veil.innerHTML = `
    <div class="sheet viewer tidy-all" role="dialog" aria-modal="true" aria-label="Tidy all folders">
      <header><h3>Tidy all folders</h3>
      <p>Each folder is read, then tidied: twins merged into the clearest title, titles put in English, empty positions written from their evidence.</p>
      <div class="ta-bar"><span class="td-say spin" id="taSay"></span>
        <button class="ghost" id="taClose" type="button">Stop</button></div></header>
      <div class="ta-body tidy" id="taBody"></div>
    </div>`;
  document.body.append(veil);
  const body = veil.querySelector("#taBody"), say = veil.querySelector("#taSay"), close = veil.querySelector("#taClose");
  let open = true, changed = false;
  const shut = () => { open = false; veil.remove(); if (changed) refresh().catch(() => {}); };
  close.onclick = shut;
  const onChange = () => { changed = true; };
  if (!folders.length){ say.className = "td-say"; say.textContent = "No folder to tidy yet."; close.textContent = "Close"; return; }

  const tally = {};
  let done = 0, failed = 0;
  const paint = () => {
    const did = [tally.merged ? `${tally.merged} merged` : "", tally.renamed ? `${tally.renamed} renamed` : "",
                 tally.written ? `${tally.written} position${tally.written === 1 ? "" : "s"} written` : ""].filter(Boolean).join(", ");
    say.textContent = `${done} of ${folders.length} folders tidied${did ? `: ${did}` : ""}${failed ? `. ${failed} step${failed === 1 ? "" : "s"} failed, each says why` : ""}.`;
  };
  paint();

  /* A section per folder, in place from the start, so the list never jumps. */
  const parts = folders.map(b => {
    const sec = el("section","ta-sec");
    const h = el("div","ta-h"); h.append(el("b",null,b.name), el("span","ta-n","Waiting"));
    sec.append(h); body.append(sec);
    return { b, sec, n: h.lastChild };
  });
  const tidyOne = async p => {
    p.n.textContent = "Reading";
    const wait = el("div","td-wait"); wait.append(el("i"), el("i"), el("i")); p.sec.append(wait);
    let r;
    try { r = await api("/api/brain/tidy", { brain: p.b.slug }); if (r.error) throw new Error(r.error); }
    catch (e) { wait.remove(); p.n.textContent = "Not read"; p.sec.append(el("div","td-say bad",e.message)); failed++; return; }
    wait.remove();
    if (!open) return;
    if (!tidyCount(r)){ p.n.textContent = "Already tidy"; p.sec.classList.add("clean"); return; }
    p.n.textContent = "Tidying";
    for (const run of tidyCards(p.sec, r, onChange, tally)){
      if (!open) return;
      if (!(await run())) failed++;
      paint();
    }
    changed = true;
    p.n.textContent = "Tidied"; p.sec.classList.add("clean");
  };
  (async () => {
    const queue = parts.slice();
    await Promise.all(Array.from({ length: Math.min(3, queue.length) }, async () => {
      while (queue.length && open){ await tidyOne(queue.shift()); done++; paint(); }
    }));
    if (!open) return;
    say.className = failed ? "td-say bad" : "td-say ok";
    paint();
    close.textContent = "Close";
  })();
}

/* What a link says, read from the concept holding it to the one it names. */
const LINK_LABEL = { needs: "needs", causes: "causes", supports: "supports", contradicts: "contradicts", example: "example of" };
const kindTo = (c, id) => ((c && c.kinds) || []).find(k => k.to === id)?.type || "related";
const cardById = id => { const [b, ...r] = String(id).split("/"); return S.concepts.find(x => x.brain === b && x.slug === r.join("/")); };
/* What a concept must be read after, and what reading it opens. */
const needsOf = c => ((c && c.kinds) || []).filter(k => k.type === "needs").map(k => k.to).filter(cardById);
const unlocksOf = id => S.concepts.filter(x => (x.kinds || []).some(k => k.type === "needs" && k.to === id));

/** A link as a chip: its kind in small capitals, then the concept, then its folder when another. */
function linkChip(c, r, onOpen, nameOf){
  const rb = r.split("/")[0], card = cardById(r);
  const chip = el("button","vw-link"); chip.type = "button";
  const kind = kindTo(c, r);
  if (kind !== "related"){ const t = el("i","lk-" + kind, LINK_LABEL[kind] || kind); chip.append(t); }
  chip.append((card ? card.title : r.split("/").slice(1).join("/")) + (rb !== c.brain ? ` · ${nameOf(rb)}` : ""));
  chip.onclick = () => onOpen(r);
  return chip;
}

/** What follows from this concept and one of another folder: derived, and said so. */
function insightsBlock(list, id, onOpen, nameOf){
  const box = el("div","ins-list");
  for (const x of list){
    const other = x.a === id ? x.b : x.a, card = cardById(other);
    const it = el("div","ins");
    it.append(el("b",null,x.title), el("p",null,x.text));

    w.onclick = () => onOpen(other);

    box.append(it);
  }
  box.append(el("div","ins-note","Drawn by Tasu from two linked concepts. It is a conclusion, not a source."));
  return box;
}

/**
 * A folder's learning path: its concepts in the order they are best read,
 * from the "needs" links. A concept sits one step after the furthest concept
 * it needs, so the first step holds the foundations. A loop is cut where it
 * closes. Concepts with no "needs" link either way are left out.
 */
function learningPath(slug){
  const own = S.concepts.filter(c => c.brain === slug);
  const ids = new Set(own.map(c => `${c.brain}/${c.slug}`));
  const pre = new Map(own.map(c => [`${c.brain}/${c.slug}`, needsOf(c).filter(t => ids.has(t))]));
  const inPath = new Set();
  for (const [id, ns] of pre) if (ns.length){ inPath.add(id); ns.forEach(n => inPath.add(n)); }
  const level = new Map(), busy = new Set();
  const depth = id => {
    if (level.has(id)) return level.get(id);
    if (busy.has(id)) return 0;
    busy.add(id);
    const d = Math.max(-1, ...(pre.get(id) || []).map(depth)) + 1;
    busy.delete(id); level.set(id, d);
    return d;
  };
  const steps = [];
  for (const id of [...inPath].sort()) { const d = depth(id); (steps[d] = steps[d] || []).push(id); }
  return steps.filter(Boolean).map(ids => ids.map(cardById).filter(Boolean).sort((a, b) => a.title.localeCompare(b.title)));
}

     in 9 bullets. Custom writes a document of the type picked, in its own
     format, with one model call. */
  let kind = "summary", doc = "quiz";
  const KIND = {
    summary: "Bullets: each concept, then what it adds. Free from the stored positions. With a question, one model call.",
    custom:  "A document in its own format: sections, paragraphs and lists. One model call.",

               "Special instructions", "Optional: the angle, the audience or the tone. Only the risks. For a new client."],
    deepdive: ["500 to 800 words: the short answer, how it works, the evidence, where sources disagree, what it means.",
               "Special instructions", "Optional: the angle, the audience or the tone. Only the risks. For a new client."],
    usecase:  ["3 to 5 real situations: what to do step by step, the expected result, the risk.",

    other:    ["Your description sets the type, the format, the length and the tone.",

    if (kind === "custom" && doc === "other" && !note){ warn("Describe the document you want."); veil.querySelector("#pNote").focus(); return; }
    /* A typo stays in the dialog, where it can be fixed, rather than failing

    /* A page the model writes waits on it, so the mascot keeps it company. */
    const viaModel = !!q || kind !== "summary" || lang !== "English";

/**
 * Why a page is not in the language asked for, or "".
 *
 * The server says so itself when a translation failed. A server that does not
 * know the language menu yet says nothing and answers in English, so the page
 * is checked against the ask as well.
 */
function langNote(r, lang){
  if (r.warning) return r.warning;
  if (!lang || lang === "English" || r.lang === lang) return "";
  return `This page is in English, not ${lang}: the server does not know the language menu yet. Run npx convex deploy, then build it again.`;
}

/**
 * The page, on screen, with the three things you do with it.
 *
 * Mailing rebuilds the page on the server rather than sending a body from here,
 * so a signed-in session cannot post arbitrary mail from this address. The
 * reply carries the page that went out and the card repaints to it, so what is
 * on screen is always what was sent. A page built from a question is asked
 * again to do that, and the button says so.
 */
function showPager(page, text, built, mailed, r, where = $("thread")){
  push("ai", body => {
    const card = el("div","pager");
    const slot = el("div");
    const acts = el("div","acts");
    const said = el("div","said");
    const lang = el("div","err");
    card.append(lang, slot, acts, said);
    body.append(card);

    /* The language, above the page: read before the page is. */
    const flagLang = x => {
      const why = x ? langNote(x, built.lang) : "";
      lang.hidden = !why; lang.innerHTML = "";
      if (why) lang.append(el("b",null,"Not in " + built.lang), el("span",null,why));
    };
    flagLang(r);
    /* A mail that went, in a line. One that did not, in full, with the reason. */
    const tell = (ok, msg) => {
      said.innerHTML = "";
      said.className = ok || !msg ? "said" : "said err";
      if (ok) said.textContent = msg;
      else if (msg) said.append(el("b",null,"Not sent"), el("span",null,msg));
    };

    let now = { page, text };
    const paint = () => {
      slot.innerHTML = "";
      const p = now.page;
      slot.append(el("h3",null,p.title));
      if (p.line) slot.append(el("div","sub",p.line));
      for (const sec of p.sections || []){
        /* A summary's bullets, or a document's paragraphs and lists. */
        const ul = (sec.blocks || []).length ? docBody(sec.blocks) : el("ul");
        for (const b of (sec.blocks || []).length ? [] : sec.bullets || []){
          const li = el("li");
          if (typeof b === "string") li.textContent = b;
          else {
            if (b.k) li.append(el("strong","k",b.k));
            if (b.say) li.append(el("span","say",b.say));
          }
          ul.append(li);
        }
        /* A quiz keeps its answers folded, so the questions are worked
           through first. Copy, print and mail carry them in full. */
        if (sec.fold || /^answers?$/i.test(sec.head || "")){
          const d = el("details","answers");
          d.append(el("summary",null,"Show the answers"), ul);
          slot.append(d);
          continue;
        }
        if (sec.head) slot.append(el("h4",null,sec.head));
        slot.append(ul);
      }
      if (p.foot) slot.append(el("div","foot",p.foot));
    };
    paint();

    const copy = el("button","fresh","Copy");
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(now.text); copy.textContent = "Copied"; }
      catch { copy.textContent = "Blocked"; }
      setTimeout(() => { copy.textContent = "Copy"; }, 1600);
    };

    const print = el("button","fresh","Print");
    print.onclick = () => printPager(now.page);

    const to = el("input");
    to.type = "email"; to.placeholder = "Send it to"; to.value = lastMail();
    const send = el("button","fresh","Mail it");
    send.title = built.q || built.lang || (built.kind && built.kind !== "summary")
      ? "The page is written again so the page that is sent is the page you see. One model call."
      : "Built again from the stored positions, which gives the same page.";

    const post = async () => {
      const addr = to.value.trim();
      if (!addr){ to.focus(); return; }
      send.disabled = true; send.textContent = "Sending"; tell(true, "");
      try {
        /* The page is kept already: this build is only for the mail. */
        const r = await api("/api/onepager", { ...built, mail: addr, keep: false });
        now = { page: r.page, text: r.text };
        paint(); flagLang(r); bottom(where);
        if (r.sent === false) throw new Error(r.mailError || "the mail service refused it");
        try { localStorage.setItem(MAIL_KEY, addr); } catch {}
        tell(true, `Sent to ${addr}. Not in the inbox within 5 minutes? Look in spam.`);
        send.textContent = "Sent";
      } catch (e) {
        send.disabled = false; send.textContent = "Mail it";
        tell(false, e.message);
      }
    };
    send.onclick = post;
    to.onkeydown = e => { if (e.key === "Enter") post(); };
    /* A new address means a new send. */
    to.oninput = () => { send.disabled = false; send.textContent = "Mail it"; tell(true, ""); };

    /* Sent from the dialog already: the card says so rather than asking again. */
    if (mailed){
      to.value = mailed.to;
      if (mailed.ok){ send.disabled = true; send.textContent = "Sent"; tell(true, `Sent to ${mailed.to}. Not in the inbox within 5 minutes? Look in spam.`); }
      else tell(false, mailed.why);
    }

    /* Mail goes from the owner's domain, so other workspaces copy or print. */
    acts.append(copy, print, ...(ownerWs() ? [to, send] : []));
  }, where);
  bottom(where);
}

/** **bold** in a document's text, with everything else escaped. */
const boldText = t => esc(t).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
/** A document section's paragraphs and lists, as one element. */
function docBody(blocks){
  const box = el("div","doc");
  for (const x of blocks){
    if (x.p != null){ const p = el("p"); p.innerHTML = boldText(x.p); box.append(p); continue; }
    const list = el(x.ol ? "ol" : "ul");
    for (const t of x.ol || x.ul || []){ const li = el("li"); li.innerHTML = boldText(t); list.append(li); }
    box.append(list);
  }
  return box;
}
const docHtml = blocks => blocks.map(x => x.p != null ? `<p>${boldText(x.p)}</p>`
  : `<${x.ol ? "ol" : "ul"}>${(x.ol || x.ul || []).map(t => `<li>${boldText(t)}</li>`).join("")}</${x.ol ? "ol" : "ul"}>`).join("");

<style>
