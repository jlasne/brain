<title>Octopus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="icon" href="/brand/logo-mark.png">

<script>
  /* The deployment this app talks to. Public by design: the OpenRouter key
     lives on the server and never reaches a browser. */
  window.OCTOPUS_API = "https://uncommon-wolf-174.eu-west-1.convex.site";
  window.OCTOPUS_BUILD = "2026-09-15a";
</script>

<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root{
    /* Claude palette, light is the default */
    --bg:#faf9f5; --surface:#ffffff; --surface-2:#f0eee6; --surface-3:#e9e6dc;
    --ink:#141413; --ink-2:#3d3d3a; --ink-3:#6e6e68; --ink-4:#93918a;
    --line:#e5e2d9; --line-2:#d4d0c4;
    --accent:#bf5a3c; --accent-fill:#d97757; --accent-on:#ffffff;
    --accent-soft:rgba(217,119,87,.10); --accent-line:rgba(217,119,87,.34);
    --good:#3f7d5c;
    --shadow:0 1px 2px rgba(20,20,19,.05), 0 1px 8px rgba(20,20,19,.04);
    --shadow-lift:0 2px 6px rgba(20,20,19,.07), 0 12px 32px rgba(20,20,19,.10);

    --sans:'Hanken Grotesk',ui-sans-serif,system-ui,'Helvetica Neue',Arial,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ease:cubic-bezier(.22,.61,.36,1);
    color-scheme:light;
  }

  :root:not([data-theme="light"]){
    @media (prefers-color-scheme:dark){
      --bg:#262624; --surface:#30302e; --surface-2:#3a3a37; --surface-3:#44443f;
      --ink:#f5f4ef; --ink-2:#d8d6ce; --ink-3:#a8a69d; --ink-4:#8a887f;
      --line:#45443f; --line-2:#57564f;
      --accent:#e79173; --accent-fill:#d97757; --accent-on:#1a1a18;
      --accent-soft:rgba(217,119,87,.13); --accent-line:rgba(217,119,87,.40);
      --good:#6fb891;
      --shadow:0 1px 2px rgba(0,0,0,.22), 0 1px 8px rgba(0,0,0,.18);
      --shadow-lift:0 2px 6px rgba(0,0,0,.28), 0 12px 32px rgba(0,0,0,.34);
      color-scheme:dark;
    }
  }

  :root[data-theme="dark"]{
    --bg:#262624; --surface:#30302e; --surface-2:#3a3a37; --surface-3:#44443f;
    --ink:#f5f4ef; --ink-2:#d8d6ce; --ink-3:#a8a69d; --ink-4:#8a887f;
    --line:#45443f; --line-2:#57564f;
    --accent:#e79173; --accent-fill:#d97757; --accent-on:#1a1a18;
    --accent-soft:rgba(217,119,87,.13); --accent-line:rgba(217,119,87,.40);
    --good:#6fb891;
    --shadow:0 1px 2px rgba(0,0,0,.22), 0 1px 8px rgba(0,0,0,.18);
    --shadow-lift:0 2px 6px rgba(0,0,0,.28), 0 12px 32px rgba(0,0,0,.34);
    color-scheme:dark;
  }

  html{ background:var(--bg); }
  body{
    background:var(--bg); color:var(--ink-2);
    font:400 16px/1.62 var(--sans);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    height:100dvh; overflow:hidden;
  }
  ::selection{ background:var(--accent-soft); color:var(--ink); }

  button,input,textarea,select{ font:inherit; color:inherit; background:none; border:none; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--accent-fill); outline-offset:2px; border-radius:4px; }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--line-2); border-radius:10px; border:3px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--surface-3); background-clip:content-box; }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* ============ shell ============ */
  .app{
    display:grid; grid-template-columns:264px 1fr; height:100dvh;
    transition:grid-template-columns .2s var(--ease);
  }

  /* Folding the nav is a desktop affair. Narrow screens already slide it in
     and out as a drawer, so these rules must not reach them. */
  .navtoggle{
    margin-left:auto; flex-shrink:0; width:24px; height:24px; border-radius:6px;
    display:grid; place-items:center; color:var(--ink-3);
    font:400 15px/1 var(--sans);
    transition:color .15s var(--ease), background .15s var(--ease);
  }
  .navtoggle:hover{ color:var(--accent); background:var(--surface-3); }
  .navopen{
    display:none; position:fixed; top:13px; left:13px; z-index:30;
    place-items:center; width:30px; height:30px; border-radius:7px;
    border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink-3);
  }
  .navopen:hover{ color:var(--accent); border-color:var(--accent-fill); }
  @media (min-width:861px){
    .app.nav-closed{ grid-template-columns:0 1fr; }
    .app.nav-closed aside{ opacity:0; pointer-events:none; }
    .app.nav-closed .navopen{ display:grid; }
    aside{ transition:opacity .15s var(--ease); }
  }
  @media (max-width:860px){ .navtoggle{ display:none; } }

  /* ============ sidebar ============ */
  aside{
    background:var(--surface-2); border-right:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0;
  }
  .brand{
    padding:18px 18px 15px;
    display:flex; align-items:center; gap:9px;
  }
  .brand .mark{ width:24px; height:24px; flex-shrink:0; color:var(--accent-fill); }
  .brand .mark svg, .brand .mark img{ width:100%; height:100%; display:block; }
  .brand h1{ font:600 18px/1 var(--sans); letter-spacing:-.015em; color:var(--ink); }
  .brand h1 a, .topbar h1 a{ color:inherit; text-decoration:none; }
  .brand h1 a:hover, .topbar h1 a:hover{ color:var(--accent); }

  .side-scroll{ flex:1; overflow-y:auto; padding:16px 12px; min-height:0; }

  .side-h{
    display:flex; align-items:center; gap:6px; margin:2px 0 7px; padding:0 3px;
    font:400 10.5px/1.6 var(--mono); letter-spacing:.07em; text-transform:uppercase;
    color:var(--ink-4);
  }
  .side-h b{ color:var(--accent); font-weight:500; margin-left:auto; }

  /* One line per brain: the name, and what it holds. The scope line and the
     controls live above the composer, next to the choice they belong to, so a
     row here stays a row. */
  .brain-row{
    display:flex; align-items:baseline; gap:8px; width:100%; text-align:left;
    padding:8px 10px; border-radius:8px; border:1px solid transparent;
    transition:background .15s var(--ease), border-color .15s var(--ease);
  }
  .brain-row + .brain-row{ margin-top:2px; }
  .brain-row .nm{
    font:500 13.5px/1.35 var(--sans); color:var(--ink-2);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .brain-row .ct{ margin-left:auto; font:400 10.5px/1 var(--mono); color:var(--ink-4); white-space:nowrap; }
  /* The one control a row carries, on the row you are pointing at. */
  .brain-row .ed{
    font:500 10.5px/1 var(--sans); color:var(--ink-4); padding:3px 5px; border-radius:5px;
    opacity:0; transition:opacity .12s var(--ease), color .12s var(--ease), background .12s var(--ease);
  }
  .brain-row:hover .ed, .brain-row.on .ed{ opacity:1; }
  .brain-row .ed:hover{ color:var(--accent); background:var(--accent-soft); }
  .brain-row:hover{ background:var(--surface); }
  .brain-row:hover .nm{ color:var(--ink); }
  .brain-row.on{ background:var(--surface); border-color:var(--accent-line); }
  .brain-row.on .nm, .brain-row.on .ct{ color:var(--accent); }
  .empty-side{ padding:6px 3px; font:400 12.5px/1.55 var(--sans); color:var(--ink-4); }

  .new-brain{
    margin:0 0 12px; padding:10px 11px; width:100%; text-align:left;
    border:1px dashed var(--line-2); border-radius:9px;
    font:500 13px/1 var(--sans); color:var(--accent);
    transition:background .15s var(--ease), border-color .15s var(--ease);
  }
  .new-brain:hover{ background:var(--surface); border-color:var(--accent-fill); }

  .connect-row{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    border-top:1px solid var(--line); padding:11px 20px;
    font:500 12px/1.3 var(--sans); color:var(--ink-3);
    transition:color .15s var(--ease), background .15s var(--ease);
  }
  .connect-row:hover{ color:var(--accent); background:var(--surface); text-decoration:none; }
  .connect-row .go-out{ margin-left:auto; font-size:12px; color:var(--ink-4); }
  .connect-row:hover .go-out{ color:var(--accent); }
  .connect-row .dot{
    width:6px; height:6px; border-radius:50%; background:var(--accent-fill); flex-shrink:0;
  }

  .urlbox{
    display:flex; align-items:stretch; gap:0; margin:4px 0 2px;
    border:1px solid var(--line-2); border-radius:8px; overflow:hidden; background:var(--surface-2);
  }
  .urlbox input{
    flex:1; min-width:0; background:none; border:none;
    font:400 12px/1.4 var(--mono); color:var(--ink); padding:10px 11px;
  }
  .urlbox button{
    flex-shrink:0; padding:0 13px; border-left:1px solid var(--line-2);
    font:500 12px/1 var(--sans); color:var(--accent); background:var(--surface);
  }
  .urlbox button:hover{ background:var(--accent-soft); }
  .steps{ counter-reset:st; margin:10px 0 0; }
  .steps li{
    counter-increment:st; position:relative; padding:0 0 7px 24px;
    font:400 13px/1.5 var(--sans); color:var(--ink-2); list-style:none;
  }
  .steps li::before{
    content:counter(st); position:absolute; left:0; top:1px;
    font:600 10px/1.7 var(--mono); color:var(--accent);
    width:16px; height:16px; border-radius:50%; background:var(--accent-soft); text-align:center;
  }

  /* Three controls that look like controls. Underlined words read as footnotes,
     and a person hunting for the model picker never found one. */
  .side-foot{ border-top:1px solid var(--line); padding:12px; display:grid; gap:7px; }
  .foot-btn{
    display:flex; align-items:center; gap:9px; width:100%; min-width:0;
    border:1px solid var(--line-2); border-radius:8px; background:var(--surface);
    padding:9px 11px; font:500 12.5px/1.2 var(--sans); color:var(--ink-2);
    transition:border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease);
  }
  .foot-btn:hover{ border-color:var(--accent-fill); color:var(--ink); background:var(--surface-2); }
  .foot-btn .lbl{
    flex-shrink:0; font:400 10px/1 var(--mono); letter-spacing:.07em;
    text-transform:uppercase; color:var(--ink-4);
  }
  .foot-btn .val{
    margin-left:auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font:400 11.5px/1.3 var(--mono); color:var(--ink-3);
  }
  #stat.pick .val{ color:var(--accent); }
  .foot-row{ display:flex; gap:7px; }
  .foot-row .foot-btn{ justify-content:center; }


  .mlist{
    max-height:44vh; overflow-y:auto; margin-top:10px;
    border:1px solid var(--line); border-radius:10px; background:var(--bg);
  }
  .mrow{ display:block; width:100%; text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); }
  .mrow:last-child{ border-bottom:none; }
  .mrow:hover{ background:var(--surface-2); }
  .mrow.on{ background:var(--accent-soft); }
  .mrow b{ display:block; font:500 13.5px/1.4 var(--sans); color:var(--ink); }
  .mrow span{ display:block; margin-top:2px; font:400 11.5px/1.6 var(--mono); color:var(--ink-3); }
  .mrow.on b{ color:var(--accent); }
  .mnone{ padding:14px 12px; font:400 13px/1.5 var(--sans); color:var(--ink-3); }

  /* How much of the transcript quota is gone. */
  .bar{
    height:6px; border-radius:3px; background:var(--surface-3); overflow:hidden; margin-bottom:9px;
  }
  .bar i{ display:block; height:100%; background:var(--accent-fill); border-radius:3px; }
  .bar i.tight{ background:var(--accent); }
  .meter{ font:400 13px/1.55 var(--sans); color:var(--ink-3); }
  .meter + .meter{ margin-top:4px; }
  .meter b{ color:var(--ink); font-weight:600; }

  /* The three ways in, on the first screen of the door. */
  .picks{ padding:16px 20px 2px; }
  .pick-row{
    display:block; width:100%; text-align:left; padding:13px 14px; margin-bottom:9px;
    border:1px solid var(--line-2); border-radius:11px; background:var(--bg);
    transition:border-color .15s var(--ease), background .15s var(--ease);
  }
  a.pick-row, a.pick-row:hover{ color:inherit; text-decoration:none; }
  .pick-row:hover{ border-color:var(--accent-fill); background:var(--surface-2); text-decoration:none; }
  .pick-row b{ display:block; font:600 14.5px/1.35 var(--sans); color:var(--ink); }
  .pick-row span{ display:block; margin-top:4px; font:400 13px/1.5 var(--sans); color:var(--ink-3); }
  .pick-row em{ font-style:normal; color:var(--accent); }
  .sheet .home{
    margin-right:auto; font:400 13px/1 var(--sans); color:var(--ink-3);
    text-decoration:underline; text-underline-offset:2px; align-self:center;
  }
  .sheet .home:hover{ color:var(--accent); }

  /* ============ main ============ */
  main{ display:flex; flex-direction:column; min-height:0; min-width:0; }

  .thread{ flex:1; overflow-y:auto; padding:36px 0 8px; min-height:0; scroll-behavior:smooth; }
  .col{ width:100%; max-width:760px; margin:0 auto; padding:0 28px; }

  /* ============ messages ============ */
  .msg{ margin-bottom:30px; animation:rise .28s var(--ease) both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

  .msg.me{ display:flex; justify-content:flex-end; }
  .msg.me .body{
    background:var(--surface-2); border-radius:18px 18px 6px 18px;
    padding:12px 17px; max-width:82%; color:var(--ink);
    white-space:pre-wrap; overflow-wrap:anywhere;
  }
  .msg.me .body .attach{
    display:block; margin-top:7px; padding-top:7px; border-top:1px solid var(--line);
    font:400 11.5px/1.5 var(--mono); color:var(--ink-3);
  }

  .msg.ai .who{
    font:600 12.5px/1 var(--sans); letter-spacing:0; text-transform:none;
    color:var(--ink); margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .msg.ai .who .sc{ color:var(--ink-3); font-weight:400; }
  .msg.ai .body{ color:var(--ink-2); font-size:16.5px; line-height:1.68; }
  .msg.ai .body p{ margin-bottom:.85em; }
  .msg.ai .body p:last-child{ margin-bottom:0; }
  /* One sentence per line. A line gets air under it, a group gets more. */
  .msg.ai .body p.ln{ margin:0; }
  .msg.ai .body p.ln + p.ln{ margin-top:.42em; }
  .msg.ai .body .para + .para{ margin-top:1.1em; }
  .msg.ai .body strong{ color:var(--ink); font-weight:500; }
  .msg.ai .body em{ font-style:normal; color:var(--ink); }

  .srcline{
    margin-top:14px; padding-top:11px; border-top:1px solid var(--line);
    font:400 12px/1.6 var(--mono); color:var(--ink-3);
  }
  .smallbrain{
    display:inline-block; margin-bottom:10px;
    font:400 11px/1.5 var(--mono); color:var(--accent);
    border:1px solid var(--accent-line); border-radius:4px; padding:3px 8px;
  }

  .thinking{ display:flex; align-items:center; gap:9px; color:var(--ink-3); font:400 15px/1 var(--sans); }
  .dots{ display:inline-flex; gap:3px; }
  .dots i{ width:5px; height:5px; border-radius:50%; background:var(--accent-fill); animation:pulse 1.3s infinite var(--ease); }
  .dots i:nth-child(2){ animation-delay:.18s; }
  .dots i:nth-child(3){ animation-delay:.36s; }
  @keyframes pulse{ 0%,60%,100%{ opacity:.25; transform:translateY(0); } 30%{ opacity:1; transform:translateY(-3px); } }

  .err{
    border:1px solid var(--accent-line); background:var(--accent-soft);
    border-radius:12px; padding:13px 15px; color:var(--ink-2); font-size:15px;
  }
  .err b{ color:var(--accent); font-weight:500; display:block; margin-bottom:3px; }

  /* ============ the card ============ */
  .card{
    border:1px solid var(--accent-line); background:var(--surface);
    border-radius:16px; overflow:hidden; box-shadow:var(--shadow-lift);
  }
  .card-top{
    padding:14px 16px; border-bottom:1px solid var(--line);
    display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px;
  }
  .card-top .id{ font:700 13px/1.3 var(--mono); color:var(--ink); }
  .card-top .meta{ font:400 11.5px/1.4 var(--mono); color:var(--ink-3); }

  .card-grid{ display:grid; grid-template-columns:auto 1fr; gap:9px 14px; padding:14px 16px; }
  .card-grid dt{
    font:600 12.5px/1.6 var(--sans); letter-spacing:0;
    color:var(--accent); white-space:nowrap;
  }
  .card-grid dd{ font-size:14.5px; line-height:1.55; color:var(--ink-2); }
  .card-grid dd b{ color:var(--ink); font-weight:500; }
  .card-grid dd ul{ list-style:none; }
  .card-grid dd li{ margin-bottom:3px; }
  .card-grid dd li:last-child{ margin-bottom:0; }
  .card-grid dd .none{ color:var(--ink-3); }

  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    font:400 12.5px/1 var(--sans); padding:5px 9px; border-radius:6px;
    border:1px solid var(--line-2); color:var(--ink-2); background:var(--surface-2);
  }
  .chip.new{ color:var(--accent); border-color:var(--line-2); }
  .chip.cand{ color:var(--accent); border-color:var(--accent-line); cursor:pointer;
    transition:background .15s var(--ease), border-color .15s var(--ease); }
  .chip.cand:hover{ background:var(--accent-soft); }
  .chip.cand.on{ background:var(--accent-fill); border-color:var(--accent-fill); color:var(--accent-on); }
  .chip-note{ font:400 12.5px/1.6 var(--sans); color:var(--ink-3); margin-top:7px; }

  .conflicts{ border-top:1px solid var(--line); }
  .cf{ padding:14px 16px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:2.4ch 1fr; gap:12px; }
  .cf:last-child{ border-bottom:none; }
  .cf .n{ font:600 14px/1.55 var(--sans); color:var(--accent); }
  .cf .cn{ font:600 14.5px/1.4 var(--sans); color:var(--ink); margin-bottom:8px; }
  .cf .side{ font-size:14px; line-height:1.5; margin-bottom:4px; }
  .cf .side span{ font:600 11.5px/1.6 var(--sans); letter-spacing:.03em; text-transform:uppercase; color:var(--ink-3); margin-right:7px; }
  .cf .why{ font-size:13.5px; color:var(--ink-3); margin-top:5px; }
  .cf .kind{ font:600 11px/1.6 var(--sans); letter-spacing:.03em; text-transform:uppercase;
    color:var(--ink-3); margin:-4px 0 8px; }
  .cf .kind.big{ color:var(--accent); }
  .cf .opts{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .opt{
    font:400 13px/1 var(--sans); padding:6px 11px; border-radius:7px;
    border:1px solid var(--line-2); color:var(--ink-2); background:var(--surface-2);
    transition:all .15s var(--ease);
  }
  .opt:hover{ border-color:var(--accent-fill); color:var(--ink); background:var(--surface-2); }
  .opt.on{ border-color:var(--accent-fill); color:var(--accent); background:var(--accent-soft); font-weight:500; }
  .opt.dflt{ border-style:dashed; }

  .card-foot{
    padding:14px 16px; border-top:1px solid var(--line); background:var(--surface-2);
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
  }
  .card-foot .hint{ font:400 13px/1.5 var(--sans); color:var(--ink-3); flex:1; min-width:170px; }
  .go{
    font:500 14px/1 var(--sans); padding:10px 19px; border-radius:9px;
    background:var(--accent-fill); color:var(--accent-on);
    box-shadow:var(--shadow);
    transition:filter .15s var(--ease);
  }
  .go:hover{ filter:brightness(1.12); }
  .go[disabled]{ opacity:.4; cursor:default; filter:none; }
  .ghost{
    font:500 14px/1 var(--sans); padding:10px 15px; border-radius:9px;
    border:1px solid var(--line-2); color:var(--ink-2);
  }
  .ghost:hover{ border-color:var(--accent-fill); color:var(--ink); background:var(--surface); }

  .receipt{
    border:1px solid var(--line); background:var(--surface-2);
    border-radius:12px; padding:15px 17px;
    font:400 12.5px/1.9 var(--mono); color:var(--ink-2);
    white-space:pre-wrap; overflow-wrap:anywhere;
  }
  .receipt .v{ color:var(--accent); }
  .receipt .ok{ color:var(--good); }

  /* ============ empty state ============ */
  .zero{ max-width:640px; margin:0 auto; padding:28px 28px 0; }
  .zero h2{ font:600 30px/1.2 var(--sans); letter-spacing:-.02em; color:var(--ink); text-wrap:balance; }
  .zero .lede{ margin-top:14px; font-size:17px; line-height:1.62; color:var(--ink-2); }

  /* ============ composer ============ */

  /* ============ modal ============ */

  .gate{

  .gate .mk svg, .gate .mk img{ width:100%; height:100%; display:block; }
  .gate h2{ font:600 25px/1.2 var(--sans); letter-spacing:-.02em; color:var(--ink); text-wrap:balance; }
  .gate p{ margin-top:11px; font-size:15.5px; line-height:1.6; color:var(--ink-3); }
  .gate form{ margin-top:22px; display:flex; flex-direction:column; gap:10px; }
  .gate input{

    padding:13px 15px; font:400 16px/1.4 var(--sans); color:var(--ink);

  .gate input:focus{ border-color:var(--accent-fill); }

  .gate .note{

  /* ============ responsive ============ */
  @media (max-width:860px){
    .app{ grid-template-columns:1fr; }
    aside{
      position:fixed; inset:0 auto 0 0; width:264px; z-index:40;

          </div>

<script>
(() => {
"use strict";

const API = window.OCTOPUS_API;
const TOKEN_KEY = "octopus.token.v1";
/* A member's own model key. It lives in this tab and travels with the requests
   that spend a model call. The server hashes it once to know who you are and
   stores nothing else. */
const KEY_KEY = "octopus.key.v1";
const WHO_KEY = "octopus.who.v1";

const S = {
  token: null, brains: [], concepts: [], sources: [], model: "", pick: "",
  mode: "ask", scope: "all", transcript: null, busy: false, pendingCard: null, chunk: 18000,
  mentions: 1,
  /* The last few turns of the current thread. It travels with each question so
     a follow-up means something, and it is never written down: closing the tab
     ends it. */
  thread: [],
  level: "normal",
  key: null, account: null, who: "", hasKey: false, keyHint: "",
  /* A personal deployment answers to one account: no sign-up, no key-for-one-tab. */
  personal: false,
};

/* The level is a per-browser convenience, so a blocked or cleared store just
   falls back to normal. */
const LEVELS = ["normal","educational","expert"];
try { const v = localStorage.getItem("octopus.level"); if (LEVELS.includes(v)) S.level = v; } catch {}
const saveLevel = () => { try { localStorage.setItem("octopus.level", S.level); } catch {} };

/* The model this browser asks for. Empty means the one the server runs. Your
   key pays for it, so the choice sits with whoever holds the key. */
const PICK_KEY = "octopus.model";
try { S.pick = localStorage.getItem(PICK_KEY) || ""; } catch {}
const savePick = () => { try { S.pick ? localStorage.setItem(PICK_KEY, S.pick) : localStorage.removeItem(PICK_KEY); } catch {} };

/* Folded nav, remembered. A blocked store just leaves it open. */
let navOpen = true;
try { navOpen = localStorage.getItem("octopus.nav") !== "closed"; } catch {}
function paintNav(){
  $("app").classList.toggle("nav-closed", !navOpen);
  try { localStorage.setItem("octopus.nav", navOpen ? "open" : "closed"); } catch {}
}


const $ = id => document.getElementById(id);
const el = (t,c,txt) => { const n=document.createElement(t); if(c)n.className=c; if(txt!=null)n.textContent=txt; return n; };
const esc = s => String(s??"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const slug = s => String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48)||"item";
const pad2 = n => String(n).padStart(2,"0");
const today = () => new Date().toISOString().slice(0,10);
const rich = t => esc(t).split(/\n{2,}/).map(p =>
  "<p>" + p.replace(/\n/g,"<br>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>") + "</p>").join("");

/* every call to the server goes through here, carrying the session token */
async function api(path, body = {}) {
  let r;
  const ctl = new AbortController();
  const cap = setTimeout(() => ctl.abort(), 180000);   // a read can think for a while
  try {
    r = await fetch(API + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: S.token, ...(S.pick ? { model: S.pick } : {}), ...body }),
      signal: ctl.signal,
    });
  } catch (e) {
    throw new Error(e?.name === "AbortError"
      ? "That call ran past 3 minutes with no answer. Try a shorter source."
      : "The server did not answer. Check your connection.");
  } finally { clearTimeout(cap); }
  if (r.status === 401) {
    [TOKEN_KEY, KEY_KEY, WHO_KEY].forEach(k => sessionStorage.removeItem(k));
    location.reload(); throw new Error("locked");
  }
  const d = await r.json().catch(() => ({ error: "the server sent something unreadable" }));
  if (d.error) throw new Error(d.error);
  return d;
}

/* ============ the gate ============ */
const MARK = document.querySelector(".brand .mark").innerHTML;

/** A modal over the app, not a wall in front of it. It has no way out,
    because every route behind it needs the token it hands back. */
function gateScreen() {
  $("app").classList.add("locked");
  const veil = el("div","veil");
  document.body.append(veil);

  /* Three ways in, named on the first screen so the choice is made before any
     field appears.
       guest   a key and nothing else, forgotten when the tab closes. Reading only.
       member  a name and a password. The key can be remembered on the account.
       mcp     a link out, because the connector needs no key and no account.
     The passphrase door is gone. Its route still answers, so a deployment that
     loses every account password has a way back in through the API. */
  let mode = "member";
  /* Personal deployment: one door, and it is the account's. Nothing to pick. */
  let step = S.personal ? "in" : "pick";  // "pick", then "in", then "key" when an account has none saved
  let acct = null;          // what /api/login handed back

  const HEAD = {
    member: S.personal
      ? ["Sign in", "This deployment answers to one account."]
      : ["Create or connect", "A name and a password. An unused name opens an account. Your model key pays for what you ask and drop."],
    guest:  ["Read access", "Paste a key, ask anything. The key is forgotten when this tab closes."],
  };

  const finish = (token, who) => {
    S.token = token; S.who = who;
    sessionStorage.setItem(TOKEN_KEY, token);
    sessionStorage.setItem(WHO_KEY, who);
    if (S.key) sessionStorage.setItem(KEY_KEY, S.key); else sessionStorage.removeItem(KEY_KEY);
    veil.remove(); $("app").classList.remove("locked");
    open();
  };

  const paint = () => {
    const [title, blurb] = HEAD[mode];

    const form = step === "key" ? `
        <div class="f">
          <label for="gk">Your model key</label>
          <input type="password" id="gk" autocomplete="off" spellcheck="false" placeholder="sk-or-..." required>
          <div class="hint">Make a key with a spend limit rather than pasting your main one.</div>
        </div>
        <div class="f"><label class="check"><input type="checkbox" id="grem"> Remember it on my account</label>
          <div class="hint">Remembered keys are encrypted with a secret held on the server. Leave it unticked and the key stays in this tab only.</div>
        </div>`
      : mode === "guest" ? `
        <div class="f">
          <label for="gk">Your model key</label>
          <input type="password" id="gk" autocomplete="off" spellcheck="false" placeholder="sk-or-..." required>
          <div class="hint">Nothing about you is stored. The key lives in this tab and pays for your questions.</div>
        </div>`
      : `
        <div class="f">
          <label for="gn">Name</label>
          <input type="text" id="gn" autocomplete="username" placeholder="What to call you" required>
        </div>
        <div class="f">
          <label for="gw">Password</label>
          <input type="password" id="gw" autocomplete="current-password" placeholder="At least 8 characters" required>
          <div class="hint">${S.personal
            ? "The brains here belong to one account. Reading them from your own AI needs no account: see <a href=\"/doc\">the connector</a>."
            : "A name nobody has taken opens a new account."}</div>
        </div>`;

    /* The first screen names the three ways in and asks for nothing. */
    if (step === "pick") {
      veil.innerHTML = `
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gh">
          <header>
            <div class="mk" aria-hidden="true">${MARK}</div>
            <h3 id="gh">Three ways in</h3>
            <p>Every brain is readable.</p>
          </header>
          <div class="picks">
            <button class="pick-row" type="button" data-pick="guest">
              <b>Read only</b>
              <span>Drop your key. It goes when the tab closes.</span>
            </button>
            <button class="pick-row" type="button" data-pick="member">
              <b>Create and ask</b>
              <span>Make an account. Feed brains, then read them.</span>
            </button>
            <a class="pick-row" href="/doc">
              <b>MCP</b>
              <span>Read the brains from your own AI client.</span>
            </a>
          </div>
          <footer><a class="home" href="/">Octopus home</a></footer>
        </div>`;
      veil.querySelectorAll("[data-pick]").forEach(btn => {
        btn.onclick = () => { mode = btn.dataset.pick; step = "in"; paint(); };
      });
      return;
    }

    const swaps = step === "key" || S.personal ? ""
      : `<button class="ghost" type="button" data-go="pick">Back</button>`;

    veil.innerHTML = `
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gh">
        <header>
          <div class="mk" aria-hidden="true">${MARK}</div>
          <h3 id="gh">${step === "key" ? "One more thing" : title}</h3>
          <p>${step === "key"
            ? `Signed in as <b>${esc(acct.name)}</b>. This account has no model key saved, so paste one to ask and drop.`
            : blurb}</p>
        </header>
        <form>
          ${form}
          <div class="f"><div id="gmsg" class="bad" role="alert"></div></div>
          <footer><a class="home" href="/">Octopus home</a>${swaps}<button class="go" type="submit">Open</button></footer>
        </form>
      </div>`;

    const msg = veil.querySelector("#gmsg");
    veil.querySelectorAll("[data-go]").forEach(btn => {
      btn.onclick = () => { step = btn.dataset.go; paint(); };
    });
    setTimeout(() => veil.querySelector("#gn, #gk")?.focus(), 60);

    veil.querySelector("form").onsubmit = async e => {
      e.preventDefault();
      const btn = veil.querySelector(".go");
      btn.disabled = true;
      msg.className = "spin"; msg.textContent = "Checking";
      try {
        /* The account exists but has no saved key, so this step supplies one. */
        if (step === "key") {
          const key = veil.querySelector("#gk").value.trim();
          S.key = key;
          if (veil.querySelector("#grem").checked) {
            const r = await api("/api/account/key", { key });
            if (r.error) throw new Error(r.error);
          }
          finish(S.token, acct.name);
          return;
        }
        if (mode === "guest") {
          const key = veil.querySelector("#gk").value.trim();
          const r = await api("/api/guest", { key });
          S.key = key; S.account = null;
          finish(r.token, "guest");
          return;
        }
        const r = await api("/api/login", {
          name: veil.querySelector("#gn").value.trim(),
          password: veil.querySelector("#gw").value,
        });
        S.token = r.token; S.account = r.account; acct = r;
        if (r.hasKey) { S.key = null; finish(r.token, r.name); return; }
        /* Held here rather than opening, because every question needs a key. */
        step = "key"; paint();
      } catch (err) {
        btn.disabled = false;
        msg.className = "bad"; msg.textContent = String(err.message);
      }
    };
  };
  paint();
}

/** Same modal shape when the deployment itself is unreachable. */
function deadScreen(why) {
  $("app").classList.add("locked");
  const veil = el("div","veil");
  veil.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <header>
        <div class="mk" aria-hidden="true">${MARK}</div>
        <h3>The server is not answering</h3>
        <p>Octopus reaches a Convex deployment for every read and every model call. This one stayed quiet.</p>
      </header>
      <div class="f"><div class="closest" style="margin:0"><b>What came back</b><div>${esc(why)}</div></div></div>
      <footer><button class="go" id="again">Try again</button></footer>
    </div>`;
  document.body.append(veil);
  veil.querySelector("#again").onclick = () => location.reload();
}

/* ============ boot ============ */
(async () => {
  render(); sizeBox();                       // the shell paints straight away
  const saved = sessionStorage.getItem(TOKEN_KEY);
  if (saved) {
    S.token = saved;
    S.key = sessionStorage.getItem(KEY_KEY) || null;
    S.who = sessionStorage.getItem(WHO_KEY) || "";
    try { await open(); return; }
    catch (_) {
      [TOKEN_KEY, KEY_KEY, WHO_KEY].forEach(k => sessionStorage.removeItem(k));
      S.token = null; S.key = null; S.who = "";
    }
  }
  /* The status call is only a reachability probe now, so an unreachable
     deployment says so rather than showing a sign-in that cannot work. */
  try { const st = await api("/api/status"); S.personal = !!st.personal; }
  catch (e) { deadScreen(e.message); return; }
  gateScreen();
})();

async function open(){ await refresh(); sizeBox(); $("input").focus(); }

async function refresh(){
  const d = await api("/api/state");
  S.brains = d.brains || []; S.concepts = d.concepts || []; S.sources = d.sources || [];
  S.model = d.model || ""; S.chunk = d.chunk || 18000;
  /* The deployment decides how many sources an idea needs, so the card and the
     receipt say the number the rule actually runs on. */
  S.mentions = Number(d.mentions) || 1;
  if (d.account !== undefined) S.account = d.account;
  if (d.kind) S.who = d.kind === "member" ? (S.who || d.account) : d.kind;
  if (d.hasKey !== undefined){ S.hasKey = d.hasKey; S.keyHint = d.keyHint || ""; }
  $("keyBtn").hidden = S.who === "guest" || !S.account;
  $("lockBtn").textContent = S.who === "guest" ? "Leave" : "Sign out";
  render();
}

/* ============ render ============ */
const conceptsOf = b => S.concepts.filter(c => c.brain === b).sort((x,y)=>(x.n||0)-(y.n||0));
const sourcesOf  = b => S.sources.filter(s => (s.brains||[]).includes(b));

function render(){ renderSide(); renderScope(); renderComposer(); renderZero(); }

function renderSide(){
  const box = $("brains"); box.innerHTML = "";
  $("bcount").textContent = S.brains.length || "";
  if (!S.brains.length){
    box.append(el("div","empty-side","None yet. A brain is a subject or a person, with a one line scope."));
  } else {
    /* Clicking a row picks that brain to ask or to feed. Its scope, its counts
       and its controls appear above the composer, which is where the same
       choice is made. A second click goes back to every brain. */
    for (const b of S.brains){
      const on = S.scope === b.slug;
      const row = el("button","brain-row" + (on ? " on" : ""));
      row.append(el("span","nm",b.name),
                 el("span","ct",`${conceptsOf(b.slug).length}·${sourcesOf(b.slug).length}`));
      row.title = `${b.scope || "no scope line"}\n${conceptsOf(b.slug).length} concepts, ${sourcesOf(b.slug).length} sources`;
      row.onclick = () => { S.scope = on ? "all" : b.slug; render(); };
      /* Only the owner may change a brain, which is what the server enforces,
         so the control appears on their own rows alone. */
      if (S.who === "owner" || (!!b.owner && b.owner === S.account)){
        const ed = el("span","ed","edit");
        ed.title = "Name, scope, and who may feed it";
        ed.onclick = e => { e.stopPropagation(); openBrainSheet(b); };
        row.append(ed);
      }
      box.append(row);
    }
  }

  const live = S.pick || S.model;
  $("stat").querySelector(".val").textContent = live ? live.split("/").pop() : "default";
  $("stat").classList.toggle("pick", !!S.pick);
  $("stat").title = S.pick
    ? `${S.pick}, your choice. Click to change it. Build ${window.OCTOPUS_BUILD}.`
    : `${S.model || "the server default"}. Click to pick another. Build ${window.OCTOPUS_BUILD}.`;
}

/**
 * Everything about one brain, in one place: what it is called, the line that
 * decides what belongs inside, and who may feed it.
 *
 * A new name moves the slug, and the slug is how concepts, source rows and
 * counted candidates find their brain. The server moves all three in one write
 * and reports the counts, which is what the receipt below shows.
 */
function openBrainSheet(b){
  closeSide();
  const veil = el("div","veil");
  const was = String(b.visibility ?? "") === "open" || String(b.visibility ?? "") === "drop";
  veil.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <header><h3>${esc(b.name)}</h3>
      <p>The scope line is the only test of what belongs inside. Change it and the next drop is judged
        against the new line.</p></header>
      <div class="f"><label for="rName">Name</label><input id="rName" autocomplete="off"></div>
      <div class="f"><label for="rScope">Scope, in one line</label><textarea id="rScope"></textarea></div>
      <div class="f"><label>Who can feed it</label><div class="seg" id="rVis">
        <button data-v="closed">Only me</button><button data-v="open">Anyone</button></div>
        <div class="hint">Every brain is readable by anyone. This decides who may drop sources into it,
          because a source rewrites the positions inside.</div></div>
      <div class="f"><div id="rMsg" class="bad" role="alert"></div></div>
      <footer><button class="ghost" id="rCancel">Cancel</button><button class="go" id="rSave">Save</button></footer>
    </div>`;
  document.body.append(veil);
  const nameI = veil.querySelector("#rName"), scopeI = veil.querySelector("#rScope"),
        msg = veil.querySelector("#rMsg"), save = veil.querySelector("#rSave");
  nameI.value = b.name || ""; scopeI.value = b.scope || "";
  let vis = was ? "open" : "closed";
  const paint = () => [...veil.querySelectorAll("#rVis button")]
    .forEach(x => x.classList.toggle("on", x.dataset.v === vis));
  paint();
  veil.querySelector("#rVis").onclick = e => {
    const x = e.target.closest("button"); if (x){ vis = x.dataset.v; paint(); }
  };
  const shut = () => veil.remove();
  veil.querySelector("#rCancel").onclick = shut;
  veil.onclick = e => { if(e.target===veil) shut(); };
  setTimeout(()=>nameI.focus(),30);

  save.onclick = async () => {
    const nm = nameI.value.trim(), sc = scopeI.value.trim();
    if (nm.length < 2){ msg.className="bad"; msg.textContent="give a name of at least 2 characters"; nameI.focus(); return; }
    save.disabled = true; msg.className="spin"; msg.textContent = "Saving";
    try {
      /* Feeding goes first, because it is keyed by the old slug and a rename
         would move that slug out from under it. */
      if ((vis === "open") !== was){
        const v = await api("/api/brain/visibility", { slug: b.slug, visibility: vis });
        if (v.error) throw new Error(v.error);
      }
      const r = await api("/api/brain/rename", { slug: b.slug, name: nm, scope: sc });
      if (r.error) throw new Error(r.error);
      shut(); await refresh();
      if (S.scope === b.slug) S.scope = r.slug;
      render();
      const m = r.moved || {};
      push("ai", x => { x.innerHTML = rich(
        (r.name !== b.name
          ? `**${esc(b.name)}** is now **${esc(r.name)}**, at \`${esc(r.slug)}\`.` +
            (r.slug !== b.slug
              ? ` Moved with it: ${m.concepts||0} concepts, ${m.sources||0} sources, ${m.candidates||0} counted candidates.`
              : "")
          : `**${esc(r.name)}** saved.`) +
        `\n\nScope: ${esc(r.scope || sc)}` +
        `\nFeeding: ${vis === "open" ? "anyone signed in" : "you alone"}`); });
    } catch(e){ save.disabled=false; msg.className="bad"; msg.textContent = e.message; }
  };
}

function renderScope(){
  const sel = $("scope");
  sel.innerHTML = "";
  const all = el("option", null, S.mode==="drop" ? "Suggest for me" : "All brains");
  all.value = "all"; sel.append(all);
  for (const b of S.brains){ const o = el("option", null, b.name); o.value = b.slug; sel.append(o); }
  if (!S.brains.some(b => b.slug === S.scope)) S.scope = "all";
  sel.value = S.scope;
  $("scopeLabel").textContent = S.mode==="drop" ? "Into" : "Across";
}

function renderComposer(){
  /* A guest feeds nothing, so Drop is not offered and Ask is the only mode. */
  const guest = S.who === "guest";
  if (guest && S.mode === "drop") S.mode = "ask";
  [...$("mode").children].forEach(x => {
    if (x.dataset.m === "drop") x.hidden = guest;
    x.classList.toggle("on", x.dataset.m === S.mode);
  });
  $("newBrain").hidden = guest;
  /* It appears once there is something to forget. */
  $("freshBtn").hidden = S.mode !== "ask" || !S.thread.length;
  const drop = S.mode==="drop";
  $("input").placeholder = drop
    ? "Paste a link, or the text of the source."
    : S.scope==="all" ? "Ask anything your brains have read."
                      : "Ask " + (S.brains.find(b=>b.slug===S.scope)?.name || "this brain") + ".";
  $("levelWrap").hidden = drop;
  $("level").value = S.level;
  $("testBtn").hidden = !drop;
  $("pasteBtn").hidden = !drop;
  $("pasteBtn").textContent = S.transcript ? `transcript ${Math.round(S.transcript.length/1000)}k ✓` : "+ transcript";
  $("pasteBtn").classList.toggle("has", !!S.transcript);
  $("footNote").textContent = drop
    ? "The source gets read once, then you reply to one card."
    : S.level==="educational" ? "Educational: terms defined, mechanism built, one worked example."
    : S.level==="expert" ? "Expert: the position, then how strong the evidence behind it is."
    : "The answer carries the numbers. Sources sit on one line underneath.";
  const t = $("input").value.trim();
  $("send").disabled = S.busy || !t;
  $("tHint").textContent = S.busy ? "working"
    : drop && !S.transcript && /^https?:\/\//i.test(t) ? "a link alone needs its transcript" : "";
}

function renderZero(){

/* ============ thread ============ */
const clearZero = () => $("thread").querySelector(".zero")?.remove();
const bottom = () => { const t=$("thread"); t.scrollTop = t.scrollHeight; };

function push(kind, build){
  clearZero();
  const wrap = el("div","msg "+(kind==="me"?"me":"ai"));
  const col = el("div","col");
  if (kind !== "me"){
    const who = el("div","who");
    who.append(el("span",null,"Octopus"));
    const b = S.brains.find(x=>x.slug===S.scope);
    if (b) who.append(el("span","sc","· "+b.name));
    col.append(who);
  }
  const body = el("div","body");
  col.append(body); wrap.append(col); $("thread").append(wrap);
  build(body); bottom();
  return body;
}
function says(text, attach){
  push("me", b => { b.textContent = text; if (attach) b.append(el("span","attach",attach)); });
}
function thinking(label){
  return push("ai", b => {
    const t = el("div","thinking"), d = el("span","dots");
    d.append(el("i"),el("i"),el("i"));
    t.append(d, el("span",null,label||"Thinking"));
    b.append(t);
  });
}
function setThinking(body, label){
  const s = body.querySelector(".thinking span:last-child");
  if (s) s.textContent = label;
}
function fail(body, msg){
  body.innerHTML = "";
  const e = el("div","err");
  e.append(el("b",null,"Nothing was stored"), el("span",null,msg || "Something failed on the way. Send it again."));
  body.append(e);
}

/**
 * Has this source landed already, and where. The route behind this reads one
 * indexed row and calls no model, so testing is free however often you do it.
 */
async function testSource(){
  const btn = $("testBtn");
  const raw = $("input").value.trim();
  const link = (raw.match(/https?:\/\/\S+/)||[])[0] || "";

  if (!link){
    push("ai", b => { b.innerHTML = rich(raw
      ? "The repeat check reads the link. Paste the URL and test again, because text alone carries no stable id."
      : "Paste a link first, then test."); });
    bottom(); return;
  }

  btn.disabled = true; btn.textContent = "checking";
  try {
    const r = await api("/api/drop/check", { link, text: "" });
    push("ai", b => {
      const d = el("div","receipt");
      if (r.duplicate){
        const where = (r.brains||[]).map(x => S.brains.find(y=>y.slug===x)?.name || x).join(", ") || "no brain";
        d.innerHTML =
`Already stored as <span class="v">${esc(r.sid)}</span>.
Dropped <span class="v">${esc(r.date||"undated")}</span>${r.author?` by <span class="v">${esc(r.author)}</span>`:""}
Lives in <span class="v">${esc(where)}</span>
Dropping it again reaches the same card, so no position moves.`;
      } else {
        d.innerHTML =
`<span class="ok">Not stored.</span> It would land as <span class="v">${esc(r.sid)}</span>.
Drop it to see which brain takes it and what it adds.`;
      }
      b.append(d);
    });
    bottom();
  } catch(e){
    push("ai", b => { b.innerHTML = rich("The check failed: " + (e.message || "no answer")); });
    bottom();
  } finally {
    btn.disabled = false; btn.textContent = "already stored?";
  }
}

/**

 * two unrelated settings. They are the same thing from two sides: what Octopus

 */
async function openSetupSheet(){
  closeSide();
  const veil = el("div","veil");
  const saved = !!S.hasKey;
  veil.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">

          ? `This account remembers a key ending <b>${esc(S.keyHint || "????")}</b>. A new one replaces it.`
          : "No key is saved, so the one in this tab is used until you close it."}
          Make a key with a spend limit rather than pasting your main one.</div>
      </div>
      <div class="f"><label class="check"><input type="checkbox" id="kRem" ${saved?"checked":""}> Remember it on my account</label>
        <div class="hint">Remembered keys are encrypted with a secret held on the server.</div>
      </div>
      <div class="f" style="padding-top:10px">
        ${saved ? `<button class="ghost" id="kForget">Forget the saved key</button>` : ""}
        <button class="go" id="kSave" style="margin-left:${saved?"8px":"0"}">Save the key</button>
      </div>

      <div class="f" style="border-top:1px solid var(--line); margin-top:14px; padding-top:16px">
        <label>Other AI clients</label>
        <div id="feedSlot"></div>
      </div>

      <div class="f" style="border-top:1px solid var(--line); margin-top:14px; padding-top:16px">
        <label>Video transcripts</label>
        <div id="useSlot"></div>
      </div>

      <div class="f"><div id="kMsg" class="bad" role="alert"></div></div>
      <footer><a class="ghost" href="/doc" style="text-decoration:none">MCP setup</a><button class="go" id="kDone">Done</button></footer>
    </div>`;
  document.body.append(veil);
  const inp = veil.querySelector("#kNew"), msg = veil.querySelector("#kMsg"),
        slot = veil.querySelector("#feedSlot");
  const shut = () => veil.remove();
  veil.querySelector("#kDone").onclick = shut;
  veil.onclick = e => { if(e.target===veil) shut(); };
  setTimeout(()=>inp.focus(),40);

  /* ---- the key ---- */

  if (forget) forget.onclick = async () => {

    try {
      await api("/api/account/key", { forget: true });

      shut();
      push("ai", b => { b.innerHTML = rich("The saved key is gone. Paste one when you next ask or drop."); });
    } catch(e){ forget.disabled=false; msg.className="bad"; msg.textContent = e.message; }
  };

  veil.querySelector("#kSave").onclick = async () => {
    const key = inp.value.trim();
    if (key.length < 16){ msg.className="bad"; msg.textContent="that does not look like an API key"; inp.focus(); return; }
    const btn = veil.querySelector("#kSave");
    btn.disabled = true; msg.className="spin"; msg.textContent = "Saving";
    try {
      if (veil.querySelector("#kRem").checked){
        const r = await api("/api/account/key", { key });
        if (r.error) throw new Error(r.error);
        S.hasKey = true; S.keyHint = r.keyHint || key.slice(-4);
      } else {
        /* Not remembered, so the old saved one would still be used. Drop it. */
        if (saved) await api("/api/account/key", { forget: true });
        S.hasKey = false; S.keyHint = "";
      }
      S.key = key;
      try { sessionStorage.setItem(KEY_KEY, key); } catch {}
      shut();
      push("ai", b => { b.innerHTML = rich(
        `Key set, ending **${esc(key.slice(-4))}**. ` +
        (S.hasKey ? "This account will remember it." : "It lives in this tab only.")); });
    } catch(e){ btn.disabled=false; msg.className="bad"; msg.textContent = e.message; }

  /* ---- what the transcript service has cost ---- */
  const use = veil.querySelector("#useSlot");
  use.innerHTML = `<div class="hint">Checking</div>`;
  try { use.innerHTML = usageLines(await api("/api/usage", { days: 30 })); }
  catch(e){ use.innerHTML = `<div class="hint">${esc(e.message)}</div>`; }

/**
 * Two counts, because they answer different questions.
 *
 * The vendor's is the one the quota is measured against, so it decides when to
 * start pasting instead. The local one is the pace Octopus itself runs at over
 * the last 30 days, which is what says whether the quota will hold.
 */
function usageLines(u){
  if (!u.configured){
    return `<div class="hint">No transcript service is set, so a video link asks you to paste.
      <a href="/doc">How to turn it on</a>.</div>`;
  }
  const m = u.mine || {}, p = u.plan;
  const mine = `<div class="meter">${m.got || 0} fetched through Octopus in the last ${m.days || 30} days` +
    (m.failed ? `, ${m.failed} asked you to paste` : "") + `.</div>`;

  if (!p){
    return `<div class="hint bad-ish">The service did not report its own count: ${esc(u.why || "no reason given")}</div>` + mine;
  }
  const left = Math.max((p.max || 0) - (p.used || 0), 0);
  const pct = p.max ? Math.min(Math.round((p.used / p.max) * 100), 100) : 0;
  const tight = p.max && left <= Math.max(Math.ceil(p.max * 0.15), 5);
  return `
    <div class="bar"><i style="width:${pct}%" class="${tight?"tight":""}"></i></div>
    <div class="meter"><b>${p.used}</b> of <b>${p.max}</b> credits used this billing period
      &middot; ${esc(p.name)} plan${u.mode === "auto" ? " &middot; generating when captions are missing" : ""}</div>
    ${mine}
    ${tight ? `<div class="hint" style="color:var(--accent)">${left} left. Paste transcripts until it resets.</div>` : ""}`;
}

/* Clipboard access can be refused, so leaving the text selected is the fallback. */
function copyTo(btn, input){
  btn.onclick = async () => {
    input.select();
    try { await navigator.clipboard.writeText(input.value); btn.textContent = "Copied"; }
    catch { btn.textContent = "Press copy"; }
    setTimeout(() => { btn.textContent = "Copy"; }, 1600);
  };
}

/**
 * The model list comes from OpenRouter itself, so the prices shown are the ones
 * that get billed. Only models that accept a JSON response format are offered,
 * because every drop asks for JSON and the rest fail on the first call.
 *
 * Fetched once per tab. A failed fetch leaves the text field, which still works.
 */
let MODELS = null;
async function models(){
  if (MODELS) return MODELS;
  const r = await fetch("https://openrouter.ai/api/v1/models");
  if (!r.ok) throw new Error("OpenRouter did not answer with its model list");
  const d = await r.json();
  MODELS = (d.data || [])
    .filter(m => (m.supported_parameters || []).includes("response_format"))
    .map(m => ({
      id: m.id, name: m.name || m.id,
      inp: Number(m.pricing?.prompt || 0) * 1e6,
      out: Number(m.pricing?.completion || 0) * 1e6,
      ctx: Number(m.context_length || 0),
    }))
    /* A negative price means the router decides at call time, so no number can
       be shown. Those rows would read as "$-1000000 in". */
    .filter(m => m.inp >= 0 && m.out >= 0)
    .sort((a, b) => (a.inp + a.out) - (b.inp + b.out));
  return MODELS;
}

const money = n => n === 0 ? "free" : n < 1 ? "$" + n.toFixed(3).replace(/0+$/,"").replace(/\.$/,"") : "$" + n.toFixed(2);
const ctxOf = n => n >= 1000000 ? Math.round(n/1000000) + "M" : n >= 1000 ? Math.round(n/1000) + "k" : String(n);

/**
 * Pick the model that answers. Your key pays for the call, so the choice is
 * yours. Picking nothing leaves the one this deployment runs.
 */
function openModelSheet(){
  closeSide();
  const veil = el("div","veil");

                                      || (t === "free" && m.inp === 0 && m.out === 0))

  models().then(ms => { all = ms; paint(); setTimeout(()=>q.focus(),30); })
    .catch(e => { msg.className="bad"; msg.textContent = e.message; list.innerHTML = ""; list.append(el("div","mnone","The list did not load.")); });

  veil.querySelector("#mReset").onclick = () => {
    S.pick = ""; savePick(); shut(); render();

  };

  save.onclick = () => {
    if (!chosen){ msg.className="bad"; msg.textContent="pick one from the list"; return; }
    const m = all.find(x => x.id === chosen);
    S.pick = chosen === S.model ? "" : chosen;
    savePick(); shut(); render();
    push("ai", b => { b.innerHTML = rich(
      `Now asking **${esc(chosen)}**.` +
      (m ? ` ${money(m.inp)} in, ${money(m.out)} out per million tokens, ${ctxOf(m.ctx)} of context.` : "") +

function nearest(scope){
  const stop = new Set("the a an and or of for my own to in on with about from at by as is are".split(" "));
  const w = new Set((scope.toLowerCase().match(/[a-z]{3,}/g)||[]).filter(x=>!stop.has(x)));
  let best=null, bestN=0;
  for (const b of S.brains){
    const o = new Set((String(b.scope||"").toLowerCase().match(/[a-z]{3,}/g)||[]).filter(x=>!stop.has(x)));
    let n=0; for (const x of w) if (o.has(x)) n++;
    if (n>bestN){ bestN=n; best=b; }
  }
  return bestN>=2 ? best : null;
}

/* ============ go ============ */
async function go(){
  const text = $("input").value.trim();
  if (!text || S.busy) return;
  $("input").value = ""; sizeBox();
  S.busy = true; renderComposer();
  try { S.mode==="drop" ? await doDrop(text) : await doAsk(text); }
  finally { S.busy = false; renderComposer(); }
}

/* ---------- ask ---------- */
async function doAsk(q){
  says(q);
  if (!S.brains.length){
    push("ai", b => { b.innerHTML = rich("No brains exist yet, so there is nothing to read. Create one, drop a few sources, then ask again."); });
    return;
  }
  const body = thinking("Reading your brains");
  try {
    const r = await api("/api/ask",
      { q, brain: S.scope, level: S.level, history: S.thread.slice(-4), key: S.key });
    body.innerHTML = "";
    if (r.sources > 0 && r.sources < 10)
      body.append(el("div","smallbrain",`Small brain: ${r.sources} source${r.sources===1?"":"s"} behind this`));
    const out = el("div"); out.innerHTML = splitAnswer(r.answer); body.append(out);
    /* Six turns is what a thread of follow-ups runs to before the subject has
       moved anyway. Only the last four travel. */
    S.thread.push({ q, a: String(r.answer ?? "") });
    if (S.thread.length > 6) S.thread = S.thread.slice(-6);
    renderComposer();
    bottom();
  } catch(e){ fail(body, e.message); }
}
/**
 * The answer arrives as one sentence per line, which is what the prompt asks
 * for. Each line becomes its own block, so the gap between sentences is a
 * setting rather than whatever a line break happens to give.
 *
 * A blank line in the answer starts a new group, with a wider gap.
 */
function splitAnswer(t){
  const m = String(t).match(/\n\s*(Sources:[^\n]*)\s*$/i);
  const body = m ? String(t).slice(0, m.index) : String(t);
  const html = body.split(/\n{2,}/).map(group =>
    `<div class="para">` +
    group.split("\n").map(l => l.trim()).filter(Boolean)
      .map(l => `<p class="ln">${esc(l).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")}</p>`)
      .join("") + `</div>`).filter(x => x !== `<div class="para"></div>`).join("");
  return html + (m ? `<div class="srcline">${esc(m[1])}</div>` : "");
}

/* ---------- drop ---------- */
async function doDrop(text){
  const link = (text.match(/https?:\/\/\S+/)||[])[0] || "";
  let bodyTxt = S.transcript || (link ? null : text);
  says(text, S.transcript ? `transcript attached, ${(S.transcript.match(/\S+/g)||[]).length.toLocaleString()} words` : null);

  if (!S.brains.length){
    push("ai", b => { b.innerHTML = rich("Create a brain first. A source needs a scope to be filed against."); });
    return;
  }

  let chk;
  const body = thinking("Checking for a repeat");
  try { chk = await api("/api/drop/check", { link, text }); }
  catch(e){ fail(body, e.message); return; }

  /* Already held somewhere. That is worth knowing, not a reason to stop: the
     same source often belongs in a second brain. Reusing the extraction it
     already gave up means the second filing reads nothing. */
  if (chk.duplicate){
    const names = (chk.brains||[]).map(x => S.brains.find(y=>y.slug===x)?.name || x);
    body.innerHTML = "";
    body.innerHTML = rich(
      `**Already stored** as \`${esc(chk.sid)}\`, filed ${esc(chk.date||"earlier")} into ` +
      `**${esc(names.join(", ")||"no brain")}**.\n\n` +
      `Filing it into another brain reuses what it already gave up, so nothing gets read twice.`);
    const row = el("div"); row.style.cssText = "display:flex;gap:8px;margin-top:14px";
    const go = el("button","go","File it elsewhere");
    const no = el("button","ghost","Stop");
    no.onclick = () => {
      row.remove();
      push("ai", b => { b.innerHTML = rich("Stopped. Nothing was read and no position moved."); });
    };
    go.onclick = async () => {
      go.disabled = no.disabled = true; row.remove();
      const b2 = thinking("Reading back what it already gave up");
      let got;
      try { got = await api("/api/drop/again", { sid: chk.sid }); }
      catch(e){ fail(b2, e.message); return; }
      if (got.error){ fail(b2, got.error); return; }
      await planAndCard(b2, chk.sid, chk.link || link, got.ext, 0, chk.brains || []);
    };
    row.append(go, no); body.append(row);
    return;
  }

  /* A link on its own. Octopus opens the page, so pasting is only needed when
     the text sits somewhere a fetch cannot reach, such as a video's captions or
     a page behind a login. The duplicate check already ran, so a repeat costs
     nothing here. */
  if (!bodyTxt){
    setThinking(body, "Opening the link");
    let got;
    try { got = await api("/api/fetch", { url: link }); }
    catch(e){ got = { error: e.message }; }

    if (got && got.text){
      bodyTxt = got.text;
    } else {
      body.innerHTML = "";
      body.innerHTML = rich(`**That page needs pasting.** ${esc((got && got.error) || "It gave nothing back.")}`);
      const go = el("button","go","Paste the text");
      go.style.marginTop = "12px"; go.onclick = openTranscript; body.append(go);
      return;
    }
  }

  const CH = S.chunk, chunks = [];
  for (let i=0; i<bodyTxt.length; i+=CH) chunks.push(bodyTxt.slice(i,i+CH));
  const parts = [];
  try {
    for (let i=0;i<chunks.length;i++){
      setThinking(body, chunks.length>1 ? `Reading, pass ${i+1} of ${chunks.length}` : "Reading the source");
      const r = await api("/api/drop/read", { chunk: chunks[i], part: i+1, total: chunks.length, key: S.key });
      parts.push(r.part||{});
    }
  } catch(e){ fail(body, e.message); return; }

  const ext = {
    title: parts.find(p=>p.title)?.title || link || "Untitled source",
    author: parts.find(p=>p.author)?.author || "",
    date: parts.find(p=>p.date)?.date || "",
    topics: parts.flatMap(p=>p.topics||[]),
    quotes: parts.flatMap(p=>p.quotes||[]),
    thin: parts.flatMap(p=>p.thin||[]),
  };

  /* An extraction with no topics means the read came back empty, which is a
     different thing from a source that holds nothing. Left alone, the plan runs
     on nothing and the card reads "nothing new", which blames the source. */
  if (!ext.topics.length){
    body.innerHTML = "";
    body.innerHTML = rich(
      `**The read came back empty.** ${Math.round(bodyTxt.length/1000)}k characters went in and no topic came out.\n\n` +
      `Auto-captions with no punctuation are the usual cause. Paste the transcript from the video's own panel, which carries line breaks.`);
    const go = el("button","go","Paste the text");
    go.style.marginTop = "12px"; go.onclick = openTranscript; body.append(go);
    return;
  }

  await planAndCard(body, chk.sid, link, ext, bodyTxt.length);
}

/**
 * The plan and the card, from an extraction however it arrived: read just now,
 * or reused from a source already stored.
 *
 * `held` names the brains that already carry it, which the plan leaves out so
 * it proposes somewhere new rather than rewriting positions with a source they
 * already hold.
 */
async function planAndCard(body, sid, link, ext, len, held){
  setThinking(body, "Comparing against what you hold");
  let plan;
  try {
    plan = (await api("/api/drop/plan", { ext, brain: S.scope, key: S.key,
      ...(held && held.length ? { exclude: held } : {}) })).plan;
  } catch(e){ fail(body, e.message); return; }

  /* A plan that files nothing anywhere is a failed read, not an empty source.
     Rendering the card would offer Store it on a source that touches no
     position, and the store would refuse. Say what happened instead. */
  const lands = (plan.matched||[]).length + (plan.candidates||[]).length + (plan.new||[]).length;
  if (!lands){
    body.innerHTML = "";
    body.innerHTML = rich(
      `**The plan found nothing to file.** ${len ? `${Math.round(len/1000)}k characters were read` : "The stored extraction was reused"}, ` +
      `and no concept, candidate or new claim came back.\n\n` +
      `An auto-caption with no punctuation is the usual cause. Paste the transcript from the video's own panel, which carries sentences.`);
    const go = el("button","go","Paste the text");
    go.style.marginTop = "12px"; go.onclick = openTranscript; body.append(go);
    S.pendingCard = null; renderComposer();
    return;
  }

  /* Position-changing clashes lead, nuance follows. Both get a say, because
     you are the one who holds these positions. */
  const decide = [...(plan.conflicts||[]).filter(c=>c.kind==="flip"),
                  ...(plan.conflicts||[]).filter(c=>c.kind!=="flip")];
  const pc = { sid, link, ext, plan, choices:{}, byKey:{}, promote:[], len };
  S.pendingCard = pc; S.transcript = null; renderComposer();

  body.innerHTML = "";
  body.append(buildCard(pc, decide));
  bottom();
}

/* The decision travels under the concept it concerns, never under a position
   number, because the rewriter reads it per concept. */
const ckey = (c, i) => c.conceptId || (c.brain && c.concept ? c.brain+"/"+c.concept : c.concept) || ("c"+i);

function buildCard(pc, decide){
  const { sid, ext, plan } = pc;
  const card = el("div","card");
  const top = el("div","card-top");
  top.append(el("span","id",sid),
    el("span","meta",[ext.author, ext.date,
      pc.len ? Math.round(pc.len/1000)+"k chars" : "read already"].filter(Boolean).join(" · ")));
  card.append(top);

  const dl = el("dl","card-grid");
  const row = (k,node) => { dl.append(el("dt",null,k)); const d=el("dd"); d.append(node); dl.append(d); };

  row("Goes to", el("span",null,
    (plan.brains||[]).map(x => { const b=S.brains.find(y=>y.slug===x); return b?`${b.name} (${b.type})`:x; }).join(" · ") || "no brain matched"));

  const cc = el("div","chips");
  (plan.matched||[]).forEach(m => {
    const c = S.concepts.find(x => `${x.brain}/${x.slug}` === m.conceptId);
    cc.append(el("span","chip", c?c.title:String(m.conceptId||"").split("/").pop()));
  });
  /* A candidate waits for a third source before it becomes a position. Clicking
     it takes it now, because you are the one who decides what this brain holds. */
  (plan.candidates||[]).forEach(m => {
    if (S.mentions <= 1){ cc.append(el("span","chip cand","+ "+m.title)); return; }
    const ch = el("button","chip cand","+ "+m.title);
    ch.onclick = () => {
      const i = pc.promote.indexOf(m.title);
      if (i < 0) { pc.promote.push(m.title); ch.classList.add("on"); }
      else { pc.promote.splice(i,1); ch.classList.remove("on"); }
    };
    cc.append(ch);
  });
  if (!cc.children.length) cc.append(el("span","chip none","none"));
  const cbox = el("div");
  cbox.append(cc);
  if ((plan.candidates||[]).length)
    cbox.append(el("div","chip-note",
      S.mentions <= 1
        ? "Orange ones are new here. Each becomes a position when you store it."
        : `Orange ones are new here. They need ${S.mentions} sources to become a position. Click one to take it now.`));
  row("Concepts", cbox);

  const nu = el("ul");
  (plan.new||[]).slice(0,3).forEach(x => nu.append(el("li",null,"· "+x)));
  if (!(plan.new||[]).length) nu.append(el("li","none","nothing new"));
  else if ((plan.new||[]).length>3) nu.append(el("li","none",`and ${plan.new.length-3} more`));
  row(`New ${(plan.new||[]).length||""}`, nu);

  const eu = el("ul");
  (plan.echo||[]).slice(0,3).forEach(x => eu.append(el("li",null,`· ${x.claim} — repeats ${x.repeatsSource||"an earlier source"}`)));
  if (!(plan.echo||[]).length) eu.append(el("li","none","none"));
  row(`Echoes ${(plan.echo||[]).length||""}`, eu);

  card.append(dl);

  if (decide.length){
    const wrap = el("div","conflicts");
    decide.forEach((c,i) => {
      const key = ckey(c,i);
      const f = el("div","cf"); f.append(el("span","n",String(i+1)));
      const r = el("div");
      r.append(el("div","cn", c.concept + (c.brain ? "  ·  "+(S.brains.find(b=>b.slug===c.brain)?.name||c.brain) : "")));
      r.append(el("div", c.kind==="flip" ? "kind big" : "kind",
        c.kind==="flip" ? "changes the position"
        : c.kind==="drift" ? "same person, later view"
        : "adds nuance, position holds"));
      const mk = (lab,val,date) => { const d=el("div","side"); d.append(el("span",null,lab), document.createTextNode(String(val||"") + (date?`, ${date}`:""))); return d; };
      r.append(mk("new", c.says, c.saysDate), mk("stored", c.stored, c.storedDate));
      if (c.why) r.append(el("div","why","They differ because "+c.why));
      const opts = el("div","opts");
      [["both","keep both"],["new","new wins"],["old","mine wins"],["skip","reject source"]].forEach(([v,lab]) => {
        const o = el("button","opt"+(v==="both"?" dflt on":""), lab);
        o.onclick = () => { pc.choices[key]=v; [...opts.children].forEach(x=>x.classList.remove("on")); o.classList.add("on"); };
        opts.append(o);
      });
      pc.choices[key] = "both";
      pc.byKey[key] = c;
      r.append(opts); f.append(r); wrap.append(f);
    });
    card.append(wrap);
  }

  const foot = el("div","card-foot");
  /* A caveat IS a contradiction, it just does not change a position. Saying
     "no conflict" while one sits above the line reads as a lie. */
  foot.append(el("span","hint", decide.length
    ? `${decide.length} contradiction${decide.length===1?"":"s"} to settle. Silence keeps both, so a long list costs you nothing.`
    : "Nothing here contradicts what you hold."));
  const skip = el("button","ghost","Reject source");
  const ok   = el("button","go","Store it");
  skip.onclick = () => { card.remove(); S.pendingCard=null;
    push("ai", b => { b.innerHTML = rich("Rejected. Nothing was stored and no position moved."); }); };
  ok.onclick = async () => {
    ok.disabled = skip.disabled = true; ok.textContent = "Storing";
    if (Object.values(pc.choices).includes("skip")){
      card.remove(); S.pendingCard=null;
      push("ai", b => { b.innerHTML = rich("Rejected on a conflict. Nothing was stored and no position moved."); });
      return;
    }
    const b2 = thinking("Rewriting the positions it touched");
    try {
      const r = await api("/api/drop/settle", {
        sid: pc.sid, link: pc.link, ext: pc.ext, plan: pc.plan,
        choices: pc.choices, promote: pc.promote, key: S.key });
      card.remove(); await refresh();
      b2.innerHTML = "";
      b2.append(receipt(r, pc));
      bottom();
    } catch(e){ ok.disabled = skip.disabled = false; ok.textContent = "Store it"; fail(b2, e.message); }
    S.pendingCard = null;
  };
  foot.append(skip, ok); card.append(foot);
  return card;
}

function receipt(r, pc){
  const names = (r.brains||[]).map(x => S.brains.find(b=>b.slug===x)?.name || x).join(", ") || "none";
  const ch = Object.values(pc.choices||{});
  const flipped = ch.filter(x=>x==="new").length, both = ch.filter(x=>x==="both").length;
  const open = Object.entries(pc.choices||{}).filter(([,v])=>v==="both")
    .map(([k]) => (pc.byKey||{})[k]?.concept).filter(Boolean);
  const d = el("div","receipt");
  d.innerHTML =
`Stored <span class="v">${esc(r.sid)}</span>. Brains <span class="v">${esc(names)}</span>.
Rewritten: <span class="v">${r.positions}</span> position${r.positions===1?"":"s"} · <span class="v">${(r.brains||[]).length}</span> summar${(r.brains||[]).length===1?"y":"ies"}
<span class="v">${r.counts?.new ?? 0}</span> new · <span class="v">${r.counts?.echo ?? 0}</span> echoes · <span class="v">${flipped}</span> flipped · <span class="v">${both}</span> kept both
<span class="ok">Coherent.</span> Open conflicts: <span class="v">${esc(open.join(", ")||"none")}</span>`;
  /* A counted candidate is stored, just not as a position yet. Saying so keeps
     the receipt honest about where the idea went. */
  for (const c of (r.counted||[])){
    d.innerHTML += `\nCounted <span class="v">${esc(c.title)}</span> at <span class="v">${c.have}</span> of ${S.mentions}. ` +
      `<span class="v">${c.need}</span> more source${c.need===1?"":"s"} makes it a position.`;
  }
  return d;
}

/* ============ export ============ */
function exportAll(){
  const out = ["# MAP\n\n| Brain | Type | Concepts | Scope |\n|---|---|---|---|"];
  for (const b of S.brains) out.push(`| brain-${b.type}-${b.slug} | ${b.type} | ${conceptsOf(b.slug).length} | ${b.scope} |`);
  out.push("\n# SOURCES\n\n| Id | Date | Author | Link | Brains |\n|---|---|---|---|---|");
  for (const s of S.sources) out.push(`| ${s.sid} | ${s.date||""} | ${s.author||""} | ${s.link||""} | ${(s.brains||[]).join(", ")} |`);
  for (const b of S.brains){
    out.push(`\n# brain-${b.type}-${b.slug}/SUMMARY.md\n\n**Scope:** ${b.scope}\n`);
    for (const c of conceptsOf(b.slug)) out.push(`- ${c.title}: ${c.summaryLine||c.position||"no position yet"}. \`${pad2(c.n||1)}-${slug(c.title)}.md\``);
    for (const c of conceptsOf(b.slug)){
      out.push(`\n## brain-${b.type}-${b.slug}/${pad2(c.n||1)}-${slug(c.title)}.md\n`);
      out.push(`### Position\n\n${c.position||"none yet"}\n`);
      out.push(`### Evidence\n\n${(c.evidence||[]).map(e=>`- ${e.date||"?"}, ${e.author||"?"}: ${e.claim||""}`).join("\n")||"- none"}\n`);
      out.push(`### Data\n\n${(c.data||[]).map(x=>"- "+x).join("\n")||"- none"}\n`);
      out.push(`### Open conflicts\n\n${(c.conflicts||[]).map(x=>`- ${x.a} (${x.aDate}) against ${x.b} (${x.bDate}). They differ because ${x.why}.`).join("\n")||"- none"}\n`);
      out.push(`### Sources\n\n${(c.sources||[]).map(x=>"- `notes/"+x+".md`").join("\n")||"- none"}\n`);
      out.push(`### Updated\n\n${c.updated||""}\n`);
    }
  }
  const md = out.join("\n");
  push("ai", b => {
    b.innerHTML = rich(`**Export ready.** ${S.brains.length} brain${S.brains.length===1?"":"s"}, ${S.concepts.length} concept${S.concepts.length===1?"":"s"}, ${S.sources.length} source${S.sources.length===1?"":"s"}, as the markdown the repo expects.`);
    const pre = el("div","receipt");
    pre.style.cssText = "margin-top:12px;max-height:280px;overflow:auto";
    pre.textContent = md.slice(0,4000) + (md.length>4000 ? `\n\n... ${md.length-4000} more characters` : "");
    b.append(pre);
    const cp = el("button","go","Copy all");
    cp.style.marginTop = "12px";
    cp.onclick = async () => {
      try { await navigator.clipboard.writeText(md); cp.textContent = "Copied"; }
      catch(_){ cp.textContent = "Select it above"; }
    };
    b.append(cp);
  });
}

})();
</script>
