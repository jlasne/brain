<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Octopus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="icon" href="/brand/logo-mark.png">

<script>
  /* The deployment this app talks to. Public by design: the OpenRouter key
     lives on the server and never reaches a browser. */
  window.OCTOPUS_API = "https://uncommon-wolf-174.eu-west-1.convex.site";
  window.OCTOPUS_BUILD = "2026-09-15a";
</script>

<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root{
    /* The mark the loader turns. */
    --mark:url("/brand/logo-mark.png");
    /* Octopus: the orange #d97757 on beige #F5F5DC, the sidebar a shade deeper.
       Cards stay white. The lighter labels and the orange text run one step
       darker than before so they hold 4.5:1 on the beige. There is no dark
       variant: the brand colours are the look, whatever the system setting. */
    --bg:#F5F5DC; --surface:#ffffff; --surface-2:#EAEACB; --surface-3:#dfdfbc;
    --ink:#141413; --ink-2:#3d3d3a; --ink-3:#5c5b52; --ink-4:#67665a;
    --line:#e2e2c4; --line-2:#cfcfab;
    --accent:#a54b2f; --accent-fill:#d97757; --accent-solid:#d97757; --accent-on:#ffffff;
    --accent-soft:rgba(217,119,87,.10); --accent-line:rgba(217,119,87,.34);
    --good:#3f7d5c;
    --shadow:0 1px 2px rgba(20,20,19,.05), 0 1px 8px rgba(20,20,19,.04);
    --shadow-lift:0 2px 6px rgba(20,20,19,.07), 0 12px 32px rgba(20,20,19,.10);

    --sans:'Hanken Grotesk',ui-sans-serif,system-ui,'Helvetica Neue',Arial,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ease:cubic-bezier(.22,.61,.36,1);
    color-scheme:light;
  }


  /* ======================================================================
     THE SQUIDGY SPACE

     Brown #A8704E and pink #F5C9D1, on every surface rather than the accent
     alone. The sidebar is an 80% wash of the pink, the page a 40% one, cards stay
     white so what you read keeps its contrast, and the text runs in browns
     instead of greys.

       --accent-fill   the brand brown: borders, focus rings, dots, bars
       --accent-solid  a fill that carries a label, 7% darker than the brand
                       brown because white on #A8704E reads at 4.12:1
       --accent        accent text, dark enough to hold 4.5:1 on the pink

     Every text colour here clears 4.5:1 on the pink, the page and white.
     ====================================================================== */
  :root[data-space="squidgy"]{
    --mark:url("/brand/squidgy-mark.png");
    --bg:#fbe9ed; --surface:#ffffff; --surface-2:#f7d4da; --surface-3:#efc0c9;
    --ink:#2a1810; --ink-2:#4b3024; --ink-3:#6b4234; --ink-4:#7c5243;
    --line:#f1cfd6; --line-2:#dfa9b4;
    --accent:#7a4e36; --accent-fill:#A8704E; --accent-solid:#9c6849; --accent-on:#ffffff;
    --accent-soft:rgba(168,112,78,.12); --accent-line:rgba(168,112,78,.40);
    --shadow:0 1px 2px rgba(122,78,54,.08), 0 1px 8px rgba(122,78,54,.06);
    --shadow-lift:0 2px 6px rgba(122,78,54,.10), 0 12px 32px rgba(122,78,54,.14);
  }

  /* What you say sits in the brand colour, so the thread reads as two voices at
     a glance: yours in brown, the brain's on the page. */
  :root[data-space="squidgy"] .msg.me .body{ background:var(--accent-solid); color:var(--accent-on); border-color:transparent; }
  :root[data-space="squidgy"] .msg.me .body .attach{ color:var(--accent-on); opacity:.8; }

  /* The dog greets an empty thread. */
  .zero-mark{ display:block; height:92px; width:auto; margin-bottom:22px; }

  html{ background:var(--bg); }
  body{
    background:var(--bg); color:var(--ink-2);
    font:400 16px/1.62 var(--sans);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    height:100dvh; overflow:hidden;
  }
  ::selection{ background:var(--accent-soft); color:var(--ink); }

  button,input,textarea,select{ font:inherit; color:inherit; background:none; border:none; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--accent-fill); outline-offset:2px; border-radius:4px; }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--line-2); border-radius:10px; border:3px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--surface-3); background-clip:content-box; }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* ============ shell ============ */
  .app{
    display:grid; grid-template-columns:264px 1fr; height:100dvh;
    transition:grid-template-columns .2s var(--ease);
  }

  /* Folding the nav is a desktop affair. Narrow screens already slide it in
     and out as a drawer, so these rules must not reach them. */
  .navtoggle{
    margin-left:auto; flex-shrink:0; width:24px; height:24px; border-radius:6px;
    display:grid; place-items:center; color:var(--ink-3);
    font:400 15px/1 var(--sans);
    transition:color .15s var(--ease), background .15s var(--ease);
  }
  .navtoggle:hover{ color:var(--accent); background:var(--surface-3); }
  .navopen{
    display:none; position:fixed; top:13px; left:13px; z-index:30;
    place-items:center; width:30px; height:30px; border-radius:7px;
    border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink-3);
  }
  .navopen:hover{ color:var(--accent); border-color:var(--accent-fill); }
  @media (min-width:861px){
    .app.nav-closed{ grid-template-columns:0 1fr; }
    .app.nav-closed aside{ opacity:0; pointer-events:none; }
    .app.nav-closed .navopen{ display:grid; }
    aside{ transition:opacity .15s var(--ease); }
  }
  @media (max-width:860px){ .navtoggle{ display:none; } }

  /* ============ sidebar ============ */
  aside{
    background:var(--surface-2); border-right:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0;
  }
  .brand{
    padding:18px 18px 15px;
    display:flex; align-items:center; gap:9px;
  }
  .brand .mark{ width:24px; height:24px; flex-shrink:0; color:var(--accent-fill); }
  .brand .mark svg, .brand .mark img{ width:100%; height:100%; display:block; }
  .brand h1{ font:600 18px/1 var(--sans); letter-spacing:-.015em; color:var(--ink); }
  .brand h1 a, .topbar h1 a{ color:inherit; text-decoration:none; }
  .brand h1 a:hover, .topbar h1 a:hover{ color:var(--accent); }

  .side-scroll{ flex:1; overflow-y:auto; padding:16px 12px; min-height:0; }

  .side-h{
    display:flex; align-items:center; gap:6px; margin:2px 0 7px; padding:0 3px;
    font:400 10.5px/1.6 var(--mono); letter-spacing:.07em; text-transform:uppercase;
    color:var(--ink-4);
  }
  .side-h b{ color:var(--accent); font-weight:500; margin-left:auto; }

  /* People, then Subjects. Quieter than the panel header above it, because it
     divides a list rather than naming the panel. */
  .group-h{
    margin:11px 0 5px; padding:0 3px;
    font:500 10px/1.6 var(--mono); letter-spacing:.09em; text-transform:uppercase;
    color:var(--ink-4);
  }
  .group-h:first-child{ margin-top:0; }

  /* The drop's source line. It shares the composer box with the content, divided by one
     rule, so the two read as halves of one drop rather than two forms. */
  .dropsrc{
    display:flex; align-items:center; gap:10px;
    padding:9px 14px 9px 15px; border-bottom:1px solid var(--line);
  }
  .dropsrc label{
    font:500 11px/1 var(--mono); letter-spacing:.07em; text-transform:uppercase;
    color:var(--ink-4); flex-shrink:0;
  }
  .dropsrc input{
    flex:1; min-width:0; border:none; background:none; padding:0;
    font:400 14px/1.5 var(--sans); color:var(--ink);
  }
  .dropsrc input:focus{ outline:none; }
  .dropsrc input::placeholder{ color:var(--ink-4); }

  /* One line per brain: the name, and what it holds. The scope line and the
     controls live above the composer, next to the choice they belong to, so a
     row here stays a row. */
  .brain-row{
    display:flex; align-items:baseline; gap:8px; width:100%; text-align:left;
    padding:8px 10px; border-radius:8px; border:1px solid transparent;
    transition:background .15s var(--ease), border-color .15s var(--ease);
  }
  .brain-row + .brain-row{ margin-top:2px; }
  /* A person or a subject, told apart by one small mark. */
  .b-ic{ width:15px; height:15px; flex:none; align-self:center; fill:none; stroke:currentColor;
         stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; color:var(--ink-4); }
  .brain-row.on .b-ic, .pk-row.on .b-ic{ color:var(--accent); }
  .brain-row .nm{
    font:500 13.5px/1.35 var(--sans); color:var(--ink-2);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .brain-row .ct{ margin-left:auto; font:400 10.5px/1 var(--mono); color:var(--ink-4); white-space:nowrap; }
  /* The one control a row carries, on the row you are pointing at. */
  /* Hidden, they take no room, so a long name shows whole until the row is
     pointed at. */
  .brain-row .ed{
    display:none; font:500 10.5px/1 var(--sans); color:var(--ink-4); padding:3px 5px; border-radius:5px;
    transition:color .12s var(--ease), background .12s var(--ease);
  }
  .brain-row:hover .ed, .brain-row:focus-visible .ed, .brain-row.on .ed{ display:inline-block; }
  /* A touch screen has no hover, so its row shows the controls. */
  @media (hover:none){ .brain-row .ed{ display:inline-block; } }
  .brain-row .ed:hover{ color:var(--accent); background:var(--accent-soft); }
  .brain-row:hover{ background:var(--surface); }
  .brain-row:hover .nm{ color:var(--ink); }
  .brain-row.on{ background:var(--surface); border-color:var(--accent-line); }
  .brain-row.on .nm, .brain-row.on .ct{ color:var(--accent); }
  .empty-side{ padding:6px 3px; font:400 12.5px/1.55 var(--sans); color:var(--ink-4); }

  /* The brain viewer: a wide sheet, a list, then one concept. */
  .sheet.viewer{ max-width:760px; max-height:88vh; display:flex; flex-direction:column; }
  .viewer .vw-h{ position:relative; padding:18px 52px 14px 20px; border-bottom:1px solid var(--line); }
  .viewer .vw-h p{ margin-top:6px; font-size:13.5px; line-height:1.5; color:var(--ink-3); }
  .viewer .vw-x{ position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:9px;
                 font:400 22px/1 var(--sans); color:var(--ink-3); }
  .viewer .vw-x:hover{ background:var(--surface-2); color:var(--ink); }
  .viewer .vw-back{ display:block; margin-bottom:8px; font:500 12.5px/1 var(--sans); color:var(--accent); }
  .viewer .vw-bar{ display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line); }
  .viewer .vw-count{ font:400 12px/1 var(--mono); color:var(--ink-3); white-space:nowrap; }
  .viewer .vw-filter{ margin-left:auto; width:min(260px, 50%); padding:8px 11px; border:1px solid var(--line-2);
                      border-radius:9px; background:var(--surface); font:400 13.5px/1.2 var(--sans); color:var(--ink); }
  .viewer .vw-list{ overflow-y:auto; padding:6px 10px 12px; }
  .viewer .vw-row{ display:flex; align-items:flex-start; gap:14px; width:100%; text-align:left; padding:11px 10px;
                   border-radius:10px; }
  .viewer .vw-row:hover{ background:var(--surface-2); }
  .viewer .vw-main{ flex:1; min-width:0; }
  .viewer .vw-main b{ display:block; font:600 14px/1.35 var(--sans); color:var(--ink); }
  .viewer .vw-sum{ display:block; margin-top:3px; font-size:13px; line-height:1.45; color:var(--ink-3); }
  .viewer .vw-meta{ flex:none; margin-top:2px; font:400 11px/1.3 var(--mono); color:var(--ink-4); white-space:nowrap; }
  .viewer .vw-none{ padding:22px 20px; color:var(--ink-3); font-size:14px; }
  .viewer .vw-body{ overflow-y:auto; padding:6px 20px 18px; }
  .viewer .vw-sec{ padding:14px 0 4px; border-bottom:1px solid var(--line); }
  .viewer .vw-sec:last-of-type{ border-bottom:0; }
  .viewer .vw-sec h4{ margin-bottom:8px; font:500 10.5px/1.5 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-4); }
  .viewer .vw-sec p{ font-size:14.5px; line-height:1.6; color:var(--ink); }
  .viewer .vw-ev, .viewer .vw-data{ margin:0; padding:0; list-style:none; }
  .viewer .vw-ev li, .viewer .vw-data li{ padding:6px 0; font-size:13.5px; line-height:1.5; color:var(--ink-2); display:flex; gap:10px; }
  .viewer .vw-date{ flex:none; width:84px; font:400 11.5px/1.7 var(--mono); color:var(--ink-4); }
  .viewer .vw-links{ display:flex; flex-wrap:wrap; gap:6px; padding-bottom:8px; }
  .viewer .vw-link{ padding:6px 10px; border:1px solid var(--line-2); border-radius:999px; background:var(--surface);
                    font:500 12.5px/1.2 var(--sans); color:var(--accent); }
  .viewer .vw-link:hover{ border-color:var(--accent-fill); }
  .viewer .vw-acts{ display:flex; align-items:center; gap:12px; padding-top:14px; }
  .viewer .vw-upd{ margin-left:auto; font:400 11.5px/1 var(--mono); color:var(--ink-4); }

  .side-act{
    display:flex; align-items:center; gap:8px; margin:0 0 8px; padding:10px 11px; width:100%; text-align:left;
    border:1px solid var(--line-2); border-radius:9px; background:var(--surface);
    font:500 13px/1 var(--sans); color:var(--ink-2);
    transition:border-color .15s var(--ease), color .15s var(--ease);
  }
  .side-act:hover{ border-color:var(--accent-fill); color:var(--accent); }
  .side-act svg{ width:15px; height:15px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }

  /* The brain picker: the space's mark, where the question goes, and a menu
     that opens upward from the box. */
  .pick-btn{
    display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 11px 0 8px;
    border:1px solid var(--line-2); border-radius:9px; background:var(--surface);
    font:500 13px/1 var(--sans); color:var(--ink); max-width:250px;
    transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .pick-btn:hover, .pick-btn[aria-expanded="true"]{ border-color:var(--accent-fill); }
  .pick-btn[aria-expanded="true"]{ box-shadow:0 0 0 3px var(--accent-soft); }
  .pick-btn .pk-mark{ width:18px; height:18px; border-radius:5px; object-fit:contain; flex:none; }
  .pick-btn .pk-lbl{ color:var(--ink-3); font-weight:400; }
  .pick-btn .pk-val{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .pick-btn .pk-chev{ width:11px; height:11px; flex:none; fill:none; stroke:var(--ink-3); stroke-width:1.6;
                      stroke-linecap:round; stroke-linejoin:round; transition:transform .15s var(--ease); }
  .pick-btn[aria-expanded="false"] .pk-chev{ transform:rotate(180deg); }
  .pick-menu{
    position:fixed; z-index:60; width:280px; max-height:min(56vh, 420px); overflow:auto;
    background:var(--surface); border:1px solid var(--line-2); border-radius:13px;
    box-shadow:0 14px 40px rgba(20,20,19,.16), 0 2px 6px rgba(20,20,19,.06); padding:6px;
    animation:pickin .14s var(--ease);
  }
  @keyframes pickin{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  .pick-menu .pk-h{ padding:10px 10px 5px; font:500 10.5px/1.4 var(--mono); letter-spacing:.08em;
                    text-transform:uppercase; color:var(--ink-4); }
  .pick-menu .pk-row{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 10px;
    border-radius:9px; color:var(--ink); font:400 13.5px/1.25 var(--sans);
  }
  .pick-menu .pk-row:hover, .pick-menu .pk-row:focus-visible{ background:var(--surface-2); outline:none; }
  .pick-menu .pk-row.on{ background:var(--accent-soft); color:var(--accent); font-weight:500; }
  .pick-menu .pk-dot{ width:8px; height:8px; border-radius:50%; flex:none; background:var(--line-2); }
  .pick-menu .pk-row.on .pk-dot{ background:var(--accent-fill); }
  .pick-menu .pk-box{
    width:16px; height:16px; border-radius:5px; flex:none; display:grid; place-items:center;
    border:1.5px solid var(--line-2); background:var(--surface);
  }
  .pick-menu .pk-box svg{ width:11px; height:11px; fill:none; stroke:var(--accent-on); stroke-width:1.9;
                          stroke-linecap:round; stroke-linejoin:round; opacity:0; }
  .pick-menu .pk-row.on .pk-box{ background:var(--accent-solid); border-color:var(--accent-solid); }
  .pick-menu .pk-row.on .pk-box svg{ opacity:1; }
  .pick-menu.multi .pk-row.on{ background:transparent; color:var(--ink); font-weight:500; }
  .pick-menu.multi .pk-row.on:first-child{ background:var(--accent-soft); color:var(--accent); }
  .pick-menu .pk-done{
    position:sticky; bottom:-6px; display:block; width:calc(100% + 12px); margin:6px -6px -6px; padding:12px;
    background:var(--surface); border-top:1px solid var(--line); border-radius:0 0 12px 12px;
    font:600 13.5px/1 var(--sans); color:var(--accent);
  }
  .pick-menu .pk-done:hover{ background:var(--surface-2); }
  .pick-menu .pk-nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pick-menu .pk-sub{ display:block; margin-top:3px; font-size:11.5px; font-weight:400; color:var(--ink-3); white-space:normal; }
  .pick-menu .pk-ct{ flex:none; font:400 11.5px/1 var(--mono); color:var(--ink-4); }

  .new-brain{
    margin:0 0 12px; padding:10px 11px; width:100%; text-align:left;
    border:1px dashed var(--line-2); border-radius:9px;
    font:500 13px/1 var(--sans); color:var(--accent);
    transition:background .15s var(--ease), border-color .15s var(--ease);
  }
  .new-brain:hover{ background:var(--surface); border-color:var(--accent-fill); }

  .connect-row{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    border-top:1px solid var(--line); padding:11px 20px;
    font:500 12px/1.3 var(--sans); color:var(--ink-3);
    transition:color .15s var(--ease), background .15s var(--ease);
  }
  .connect-row:hover{ color:var(--accent); background:var(--surface); text-decoration:none; }
  .connect-row .go-out{ margin-left:auto; font-size:12px; color:var(--ink-4); }
  .connect-row:hover .go-out{ color:var(--accent); }
  .connect-row .dot{
    width:6px; height:6px; border-radius:50%; background:var(--accent-fill); flex-shrink:0;
  }

  .urlbox{
    display:flex; align-items:stretch; gap:0; margin:4px 0 2px;
    border:1px solid var(--line-2); border-radius:8px; overflow:hidden; background:var(--surface-2);
  }
  .urlbox input{
    flex:1; min-width:0; background:none; border:none;
    font:400 12px/1.4 var(--mono); color:var(--ink); padding:10px 11px;
  }
  .urlbox button{
    flex-shrink:0; padding:0 13px; border-left:1px solid var(--line-2);
    font:500 12px/1 var(--sans); color:var(--accent); background:var(--surface);
  }
  .urlbox button:hover{ background:var(--accent-soft); }
  .steps{ counter-reset:st; margin:10px 0 0; }
  .steps li{
    counter-increment:st; position:relative; padding:0 0 7px 24px;
    font:400 13px/1.5 var(--sans); color:var(--ink-2); list-style:none;
  }
  .steps li::before{
    content:counter(st); position:absolute; left:0; top:1px;
    font:600 10px/1.7 var(--mono); color:var(--accent);
    width:16px; height:16px; border-radius:50%; background:var(--accent-soft); text-align:center;
  }

  /* Controls that look like controls. Underlined words read as footnotes,
     and a person hunting for the model picker never found one. Setup holds
     the model and the export; the sidebar keeps Setup and Sign out. */
  .side-foot{ border-top:1px solid var(--line); padding:12px; display:grid; gap:7px; }
  .foot-btn{
    display:flex; align-items:center; gap:9px; width:100%; min-width:0;
    border:1px solid var(--line-2); border-radius:8px; background:var(--surface);
    padding:9px 11px; font:500 12.5px/1.2 var(--sans); color:var(--ink-2);
    transition:border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease);
  }
  .foot-btn:hover{ border-color:var(--accent-fill); color:var(--ink); background:var(--surface-2); }
  .foot-btn .lbl{
    flex-shrink:0; font:400 10px/1 var(--mono); letter-spacing:.07em;
    text-transform:uppercase; color:var(--ink-4);
  }
  .foot-btn .val{
    margin-left:auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font:400 11.5px/1.3 var(--mono); color:var(--ink-3);
  }
  #setModel.pick .val{ color:var(--accent); }
  .sheet .set-row{ display:grid; gap:7px; }
  .foot-row{ display:flex; gap:7px; }
  .foot-row .foot-btn{ justify-content:center; }


  .mlist{
    max-height:44vh; overflow-y:auto; margin-top:10px;
    border:1px solid var(--line); border-radius:10px; background:var(--bg);
  }
  .mrow{ display:block; width:100%; text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); }
  .mrow:last-child{ border-bottom:none; }
  .mrow:hover{ background:var(--surface-2); }
  .mrow.on{ background:var(--accent-soft); }
  .mrow b{ display:block; font:500 13.5px/1.4 var(--sans); color:var(--ink); }
  .mrow span{ display:block; margin-top:2px; font:400 11.5px/1.6 var(--mono); color:var(--ink-3); }
  .mrow.on b{ color:var(--accent); }
  .mnone{ padding:14px 12px; font:400 13px/1.5 var(--sans); color:var(--ink-3); }

  /* How much of the transcript quota is gone. */
  .bar{
    height:6px; border-radius:3px; background:var(--surface-3); overflow:hidden; margin-bottom:9px;
  }
  .bar i{ display:block; height:100%; background:var(--accent-fill); border-radius:3px; }
  .bar i.tight{ background:var(--accent); }
  .meter{ font:400 13px/1.55 var(--sans); color:var(--ink-3); }
  .meter + .meter{ margin-top:4px; }
  .meter b{ color:var(--ink); font-weight:600; }

  /* The three ways in, on the first screen of the door. */
  .picks{ padding:16px 20px 2px; }
  .pick-row{
    display:block; width:100%; text-align:left; padding:13px 14px; margin-bottom:9px;
    border:1px solid var(--line-2); border-radius:11px; background:var(--bg);
    transition:border-color .15s var(--ease), background .15s var(--ease);
  }
  a.pick-row, a.pick-row:hover{ color:inherit; text-decoration:none; }
  .pick-row:hover{ border-color:var(--accent-fill); background:var(--surface-2); text-decoration:none; }
  .pick-row b{ display:block; font:600 14.5px/1.35 var(--sans); color:var(--ink); }
  .pick-row span{ display:block; margin-top:4px; font:400 13px/1.5 var(--sans); color:var(--ink-3); }
  .pick-row em{ font-style:normal; color:var(--accent); }
  .sheet .home{
    margin-right:auto; font:400 13px/1 var(--sans); color:var(--ink-3);
    text-decoration:underline; text-underline-offset:2px; align-self:center;
  }
  .sheet .home:hover{ color:var(--accent); }

  /* ============ main ============ */
  main{ display:flex; flex-direction:column; min-height:0; min-width:0; }

  .thread{ flex:1; overflow-y:auto; padding:36px 0 8px; min-height:0; scroll-behavior:smooth; }
  .col{ width:100%; max-width:760px; margin:0 auto; padding:0 28px; }

  /* ============ messages ============ */
  .msg{ margin-bottom:30px; animation:rise .28s var(--ease) both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

  .msg.me{ display:flex; justify-content:flex-end; }
  .msg.me .body{
    background:var(--surface-2); border-radius:18px 18px 6px 18px;
    padding:12px 17px; max-width:82%; color:var(--ink);
    white-space:pre-wrap; overflow-wrap:anywhere;
  }
  .msg.me .body .attach{
    display:block; margin-top:7px; padding-top:7px; border-top:1px solid var(--line);
    font:400 11.5px/1.5 var(--mono); color:var(--ink-3);
  }

  .msg.ai .who{
    font:600 12.5px/1 var(--sans); letter-spacing:0; text-transform:none;
    color:var(--ink); margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .msg.ai .who .sc{ color:var(--ink-3); font-weight:400; }
  .msg.ai .body{ color:var(--ink-2); font-size:16.5px; line-height:1.68; }
  .msg.ai .body p{ margin-bottom:.85em; }
  .msg.ai .body p:last-child{ margin-bottom:0; }
  /* One sentence per line. A line gets air under it, a group gets more. */
  .msg.ai .body p.ln{ margin:0; }
  .msg.ai .body p.ln + p.ln{ margin-top:.42em; }
  .msg.ai .body .para + .para{ margin-top:1.1em; }
  .msg.ai .body strong{ color:var(--ink); font-weight:500; }
  .msg.ai .body em{ font-style:normal; color:var(--ink); }

  .srcline{
    margin-top:14px; padding-top:11px; border-top:1px solid var(--line);
    font:400 12px/1.6 var(--mono); color:var(--ink-3);
  }
  .ans-acts{ display:flex; gap:6px; margin-top:10px; }
  .mini{
    min-height:30px; padding:4px 10px; border:1px solid var(--line); border-radius:6px; background:transparent;
    font:500 12px/1 var(--sans); color:var(--ink-3); cursor:pointer;
  }
  .mini:hover{ border-color:var(--accent-line); color:var(--accent); }
  .smallbrain{
    display:inline-block; margin-bottom:10px;
    font:400 11px/1.5 var(--mono); color:var(--accent);
    border:1px solid var(--accent-line); border-radius:4px; padding:3px 8px;
  }

  .thinking{ display:flex; align-items:center; gap:9px; color:var(--ink-3); font:400 15px/1 var(--sans); }
  .thinking .act{ margin-left:2px; font:400 12px/1 var(--mono); letter-spacing:.03em; color:var(--ink-4); }
  /* Working, shown as the space's own mark turning. The image comes from a
     variable, so it follows the space with no script: the octopus in Octopus,
     the dog in Squidgy. With reduced motion asked for, it holds still and the
     label beside it still says what is happening. */
  .spinner{
    width:30px; height:30px; flex-shrink:0;
    background:var(--mark) center/contain no-repeat;
    animation:turn 1.3s linear infinite;
  }
  @keyframes turn{ to{ transform:rotate(360deg); } }

  .err{
    border:1px solid var(--accent-line); background:var(--accent-soft);
    border-radius:12px; padding:13px 15px; color:var(--ink-2); font-size:15px;
  }
  .err b{ color:var(--accent); font-weight:500; display:block; margin-bottom:3px; }

  /* ============ the card ============ */
  .card{
    border:1px solid var(--accent-line); background:var(--surface);
    border-radius:16px; overflow:hidden; box-shadow:var(--shadow-lift);
  }
  .card-top{
    padding:14px 16px; border-bottom:1px solid var(--line);
    display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px;
  }
  .card-top .id{ font:700 13px/1.3 var(--mono); color:var(--ink); }
  .card-top .meta{ font:400 11.5px/1.4 var(--mono); color:var(--ink-3); }

  .card-grid{ display:grid; grid-template-columns:auto 1fr; gap:9px 14px; padding:14px 16px; }
  .card-grid dt{
    font:600 12.5px/1.6 var(--sans); letter-spacing:0;
    color:var(--accent); white-space:nowrap;
  }
  .card-grid dd{ font-size:14.5px; line-height:1.55; color:var(--ink-2); }
  .card-grid dd b{ color:var(--ink); font-weight:500; }
  .card-grid dd ul{ list-style:none; }
  .card-grid dd li{ margin-bottom:3px; }
  .card-grid dd li:last-child{ margin-bottom:0; }
  .card-grid dd .none{ color:var(--ink-3); }
  .card-grid .author input, .card-grid .author select{
    display:block; width:100%; max-width:340px; padding:7px 10px; border:1px solid var(--line-2); border-radius:7px;
    background:var(--surface); font:inherit; font-size:14.5px; color:var(--ink);
  }
  .card-grid .author input[hidden]{ display:none; }
  .card-grid .author select + input{ margin-top:6px; }
  .card-grid .author input:focus, .card-grid .author select:focus{ outline:none; border-color:var(--accent-fill); }
  .card-grid .author .bad{ border-color:var(--accent); background:var(--accent-soft); }
  .card-grid .author-hint{ margin-top:4px; font-size:12.5px; color:var(--ink-3); }

  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    font:400 12.5px/1 var(--sans); padding:5px 9px; border-radius:6px;
    border:1px solid var(--line-2); color:var(--ink-2); background:var(--surface-2);
  }
  .chip.new{ color:var(--accent); border-color:var(--line-2); }
  .chip.cand{ color:var(--accent); border-color:var(--accent-line); cursor:pointer;
    transition:background .15s var(--ease), border-color .15s var(--ease); }
  .chip.cand:hover{ background:var(--accent-soft); }
  .chip.cand.on{ background:var(--accent-solid); border-color:var(--accent-solid); color:var(--accent-on); }
  .chip-note{ font:400 12.5px/1.6 var(--sans); color:var(--ink-3); margin-top:7px; }

  .conflicts{ border-top:1px solid var(--line); }
  .cf{ padding:14px 16px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:2.4ch 1fr; gap:12px; }
  .cf:last-child{ border-bottom:none; }
  .cf .n{ font:600 14px/1.55 var(--sans); color:var(--accent); }
  .cf .cn{ font:600 14.5px/1.4 var(--sans); color:var(--ink); margin-bottom:8px; }
  .cf .side{ font-size:14px; line-height:1.5; margin-bottom:4px; }
  .cf .side span{ font:600 11.5px/1.6 var(--sans); letter-spacing:.03em; text-transform:uppercase; color:var(--ink-3); margin-right:7px; }
  .cf .why{ font-size:13.5px; color:var(--ink-3); margin-top:5px; }
  .cf .kind{ font:600 11px/1.6 var(--sans); letter-spacing:.03em; text-transform:uppercase;
    color:var(--ink-3); margin:-4px 0 8px; }
  .cf .kind.big{ color:var(--accent); }
  .cf .opts{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .opt{
    font:400 13px/1 var(--sans); padding:6px 11px; border-radius:7px;
    border:1px solid var(--line-2); color:var(--ink-2); background:var(--surface-2);
    transition:all .15s var(--ease);
  }
  .opt:hover{ border-color:var(--accent-fill); color:var(--ink); background:var(--surface-2); }
  .opt.on{ border-color:var(--accent-fill); color:var(--accent); background:var(--accent-soft); font-weight:500; }
  .opt.dflt{ border-style:dashed; }

  .card-foot{
    padding:14px 16px; border-top:1px solid var(--line); background:var(--surface-2);
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
  }
  .card-foot .hint{ font:400 13px/1.5 var(--sans); color:var(--ink-3); flex:1; min-width:170px; }
  .go{
    font:500 14px/1 var(--sans); padding:10px 19px; border-radius:9px;
    background:var(--accent-solid); color:var(--accent-on);
    box-shadow:var(--shadow);
    transition:filter .15s var(--ease);
  }
  .go:hover{ filter:brightness(1.12); }
  .go[disabled]{ opacity:.4; cursor:default; filter:none; }
  .ghost{
    font:500 14px/1 var(--sans); padding:10px 15px; border-radius:9px;
    border:1px solid var(--line-2); color:var(--ink-2);
  }
  .ghost:hover{ border-color:var(--accent-fill); color:var(--ink); background:var(--surface); }

  .receipt{
    border:1px solid var(--line); background:var(--surface-2);
    border-radius:12px; padding:15px 17px;
    font:400 12.5px/1.9 var(--mono); color:var(--ink-2);
    white-space:pre-wrap; overflow-wrap:anywhere;
  }
  .receipt .v{ color:var(--accent); }
  .receipt .ok{ color:var(--good); }

  /* How much of a source the plan filed. */
  .coverage{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:12px;
    font:400 13px/1.5 var(--sans); color:var(--ink-3);
  }

  /* ============ one page ============ */
  .pager{
    border:1px solid var(--line-2); border-radius:14px; background:var(--surface);
    padding:22px 24px; box-shadow:var(--shadow);
  }
  .pager h3{ font:600 20px/1.25 var(--sans); letter-spacing:-.02em; color:var(--ink); }
  .pager .sub{ margin-top:6px; font:400 14px/1.5 var(--sans); color:var(--ink-3); }
  .pager h4{
    margin:18px 0 7px; font:500 10.5px/1.6 var(--mono);
    letter-spacing:.08em; text-transform:uppercase; color:var(--ink-4);
  }
  .pager ul{ margin:12px 0 0; padding-left:19px; }
  .pager li{ margin-bottom:8px; font:400 14.5px/1.55 var(--sans); color:var(--ink-2); }
  .pager li::marker{ color:var(--accent-fill); }
  /* A document: paragraphs and lists under its section headings. */
  .pager .doc{ margin-top:10px; }
  .pager .doc p{ margin:0 0 10px; font:400 14.5px/1.6 var(--sans); color:var(--ink-2); }
  .pager .doc ul, .pager .doc ol{ margin:0 0 10px; padding-left:21px; }
  .pager .doc li{ margin-bottom:6px; }
  .pager .doc strong{ font-weight:600; color:var(--ink); }
  .pager li .k, .msg.ai .body .pager li .k{ display:block; font-weight:600; color:var(--ink); }
  .pager li .say{ display:block; }
  .pager details.answers{ margin-top:14px; border-top:1px dashed var(--line-2); padding-top:10px; }
  .pager details.answers summary{
    cursor:pointer; list-style:none; font:500 12.5px/1.4 var(--sans); color:var(--accent); width:max-content;
  }
  .pager details.answers summary::-webkit-details-marker{ display:none; }
  .pager details.answers summary::before{ content:"+ "; }
  .pager details.answers[open] summary::before{ content:"\2212  "; }
  .pager .foot{
    margin-top:18px; padding-top:13px; border-top:1px solid var(--line);
    font:400 11.5px/1.6 var(--mono); color:var(--ink-4);
  }
  .pager .acts{ display:flex; align-items:center; gap:8px; margin-top:15px; flex-wrap:wrap; }
  .pager .acts input{
    flex:1; min-width:170px; border:1px solid var(--line-2); border-radius:9px;
    background:var(--surface-2); padding:8px 11px;
    font:400 13.5px/1.4 var(--sans); color:var(--ink);
  }
  .pager .acts input:focus{ border-color:var(--accent-fill); outline:none; }
  .pager .said{ font:400 12.5px/1.6 var(--sans); color:var(--accent); }

  /* ============ empty state ============ */
  .zero{ max-width:640px; margin:0 auto; padding:28px 28px 0; }
  .zero h2{ font:600 30px/1.2 var(--sans); letter-spacing:-.02em; color:var(--ink); text-wrap:balance; }
  .zero .lede{ margin-top:14px; font-size:17px; line-height:1.62; color:var(--ink-2); }

  /* ============ composer ============ */
  .composer-wrap{
    border-top:1px solid var(--line);
    background:linear-gradient(to bottom, transparent, var(--bg) 24%);
    padding-bottom:18px;
  }
  .composer{
    width:100%; max-width:760px; margin:0 auto; padding:14px 28px 0;
  }
  .ctrls{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:9px; }

  .seg{ display:inline-flex; border:1px solid var(--line-2); border-radius:9px; overflow:hidden; background:var(--surface); }
  .seg button{
    font:500 13px/1 var(--sans); letter-spacing:0;
    padding:8px 15px; color:var(--ink-3);
    transition:all .15s var(--ease);
  }
  .seg button:hover{ color:var(--ink); }
  .seg button.on{ background:var(--accent-solid); color:var(--accent-on); }
  /* The answer levels: an icon each, and the name of the one in use. */
  .seg.lv button{ display:inline-flex; align-items:center; gap:6px; padding:8px 11px; }
  .seg.lv button:not(.on) span{ display:none; }
  .seg.lv svg{ width:15px; height:15px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8;
               stroke-linecap:round; stroke-linejoin:round; }

  [hidden]{ display:none !important; }

  .scope{
    display:inline-flex; align-items:center; gap:7px;
    border:1px solid var(--line-2); border-radius:9px; padding:0 11px 0 12px; background:var(--surface);
  }
  .scope label{ font:400 13px/1 var(--sans); color:var(--ink-3); }
  .fresh{
    font:500 12.5px/1 var(--sans); color:var(--ink-3); white-space:nowrap;
    border:1px solid var(--line-2); border-radius:9px; background:var(--surface);
    padding:0 12px; height:36px;
    transition:color .15s var(--ease), border-color .15s var(--ease);
  }
  .fresh:hover{ color:var(--accent); border-color:var(--accent-fill); }

  .scope select{
    font:500 13px/1 var(--sans); color:var(--ink); padding:8px 2px 8px 0;
    appearance:none; cursor:pointer; max-width:170px;
  }
  .scope select option{ background:var(--surface); color:var(--ink); }
  .scope:focus-within{ border-color:var(--accent-fill); }
  .scope::after{ content:"▾"; color:var(--ink-3); font-size:10px; margin-left:-3px; pointer-events:none; }

  .box{
    border:1px solid var(--line-2); border-radius:20px; background:var(--surface);
    box-shadow:var(--shadow);
    transition:border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .box:focus-within{ border-color:var(--accent-fill); box-shadow:var(--shadow-lift); }
  .box textarea{
    display:block; width:100%; resize:none; padding:15px 18px 6px;
    font:400 16.5px/1.6 var(--sans); color:var(--ink);
    max-height:210px; overflow-y:auto;
  }
  .box textarea::placeholder{ color:var(--ink-3); }
  /* The box shows the focus for both fields. Without this the global focus ring
     draws a second rounded rectangle inside the first, cutting the source line
     off from the content it belongs to. */
  .box textarea:focus-visible, .dropsrc input:focus-visible{ outline:none; }
  .box .tbar{ display:flex; align-items:center; gap:9px; padding:6px 12px 11px 18px; }
  .box .tbar .t{ flex:1; font:400 11.5px/1.5 var(--mono); color:var(--ink-3); }
  .tools{ display:flex; align-items:center; gap:9px; flex-shrink:0; }
  .tools:empty, .tools:not(:has(.paste:not([hidden]))){ display:none; }
  .paste{
    white-space:nowrap;
    font:400 11.5px/1 var(--mono); padding:6px 10px; border-radius:5px;
    border:1px solid var(--line); color:var(--ink-3);
    transition:all .15s var(--ease);
  }
  .paste:hover{ border-color:var(--accent); color:var(--ink); }
  .send{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:var(--accent-solid); color:var(--accent-on);
    display:grid; place-items:center; box-shadow:var(--shadow);
    transition:filter .15s var(--ease), opacity .15s var(--ease);
  }
  .send:hover{ filter:brightness(1.12); }
  .send[disabled]{ opacity:.3; cursor:default; filter:none; }
  .send svg{ width:15px; height:15px; display:block; }

  .foot-note{
    max-width:760px; margin:9px auto 0; padding:0 28px;
    font:400 12.5px/1.5 var(--sans); color:var(--ink-3); text-align:center;
  }

  /* ============ modal ============ */
  .veil{
    position:fixed; inset:0; background:rgba(20,20,19,.44); backdrop-filter:blur(3px);
    display:grid; place-items:center; padding:20px; z-index:50;
    animation:fade .18s var(--ease) both;
  }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  .sheet{
    width:100%; max-width:480px; background:var(--surface);
    border:1px solid var(--line); border-radius:18px; overflow:hidden;
    box-shadow:var(--shadow-lift);
    animation:rise .24s var(--ease) both;
  }
  .sheet header{ padding:18px 20px 14px; border-bottom:1px solid var(--line); }
  .sheet h3{ font:600 19px/1.25 var(--sans); letter-spacing:-.01em; color:var(--ink); }
  .sheet header p{ margin-top:7px; font-size:13.5px; line-height:1.55; color:var(--ink-3); }
  .sheet .f{ padding:16px 20px 4px; }
  .sheet .f + .f{ padding-top:0; }
  .sheet label{
    display:block; font:500 13px/1 var(--sans); color:var(--ink);
    margin-bottom:7px;
  }
  .sheet select.pick{
    width:100%; border:1px solid var(--line-2); border-radius:9px; background:var(--bg);
    padding:10px 12px; font:400 14.5px/1.5 var(--sans); color:var(--ink);
  }
  .sheet input, .sheet textarea{
    width:100%; border:1px solid var(--line-2); border-radius:9px; background:var(--bg);
    padding:10px 12px; font:400 14.5px/1.5 var(--sans); color:var(--ink);
    transition:border-color .15s var(--ease);
  }
  .sheet input:focus, .sheet textarea:focus{ border-color:var(--accent-fill); }
  .sheet textarea{ resize:vertical; min-height:62px; }
  .sheet .hint{ margin-top:7px; font:400 13px/1.5 var(--sans); color:var(--ink-3); }
  .sheet footer{ padding:16px 20px 18px; display:flex; justify-content:flex-end; gap:9px; }
  .closest{
    margin:0 20px 4px; padding:12px 14px; border-radius:12px;
    border:1px solid var(--accent-line); background:var(--accent-soft);
    font-size:13.5px; line-height:1.55;
  }
  .closest b{ display:block; font:600 12.5px/1 var(--sans); color:var(--accent); margin-bottom:6px; }

  /* ============ gate ============ */
  .app.locked{ filter:blur(2.5px); pointer-events:none; user-select:none; }
  .sheet .mk{ width:30px; height:30px; color:var(--accent-fill); margin-bottom:13px; }
  .sheet .mk svg{ width:100%; height:100%; display:block; }
  .sheet .bad{ color:var(--accent); font-size:13.5px; line-height:1.5; margin-top:4px; min-height:1.2em; }
  .sheet .spin{ color:var(--ink-3); font-size:13.5px; line-height:1.5; margin-top:4px; min-height:1.2em; }

  .gate{
    position:fixed; inset:0; z-index:100; background:var(--bg);
    display:grid; place-items:center; padding:24px;
  }
  .gate .panel{
    width:100%; max-width:392px; text-align:left;
    animation:rise .3s var(--ease) both;
  }
  .gate .mk{ width:38px; height:38px; color:var(--accent-fill); margin-bottom:20px; }
  .gate .mk svg, .gate .mk img{ width:100%; height:100%; display:block; }

<script>
(() => {
"use strict";

const API = window.OCTOPUS_API;
const TOKEN_KEY = "octopus.token.v1";
/* A member's own model key. It lives in this tab and travels with the requests
   that spend a model call. The server hashes it once to know who you are and
   stores nothing else. */

const S = {
  token: null, brains: [], concepts: [], sources: [], model: "", pick: "",
  mode: "ask", scope: "all", into: [], busy: false, pendingCard: null, chunk: 18000,
  /* The last few turns of the current thread. It travels with each question so
     a follow-up means something, and it is never written down: closing the tab
     ends it. */
  thread: [],
  level: "normal",
  /* Which space this session reads, and what it calls itself. The passphrase at
     the door decided it, and the app only reports it. */
  space: "octopus", spaceName: "Octopus",
};

/* The level is a per-browser convenience, so a blocked or cleared store just
   falls back to normal. */
const LEVELS = ["normal","educational","learning"];
try { const v = localStorage.getItem("octopus.level"); if (LEVELS.includes(v)) S.level = v; } catch {}
const saveLevel = () => { try { localStorage.setItem("octopus.level", S.level); } catch {} };

/* The model this browser asks for. Empty means the one the server runs. Your
   key pays for it, so the choice sits with whoever holds the key. */
const PICK_KEY = "octopus.model";
try { S.pick = localStorage.getItem(PICK_KEY) || ""; } catch {}
const savePick = () => { try { S.pick ? localStorage.setItem(PICK_KEY, S.pick) : localStorage.removeItem(PICK_KEY); } catch {} };

/* Folded nav, remembered. A blocked store just leaves it open. */
let navOpen = true;
try { navOpen = localStorage.getItem("octopus.nav") !== "closed"; } catch {}
function paintNav(){
  $("app").classList.toggle("nav-closed", !navOpen);
  try { localStorage.setItem("octopus.nav", navOpen ? "open" : "closed"); } catch {}
}


const $ = id => document.getElementById(id);
const el = (t,c,txt) => { const n=document.createElement(t); if(c)n.className=c; if(txt!=null)n.textContent=txt; return n; };
const esc = s => String(s??"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const slug = s => String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48)||"item";
/** A short fingerprint of a text. */
const fnv = t => {
  let h = 0x811c9dc5;
  for (let i = 0; i < t.length; i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(36);
};
/* A concept's id. A long title keeps its first 41 characters and a short
   hash of the rest, so two ideas that open the same way stay two concepts.
   Same rule as the server's conceptSlug. */
const conceptSlug = t => {
  const full = String(t ?? "").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "item";
  if (full.length <= 48) return full;
  let h = 0x811c9dc5;
  for (let i = 0; i < full.length; i++){ h ^= full.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return `${full.slice(0, 41).replace(/-+$/,"")}-${h.toString(36).padStart(6,"0").slice(-6)}`;
};
const pad2 = n => String(n).padStart(2,"0");
const today = () => new Date().toISOString().slice(0,10);
const rich = t => esc(t).split(/\n{2,}/).map(p =>
  "<p>" + p.replace(/\n/g,"<br>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>") + "</p>").join("");

/* every call to the server goes through here, carrying the session token */
async function api(path, body = {}) {
  let r;
  const ctl = new AbortController();
  const cap = setTimeout(() => ctl.abort(), 180000);   // a read can think for a while
  try {
    r = await fetch(API + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: S.token, ...(S.pick ? { model: S.pick } : {}), ...body }),
      signal: ctl.signal,
    });
  } catch (e) {
    throw new Error(e?.name === "AbortError"
      ? "That call ran past 3 minutes with no answer. Try a shorter source."
      : "The server did not answer. Check your connection.");
  } finally { clearTimeout(cap); }
  if (r.status === 401) {
    sessionStorage.removeItem(TOKEN_KEY);
    location.reload(); throw new Error("locked");
  }
  const d = await r.json().catch(() => ({ error: "the server sent something unreadable" }));
  if (d.error) throw new Error(d.error);
  return d;
}

/**
 * A call that writes nothing, tried up to three times.
 *
 * Reading and planning a long document is about 40 calls. One busy model or
 * one dropped connection among them used to throw the whole reading away.
 */
async function apiRetry(path, body = {}){
  for (let n = 1; ; n++){
    try { return await api(path, body); }
    catch (e) {
      const passing = /did not answer|ran past|timed out|still\s(thinking|writing)|429|rate limit|overloaded|busy|50[0-9]|temporar|unreadable|cut off/i
        .test(e.message);
      if (!passing || n >= 3 || e.message === "locked") throw e;
      await new Promise(ok => setTimeout(ok, n * 2500));
    }
  }
}

/* ============ the gate ============ */
const MARK = document.querySelector(".brand .mark").innerHTML;

/** A modal over the app, not a wall in front of it. It has no way out,
    because every route behind it needs the token it hands back. */
/**
 * Back to the door.
 *
 * The door is the landing page now, one panel per space, because the passphrase
 * is what decides which brains a session reads. Nothing here can ask for it
 * without already knowing which space to ask about, so a tab with no session
 * goes back where the choice is made.
 */
function gateScreen() {
  const here = encodeURIComponent(location.pathname + location.search);
  location.replace("/?from=" + here);
}

/** Same modal shape when the deployment itself is unreachable. */
function deadScreen(why) {
  $("app").classList.add("locked");
  const veil = el("div","veil");
  veil.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <header>
        <div class="mk" aria-hidden="true">${MARK}</div>
        <h3>The server is not answering</h3>
        <p>Octopus reaches a Convex deployment for every read and every model call. This one stayed quiet.</p>
      </header>
      <div class="f"><div class="closest" style="margin:0"><b>What came back</b><div>${esc(why)}</div></div></div>
      <footer><button class="go" id="again">Try again</button></footer>
    </div>`;
  document.body.append(veil);
  veil.querySelector("#again").onclick = () => location.reload();
}

/* ============ boot ============ */
(async () => {
  render(); sizeBox();                       // the shell paints straight away
  const saved = sessionStorage.getItem(TOKEN_KEY);
  if (saved) {
    S.token = saved;
    try { await open(); return; }
    catch (_) {
      sessionStorage.removeItem(TOKEN_KEY);
      S.token = null;
    }
  }
  /* A reachability probe before the bounce, so an unreachable deployment says so
     rather than sending the tab to a door that cannot answer either. */
  try { await api("/api/status"); }
  catch (e) { deadScreen(e.message); return; }
  gateScreen();
})();

async function open(){ await refresh(); sizeBox(); $("input").focus(); }

async function refresh(){
  const d = await api("/api/state");
  S.brains = d.brains || []; S.concepts = d.concepts || []; S.sources = d.sources || [];
  S.model = d.model || ""; S.chunk = d.chunk || 18000;
  if (d.space){ S.space = d.space; S.spaceName = d.spaceName || d.space; paintSpace(); }
  render();
}

/* ============ render ============ */
const conceptsOf = b => S.concepts.filter(c => c.brain === b).sort((x,y)=>(x.n||0)-(y.n||0));
const sourcesOf  = b => S.sources.filter(s => (s.brains||[]).includes(b));

function render(){ renderSide(); renderScope(); renderComposer(); renderZero(); }

/**
 * Which space this is, said once and shown everywhere.
 *
 * The attribute on <html> carries the tint, so one line retints every button and
 * rule in the app. The name and the mark follow it. A mark with no file yet
 * leaves the Octopus one in place rather than a gap.
 */
function paintSpace(){
  document.documentElement.dataset.space = S.space;
  document.title = S.spaceName;
  $("spaceName").textContent = S.spaceName;
  $("spaceNameBar").textContent = S.spaceName;
  /* The header box is square, and a whole dachshund at 24 pixels is a smudge,
     so a space other than Octopus shows its head icon there and in the tab. */
  const mark = $("spaceMark");
  const want = S.space === "octopus" ? "/brand/logo-mark.png" : `/brand/${S.space}-icon.png`;
  if (mark.getAttribute("src") === want) return;
  const probe = new Image();
  probe.onload = () => {
    mark.src = want;
    $("spaceMarkBar").src = want;
    $("scopeMark").src = want;
    const tab = document.querySelector('link[rel="icon"]');
    if (tab) tab.href = want;
  };
  probe.src = want;
}

/**
 * The brains, grouped and ranked.
 *
 * A person and a subject are different questions, so they sit apart. Inside a
 * group the fullest brain leads, counted by positions first and sources second,
 * because that is the one worth opening. Creation order said nothing about
 * which brain you want.
 */
const weight = b => conceptsOf(b.slug).length * 1000 + sourcesOf(b.slug).length;
function grouped(){
  const of = t => ordered().filter(b => (b.type === "person" ? "person" : "subject") === t);
  return [{ head: "People", rows: of("person") }, { head: "Subjects", rows: of("subject") }]
    .filter(g => g.rows.length);
}
/** Every brain in one list, the fullest first. An icon tells a person from a subject. */
const ordered = () => [...S.brains].sort((x, y) => weight(y) - weight(x) || x.name.localeCompare(y.name));
const BRAIN_ICON = {
  person: `<svg class="b-ic" viewBox="0 0 24 24" role="img" aria-label="Person"><title>Person</title><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.6 7-5.6s6.2 2 7 5.6"/></svg>`,
  subject: `<svg class="b-ic" viewBox="0 0 24 24" role="img" aria-label="Subject"><title>Subject</title><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/></svg>`,
};
const brainIcon = b => { const w = el("span","b-ico"); w.innerHTML = BRAIN_ICON[b.type === "person" ? "person" : "subject"]; return w.firstChild; };

/* Clicking a row picks that brain to ask or to feed. A second click goes back
   to every brain. Edit is the one control a row carries. */
function brainRow(b){
  const on = S.scope === b.slug;
  const row = el("button","brain-row" + (on ? " on" : ""));
  const ideas = conceptsOf(b.slug).length, read = sourcesOf(b.slug).length;
  /* The concept count on the row; the sources behind it on hover. */
  row.append(brainIcon(b), el("span","nm",b.name), el("span","ct",String(ideas)));
  row.title = `${b.scope || "no scope line"}\n${ideas} concepts, ${read} sources`;
  /* On a phone the drawer covers the thread, so a pick closes it. */
  row.onclick = () => { S.scope = on ? "all" : b.slug; S.into = on ? [] : [b.slug]; closeSide(); render(); };
  {
    const op = el("span","ed","open");
    op.title = "See what this brain holds";
    op.onclick = e => { e.stopPropagation(); openBrainView(b); };
    row.append(op);
    const ed = el("span","ed","edit");
    ed.title = "Name and scope";
    ed.onclick = e => { e.stopPropagation(); openBrainSheet(b); };
    row.append(ed);
  }
  return row;
}

function renderSide(){
  const box = $("brains"); box.innerHTML = "";
  $("bcount").textContent = S.brains.length || "";
  if (!S.brains.length){
    box.append(el("div","empty-side","None yet. A brain is a subject or a person, with a one line scope."));
  } else {
    /* One list, no groups: the icon on each row says person or subject. */
    for (const b of ordered()) box.append(brainRow(b));

}

/** The model in use, as Setup names it: short on the button, whole in its title. */
function modelLabel(){
  const live = S.pick || S.model;
  return {
    val: live ? live.split("/").pop() : "default",
    title: S.pick
      ? `${S.pick}, your choice. Click to change it. Build ${window.OCTOPUS_BUILD}.`

  };
}

/**
 * Everything about one brain, in one place: what it is called, and the line
 * that decides what belongs inside.
 *
 * A new name moves the slug, and the slug is how concepts, source rows and
 * counted candidates find their brain. The server moves all three in one write
 * and reports the counts, which is what the receipt below shows.
 */
function openBrainSheet(b){
  closeSide();
  const veil = el("div","veil");
  veil.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <header><h3>${esc(b.name)}</h3>
      <p>The scope line is the only test of what belongs inside. Change it and the next drop is judged
        against the new line.</p></header>
      <div class="f"><label for="rName">Name</label><input id="rName" autocomplete="off"></div>
      <div class="f"><label for="rScope">Scope, in one line</label><textarea id="rScope"></textarea></div>
      <div class="f"><div id="rMsg" class="bad" role="alert"></div></div>
      <footer><button class="ghost" id="rCancel">Cancel</button><button class="go" id="rSave">Save</button></footer>
    </div>`;
  document.body.append(veil);
  const nameI = veil.querySelector("#rName"), scopeI = veil.querySelector("#rScope"),
        msg = veil.querySelector("#rMsg"), save = veil.querySelector("#rSave");
  nameI.value = b.name || ""; scopeI.value = b.scope || "";
  const shut = () => veil.remove();
  veil.querySelector("#rCancel").onclick = shut;
  veil.onclick = e => { if(e.target===veil) shut(); };
  setTimeout(()=>nameI.focus(),30);

  save.onclick = async () => {
    const nm = nameI.value.trim(), sc = scopeI.value.trim();
    if (nm.length < 2){ msg.className="bad"; msg.textContent="give a name of at least 2 characters"; nameI.focus(); return; }
    save.disabled = true; msg.className="spin"; msg.textContent = "Saving";
    try {
      const r = await api("/api/brain/rename", { slug: b.slug, name: nm, scope: sc });
      if (r.error) throw new Error(r.error);
      shut(); await refresh();
      if (S.scope === b.slug) S.scope = r.slug;
      S.into = S.into.map(x => x === b.slug ? r.slug : x);
      render();
      const m = r.moved || {};
      push("ai", x => { x.innerHTML = rich(
        (r.name !== b.name
          ? `**${esc(b.name)}** is now **${esc(r.name)}**, at \`${esc(r.slug)}\`.` +
            (r.slug !== b.slug
              ? ` Moved with it: ${m.concepts||0} concepts and ${m.sources||0} sources.`
              : "")
          : `**${esc(r.name)}** saved.`) +
        `\n\nScope: ${esc(r.scope || sc)}`); });
    } catch(e){ save.disabled=false; msg.className="bad"; msg.textContent = e.message; }
  };
}

/** The picker's face: the space's mark, where it goes, and to which brain. */
function renderScope(){
  if (!S.brains.some(b => b.slug === S.scope)) S.scope = "all";
  S.into = S.into.filter(x => S.brains.some(b => b.slug === x));
  const drop = S.mode === "drop";
  const nameOf = x => S.brains.find(b => b.slug === x)?.name || x;
  $("scopeLabel").textContent = drop ? "Into" : "Across";
  /* A drop can feed several brains: the first by name, then how many more. */
  $("scopeVal").textContent = drop
    ? (!S.into.length ? "Suggest for me" : S.into.length === 1 ? nameOf(S.into[0]) : `${nameOf(S.into[0])} +${S.into.length - 1}`)
    : S.scope === "all" ? "All brains" : nameOf(S.scope);
  const mark = $("spaceMark")?.getAttribute("src");
  if (mark && $("scopeMark").getAttribute("src") !== mark) $("scopeMark").src = mark;
  if (pickMenu) fillPick();
}

/* The picker's menu, drawn on the page itself so the scrolling bar of a phone
   never clips it, and placed above the button, since the box sits low. */
var pickMenu = null;   // var, not let: render() runs before this line is reached
function fillPick(){
  const m = pickMenu, drop = S.mode === "drop";
  const scroll = m.scrollTop;
  m.innerHTML = "";
  m.classList.toggle("multi", drop);
  m.setAttribute("aria-multiselectable", drop ? "true" : "false");
  /* Asking reads one brain or all of them. Dropping ticks as many as the
     source belongs in, and the menu stays open while they are ticked. */
  const isOn = slug => drop ? (slug === "all" ? !S.into.length : S.into.includes(slug)) : S.scope === slug;
  const row = (slug, name, sub, count, b) => {
    const on = isOn(slug);
    const r = el("button","pk-row" + (on ? " on" : ""));
    r.setAttribute("role","option"); r.setAttribute("aria-selected", on ? "true" : "false");
    const nm = el("span","pk-nm", name);
    if (sub) nm.append(el("span","pk-sub", sub));
    const mark = el("span", drop && slug !== "all" ? "pk-box" : "pk-dot");
    if (drop && slug !== "all") mark.innerHTML = `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 5 8.6l4.5-5"/></svg>`;
    r.append(mark);
    if (b) r.append(brainIcon(b));
    r.append(nm);
    if (count != null) r.append(el("span","pk-ct", count));
    r.onclick = e => {
      e.stopPropagation();
      if (!drop){ S.scope = slug; S.into = slug === "all" ? [] : [slug]; closePick(); render(); $("input").focus(); return; }
      if (slug === "all") S.into = [];
      else S.into = S.into.includes(slug) ? S.into.filter(x => x !== slug) : [...S.into, slug];
      S.scope = S.into.length === 1 ? S.into[0] : "all";
      render();
    };
    return r;
  };
  const ideas = S.concepts.length;
  m.append(row("all", drop ? "Suggest for me" : "All brains",
    drop ? "The AI picks where it belongs" : `${S.brains.length} brain${S.brains.length===1?"":"s"}, ${ideas} concept${ideas===1?"":"s"}`));
  if (drop) m.append(el("div","pk-h","Or tick the brains to feed"));
  if (!drop) m.append(el("div","pk-h","Or one brain"));
  for (const b of ordered()) m.append(row(b.slug, b.name, "", String(conceptsOf(b.slug).length), b));
  if (drop){
    const done = el("button","pk-done", S.into.length > 1 ? `Feed ${S.into.length} brains` : "Done");
    done.onclick = e => { e.stopPropagation(); closePick(); $("input").focus(); };
    m.append(done);
  }
  m.scrollTop = scroll;
}
function placePick(){
  const r = $("scopeBtn").getBoundingClientRect(), w = pickMenu.offsetWidth;
  pickMenu.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + "px";
  pickMenu.style.bottom = (innerHeight - r.top + 8) + "px";
}
function openPick(){
  if (pickMenu) return closePick();
  pickMenu = el("div","pick-menu");
  pickMenu.setAttribute("role","listbox");
  fillPick();
  document.body.append(pickMenu);
  placePick();
  $("scopeBtn").setAttribute("aria-expanded","true");
  (pickMenu.querySelector(".pk-row.on") || pickMenu.querySelector(".pk-row"))?.focus();
}
function closePick(){
  if (!pickMenu) return;
  pickMenu.remove(); pickMenu = null;
  $("scopeBtn").setAttribute("aria-expanded","false");
}

function renderComposer(){
  [...$("mode").children].forEach(x => x.classList.toggle("on", x.dataset.m === S.mode));
  /* It appears once there is something to forget. */
  $("freshBtn").hidden = S.mode !== "ask" || !S.thread.length;
  const drop = S.mode==="drop";
  $("srcLine").hidden = !drop;
  $("input").placeholder = drop
    ? "Paste the text or the transcript here, or add a document. Leave it empty when the source is a link."
    : S.scope==="all" ? "Ask anything your brains have read."
                      : "Ask " + (S.brains.find(b=>b.slug===S.scope)?.name || "this brain") + ".";
  $("levelWrap").hidden = drop;
  for (const x of $("level").children){
    const on = x.dataset.v === S.level;
    x.classList.toggle("on", on); x.setAttribute("aria-checked", on ? "true" : "false");
  }
  $("fileBtn").hidden = !drop;
  $("footNote").textContent = drop
    ? "The source gets read once, then you reply to one card."
    : S.level==="educational" ? "Educational: terms defined, mechanism built, one worked example."
    : S.level==="learning" ? "Learning: no answer given. Steps and hints to reach it yourself."
    : "Normal: the answer carries the numbers. Sources sit on one line underneath.";

  const t = $("input").value.trim();
  const src = drop ? $("srcInput").value.trim() : "";
  /* A drop needs something to read: content, a pasted transcript, or a link
     the server can open. A source named with neither is a title and nothing
     else, so the button stays off and the hint says what is missing. */
  const ready = hasContent(src, t);
  $("send").disabled = S.busy || (drop ? !ready : !t);
  $("tHint").textContent = S.busy ? "working" : drop ? dropHint(src, t) : "";
}

/* Declarations, not consts: renderComposer runs once before this line is
   reached, when the shell paints ahead of the first state call. */
function linkIn(s){ return /https?:\/\/\S+/i.test(s || ""); }
function hasContent(src, content){
  return !!(content || linkIn(src) || linkIn(content));
}

/**
 * What the drop still needs, in one line.
 *
 * It says the next move rather than the rule, because the rule only matters at
 * the moment a field is empty.
 */
function dropHint(src, content){
  if (!src && !content) return "";
  if (!src && content) return "name the source, so a repeat is caught later";
  if (hasContent(src, content)) return linkIn(src) && !content
    ? "the link gets opened, video or article" : "";
  return "paste what it says, drop a document, or give a link";
}

function renderZero(){
  const th = $("thread");
  /* The shell paints before the state call says which space this is, so an
     empty state drawn for the wrong space is replaced rather than kept. */
  const old = th.querySelector(".zero");
  if (old && old.dataset.space !== S.space) old.remove();
  if (th.children.length) return;
  const z = el("div","zero");
  z.dataset.space = S.space;
  z.innerHTML = `
    ${S.space === "squidgy" ? `<img class="zero-mark" src="/brand/squidgy-mark.png" alt="">` : ""}
    <h2>A folder that gets smarter every time you feed it.</h2>
    <p class="lede">Feed it any source and it reads the whole thing, files each idea under the right subject, flags every claim that clashes with what you already hold, then answers from dated evidence.</p>`;
  th.append(z);
}

/* ============ thread ============ */
const clearZero = () => $("thread").querySelector(".zero")?.remove();
const bottom = () => { const t=$("thread"); t.scrollTop = t.scrollHeight; };

function push(kind, build){
  clearZero();
  const wrap = el("div","msg "+(kind==="me"?"me":"ai"));
  const col = el("div","col");
  if (kind !== "me"){
    const who = el("div","who");
    who.append(el("span",null,S.spaceName));
    const b = S.brains.find(x=>x.slug===S.scope);
    if (b) who.append(el("span","sc","· "+b.name));
    col.append(who);
  }
  const body = el("div","body");
  col.append(body); wrap.append(col); $("thread").append(wrap);
  build(body); bottom();
  return body;
}
function says(text, attach){
  push("me", b => { b.textContent = text; if (attach) b.append(el("span","attach",attach)); });
}
/* What the space's mascot is up to while an answer is on its way, with the
   step it stands for in brackets. The lines follow an answer's order, one
   every 2.4 seconds: the titles are searched, matched, the concepts read,
   the evidence weighed, the answer written. A long wait alternates the last
   two, which is where a long answer spends its time. */
const WAITING = {
  octopus: [
    ["Octopus is reaching into every brain...", "searching"],
    ["Octopus is feeling for the right concepts...", "matching"],
    ["Eight arms, sorting the notes...", "reading"],
    ["Octopus is untangling the answer...", "weighing"],
    ["Octopus is inking the key points...", "writing"],
  ],
  squidgy: [
    ["Squidgy is sniffing around...", "searching"],
    ["Squidgy picked up a scent...", "matching"],
    ["Squidgy is digging through the notes...", "reading"],
    ["Squidgy is fetching the best bits...", "weighing"],
    ["Squidgy is wagging, almost there...", "writing"],
  ],
};

/**
 * The turning mark and a line. Without a label, the line is the mascot's,
 * and it changes while the wait lasts. A drop's steps pass their own label,
 * because "part 3 of 8" says more than a joke.
 */
/**
 * The browser tab says what a drop is doing, so a long one can run while
 * another tab is open: "Reading 3 of 8 · Octopus". A card or a store that
 * lands while the tab is hidden says so until the tab is looked at.
 */
function tabTitle(step){ document.title = step ? `${step} \u00b7 ${S.spaceName}` : S.spaceName; }
function tabStep(label){
  const t = String(label || ""), n = t.match(/(\d+) of (\d+)/), of = n ? ` ${n[1]} of ${n[2]}` : "";
  const step = /^Checking for a repeat/.test(t) ? "Checking"
    : /^Opening the link/.test(t) ? "Opening"
    : /^Reading/.test(t) ? "Reading" + of
    : /^Comparing against/.test(t) ? "Filing" + of
    : /^Rewriting the positions/.test(t) ? "Storing" + of : "";
  if (step) tabTitle(step);
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && /^(Card ready|Stored) /.test(document.title)) tabTitle("");
});

function thinking(label){
  tabStep(label);
  return push("ai", b => {
    const t = el("div","thinking"), mark = el("span","spinner");
    mark.setAttribute("aria-hidden", "true");
    t.setAttribute("role", "status");
    const line = el("span","tl",label||"Thinking");
    t.append(mark, line);
    b.append(t);
    const lines = !label && (WAITING[S.space] || WAITING.octopus);
    if (lines){
      const show = i => { line.textContent = lines[i][0] + " "; line.append(el("span","act",`(${lines[i][1]})`)); };
      let i = 0;
      show(i);
      const timer = setInterval(() => {
        /* The wait ended when the line left the page. */
        if (!line.isConnected || t.dataset.fixed){ clearInterval(timer); return; }
        i = i < lines.length - 1 ? i + 1 : lines.length - 2;
        show(i);
      }, 2400);
    }
  });
}
function setThinking(body, label){
  tabStep(label);
  const t = body.querySelector(".thinking");
  const s = body.querySelector(".thinking .tl");
  if (t) t.dataset.fixed = "1";
  if (s) s.textContent = label;
}
function fail(body, msg){
  tabTitle("");
  body.innerHTML = "";
  const e = el("div","err");
  e.append(el("b",null,"Nothing was stored"), el("span",null,msg || "Something failed on the way. Send it again."));
  body.append(e);
}

/**
 * Two counts, because they answer different questions.
 *
 * The vendor's is the one the quota is measured against, so it decides when to
 * start pasting instead. The local one is the pace Octopus itself runs at over
 * the last 30 days, which is what says whether the quota will hold.
 */
function usageLines(u){
  if (!u.configured){
    return `<div class="hint">No transcript service is set, so a video link asks you to paste.
      <a href="/doc">How to turn it on</a>.</div>`;
  }
  const m = u.mine || {}, p = u.plan;
  const mine = `<div class="meter">${m.got || 0} fetched through Octopus in the last ${m.days || 30} days` +
    (m.failed ? `, ${m.failed} asked you to paste` : "") + `.</div>`;

  if (!p){
    return `<div class="hint bad-ish">The service did not report its own count: ${esc(u.why || "no reason given")}</div>` + mine;
  }
  const left = Math.max((p.max || 0) - (p.used || 0), 0);
  const pct = p.max ? Math.min(Math.round((p.used / p.max) * 100), 100) : 0;
  const tight = p.max && left <= Math.max(Math.ceil(p.max * 0.15), 5);
  return `
    <div class="bar"><i style="width:${pct}%" class="${tight?"tight":""}"></i></div>
    <div class="meter"><b>${p.used}</b> of <b>${p.max}</b> credits used this billing period
      &middot; ${esc(p.name)} plan${u.mode === "auto" ? " &middot; generating when captions are missing" : ""}</div>
    ${mine}
    ${tight ? `<div class="hint" style="color:var(--accent)">${left} left. Paste transcripts until it resets.</div>` : ""}`;
}

/* Clipboard access can be refused, so leaving the text selected is the fallback. */
function copyTo(btn, input){
  btn.onclick = async () => {
    input.select();
    try { await navigator.clipboard.writeText(input.value); btn.textContent = "Copied"; }
    catch { btn.textContent = "Press copy"; }
    setTimeout(() => { btn.textContent = "Copy"; }, 1600);
  };
}

/**
 * The model list comes from OpenRouter itself, so the prices shown are the ones
 * that get billed. Only models that accept a JSON response format are offered,
 * because every drop asks for JSON and the rest fail on the first call.
 *
 * Fetched once per tab. A failed fetch leaves the text field, which still works.
 */
let MODELS = null;
async function models(){
  if (MODELS) return MODELS;
  const r = await fetch("https://openrouter.ai/api/v1/models");
  if (!r.ok) throw new Error("OpenRouter did not answer with its model list");
  const d = await r.json();
  MODELS = (d.data || [])
    .filter(m => (m.supported_parameters || []).includes("response_format"))
    .map(m => ({
      id: m.id, name: m.name || m.id,
      inp: Number(m.pricing?.prompt || 0) * 1e6,
      out: Number(m.pricing?.completion || 0) * 1e6,
      ctx: Number(m.context_length || 0),
    }))
    /* A negative price means the router decides at call time, so no number can
       be shown. Those rows would read as "$-1000000 in". */
    .filter(m => m.inp >= 0 && m.out >= 0)
    .sort((a, b) => (a.inp + a.out) - (b.inp + b.out));
  return MODELS;
}

const money = n => n === 0 ? "free" : n < 1 ? "$" + n.toFixed(3).replace(/0+$/,"").replace(/\.$/,"") : "$" + n.toFixed(2);
const ctxOf = n => n >= 1000000 ? Math.round(n/1000000) + "M" : n >= 1000 ? Math.round(n/1000) + "k" : String(n);

function nearest(scope){
  const stop = new Set("the a an and or of for my own to in on with about from at by as is are".split(" "));
  const w = new Set((scope.toLowerCase().match(/[a-z]{3,}/g)||[]).filter(x=>!stop.has(x)));
  let best=null, bestN=0;
  for (const b of S.brains){
    const o = new Set((String(b.scope||"").toLowerCase().match(/[a-z]{3,}/g)||[]).filter(x=>!stop.has(x)));
    let n=0; for (const x of w) if (o.has(x)) n++;
    if (n>bestN){ bestN=n; best=b; }
  }
  return bestN>=2 ? best : null;
}

/**
 * What a brain holds: its concepts, each with the evidence under it.
 *
 * The list comes from what the app already has, names and summary lines. A
 * concept is read whole only when it is opened. Its links open the concept
 * they point at, in this brain or another one.
 */
function openBrainView(b, openId){
  closeSide();
  const veil = el("div","veil");

  sheet.setAttribute("role","dialog"); sheet.setAttribute("aria-modal","true");
  veil.append(sheet); document.body.append(veil);
  /* Escape is heard on the page: each view repaints the sheet, which can drop
     focus out of it. */
  const onKey = e => { if (e.key === "Escape" && !pickMenu) shut(); };
  const shut = () => { document.removeEventListener("keydown", onKey); veil.remove(); };
  document.addEventListener("keydown", onKey);
  veil.onclick = e => { if (e.target === veil) shut(); };
  veil.tabIndex = -1;
  let brain = b, filter = "";

  const nameOf = slug => S.brains.find(x => x.slug === slug)?.name || slug;
  const head = (title, sub, back) => {
    const h = el("header","vw-h");
    if (back){ const bk = el("button","vw-back","\u2190 " + nameOf(brain.slug)); bk.onclick = back; h.append(bk); }
    h.append(el("h3",null,title));

    const x = el("button","vw-x","\u00d7"); x.setAttribute("aria-label","Close"); x.onclick = shut;
    h.append(x);
    return h;
  };

  const list = () => {
    sheet.innerHTML = "";
    const cs = conceptsOf(brain.slug);
    const reads = sourcesOf(brain.slug).length;
    sheet.append(head(brain.name, `${brain.scope || ""}`));
    const bar = el("div","vw-bar");
    bar.append(el("span","vw-count",`${cs.length} concept${cs.length===1?"":"s"} \u00b7 ${reads} source${reads===1?"":"s"}`));
    const f = el("input","vw-filter"); f.placeholder = "Filter concepts"; f.value = filter;
    bar.append(f);
    sheet.append(bar);
    const box = el("div","vw-list");
    const paint = () => {
      box.innerHTML = "";
      const t = filter.trim().toLowerCase();
      const shown = t ? cs.filter(c => (c.title + " " + (c.summaryLine||"")).toLowerCase().includes(t)) : cs;
      if (!shown.length){ box.append(el("div","vw-none", cs.length ? "No concept matches that." : "Nothing yet. Drop a source to feed it.")); return; }
      for (const c of shown){
        const r = el("button","vw-row");
        const main = el("span","vw-main");
        main.append(el("b",null,c.title));
        if (c.summaryLine) main.append(el("span","vw-sum",c.summaryLine));
        r.append(main, el("span","vw-meta",`${c.ev||0} ev \u00b7 ${c.src||0} src`));
        r.onclick = () => detail(`${c.brain}/${c.slug}`);
        box.append(r);
      }
    };
    f.oninput = () => { filter = f.value; paint(); };
    paint();
    sheet.append(box);
    setTimeout(() => f.focus(), 30);
  };

  const detail = async id => {
    const slug = id.split("/")[0];
    brain = S.brains.find(x => x.slug === slug) || brain;
    sheet.innerHTML = "";
    sheet.append(head("Opening", "", list));
    let c;
    try { c = (await api("/api/concept", { id })).concept; }
    catch (e) { sheet.append(el("div","vw-none", e.message)); return; }
    sheet.innerHTML = "";
    sheet.append(head(c.title, c.summaryLine || "", list));
    const body = el("div","vw-body");
    const sec = (label, node) => { const d = el("section","vw-sec"); d.append(el("h4",null,label), node); body.append(d); };
    sec("Position", el("p",null, c.position || "No position yet."));
    const ev = el("ul","vw-ev");
    for (const e of c.evidence || []){
      const li = el("li");
      li.append(el("span","vw-date", e.rollup ? `${e.from || ""}${e.to && e.to !== e.from ? " to " + e.to : ""}` : (e.date || "")));
      li.append(el("span",null, e.rollup ? e.claim : `${e.author ? e.author + ": " : ""}${e.claim || ""}`));
      ev.append(li);
    }
    if (!ev.children.length) ev.append(el("li",null,"None yet."));
    sec(`Evidence (${(c.evidence || []).length})`, ev);
    if ((c.data || []).length){
      const d = el("ul","vw-data"); for (const x of c.data) d.append(el("li",null,x));
      sec("Figures", d);
    }
    if ((c.conflicts || []).length){
      const d = el("ul","vw-ev");
      for (const x of c.conflicts) d.append(el("li",null,`${x.a || ""} (${x.aDate || "?"}) against ${x.b || ""} (${x.bDate || "?"})${x.why ? ". " + x.why : ""}`));
      sec("Open conflicts", d);
    }
    if ((c.related || []).length){
      const d = el("div","vw-links");
      for (const r of c.related){
        const [rb, rs] = [r.split("/")[0], r.split("/").slice(1).join("/")];
        const card = S.concepts.find(x => x.brain === rb && x.slug === rs);
        const chip = el("button","vw-link", (card ? card.title : rs) + (rb !== c.brain ? ` \u00b7 ${nameOf(rb)}` : ""));
        chip.onclick = () => detail(r);
        d.append(chip);
      }
      sec("Linked to", d);
    }
    const srcs = (c.sources || []).map(sid => S.sources.find(x => x.sid === sid)).filter(Boolean);
    if (srcs.length){
      const d = el("ul","vw-ev");
      for (const x of srcs.slice(-12).reverse()) d.append(el("li",null,`${x.date || ""} \u00b7 ${x.title || x.sid}${x.author ? " \u00b7 " + x.author : ""}`));
      sec(`Sources (${(c.sources || []).length})`, d);
    }
    const acts = el("div","vw-acts");
    const askIt = el("button","fresh","Ask about it");
    askIt.onclick = () => {
      shut(); S.mode = "ask"; S.scope = c.brain; S.into = [c.brain]; render();
      $("input").value = `What does ${c.title} say, and why?`; $("input").focus(); renderComposer();
    };
    acts.append(askIt, el("span","vw-upd", `Updated ${c.updated || ""}`));
    body.append(acts);
    sheet.append(body);
  };

  if (openId) detail(openId); else list();
  veil.focus();
}
