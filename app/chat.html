      const xs = txt.map((u) => u.x0).sort((a, b) => a - b), few = Math.max(2, 0.15 * xs.length);
      let M = xs.length ? xs[0] : 0;
      for (let i = 0, j = 0; i < xs.length; i++) {
        while (j < xs.length && xs[j] <= xs[i] + 3) j++;
        if (j - i >= few) { M = xs[i]; break; }
      }
      const colR = txt.reduce((m, u) => Math.max(m, u.x1), 0), colW = Math.max(1, colR - M);
      const lead = []; // the pitch after a full-width line is surely inside a paragraph
      us.forEach((b, k) => {
        const a = us[k - 1], p = k ? a.y - b.y : 0;
        const full = k && a.bt && b.bt && a.x1 >= colR - 0.06 * colW && b.x0 >= a.x0 - 3;
        if (full && p >= 0.9 * b.h && p <= 2.5 * b.h) lead.push(p);
      });
      lead.sort((a, b) => a - b);
      const L = lead.length > 1 ? lead[lead.length >> 1] : 0, cf = mode(fc);
      // does line u start a new block after block b?
      const brk = (b, u) => {
        const a = b.last, pitch = a.y - u.y, dx = u.x0 - a.x0, ind = Math.max(6, 0.8 * u.h);
        const end = TERM.test(a.text), short = a.x1 < colR - 0.12 * colW;
        if (pitch > (L ? 1.3 * L : 1.6 * u.h)) return true;
        // a number inside a wrapped sentence is not a list marker, a bullet glyph always is
        if (u.mk) return !!u.mk[1] || !!b.mk || end || short;
        if (dx > ind && !(b.mk && u.f === b.f)) return true; // indent step in; hanging list text is not one
        if (dx < -ind && b.n > 1) return true;
        if (b.n === 1 && short && u.f !== a.f) return true; // a short line in another font over body text: a run-in heading
        if (L && pitch - L >= Math.max(1.5, 0.08 * L) && (short || end)) return true; // small extra gap after a short line
        return L > 0 && a.x1 < colR - 0.35 * colW && end && /^[\p{Lu}\d"(\u201C]/u.test(u.text);
      };
      const out = [];
      let cur = null;
      us.forEach((u) => {
        if (u.table) { out.push({ t: "table", text: tmd(u.lines) }); cur = null; return; }
        if (u.level) {
          if (cur && cur.t === "h" && cur.level === u.level && cur.last.y - u.y <= 1.5 * u.h) {
            cur.text = joinLines(cur.text, u.tx);
            cur.last = u;
            cur.n++;
          } else out.push(cur = { t: "h", level: u.level, text: u.tx, last: u, n: 1, x0: u.x0, f: u.f });
          return;
        }
        // a signature line, with its wide gap, stays alone, unless it is just a stretched justified line
        const stretched = Math.abs(u.x1 - colR) < 3 && Math.abs(u.x0 - M) < 3 && u.gm <= 2.5 * u.h;
        const solo = LEADER.test(u.text) || (u.segs.length > 1 && !stretched);
        u.text = solo ? u.text : u.tx;
        u.mk = !solo && isBody(u) ? OPEN.exec(u.text) : null;
        if (solo) {
          out.push({ t: "p", text: u.text, x0: u.x0, f: u.f, solo: true });
          cur = null;
        } else if (cur && cur.t === "p" && !cur.solo && !brk(cur, u)) {
          cur.text = joinLines(cur.text, u.text);
          cur.last = u;
          cur.n++;
          cur.x0 = Math.min(cur.x0, u.x0);
        } else out.push(cur = { t: "p", text: u.text, x0: u.x0, f: u.f, last: u, n: 1, mk: u.mk });
      });
      out.forEach((b) => {
        if (b.t === "h" && (b.n > 3 || b.text.length > 120)) b.t = "p"; // a long run of big text is a paragraph
        b.ind = b.t === "p" && !b.mk && !b.solo && b.x0 > M + Math.max(6, 0.9 * cH);
        b.dif = b.f !== cf;
      });
      // two or more indented blocks in a row with the same left edge are list items
      for (let i = 0, j; i < out.length; i = j + 1) {
        for (j = i; out[i].ind && j + 1 < out.length && out[j + 1].ind && Math.abs(out[j + 1].x0 - out[i].x0) <= 3; ) j++;
        if (j > i) { listX.push(out[i].x0); out.slice(i, j + 1).forEach((b) => { b.t = "li"; }); }
      }
      out.forEach((b) => { if (b.mk) b.t = "li"; });
      return out;
    };
    const pageBlocks = chunksOf.map((cs) => cs.reduce((acc, c) => acc.concat(chunkBlocks(c)), []));
    // a lone indented block: a list item if that indent is a list elsewhere, else a quote when the font differs
    pageBlocks.forEach((bs) => bs.forEach((b) => {
      if (b.t === "p" && b.ind) {
        if (listX.some((x) => Math.abs(x - b.x0) <= 3)) b.t = "li";
        else if (b.dif) b.t = "quote";
      }
    }));

    // 10. Markdown. Consecutive list items stay on adjacent lines, everything else is separated by a blank line.
    const fin = (s) => s.replace(/ +/g, " ").replace(/ ?\u0001 ?/g, "   ").trim();
    const md = P.map((p, pi) => {
      const out = [];
      let inList = false;
      pageBlocks[pi].forEach((b) => {
        let s = fin(b.text);
        if (!s) return;
        if (b.t === "li") {
          const m = b.mk, rest = s.replace(/^\S+ +/, "");
          s = !m ? "- " + s : m[1] ? "- " + rest : m[2] || m[3] ? (m[2] || m[3]) + ". " + rest : "- " + s;
          if (inList) { out[out.length - 1] += "\n" + s; return; }
        }
        inList = b.t === "li";
        out.push(b.t === "h" ? "#".repeat(b.level) + " " + s : b.t === "quote" ? "> " + s : s);
      });
      return out.length ? "[[p. " + p.n + "]]\n\n" + out.join("\n\n") : "";
    }).filter(Boolean).join("\n\n");
    return md.replace(/[ \t]+$/gm, "").replace(/\n{3,}/g, "\n\n").trim();
  } catch (e) {
    return plain();
  }
}

/** One page of a PDF as the layout reader takes it: each piece of text, where it stands and how big it is. */
async function pdfItems(doc, n){
  const page = await doc.getPage(n), vp = page.getViewport({ scale: 1 }), c = await page.getTextContent();
  const items = c.items.map(i => ({ s: i.str || "", x: i.transform?.[4] ?? 0, y: i.transform?.[5] ?? 0, w: i.width || 0, h: i.height || 0, f: i.fontName || "", e: i.hasEOL ? 1 : 0 }));
  page.cleanup();
  return { n, w: vp.width, h: vp.height, items };
}

/**
 * A PDF as Markdown, 30 pages at a time so a long one never sits whole in
 * memory. With `marks`, each page opens with its mark, so an answer can name
 * its page.
 */
async function pdfRead(file, say, marks){
  const pdfjs = await import(PDFJS + "pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.mjs";
  const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
  const out = [];
  for (let from = 1; from <= doc.numPages; from += 30){
    const pages = [];
    for (let n = from; n < from + 30 && n <= doc.numPages; n++){
      if (n === 1 || n % 5 === 0 || n === doc.numPages) say(`Reading page ${n} of ${doc.numPages}`);
      pages.push(await pdfItems(doc, n));
    }
    const md = pdfMarkdown(pages);
    if (md) out.push(marks ? md : md.replace(/^\[\[p\. \d+\]\]\n+/gm, ""));
  }
  return out.join("\n\n").trim();
}

/** A PDF as the text a drop reads. */
const pdfText = (file, say) => pdfRead(file, say, false);

/** The Word reader, loaded the first time a Word file is chosen. mammoth carries no types, so it goes in as a plain script. */
async function loadMammoth(){
  if (window.mammoth) return;
  await new Promise((ok, no) => {
    const t = document.createElement("script");
    /* The file cdnjs published, byte for byte, or nothing runs. */
    t.integrity = MAMMOTH_SRI; t.crossOrigin = "anonymous";
    t.src = MAMMOTH; t.onload = ok;
    t.onerror = () => no(new Error("the Word reader did not load. Check the connection."));
    document.head.append(t);
  });
}

/** A Word file. */
async function docxText(file){
  await loadMammoth();
  const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
  return String(r?.value ?? "").trim();
}

/**
 * A dropped document becomes the content.
 *
 * PDF, Word, a web page, and anything that is already text. The file itself is never
 * uploaded: it is read in this tab, and only the extraction ever reaches a
 * brain, which is the same rule a pasted transcript follows.
 */
async function readDocument(file){
  const name = file.name || "document";
  const ext = name.toLowerCase().split(".").pop();
  const big = Math.round(file.size / 1024);
  if (file.size > 30 * 1024 * 1024) throw new Error(`${name} is ${big}KB. 30MB is the ceiling.`);

  const btn = $("fileBtn");
  const say = t => { btn.textContent = t; };
  say("Reading");
  try {
    if (ext === "pdf") return { name, text: await pdfText(file, say) };
    if (ext === "docx") return { name, text: await docxText(file) };
    /* A web page is read for its words, not its tags. */
    if (["html", "htm", "xhtml"].includes(ext)) return { name, text: htmlToMd(await file.text()) };
    if (["txt", "md", "markdown", "text", "csv", "srt", "vtt"].includes(ext) || file.type.startsWith("text/")) {
      return { name, text: (await file.text()).trim() };
    }
    throw new Error(`${name} is a .${ext}. PDF, Word, HTML and text files are read here.`);
  } finally {
    say("+ document");
  }
}

/** The chosen file fills the content, and names the source when nothing has. */
async function takeDocument(file){
  if (!file) return;
  let got;
  try { got = await readDocument(file); }
  catch (e) {
    dpush("ai", b => { b.innerHTML = rich("**That document did not open.** " + esc(e.message)); });
    dbottom(); return;
  }
  if (!got.text){
    dpush("ai", b => { b.innerHTML = rich(
      `**${esc(got.name)} gave no text.** A scanned PDF holds pictures of words, so it needs the text pasted instead.`); });
    dbottom(); return;
  }
  $("input").value = got.text;
  if (!$("srcInput").value.trim()) $("srcInput").value = got.name;
  sizeBox(); renderComposer();
  const n = (got.text.match(/\S+/g)||[]).length.toLocaleString();
  dpush("ai", b => { b.innerHTML = rich(
    `**${esc(got.name)}** read, ${n} words. It sits in the content box. Send it when the source line is right.`); });
  dbottom();
}


/* ============ projects ============
   A project is one file or one table, a chat beside it, and a memory of its
   own. The file is read in this tab and goes to the server a piece at a time,
   cut in sections. A question reads only the sections it needs, so a file of
   any size answers at the cost of the question. The chat can propose changes
   to the file; only a click applies them. */

const PJ_FILES = ".pdf,.txt,.md,.markdown,.text,.docx,.csv,.tsv,.xlsx,.xls,.html,.htm,.xhtml";
const PJ_PIECE = 120000;            /* characters of a document sent at a time */
const PJ_ROWS = 4000;               /* rows of a sheet sent at a time */
const XLSX_URL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
const XLSX_SRI = "sha512-r22gChDnGvBylk90+2e/ycr3RVrDi8DIOkIGNhJlKfuyQM4tIRAI062MaV8sfjQKYVGjOBaZBOA87z+IhZE9DA==";
const PJ_ICON = {
  doc: `<svg class="b-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></svg>`,
  table: `<svg class="b-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M4 10h16M10 5v14"/></svg>`,
  html: `<svg class="b-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4M13 6l-2 12"/></svg>`,
};
const pjIcon = k => PJ_ICON[k === "table" ? "table" : k === "html" ? "html" : "doc"];
/** What a project's file is called: a document, a page or a table. */
const pjNoun = k => k === "table" ? "table" : k === "html" ? "page" : "document";
/** The name of the file's side in the phone's two tabs. */
const pjSeg = f => f?.kind === "table" ? "Table" : f?.kind === "html" ? "Page" : "Document";

/* ---- reading a file in this tab ---- */

/** Text with Markdown's marks, as a page of HTML: headings, lists inside lists, quotes, code, tables, bold, italic, links, a PDF's page marks. A # is an h2 under the page's own title; `top` sets its level. */
function mdView(text, top = 2){
  const fmt = t => esc(t).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>").replace(/`([^`]+)`/g, "<code>$1</code>");
  /* A web address is a link only as [words](https://...): its own marks are never read as bold or italic. */
  const inline = s => {
    let html = "", last = 0;
    const re = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
    for (let m; (m = re.exec(s));){ html += fmt(s.slice(last, m.index)) + `<a href="${esc(m[2])}" target="_blank" rel="noopener noreferrer">${fmt(m[1])}</a>`; last = m.index + m[0].length; }
    return html + fmt(s.slice(last));
  };
  const out = []; let para = [], items = [], table = [], quote = [];
  /* A PDF or a plain text file breaks its lines where the page ended: a long line with no stop is read on into the next. */
  const flushP = () => {
    if (!para.length) return;
    const soft = l => l.length >= 50 && !/[.!?:;]["')\]]?$/.test(l);
    out.push("<p>" + para.map((l, i) => (i ? (soft(para[i - 1]) ? " " : "<br>") : "") + inline(l)).join("") + "</p>");
    para = [];
  };
  /* Items carry how far they are indented; a deeper item opens a list inside the one above it. */
  const flushL = () => {
    if (!items.length) return;
    let html = ""; const st = [];
    for (const it of items){
      while (st.length && it.indent < st[st.length - 1].indent) html += `</li></${st.pop().t}>`;
      const top = st[st.length - 1];
      if (!top || it.indent > top.indent){ html += `<${it.t}${it.t === "ol" && it.num > 1 ? ` start="${it.num}"` : ""}>`; st.push({ t: it.t, indent: it.indent }); }
      else { html += "</li>"; if (top.t !== it.t){ html += `</${top.t}><${it.t}>`; top.t = it.t; } }
      html += `<li>${inline(it.text)}`;
    }
    while (st.length) html += `</li></${st.pop().t}>`;
    out.push(html); items = [];
  };
  const flushQ = () => { if (quote.length){ out.push("<blockquote><p>" + quote.map(inline).join(" ") + "</p></blockquote>"); quote = []; } };
  const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  const flushT = () => {
    if (!table.length) return;
    const sep = table.findIndex(r => /^\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?$/.test(r));
    const head = sep > 0 ? table.slice(0, sep) : [], body = table.filter((r, i) => i !== sep && !head.includes(r));
    out.push("<div class=\"pj-tw\"><table>" + (head.length ? "<thead>" + head.map(r => "<tr>" + cells(r).map(c => `<th>${inline(c)}</th>`).join("") + "</tr>").join("") + "</thead>" : "") +
      "<tbody>" + body.map(r => "<tr>" + cells(r).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</tbody></table></div>");
    table = [];
  };
  const flush = () => { flushP(); flushL(); flushT(); flushQ(); };
  let code = null;
  for (const raw of String(text ?? "").replace(/\r/g, "").split("\n")){
    const line = raw.trimEnd(), t = line.trim();
    /* A fence opens a block of code, shown as it is written, and runs to the next fence. */
    if (/^```/.test(t)){
      if (code){ out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); code = null; }
      else { flush(); code = []; }
      continue;
    }
    if (code){ code.push(line); continue; }
    const pg = /^\[\[p\. (\d+)\]\]$/.exec(t);
    if (pg){ flush(); out.push(`<div class="pj-pg">p. ${pg[1]}</div>`); continue; }
    if (!t){ flush(); continue; }
    if (/^([-*_])\1{2,}$/.test(t)){ flush(); out.push("<hr>"); continue; }
    const h = /^(#{1,3})\s+(.+)$/.exec(t);
    if (h){ flush(); out.push(`<h${h[1].length + top - 1}>${inline(h[2])}</h${h[1].length + top - 1}>`); continue; }
    const q = /^>\s?(.*)$/.exec(t);
    if (q){ flushP(); flushL(); flushT(); quote.push(q[1]); continue; }
    const li = /^(\s*)([-*•]|(\d+)[.)])\s+(.+)$/.exec(line);
    if (li){ flushP(); flushT(); flushQ(); items.push({ t: li[3] ? "ol" : "ul", num: Number(li[3] || 0), indent: li[1].replace(/\t/g, "    ").length, text: li[4] }); continue; }
    if (/^\|.*\|$/.test(t)){ flushP(); flushL(); flushQ(); table.push(t); continue; }
    flushL(); flushT(); flushQ(); para.push(t);
  }
  if (code) out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
  flush();
  return out.join("");
}

/**
 * HTML as Markdown: headings, paragraphs, lists inside lists, tables, quotes,
 * code, links, bold and italic. Word's own HTML comes through it, and so does
 * a page saved from the web: scripts, styles, menus and forms are left out,
 * the main part is kept, and text that sits loose in a block is still text.
 */
function htmlToMd(html){
  const d = new DOMParser().parseFromString(html, "text/html");
  const title = (d.querySelector("title")?.textContent || "").replace(/\s+/g, " ").trim();
  for (const x of d.querySelectorAll("script,style,noscript,template,iframe,svg,canvas,link,meta,[hidden],[aria-hidden='true']")) x.remove();
  const root = d.querySelector("main,article,[role='main']") || d.body;
  const SKIP = new Set(["NAV","FOOTER","ASIDE","FORM","BUTTON","SELECT","TEXTAREA","INPUT","DIALOG","IMG","HEAD"]);
  const BLOCK = new Set(["P","DIV","SECTION","ARTICLE","MAIN","HEADER","LI","UL","OL","TABLE","TR","TD","TH","BLOCKQUOTE","PRE","H1","H2","H3","H4","H5","H6","DL","DT","DD","FIGURE","FIGCAPTION","ADDRESS","CENTER","HR","BODY"]);
  const space = t => t.replace(/[ \t\r\f\u00a0]+/g, " ");
  /* The inline text of a node, with its bold, italic, code and links marked. A block inside it reads as a break. */
  const inl = (n, noLists) => {
    let s = "";
    for (const c of n.childNodes){
      if (c.nodeType === 3){ s += c.nodeValue.replace(/\s+/g, " "); continue; }
      if (c.nodeType !== 1) continue;
      const t = c.tagName;
      if (t === "BR"){ s += "\n"; continue; }
      if (SKIP.has(t) || (noLists && (t === "UL" || t === "OL"))) continue;
      const inner = inl(c, noLists), core = inner.trim();
      if (BLOCK.has(t)){ s += " " + inner + " "; continue; }
      if (!core){ s += /\s/.test(inner) ? " " : ""; continue; }
      const pre = /^\s/.test(inner) ? " " : "", post = /\s$/.test(inner) ? " " : "";
      if (t === "A"){ const h = c.getAttribute("href") || ""; s += /^https?:\/\//i.test(h) ? `${pre}[${core}](${h})${post}` : inner; }
      else if (t === "STRONG" || t === "B") s += `${pre}**${core}**${post}`;
      else if (t === "EM" || t === "I") s += `${pre}*${core}*${post}`;
      else if (t === "CODE" || t === "KBD" || t === "SAMP") s += `${pre}\`${core}\`${post}`;
      else s += inner;
    }
    return s;
  };
  const line = t => space(t).replace(/ *\n */g, "\n").replace(/\n{2,}/g, "\n").trim();
  /* A node's blocks, in order. Loose inline text gathers into a paragraph and ends at the next block. */
  const blocks = node => {
    const out = []; let run = "";
    const flush = () => { const t = line(run); if (t) out.push(t); run = ""; };
    const list = (el, depth, lines) => {
      let i = 0;
      for (const li of el.children){
        if (li.tagName !== "LI") continue;
        i++;
        const own = line(inl(li, true)).replace(/\s*\n\s*/g, " ");
        if (own) lines.push(`${"  ".repeat(depth)}${el.tagName === "OL" ? i + "." : "-"} ${own}`);
        for (const sub of li.children) if (sub.tagName === "UL" || sub.tagName === "OL") list(sub, depth + 1, lines);
      }
    };
    const table = t => {
      const rows = [...t.querySelectorAll("tr")].filter(tr => tr.closest("table") === t)
        .map(tr => [...tr.children].filter(c => /^T[DH]$/.test(c.tagName)));
      const w = rows.reduce((m, r) => Math.max(m, r.length), 0);
      if (!w) return;
      /* A layout table, one column wide or holding other tables, is read as the blocks it holds. */
      if (w < 2 || t.querySelector("table")){ for (const r of rows) for (const c of r) out.push(...blocks(c)); return; }
      const cell = c => line(inl(c)).replace(/\s*\n\s*/g, " ").replace(/\|/g, "/");
      const pad = r => `| ${Array.from({ length: w }, (_, i) => r[i] ? cell(r[i]) : "").join(" | ")} |`;
      out.push([pad(rows[0]), `| ${Array(w).fill("---").join(" | ")} |`, ...rows.slice(1).map(pad)].join("\n"));
    };
    const walk = n => {
      if (n.nodeType === 3){ run += n.nodeValue.replace(/\s+/g, " "); return; }
      if (n.nodeType !== 1) return;
      const t = n.tagName;
      if (SKIP.has(t)) return;
      if (/^H[1-6]$/.test(t)){ flush(); const s = line(inl(n)).replace(/\s*\n\s*/g, " "); if (s) out.push("#".repeat(Math.min(3, Number(t[1]))) + " " + s); return; }
      if (t === "UL" || t === "OL"){ flush(); const lines = []; list(n, 0, lines); if (lines.length) out.push(lines.join("\n")); return; }
      if (t === "TABLE"){ flush(); table(n); return; }
      if (t === "PRE"){ flush(); const c = n.textContent.replace(/\s+$/, ""); if (c.trim()) out.push("```\n" + c + "\n```"); return; }
      if (t === "HR"){ flush(); return; }
      if (t === "BLOCKQUOTE"){ flush(); const inner = blocks(n).join("\n\n"); if (inner) out.push(inner.split("\n").map(l => "> " + l).join("\n")); return; }
      if (BLOCK.has(t)){ flush(); for (const c of n.childNodes) walk(c); flush(); return; }
      /* An inline element read in place keeps its marks. */
      if (n.children.length === 0 || [...n.children].every(c => !BLOCK.has(c.tagName))){ run += inl({ childNodes: [n] }); return; }
      for (const c of n.childNodes) walk(c);
    };
    for (const c of node.childNodes) walk(c);
    flush();
    return out;
  };
  const out = blocks(root);
  /* A page without a heading of its own is named by its title. */
  if (title && !root.querySelector("h1") && !out.some(b => /^# /.test(b))) out.unshift("# " + title.slice(0, 150));
  return out.join("\n\n").replace(/\n{3,}/g, "\n\n").trim();
}

/** A Word file as Markdown. */
async function docxMarkdown(file){
  await loadMammoth();
  const r = await window.mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() });
  return htmlToMd(String(r?.value ?? ""));
}

/** A PDF as text, each page opening with its mark so an answer can name its page. */
async function pdfPages(file, say){ return await pdfRead(file, say, true); }

/** Comma, semicolon or tab separated text as rows. A quoted cell may hold the separator, quotes and line breaks. */
function parseDelimited(text, sep){
  const s = String(text ?? "").replace(/^﻿/, ""), out = [];
  let row = [], cell = "", q = false;
  for (let i = 0; i < s.length; i++){
    const ch = s[i];
    if (q){ if (ch === '"'){ if (s[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep){ row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r"){ if (ch === "\r" && s[i + 1] === "\n") i++; row.push(cell); cell = ""; out.push(row); row = []; }
    else cell += ch;
  }
  if (cell !== "" || row.length){ row.push(cell); out.push(row); }
  return out;
}

/** The Excel reader, loaded the first time an Excel file is chosen and checked against the file cdnjs published. */
async function loadXlsx(){
  if (window.XLSX) return;
  await new Promise((ok, no) => {
    const t = document.createElement("script");
    t.integrity = XLSX_SRI; t.crossOrigin = "anonymous"; t.src = XLSX_URL; t.onload = ok;
    t.onerror = () => no(new Error("the Excel reader did not load. Check the connection."));
    document.head.append(t);
  });
}

/** A workbook's sheets as rows of text, as Excel shows them. */
async function workbookSheets(file){
  await loadXlsx();
  const wb = window.XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });
  const sheets = [];
  for (const name of wb.SheetNames.slice(0, 40)){
    /* The one published weakness of this reader needs a sheet named like an object's own parts. */
    if (/^(__proto__|constructor|prototype)$/i.test(name)) continue;
    const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: "", blankrows: false });
    sheets.push({ name, rows: rows.map(r => r.map(c => String(c ?? ""))) });
  }
  return sheets;
}

/** Sheets of rows as a table: the first row is the header, empty rows and columns at the edge are cut. */
function tableOf(name, sheets){
  const out = [];
  for (const s of sheets){
    const rows = s.rows.filter(r => r.some(c => String(c).trim()));
    if (!rows.length) continue;
    /* The widest row, found one by one: a spread of 300,000 rows into one call overflows the stack. */
    let widest = 0;
    for (const r of rows){ let n = r.length; while (n && !String(r[n - 1]).trim()) n--; if (n > widest) widest = n; }
    const width = Math.min(60, widest);
    const fit = r => Array.from({ length: width }, (_, i) => String(r[i] ?? ""));
    out.push({ name: String(s.name).slice(0, 60), header: fit(rows[0]), rows: rows.slice(1).map(fit) });
  }
  if (!out.length) throw new Error(`${name} holds no rows to read.`);
  return { kind: "table", name, sheets: out };
}

/** A chosen file as a document or a table, read here. The file itself is never uploaded: its text and rows are. */
async function readProjectFile(file, say){
  const name = file.name || "file", ext = name.toLowerCase().split(".").pop();
  if (file.size > 30 * 1024 * 1024) throw new Error(`${name} is ${Math.round(file.size / 1048576)}MB. 30MB is the ceiling.`);
  say(`Reading ${name}`);
  if (ext === "pdf") return { kind: "doc", name, text: await pdfPages(file, say) };
  if (ext === "docx") return { kind: "doc", name, text: await docxMarkdown(file) };
  if (ext === "csv" || ext === "tsv"){
    const text = await file.text();
    const first = text.split("\n", 1)[0] || "";
    const sep = ext === "tsv" ? "\t" : (first.split(";").length > first.split(",").length ? ";" : ",");
    return tableOf(name, [{ name: name.replace(/\.[^.]+$/, ""), rows: parseDelimited(text, sep) }]);
  }
  if (ext === "xlsx" || ext === "xls"){ say("Loading the Excel reader"); return tableOf(name, await workbookSheets(file)); }
  if (["html", "htm", "xhtml"].includes(ext)) return { kind: "html", name, text: (await file.text()).trim() };
  if (["txt", "md", "markdown", "text"].includes(ext) || file.type.startsWith("text/")) return { kind: "doc", name, text: (await file.text()).trim() };
  throw new Error(`${name} is a .${ext}. A project reads Word, PDF, text, Markdown, HTML, Excel and CSV files.`);
}

/** A text cut in pieces of about `max` characters, on paragraph breaks. */
function cutText(t, max){
  const out = []; let cur = "";
  for (const p of String(t).split(/\n{2,}/)){
    if (cur && cur.length + p.length + 2 > max){ out.push(cur); cur = ""; }
    if (p.length > max){ for (let i = 0; i < p.length; i += max) out.push(p.slice(i, i + max)); continue; }
    cur = cur ? cur + "\n\n" + p : p;
  }
  if (cur) out.push(cur);
  return out;
}

/** The file sent to the server a piece at a time. `step` says where it stands. */
async function uploadProject(slug, got, step){
  /* What a project holds is said before the first piece goes, not after most of them have. */
  if (got.kind !== "table" && got.text.length > 12000000) throw new Error(`${got.name} is longer than a project reads: about 4,000 pages.`);
  if (got.kind === "table" && got.sheets.reduce((n, s) => n + s.rows.reduce((a, r) => a + r.reduce((b, c) => b + c.length + 1, 0), 0), 0) > 6000000)
    throw new Error(`${got.name} is bigger than a project reads: about 40,000 rows of 10 columns.`);
  const begin = await api("/api/project/begin", { brain: slug, name: got.name, kind: got.kind,
    ...(got.kind === "table" ? { sheets: got.sheets.map(s => ({ name: s.name, header: s.header })) } : {}) });
  if (got.kind !== "table"){
    const pieces = cutText(got.text, PJ_PIECE);
    if (!pieces.length) throw new Error(`${got.name} gave no text. A scanned PDF holds pictures of words, so it needs its text.`);
    let page = 0;
    for (let i = 0; i < pieces.length; i++){
      step(pieces.length > 1 ? `Cutting it in sections: part ${i + 1} of ${pieces.length}` : "Cutting it in sections");
      await api("/api/project/part", { brain: slug, ver: begin.ver, text: pieces[i], page });
      const last = [...pieces[i].matchAll(/^\[\[p\. (\d+)\]\]$/gm)].pop();
      if (last) page = Number(last[1]);
    }
  } else {
    for (const [si, s] of got.sheets.entries()){
      for (let at = 0; at < s.rows.length;){
        let n = 0, chars = 0;
        while (at + n < s.rows.length && n < PJ_ROWS && chars < 150000){ chars += s.rows[at + n].reduce((a, c) => a + c.length + 1, 0); n++; }
        step(`Storing ${s.name}: rows ${at + 1} to ${at + n} of ${s.rows.length}`);
        await api("/api/project/part", { brain: slug, ver: begin.ver, sheet: si, rows: s.rows.slice(at, at + n) });
        at += n;
      }
    }
  }
  step("Counting what each column holds");
  return await api("/api/project/finish", { brain: slug, ver: begin.ver });
}

/* ---- what an answer used, marked in the file ---- */

/** Wrap each quote the answer rests on, where the words stand in the file. */
function markQuotes(root, quotes){
  root.querySelectorAll("mark.pj-mark").forEach(m => m.replaceWith(...m.childNodes));
  root.normalize();
  for (const q of quotes || []){
    const needle = q.replace(/[|*_`#>]/g, " ").replace(/\s+/g, " ").trim().toLowerCase();
    if (needle.length < 6) continue;
    const nodes = [], w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) nodes.push(n);
    let hay = ""; const at = [];
    for (const t of nodes){
      const s = t.nodeValue;
      for (let i = 0; i < s.length; i++){
        const c = /\s/.test(s[i]) ? " " : s[i].toLowerCase();
        if (c === " " && hay.endsWith(" ")) continue;
        hay += c; at.push([t, i]);
      }
      /* Two cells or two paragraphs read as separate words. */
      if (at.length && !hay.endsWith(" ")){ hay += " "; at.push(at[at.length - 1]); }
    }
    const k = hay.indexOf(needle);
    if (k < 0) continue;
    /* One mark for each stretch of text inside one node, so words that run across two cells or two paragraphs are marked in both. */
    const spans = new Map();
    for (let i = k; i < k + needle.length; i++){
      const [t, o] = at[i], cur = spans.get(t);
      if (cur) cur[1] = Math.max(cur[1], o + 1); else spans.set(t, [o, o + 1]);
    }
    for (const [t, [from, to]] of spans){
      if (!t.nodeValue.slice(from, to).trim()) continue;
      try {
        const r = document.createRange(); r.setStart(t, from); r.setEnd(t, to);
        const m = document.createElement("mark"); m.className = "pj-mark"; r.surroundContents(m);
      } catch { /* the section's bar still shows where it was found */ }
    }
  }
}
function applyMarks(){
  const pj = S.pj; if (!pj) return;
  const m = pj.marks || { sids: new Set(), rows: new Set(), quotes: [] };
  pj.page?.querySelectorAll(".pj-sec").forEach(s => s.classList.toggle("used", m.sids.has(Number(s.dataset.sid))));
  if (pj.page && m.quotes.length) markQuotes(pj.page, m.quotes); else if (pj.page) markQuotes(pj.page, []);
  pj.grid?.tb.querySelectorAll("tr").forEach(r => r.classList.toggle("used", m.rows.has(Number(r.dataset.n))));
}
/** Show what an answer used: its sections and quotes, or its rows, marked and brought into view. */
async function focusUsed(t, scroll){
  const pj = S.pj, u = t?.used?.file; if (!pj || !u) return;
  pj.marks = { sids: new Set((u.sections || []).map(s => s.sid)), rows: new Set(u.rows || []), quotes: t.quotes || [] };
  const f = pj.data.file;
  if (f?.kind === "table" && u.rows?.length){
    const sheet = u.sheet ?? 0;
    if (pj.sheet !== sheet){ pj.sheet = sheet; pj.body.innerHTML = ""; pj.body.classList.remove("tbl"); paintGrid(pj.body); }
    const first = u.rows[0];
    if (scroll && !pj.grid.tb.querySelector(`tr[data-n="${first}"]`)) await loadRows({ from: Math.max(1, first - 5), replace: true });
    applyMarks();
    if (scroll){ showDoc(); pj.grid.tb.querySelector(`tr[data-n="${first}"]`)?.scrollIntoView({ block: "center", behavior: "smooth" }); }
  } else if (f?.kind === "doc" && u.sections?.length){
    const first = u.sections[0].sid;
    if (scroll && !pj.page.querySelector(`[data-sid="${first}"]`)) await loadSections({ sid: first, replace: true });
    applyMarks();
    if (scroll){ showDoc(); pj.page.querySelector(`[data-sid="${first}"]`)?.scrollIntoView({ block: "start", behavior: "smooth" }); }
  } else applyMarks();
}

/** What the message bar invites: a question about the file, or a description of one to make. */
function askHint(f){
  /* On a phone the hint is one line, not four. */
  const small = window.matchMedia("(max-width: 860px)").matches;
  if (!f) return small ? "Describe it. @ names a folder." : "Describe a document, a table or a page to make. Your folders are read when they help.";
  if (f.status !== "ready") return small ? "Drop the file again first." : "Drop the file again first, then ask about it here.";
  const n = pjNoun(f.kind);
  return f.chars ? (small ? "Ask, or change. @ names a folder." : `Ask about the ${n}, or ask for a change. Your folders are read when they help. Type @ to name one.`)
    : (small ? `Describe the ${n} you want.` : `Describe the ${n} you want. It is written here, then changed as you go.`);
}

/** The memory button: how many notes the project holds, as a small neutral count. */
function paintMemb(){
  const pj = S.pj; if (!pj?.memb) return;
  const n = pj.data.memory.length;
  pj.memb.querySelector("i")?.remove();
  if (n) pj.memb.append(el("i",null,String(n)));

  pj.memb.setAttribute("aria-label", pj.memb.title);
}
/** The right side: the thread of the chat. */
function paintSide(){
  const pj = S.pj; if (!pj?.thread) return;
  paintMemb();
  const box = pj.thread; box.innerHTML = "";
  const turns = pj.data.turns;
  if (!turns.length){
    const f = pj.data.file, tbl = f?.kind === "table", blank = f?.status === "ready" && !f.chars;
    const hint = el("div","pj-hint");
    hint.textContent = !f ? "Describe what you want: a document, a table or an HTML page. The chat makes it beside this, from your words and your folders, then changes it as you go. Every change can be undone. A file you have can be dropped instead."
      : f.status !== "ready" ? "The file was not finished. Add it again."
      : blank ? `Describe the ${pjNoun(f.kind)} you want. The chat writes it in the file beside this, then changes it as you go. Every change can be undone.`
      : f.made ? `Ask for a change and it is made at once, with an Undo. Ask a question and you get the answer first, then what it rests on.`
      : `Ask about the ${tbl ? "table" : "file"}. Ask for a brainstorm and you get a proposal, with where each point comes from. Ask for a change and you see it before it is made.`;
    box.append(hint);
    if (!f || f.status === "ready"){
      const tries = el("div","pj-try");
      /* A file still to make can be built from the owner's biggest folder: a start that shows the folders are read. */
      const fold = !f || blank ? ordered().find(b => b.type !== "personal") : null;
      const list = !f ? ["A table of my monthly expenses, with a category, an amount and a date", "A landing page for my coaching business: a hero, three offers and a contact form", "A one page project brief: goal, scope, risks and next steps"]
        : blank ? (tbl ? ["A table of my monthly expenses, with a category, an amount and a date", "A content calendar for the next four weeks"]
          : f.kind === "html" ? ["A landing page for my coaching business: a hero, three offers and a contact form", "A one page résumé with my experience and skills"]
          : ["A one page project brief: goal, scope, risks and next steps", "A meeting notes template with decisions and actions"])
        : tbl ? ["Which rows stand out, and why?", "Brainstorm: what should I change in this table?"]
        : ["Summarise this in five lines.", "Brainstorm: what is missing from this?"];
      if (fold) list.push(tbl ? `A table of the key points in my ${fold.name} folder, with the source of each` : f?.kind === "html" ? `A page presenting my ${fold.name} folder in five sections` : `A one page summary of my ${fold.name} folder`);
      for (const q of list){
        const b = el("button",null,q); b.type = "button"; b.onclick = () => { pj.input.value = q; pj.size(); pj.input.focus(); };
        tries.append(b);
      }
      box.append(tries);
    }
  }
  for (const t of turns) box.append(turnEl(t));
  box.scrollTop = box.scrollHeight;
  pj.size();

/** Row numbers as a short phrase: "rows 4, 5, 10" and "and 3 more". */
function rowsLine(rows){
  const shown = rows.slice(0, 6).join(", ");
  return `rows ${shown}${rows.length > 6 ? ` and ${rows.length - 6} more` : ""}`;
}
/** What a message cost, as the model host reported it: tokens in and out, the part it reused from before, the price in dollars when it said one. Turns kept before the price was in dollars hold it in cents. */
function costLine(c){
  const k = n => n >= 10000 ? `${Math.round(n / 1000)}k` : n >= 1000 ? `${(n / 1000).toFixed(1).replace(/\.0$/, "")}k` : String(n);
  const usd = c.usd != null ? c.usd : c.cents != null ? c.cents / 100 : null;
  const price = usd == null ? "" : usd < 0.00001 ? " · under $0.00001" : ` · $${Number(usd.toPrecision(2))}`;
  return `${k(c.in)} in · ${k(c.out)} out${c.cached ? ` · ${k(c.cached)} reused` : ""}${price}`;
}
function usedChips(t){
  const u = t.used || (t.noted?.length || t.cost?.in ? {} : null); if (!u) return null;
  const box = el("div","pj-used");
  const f = u.file;
  /* A file not opened for this message shows no chip. */
  if (f && (f.whole || f.map || f.rows?.length || f.sections?.length)){
    const what = f.rows?.length ? `: ${rowsLine(f.rows)}`
      : f.sections?.length ? `: ${f.sections.slice(0, 2).map(s => s.title).join(" · ")}${f.sections.length > 2 ? ` +${f.sections.length - 2}` : ""}`
      : f.map ? ": its contents" : "";
    const b = el("button",null,`${f.name}${what}`); b.type = "button"; b.title = "Show it in the file";
    b.onclick = () => focusUsed(t, true);
    box.append(b);
  }
  /* How little of a long file was read, whether the long sections came as passages, and that memory led there. */
  if (f?.sections?.length && f.of > 4) box.append(el("span",null,`Read ${f.sections.length} of ${f.of} sections${f.passages ? " · passages" : ""}${f.via ? " · led by memory" : ""}`));
  for (const c of u.folders || []) box.append(el("span",null,`${c.name} folder · ${c.notes} note${c.notes === 1 ? "" : "s"}`));
  if (u.memory){
    const b = el("button",null,`Memory · ${u.memory} note${u.memory === 1 ? "" : "s"}`); b.type = "button"; b.title = "Show what the project remembers";
    b.onclick = openMemory; box.append(b);
  }
  if (Array.isArray(t.noted) && t.noted.length) box.append(el("span","noted",`Noted: ${t.noted.slice(0, 2).join(", ")}`));
  if (t.cost?.in){ const c = el("span","cost",costLine(t.cost)); c.title = `${t.cost.calls || 1} model call${t.cost.calls === 1 ? "" : "s"} for this message`; box.append(c); }
  return box.children.length ? box : null;
}

function turnEl(t){
  const w = el("div","pj-turn"); w.dataset.id = t.id || "";
  w.append(el("div","pj-q",t.q));
  const a = el("div","pj-a" + (t.proposal ? " prop" : ""));
  if (t.proposal) a.append(el("div","pj-k","Proposal"));
  if (t.lead){
    const lead = el("div","pj-lead"), line = el("div","pj-ld");
    line.innerHTML = mdView(t.lead);
    lead.append(el("span","pj-tl","TL;DR"), line); a.append(lead);
  }
  if (t.a){ const md = el("div","pj-md"); md.innerHTML = mdView(t.a); a.append(md); }
  if (t.edit) a.append(editCard(t));
  const chips = usedChips(t); if (chips) a.append(chips);
  /* Nothing to press to keep an answer: the project files its own notes. */
  const acts = el("div","pj-tact");
  const refine = el("button","ghost","Refine"); refine.type = "button";
  refine.onclick = () => { S.pj.input.value = "Refine: "; S.pj.size(); S.pj.input.focus(); };
  acts.append(refine);
  a.append(acts); w.append(a);
  return w;
}

async function sendProject(q){
  const pj = S.pj; if (!pj || pj.busy) return;
  pj.busy = true; pj.size();
  const hadFile = !!pj.data.file;
  const box = pj.thread;
  box.querySelector(".pj-hint")?.remove(); box.querySelector(".pj-try")?.remove();
  const w = el("div","pj-turn"); w.append(el("div","pj-q",q));
  const a = el("div","pj-a"); thinkInto(a, pj.data.file ? "Reading the file" : "Making it"); w.append(a);
  box.append(w); box.scrollTop = box.scrollHeight;
  try {
    const tags = tagsIn(q, tagChoices(false));
    const r = await api("/api/project/chat", { brain: pj.slug, q, ...(tags.length ? { tags } : {}) });
    if (S.pj !== pj) return;
    pj.data.turns = [...pj.data.turns, r.turn].slice(-4);
    if (r.turn.edit) pj.data.edits = [{ id: r.turn.edit.id, at: Date.now(), status: r.turn.edit.status || "open", preview: r.turn.edit.preview }, ...pj.data.edits].slice(0, 10);
    w.replaceWith(turnEl(r.turn));
    /* A change applied, or a file the first description just made: the file side follows. */
    if (r.turn.edit?.status === "applied" || (!hadFile && r.turn.edit)) { try { await refreshFile(); } catch { /* the page catches up at the next look */ } }
    if (r.turn.noted?.length) refreshMemory();
    focusUsed(r.turn, false);
  } catch (e){
    if (S.pj !== pj) return;
    a.innerHTML = "";
    const err = el("div","pj-err"); err.append(el("b",null,"That did not work"), el("span",null,e.message));
    const row = el("div","pj-tact");
    const again = el("button","ghost","Try again"); again.type = "button"; again.onclick = () => { w.remove(); pj.busy = false; sendProject(q); };
    row.append(again); err.append(row); a.append(err);
  } finally { pj.busy = false; pj.size(); box.scrollTop = box.scrollHeight; }
}

/* ---- keeping, remembering, forgetting ---- */

/** What the project remembers, read again after a message noted something. */
async function refreshMemory(){
  const pj = S.pj; if (!pj) return;
  try {
    const d = await api("/api/project/get", { brain: pj.slug });
    if (S.pj !== pj) return;
    pj.data.memory = d.memory; pj.data.shortcuts = d.shortcuts || []; paintMemb(); pj.memPaint?.();
    syncProjects();
  } catch { /* the list catches up the next time the project opens */ }
}

/** What the project remembers, listed as a folder lists its concepts: the newest first, a title, a line, a small meta. A tap opens the note, with a way to forget it. */
function openMemory(){
  const pj = S.pj; if (!pj?.data) return;
  document.querySelector(".veil.pm")?.remove();
  const veil = el("div","veil pm");
  veil.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pmTitle">
    <header><h3 id="pmTitle">Memory</h3><p id="pmSub"></p></header>
    <div class="pm-list" id="pmList"></div>
    <footer><button class="ghost" id="pmClose">Close</button></footer></div>`;
  document.body.append(veil);
  const list = veil.querySelector("#pmList"), sub = veil.querySelector("#pmSub");
  const onKey = e => { if (e.key === "Escape" && veil === [...document.querySelectorAll(".veil")].pop()) shut(); };
  const shut = () => { document.removeEventListener("keydown", onKey); pj.memPaint = null; veil.remove(); };
  document.addEventListener("keydown", onKey);
  veil.querySelector("#pmClose").onclick = shut;
  veil.onclick = e => { if (e.target === veil) shut(); };
  const named = new Map((pj.data.cards || []).map(c => [c.sid, c.title]));
  /* Where a note rests in the file, and whether the file changed there since. */
  const metaOf = m => {
    const rests = (m.sections || []).map(sid => named.get(sid)).filter(Boolean);
    return [m.title === "The file" ? "From the file" : "", rests.length ? `In ${rests.slice(0, 2).join(", ")}${rests.length > 2 ? ` +${rests.length - 2}` : ""}` : "",
      m.stale ? "The file changed since" : "", fileDay(m.updated, true)].filter(Boolean).join(" · ");
  };
  let note = null;
  const paint = () => {
    note = null; list.innerHTML = "";
    const mem = pj.data.memory.slice().sort((x, y) => String(y.updated || "").localeCompare(String(x.updated || "")) || x.title.localeCompare(y.title));
    const ways = pj.data.shortcuts || [];
    sub.textContent = mem.length ? `${mem.length} note${mem.length === 1 ? "" : "s"}, the newest first.` : "";
    if (!mem.length && !ways.length){ list.append(el("div","fv-none","Nothing kept yet. The project files its notes by itself: what the file holds, what you decide, what its answers find.")); return; }
    for (const m of mem){
      const r = el("button","fv-row"); r.type = "button";
      r.append(el("b",null,m.title));
      if (m.summaryLine || m.position) r.append(el("span",null,m.summaryLine || m.position));
      r.append(el("small",null,metaOf(m)));
      r.onclick = () => open(m);
      list.append(r);
    }
    if (ways.length){
      /* Where things are: learned from the questions, free, and a pointer only: an answer is always written from the sections as they are. */
      list.append(el("div","fv-eye","Where things are"), el("div","fv-none","Learned from your questions, so the chat opens these sections first."));
      for (const w of ways.slice().sort((a, b) => b.at - a.at)){
        const where = w.s.map(sid => named.get(sid)).filter(Boolean);
        const r = el("div","fv-row st");
        r.append(el("b",null, w.q ? `“${w.q}”` : w.t.slice(0, 4).join(" · ")), el("span",null,`${where.slice(0, 3).join(", ")}${where.length > 3 ? ` and ${where.length - 3} more` : ""}`),
          el("small",null,`Used ${w.n} time${w.n === 1 ? "" : "s"}`));
        list.append(r);
      }
    }
    list.scrollTop = 0;
  };
  const open = m => {
    note = m; list.innerHTML = ""; sub.textContent = "";
    const box = el("div","pm-note");
    const back = el("button","pm-back","← All notes"); back.type = "button"; back.onclick = paint;
    box.append(back, el("div","pm-t",m.title), el("p","fv-pos",m.position || m.summaryLine || "No text."));
    const meta = metaOf(m); if (meta) box.append(el("small",null,meta));
    const x = el("button","pj-b bad","Forget this note"); x.type = "button";
    x.onclick = async () => {
      x.disabled = true;
      try { await api("/api/project/forget", { brain: pj.slug, slug: m.slug }); pj.data.memory = pj.data.memory.filter(y => y.slug !== m.slug); paintMemb(); syncProjects(); paint(); }
      catch (e){ x.disabled = false; box.append(el("div","pj-msg", e.message)); }
    };
    box.append(x); list.append(box); list.scrollTop = 0;
  };
  /* A message that just finished may have added notes: the list follows, unless a note is open. */
  pj.memPaint = () => { if (!note) paint(); };
  paint();
  (list.querySelector("button") || veil.querySelector("#pmClose")).focus();
  /* What it learned since the last answer is read again, so the list is current. */
  refreshMemory();
}

/* ---- changes to the file ---- */

function editCard(t){
  const pj = S.pj;
  const e = pj.data.edits.find(x => x.id === t.edit.id) || { id: t.edit.id, status: t.edit.status || "open", preview: t.edit.preview };
  const c = el("div","pj-edit " + e.status);
  c.append(el("div","pj-ek", { open: "Proposed change", applied: "Applied", undone: "Undone", dismissed: "Turned down" }[e.status] || e.status));
  for (const p of e.preview || []){
    const l = el("div","pj-ed"); l.append(el("b",null,p.label));
    if (p.before) l.append(el("del",null,p.before));
    if (p.after) l.append(el("ins",null,p.after));
    c.append(l);
  }
  const act = async (action, btns) => {
    btns.forEach(b => { b.disabled = true; });
    c.querySelector(".pj-msg")?.remove();
    try {
      await api("/api/project/edit", { brain: pj.slug, id: e.id, action });
      e.status = action === "apply" ? "applied" : action === "undo" ? "undone" : "dismissed";
      const known = pj.data.edits.find(x => x.id === e.id); if (known) known.status = e.status; else pj.data.edits.unshift(e);
      c.replaceWith(editCard(t));
      if (action !== "dismiss") await refreshFile();
    } catch (err){
      btns.forEach(b => { b.disabled = false; });
      c.append(el("div","pj-msg",err.message));
    }
  };
  if (e.status === "open"){
    const row = el("div","pj-tact"), yes = el("button","go","Apply"), no = el("button","ghost","Turn down");
    yes.type = no.type = "button";
    yes.onclick = () => act("apply", [yes, no]); no.onclick = () => act("dismiss", [yes, no]);
    row.append(yes, no); c.append(row);
  } else if (e.status === "applied"){
    const row = el("div","pj-tact"), undo = el("button","ghost","Undo"); undo.type = "button";
    undo.onclick = () => act("undo", [undo]);
    row.append(undo); c.append(row);
  }
  return c;
}
/** The file read again after a change, so the page shows what it holds now. */
async function refreshFile(){
  const pj = S.pj; if (!pj) return;
  const d = await api("/api/project/get", { brain: pj.slug });
  if (S.pj !== pj) return;
  pj.data.file = d.file; pj.data.cards = d.cards; pj.data.edits = d.edits;
  const old = pj.root?.querySelector(".pj-doc");
  if (old) old.replaceWith(docPane());
  const first = pj.root?.querySelector(".pj-seg")?.children[0];
  if (first) first.textContent = pjSeg(pj.data.file);
  if (pj.input) pj.input.placeholder = askHint(pj.data.file);
  syncProjects();
}

/* ---- the file's own actions ---- */

function renameProject(){
  const pj = S.pj;
  const veil = el("div","veil");
  veil.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="prTitle">

/** What each kind of file can be downloaded as: its key, its name, its extension. */
const DL_FORMATS = {
  doc: [["md","Markdown",".md"], ["pdf","PDF",".pdf"], ["html","Web page",".html"]],
  html: [["html","Web page",".html"], ["md","Markdown",".md"]],
  table: [["xlsx","Excel",".xlsx"], ["csv","CSV",".csv"], ["md","Markdown",".md"]],
};
let dlMenu = null;
function closeDownload(){
  if (!dlMenu) return;
  const m = dlMenu; dlMenu = null;
  document.removeEventListener("pointerdown", m.down, true); document.removeEventListener("keydown", m.key, true);
  window.removeEventListener("resize", m.shut); window.removeEventListener("scroll", m.shut, true);
  m.anchor.setAttribute("aria-expanded", "false"); m.menu.remove();
}
/** The formats as a small menu under the Download button. A second press, an outside press or Escape puts it away. */
function openDownload(anchor){
  const f = S.pj?.data?.file; if (!f) return;
  const same = dlMenu?.anchor === anchor; closeDownload(); if (same) return;
  const kind = f.kind === "table" ? "table" : f.kind === "html" ? "html" : "doc";
  const menu = el("div","pj-menu"); menu.setAttribute("role","menu"); menu.setAttribute("aria-label","Download as");
  for (const [k, name, ext] of DL_FORMATS[kind]){
    const b = el("button"); b.type = "button"; b.dataset.fmt = k; b.setAttribute("role","menuitem");
    b.append(el("b",null,name), el("span",null,ext));
    b.onclick = () => { closeDownload(); downloadAs(k); };
    menu.append(b);
  }
  if (kind === "table" && f.sheets.length > 1) menu.append(el("p",null,`Excel keeps all ${f.sheets.length} sheets. CSV and Markdown take the open one.`));
  document.body.append(menu);
  const r = anchor.getBoundingClientRect(), w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.round(Math.max(8, Math.min(r.right - w, innerWidth - w - 8))) + "px";
  menu.style.top = Math.round(r.bottom + 6 + h <= innerHeight - 8 || r.top - 6 - h < 8 ? r.bottom + 6 : r.top - 6 - h) + "px";
  const shut = () => closeDownload();
  const down = e => { if (!menu.contains(e.target) && !anchor.contains(e.target)) shut(); };
  const key = e => {
    if (e.key === "Escape"){ e.preventDefault(); shut(); anchor.focus(); }
    else if (e.key === "Tab") shut();
    else if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      const items = [...menu.querySelectorAll("button")], n = items.length, at = items.indexOf(document.activeElement);
      items[e.key === "ArrowDown" ? (at + 1) % n : at <= 0 ? n - 1 : at - 1].focus();
    }
  };
  dlMenu = { menu, anchor, down, key, shut };
  document.addEventListener("pointerdown", down, true); document.addEventListener("keydown", key, true);
  window.addEventListener("resize", shut); window.addEventListener("scroll", shut, true);
  anchor.setAttribute("aria-expanded", "true");
  menu.querySelector("button").focus();
}

/** A blob handed to the browser as a file with a name. */
function saveBlob(blob, name){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/** Rows of a table as a Markdown table: the first row heads it, a bar inside a cell is written \| and a line break is a space. */
function tableMarkdown(rows){
  const w = rows.reduce((m, r) => Math.max(m, r.length), 0);
  if (!w) return "";
  const cell = c => String(c ?? "").replace(/\s*\n\s*/g, " ").replace(/\|/g, "\\|").trim();
  const line = r => `| ${Array.from({ length: w }, (_, i) => cell(r[i])).join(" | ")} |`;
  return [line(rows[0]), `| ${Array(w).fill("---").join(" | ")} |`, ...rows.slice(1).map(line)].join("\n") + "\n";
}

/** The sheets of a table as one Excel workbook: a number stays a number, so a column can be summed; a code with a leading zero stays text. */
function xlsxBlob(sheets){
  const X = window.XLSX, wb = X.utils.book_new(), used = new Set();
  const typed = v => /^-?(0|[1-9]\d{0,14})(\.\d+)?$/.test(v) ? Number(v) : v;
  sheets.forEach((sh, i) => {
    /* Excel allows 31 letters, no brackets, colons, stars, question marks or slashes, and no two sheets of one name. */
    let base = String(sh.name || "").replace(/[\[\]:*?\/\\]/g, " ").trim().slice(0, 31);
    if (!base || /^(__proto__|constructor|prototype)$/i.test(base)) base = `Sheet ${i + 1}`;
    let name = base, k = 1;
    while (used.has(name.toLowerCase())) name = `${base.slice(0, 28)} ${++k}`;
    used.add(name.toLowerCase());
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(sh.rows.map((r, j) => j ? r.map(typed) : r)), name);
  });
  return new Blob([X.write(wb, { type: "array", bookType: "xlsx" })], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

/** The file in the format asked: what is said here is written here, in this tab. The server only gives the words, or the rows. */
async function downloadAs(fmt){
  const pj = S.pj, f = pj.data.file, table = f.kind === "table";
  try {
    if (fmt === "xlsx"){
      await loadXlsx();
      const sheets = [];
      for (let i = 0; i < f.sheets.length; i++){
        const r = await api("/api/project/download", { brain: pj.slug, sheet: i });
        sheets.push({ name: r.sheet || f.sheets[i].name, rows: parseDelimited(r.text, ",") });
      }
      saveBlob(xlsxBlob(sheets), `${String(f.name).replace(/\.[^.]+$/, "")}.xlsx`);
      return;
    }
    const r = await api("/api/project/download", { brain: pj.slug, sheet: table ? pj.sheet : 0 });
    const base = String(r.name).replace(/\.[^.]+$/, ""), part = table && f.sheets.length > 1 ? ` - ${r.sheet}` : "";
    const save = (text, type, name) => saveBlob(new Blob([text], { type: `${type};charset=utf-8` }), name);
    if (fmt === "csv") save(r.text, "text/csv", `${base}${part}.csv`);
    else if (fmt === "html"){
      /* A page is its own code. A document becomes one. */
      if (r.kind === "html") save(r.text, "text/html", /\.(html?|xhtml)$/i.test(r.name) ? r.name : `${base}.html`);
      else save(htmlDocument(mdView(r.text, 1), base), "text/html", `${base}.html`);
    } else if (fmt === "pdf"){
      if (r.text.length > 4000000) throw new Error("This document is too long for a PDF. Download it as Markdown or a web page.");
      /* Let the menu go before the page is busy. */
      await new Promise(ok => setTimeout(ok, 20));
      const pdf = pdfFromMarkdown(r.text, base);
      if (!pdf) throw new Error("This document uses letters a PDF cannot print here. Download it as Markdown or a web page.");
      saveBlob(new Blob([pdf], { type: "application/pdf" }), `${base}.pdf`);
    } else {
      const md = r.kind === "table" ? tableMarkdown(parseDelimited(r.text, ",")) : r.kind === "html" ? htmlToMd(r.text) : r.text;
      if (!md.trim()) throw new Error("There is nothing here to write as Markdown.");
      save(md, "text/markdown", r.kind === "doc" && /\.(md|markdown|txt)$/i.test(r.name) ? r.name : `${base}${part}.md`);
    }
  } catch (e){ pjNote(e.message); }
}

/**
 * A document's Markdown as a PDF, written here: A4, Helvetica and Courier,
 * headings, paragraphs with bold and italic, lists, quotes, code, tables whose
 * header repeats on each page, and the page number. The fonts are the ones every
 * PDF reader holds, so nothing is embedded and the file stays small. They write
 * Western European text; a document that is mostly in another script, Chinese,
 * Arabic or Cyrillic for one, comes back as null, since a PDF here would print question marks.
 */
function pdfFromMarkdown(md, title){
  /* Widths of Helvetica and Helvetica-Bold for the characters 32 to 126, in thousandths of the size. */
  const WR = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,
    667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,
    556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
  const WB = [278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,
    722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,
    556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
  /* What Windows-1252 holds beyond Latin-1, and a few signs written with letters when the font lacks them. */
  const WIN = [[0x20AC,0x80],[0x201A,0x82],[0x0192,0x83],[0x201E,0x84],[0x2026,0x85],[0x2020,0x86],[0x2021,0x87],[0x02C6,0x88],[0x2030,0x89],[0x0160,0x8A],[0x2039,0x8B],
    [0x0152,0x8C],[0x017D,0x8E],[0x2018,0x91],[0x2019,0x92],[0x201C,0x93],[0x201D,0x94],[0x2022,0x95],[0x2013,0x96],[0x2014,0x97],[0x02DC,0x98],[0x2122,0x99],
    [0x0161,0x9A],[0x203A,0x9B],[0x0153,0x9C],[0x017E,0x9E],[0x0178,0x9F]];
  const SPEC = { 0x80: 556, 0x85: 1000, 0x91: 222, 0x92: 222, 0x93: 333, 0x94: 333, 0x95: 350, 0x96: 556, 0x97: 1000, 0x99: 1000, 0xA9: 737, 0xAE: 737, 0xB0: 400, 0xB1: 584, 0xB7: 278, 0xD7: 584, 0xF7: 584 };
  const WORDS = { "→": "->", "←": "<-", "↔": "<->", "≥": ">=", "≤": "<=", "≠": "!=", "≈": "~", "−": "-", "‑": "-", "‒": "-", "✓": "v", "✔": "v", "●": "•", "◦": "-", "⁃": "-" };
  const win = new Map(WIN);
  let lost = 0, total = 0;
  /* One text as the bytes of the font: Latin-1 as it is, the rest by the table, a question mark where nothing fits. */
  const bytes = t => {
    let s = "";
    for (const ch of String(t).normalize("NFC")){
      let c = ch.codePointAt(0);
      if (c === 0xA0 || c === 0x202F) c = 32;
      if (c === 0xAD || (c >= 0x200B && c <= 0x200F) || c === 0xFEFF || (c < 32 && c !== 10 && c !== 9)) continue;
      if (c === 9) { s += "    "; continue; }
      if (WORDS[ch] && !win.has(c)) { s += WORDS[ch]; continue; }
      total++;
      if ((c >= 32 && c < 127) || (c >= 0xA0 && c <= 0xFF) || c === 10) s += String.fromCharCode(c);
      else if (win.has(c)) s += String.fromCharCode(win.get(c));
      else { s += "?"; lost++; }
    }
    return s;
  };
  const wch = (c, bold) => {
    if (c >= 32 && c < 127) return (bold ? WB : WR)[c - 32];
    if (SPEC[c]) return SPEC[c];
    const b = String.fromCharCode(c).normalize("NFD").charCodeAt(0);
    return b >= 32 && b < 127 ? (bold ? WB : WR)[b - 32] : 556;
  };
  const FONTS = { R: ["Helvetica", false], B: ["Helvetica-Bold", true], I: ["Helvetica-Oblique", false], BI: ["Helvetica-BoldOblique", true], C: ["Courier", false] };
  const FKEY = ["R", "B", "I", "BI", "C"];
  const width = (s, f, sz) => { let w = 0; if (f === "C") return s.length * 0.6 * sz; const bold = FONTS[f][1]; for (let i = 0; i < s.length; i++) w += wch(s.charCodeAt(i), bold); return w * sz / 1000; };
  const esc = s => s.replace(/[\\()]/g, m => "\\" + m);
  const num = n => (Math.round(n * 100) / 100).toString();

  /* Inline Markdown as runs of one font each. */
  const inline = (s, f) => {
    const runs = [], push = (t, ff) => { if (t) runs.push({ t, f: ff }); };
    const re = /`([^`]+)`|(!?)\[([^\]]*)\]\(([^)\s]*)[^)]*\)|\*\*([^\s*](?:[^*]*[^\s*])?)\*\*|\*([^\s*](?:[^*]*[^\s*])?)\*|<br\s*\/?>|<\/?[a-zA-Z][^>]*>|\\([*_`\[\]()#>|\\-])/g;
    let last = 0, m;
    while ((m = re.exec(s))){
      push(s.slice(last, m.index), f); last = m.index + m[0].length;
      if (m[1] != null) push(m[1], "C");
      else if (m[3] != null){ push(m[3], f); if (!m[2] && m[4] && m[4] !== m[3]) push(` (${m[4]})`, f); }
      else if (m[5] != null) runs.push(...inline(m[5], f === "I" || f === "BI" ? "BI" : "B"));
      else if (m[6] != null) runs.push(...inline(m[6], f === "B" || f === "BI" ? "BI" : "I"));
      else if (/^<br/i.test(m[0])) push("\n", f);
      else if (m[7] != null) push(m[7], f);
    }
    push(s.slice(last), f);
    return runs;
  };
  /* Words with their font, ready to wrap; `sp` says whitespace follows the word. */
  const wordsOf = (runs, sz) => {
    const out = [];
    for (const r of runs){
      for (const p of bytes(r.t).split(/(\n|\s+)/)){
        if (!p) continue;
        if (p === "\n") out.push({ br: true });
        else if (/^\s+$/.test(p)) { if (out.length && !out[out.length - 1].br) out[out.length - 1].sp = true; }
        else out.push({ t: p, f: r.f, w: width(p, r.f, sz), sp: false });
      }
    }
    return out;
  };
  /* Words as lines no wider than `max`; each word knows the space before it. A word wider than a line is cut where it overflows. */
  const wrap = (words, max, sz) => {
    const lines = []; let cur = [], x = 0;
    const flush = () => { lines.push(cur); cur = []; x = 0; };
    for (const w of words){
      if (w.br){ flush(); continue; }
      const prev = cur[cur.length - 1];
      const gap = prev && prev.sp ? width(" ", prev.f, sz) : 0;
      if (w.w > max){
        if (cur.length) flush();
        let rest = w.t;
        while (rest){
          let n = rest.length;
          while (n > 1 && width(rest.slice(0, n), w.f, sz) > max) n--;
          const piece = rest.slice(0, n); rest = rest.slice(n);
          cur.push({ t: piece, f: w.f, w: width(piece, w.f, sz), sp: !rest && w.sp, lead: 0 }); x = width(piece, w.f, sz);
          if (rest) flush();
        }
        continue;
      }
      if (cur.length && x + gap + w.w > max) flush();
      const lead = cur.length ? (cur[cur.length - 1].sp ? width(" ", cur[cur.length - 1].f, sz) : 0) : 0;
      cur.push({ ...w, lead }); x += lead + w.w;
    }
    if (cur.length || !lines.length) flush();
    return lines;
  };

  /* ---- the page ---- */
  const PW = 595.28, PH = 841.89, ML = 56, MR = 56, MT = 60, MB = 62, TW = PW - ML - MR;
  const pages = []; let page = null, y = 0;
  const newPage = () => { page = []; pages.push(page); y = PH - MT; };
  const room = h => y - h >= MB;
  const color = (r, g, b) => `${num(r)} ${num(g)} ${num(b)} rg`;
  /* A line of words (their fonts named by resource) with its top at `top`, from x, or ending at x when it aligns right. */
  const drawLine = (line, x, top, sz, lead, rgb = [0.1, 0.1, 0.12], align) => {
    const base = top - lead * 0.76;
    let cx = align === "right" ? x - line.reduce((n, w) => n + w.lead + w.w, 0) : x, run = null;
    const out = () => { if (run) page.push(`BT /${run.f} ${num(sz)} Tf ${color(...rgb)} 1 0 0 1 ${num(run.x)} ${num(base)} Tm (${esc(run.t)}) Tj ET`); run = null; };
    for (const w of line){
      cx += w.lead;
      if (run && run.f !== w.f) out();
      if (!run) run = { f: w.f, x: cx, t: "" };
      else if (w.lead) run.t += " ";
      run.t += w.t; cx += w.w;
    }
    out();
  };
  const FONTCODE = { R: "F1", B: "F2", I: "F3", BI: "F4", C: "F5" };
  const rect = (x, top, w, h, g) => page.push(`${num(g)} g ${num(x)} ${num(top - h)} ${num(w)} ${num(h)} re f`);
  const stroke = (x1, y1, x2, y2, g = 0.8, lw = 0.6) => page.push(`${num(g)} G ${num(lw)} w ${num(x1)} ${num(y1)} m ${num(x2)} ${num(y2)} l S`);

  /* Lines of words as text blocks: fonts are named by their resource code. */
  const emit = (line, x, top, sz, lead, rgb, align) => {
    const mapped = line.map(w => ({ ...w, f: FONTCODE[w.f] }));
    drawLine(mapped, x, top, sz, lead, rgb, align);
  };
  const para = (runs, o) => {
    const { x = ML, w = TW, sz = 10.5, lead = 15.5, rgb, after = 6, hang = 0, mark = null } = o || {};
    const lines = wrap(wordsOf(runs, sz), w - hang, sz);
    lines.forEach((ln, i) => {
      if (!room(lead)) newPage();
      if (i === 0 && mark) emit([{ t: bytes(mark.t), f: "R", w: 0, lead: 0 }], x, y, sz, lead, rgb);
      emit(ln, x + hang, y, sz, lead, rgb);
      y -= lead;
    });
    y -= after;
  };

  /* ---- Markdown as blocks ---- */
  const src = String(md ?? "").replace(/\r\n?/g, "\n").split("\n");
  const blocks = [];
  const cellsOf = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  const isSep = r => /^\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?$/.test(r.trim());
  const itemRe = /^(\s*)([-*+•]|\d+[.)])\s+(.*)$/;
  for (let i = 0; i < src.length;){
    const ln = src[i], t = ln.trim();
    if (!t){ i++; continue; }
    let m;
    if ((m = /^(```|~~~)/.exec(t))){
      const body = []; i++;
      while (i < src.length && !/^(```|~~~)/.test(src[i].trim())) body.push(src[i++]);
      i++; blocks.push({ k: "code", lines: body }); continue;
    }
    if (/^\[\[p\. \d+\]\]$/.test(t)){ i++; continue; }
    if ((m = /^(#{1,6})\s+(.*?)\s*#*$/.exec(t))){ blocks.push({ k: "h", n: m[1].length, s: m[2] }); i++; continue; }
    if (/^([-*_])(\s*\1){2,}$/.test(t)){ blocks.push({ k: "hr" }); i++; continue; }
    if (/^>/.test(t)){ const q = []; while (i < src.length && /^\s*>/.test(src[i])) q.push(src[i++].trim().replace(/^>\s?/, "")); blocks.push({ k: "quote", s: q.join(" ") }); continue; }
    if (/^\|.*\|$/.test(t)){
      const rows = []; while (i < src.length && /^\s*\|.*\|\s*$/.test(src[i])) rows.push(src[i++]);
      const sep = rows.findIndex(isSep);
      const body = rows.filter((r, j) => j !== sep).map(cellsOf);
      blocks.push({ k: "table", head: sep > 0 ? body.slice(0, sep) : [], rows: sep > 0 ? body.slice(sep) : body }); continue;
    }
    if (itemRe.test(ln)){
      const items = [];
      while (i < src.length && src[i].trim()){
        const li = itemRe.exec(src[i]);
        if (li) items.push({ lvl: Math.min(3, Math.floor(li[1].replace(/\t/g, "    ").length / 2)), num: /\d/.test(li[2]) ? parseInt(li[2], 10) : 0, s: li[3] });
        else if (/^\s+\S/.test(src[i]) && items.length) items[items.length - 1].s += " " + src[i].trim();
        else break;
        i++;
      }
      blocks.push({ k: "list", items }); continue;
    }
    /* A paragraph: the lines of a PDF or a text file break where the page ended, so a long line that stops no sentence reads on. */
    const lines = [];
    while (i < src.length && src[i].trim() && !/^(```|~~~|#{1,6}\s|>|\|.*\|$)/.test(src[i].trim()) && !itemRe.test(src[i]) && !/^([-*_])(\s*\1){2,}$/.test(src[i].trim())) lines.push(src[i++].trim());
    blocks.push({ k: "p", lines });
  }

  /* ---- laying the blocks out ---- */
  newPage();
  const H = { 1: [19, 24, 14], 2: [14.5, 19, 11], 3: [12, 16, 9], 4: [10.5, 15, 7], 5: [10.5, 15, 7], 6: [10.5, 15, 7] };
  let first = true;
  for (const b of blocks){
    if (b.k === "h"){
      const [sz, lead, before] = H[b.n];
      if (!first && y < PH - MT - 1) y -= before;
      if (!room(lead * 2 + 14)) newPage();
      para(inline(b.s, "B"), { sz, lead, after: 5, rgb: [0.07, 0.07, 0.09] });
    } else if (b.k === "p"){
      let s = "";
      b.lines.forEach((l, j) => { const p = b.lines[j - 1]; s += j ? (p.length >= 50 && !/[.!?:;]["')\]]?$/.test(p) ? " " : "\n") + l : l; });
      para(inline(s, "R"), {});
    } else if (b.k === "list"){
      const counters = [];
      for (const it of b.items){
        counters.length = it.lvl + 1;
        const n = it.num ? (counters[it.lvl] = it.num) : 0;
        if (it.num) counters[it.lvl] = it.num + 1; else counters[it.lvl] = 0;
        const x = ML + it.lvl * 16;
        para(inline(it.s, "R"), { x, w: TW - it.lvl * 16, hang: 15, after: 2.5, mark: { t: it.num ? `${n}.` : it.lvl ? "-" : "•" } });
      }
      y -= 4;
    } else if (b.k === "quote"){
      const top = y;
      para(inline(b.s, "I"), { x: ML + 14, w: TW - 14, rgb: [0.33, 0.33, 0.36], after: 0 });
      stroke(ML + 4, top - 1, ML + 4, y + 3, 0.72, 2);
      y -= 8;
    } else if (b.k === "code"){
      const sz = 8.8, lead = 12, per = Math.max(20, Math.floor((TW - 16) / (0.6 * sz)));
      const rows = [];
      for (const l of b.lines){ const t = bytes(l.replace(/\t/g, "    ")); if (!t) rows.push(""); for (let k = 0; k < t.length; k += per) rows.push(t.slice(k, k + per)); }
      let i = 0;
      while (i < rows.length){
        if (!room(lead + 8)) newPage();
        const fit = Math.max(1, Math.min(rows.length - i, Math.floor((y - MB - 8) / lead)));
        rect(ML, y, TW, fit * lead + 8, 0.955);
        for (let k = 0; k < fit; k++){ if (rows[i + k]) page.push(`BT /F5 ${num(sz)} Tf 0.15 0.15 0.18 rg 1 0 0 1 ${num(ML + 8)} ${num(y - 4 - lead * (k + 0.76))} Tm (${esc(rows[i + k])}) Tj ET`); }
        y -= fit * lead + 8; i += fit;
      }
      y -= 8;
    } else if (b.k === "hr"){
      if (!room(20)) newPage();
      y -= 8; stroke(ML, y, PW - MR, y, 0.78, 0.8); y -= 10;
    } else if (b.k === "table"){
      const sz = 9, lead = 12.5, padX = 5, padY = 4;
      y -= 4;
      const all = [...b.head, ...b.rows];
      const cols = Math.max(1, ...all.map(r => r.length));
      const cellWords = r => Array.from({ length: cols }, (_, c) => wordsOf(inline(r[c] ?? "", b.head.includes(r) ? "B" : "R"), sz));
      const prep = all.map(cellWords);
      const natural = Array.from({ length: cols }, (_, c) => Math.max(20, ...prep.map(r => r[c].reduce((n, w) => n + (w.w || 0) + (w.sp ? width(" ", "R", sz) : 0), 0))) + 2 * padX);
      const least = Array.from({ length: cols }, (_, c) => Math.min(natural[c], Math.max(34, ...prep.map(r => Math.max(0, ...r[c].map(w => w.w || 0))) + 2 * padX)));
      let colw = natural.slice();
      const sum = a => a.reduce((n, x) => n + x, 0);
      if (sum(natural) > TW){
        const spare = TW - sum(least), want = sum(natural) - sum(least);
        colw = least.map((l, c) => l + (want > 0 ? (natural[c] - l) * Math.max(0, spare) / want : 0));
        const over = sum(colw) - TW; if (over > 0) colw = colw.map(w => w * TW / sum(colw));
      } else colw = natural.map(w => w + (TW - sum(natural)) / cols);
      const drawRow = (cells, head) => {
        const wrapped = cells.map((c, j) => wrap(c, colw[j] - 2 * padX, sz));
        const h = Math.max(...wrapped.map(l => l.length)) * lead + 2 * padY;
        if (!room(h)) { newPage(); if (!head && b.head.length) drawRow(prep[0], true); }
        if (head) rect(ML, y, TW, h, 0.93);
        let x = ML;
        wrapped.forEach((lines, j) => {
          lines.forEach((ln, k) => emit(ln, x + padX, y - padY - k * lead, sz, lead, [0.1, 0.1, 0.12]));
          page.push(`0.8 G 0.5 w ${num(x)} ${num(y - h)} ${num(colw[j])} ${num(h)} re S`);
          x += colw[j];
        });
        y -= h;
      };
      b.head.forEach((_, r) => drawRow(prep[r], true));
      b.rows.forEach((_, r) => drawRow(prep[b.head.length + r], false));
      y -= 10;
    }
    first = false;
  }
  if (total && lost > Math.max(4, total * 0.02)) return null;

  /* ---- the file ---- */
  let out = "%PDF-1.4\n%\xE2\xE3\xCF\xD3\n";
  const off = [];
  const put = (id, body) => { off[id] = out.length; out += `${id} 0 obj\n${body}\nendobj\n`; };
  const n = pages.length, first0 = 9;
  put(1, "<< /Type /Catalog /Pages 2 0 R >>");
  put(2, `<< /Type /Pages /Kids [${pages.map((_, i) => `${first0 + i * 2} 0 R`).join(" ")}] /Count ${n} >>`);
  FKEY.forEach((k, i) => put(3 + i, `<< /Type /Font /Subtype /Type1 /BaseFont /${FONTS[k][0]} /Encoding /WinAnsiEncoding >>`));
  const name = esc(String(title ?? "Document").replace(/[^\x20-\x7e]/g, "").slice(0, 120));
  put(8, `<< /Title (${name}) /Producer (Octopus) >>`);
  const foot = bytes(String(title ?? "")).slice(0, 70);
  pages.forEach((ops, i) => {
    /* The footer: the name of the file at the left, the page at the right. */
    page = ops;
    const left = [{ t: foot, f: "F1", w: width(foot, "R", 8), lead: 0 }], right = [{ t: `${i + 1} / ${n}`, f: "F1", w: width(`${i + 1} / ${n}`, "R", 8), lead: 0 }];
    drawLine(left, ML, MB - 22, 8, 10, [0.5, 0.5, 0.54]);
    drawLine(right, PW - MR, MB - 22, 8, 10, [0.5, 0.5, 0.54], "right");
    const content = ops.join("\n");
    put(first0 + i * 2, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${num(PW)} ${num(PH)}] /Resources << /Font << ${FKEY.map((k, j) => `/F${j + 1} ${3 + j} 0 R`).join(" ")} >> >> /Contents ${first0 + i * 2 + 1} 0 R >>`);
    put(first0 + i * 2 + 1, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  });
  const size = first0 + n * 2, xref = out.length;
  out += `xref\n0 ${size}\n0000000000 65535 f \n`;
  for (let id = 1; id < size; id++) out += `${String(off[id]).padStart(10, "0")} 00000 n \n`;
  out += `trailer\n<< /Size ${size} /Root 1 0 R /Info 8 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  const bin = new Uint8Array(out.length);
  for (let i = 0; i < out.length; i++) bin[i] = out.charCodeAt(i) & 255;
  return bin;
}

/** A line at the top of the file, for what did not work. It goes by itself. */
function pjNote(text){
  const pj = S.pj; if (!pj?.body) return;
  const n = el("div","pj-msg",text); n.style.cssText = "padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)";
  pj.body.prepend(n); setTimeout(() => n.remove(), 7000);
