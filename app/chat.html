/**
 * Which space this is, said once and shown everywhere.
 *
 * The attribute on <html> carries the tint, so one line retints every button and
 * rule in the app. The name and the mark follow it. A mark with no file yet
 * leaves the Octopus one in place rather than a gap.
 */
/* ============ a workspace's own look ============ */
/**
 * A logo and two colours, set in Setup. The accent paints what the brand
 * colour paints; its text and button shades are derived from it, darkened
 * toward the night navy until they read at 4.5:1. The page colour is kept
 * light, so every text colour on it still reads.
 */
const LOOK_VARS = ["--bg", "--surface-2", "--surface-3", "--line", "--line-2", "--accent", "--accent-fill", "--accent-solid",
  "--accent-on", "--accent-soft", "--accent-line", "--mark"];
const NAVY = [5, 11, 22], WHITE = [255, 255, 255];
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgbHex = c => "#" + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
const cssRgb = t => { const m = String(t).match(/\d+(\.\d+)?/g); return m && m.length >= 3 ? m.slice(0, 3).map(Number) : null; };
const toRgb = t => /^\s*#[0-9a-f]{6}\s*$/i.test(t) ? hexRgb(t.trim()) : cssRgb(t);
const luma = c => { const [r, g, b] = c.map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; };
const ratio = (a, b) => { const x = luma(a), y = luma(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const mixRgb = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
function darkenTo(c, on, want){ let x = c; for (let t = .04; t <= 1 && ratio(x, on) < want; t += .04) x = mixRgb(c, NAVY, t); return x; }
function lightenTo(c, min){ let x = c; for (let t = .02; t <= 1 && luma(x) < min; t += .02) x = mixRgb(c, WHITE, t); return x; }

/** The CSS variables a look sets, measured against the page it lands on. */
function lookVars(look){
  const v = {};
  if (!look) return v;
  const page = look.bg ? lightenTo(hexRgb(look.bg), .78)
    : toRgb(getComputedStyle(document.documentElement).getPropertyValue("--bg")) || [245, 245, 245];
  const side = mixRgb(page, NAVY, .06);
  if (look.bg) Object.assign(v, { "--bg": rgbHex(page), "--surface-2": rgbHex(side), "--surface-3": rgbHex(mixRgb(page, NAVY, .11)),
    "--line": rgbHex(mixRgb(page, NAVY, .09)), "--line-2": rgbHex(mixRgb(page, NAVY, .19)) });
  if (look.accent) {
    const a = hexRgb(look.accent);
    Object.assign(v, { "--accent-fill": rgbHex(a), "--accent-solid": rgbHex(darkenTo(a, WHITE, 4.5)), "--accent-on": "#ffffff",
      "--accent": rgbHex(darkenTo(a, side, 4.5)), "--accent-soft": `rgba(${a.join(",")},.12)`, "--accent-line": `rgba(${a.join(",")},.40)` });
  }
  if (look.logo) v["--mark"] = `url("${look.logo}")`;
  return v;
}

/**
 * Wear a look, or the workspace's default with none. A preview is not kept;
 * a saved look is remembered in this browser, so the next visit paints in it.
 */
function applyLook(look, opts = {}){
  const root = document.documentElement;
  for (const k of LOOK_VARS) root.style.removeProperty(k);
  if (!opts.preview) S.brand = look || null;
  const vars = lookVars(look);
  for (const [k, val] of Object.entries(vars)) root.style.setProperty(k, val);
  root.dataset.logo = look?.logo ? "1" : "";
  S.logo = look?.logo || null;
  if (!opts.preview) {
    try { Object.keys(vars).length ? localStorage.setItem("octopus.look." + S.space, JSON.stringify(vars)) : localStorage.removeItem("octopus.look." + S.space); } catch {}
  }
  paintSpace();
  renderZero();
}

/** A picked file, drawn onto 128 pixels a side and kept as a PNG. */
async function toLogo(file){
  if (!file) throw new Error("No file was picked.");
  if (file.size > 5e6) throw new Error("That image is over 5 MB. Pick a smaller one.");
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("That file is not an image this browser can read.")); i.src = url; });
    const side = 128, c = document.createElement("canvas");
    c.width = c.height = side;
    const w0 = img.naturalWidth || side, h0 = img.naturalHeight || side, k = Math.min(side / w0, side / h0);
    c.getContext("2d").drawImage(img, (side - w0 * k) / 2, (side - h0 * k) / 2, w0 * k, h0 * k);
    const out = c.toDataURL("image/png");
    if (out.length > 200000) throw new Error("That logo holds too much detail to keep. Try a simpler one.");
    return out;
  } finally { URL.revokeObjectURL(url); }
}

/** The workspace's mark: its own logo, the octopus, the dog's head, or Tasu's folder. */
function markOf(){
  if (S.logo) return S.logo;

function paintSpace(){

/**
 * The brains, grouped and ranked.
 *
 * A person and a subject are different questions, so they sit apart. Inside a
 * group the fullest brain leads, counted by positions first and sources second,
 * because that is the one worth opening. Creation order said nothing about
 * which brain you want.
 */
const weight = b => conceptsOf(b.slug).length * 1000 + sourcesOf(b.slug).length;
function grouped(){
  const of = t => ordered().filter(b => b.type !== "personal" && (b.type === "person" ? "person" : "subject") === t);
  return [{ head: "People", rows: of("person") }, { head: "Subjects", rows: of("subject") }]
    .filter(g => g.rows.length);
}

/* Personal brains lead: they are yours, and the list's first stop. */
const ordered = () => [...S.brains].sort((x, y) => (y.type === "personal") - (x.type === "personal") || weight(y) - weight(x) || x.name.localeCompare(y.name));
const BRAIN_ICON = {
  personal: `<svg class="b-ic" viewBox="0 0 24 24" role="img" aria-label="Personal"><title>Personal</title><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>`,
  person: `<svg class="b-ic" viewBox="0 0 24 24" role="img" aria-label="Person"><title>Person</title><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.6 7-5.6s6.2 2 7 5.6"/></svg>`,
  subject: `<svg class="b-ic" viewBox="0 0 24 24" role="img" aria-label="Subject"><title>Subject</title><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/></svg>`,
};
const brainIcon = b => { const w = el("span","b-ico"); w.innerHTML = BRAIN_ICON[b.type === "person" || b.type === "personal" ? b.type : "subject"]; return w.firstChild; };
/* A personal brain: a chat that files what its owner says. Only its own chat reads it. */
function isPersonal(slug){ return S.brains.find(b => b.slug === slug)?.type === "personal"; }
/** A brain shared into this workspace to be read, never fed: the demo's view of one. */
function readOnly(b){ return !!b && (b.viewers || []).includes(S.space); }
/* Into a personal chat or out of one, the thread starts fresh: the two never share a chat. */
function crossing(to){ if ((S.chatId || chatBusy()) && isPersonal(to) !== isPersonal(S.scope)) newChat(); }
/**
 * The folders ticked to chat in. None asks them all, one reads as that
 * folder, and two or more travel as a list. A drop feeds the ones it may.
 */
function setPicks(list){
  const ok = new Set(S.brains.filter(b => b.type !== "personal").map(b => b.slug));
  S.picks = [...new Set(list)].filter(x => ok.has(x));
  S.scope = S.picks.length === 1 ? S.picks[0] : "all";
  S.into = S.picks.filter(x => !readOnly(S.brains.find(b => b.slug === x)));
}
/** The ticked folders by name: "Wealth and Charles Gave", or "4 folders" past three. */
function picksName(){
  const n = S.picks.map(x => S.brains.find(b => b.slug === x)?.name || x);
  return n.length > 3 ? `${n.length} folders` : n.length > 1 ? `${n.slice(0, -1).join(", ")} and ${n[n.length - 1]}` : n[0] || "";
}
const shared = () => S.brains.filter(b => b.type !== "personal");

/* Clicking a row ticks that folder to chat in, and several can be ticked: the
   question reads those alone. A second click unticks it. A personal folder is
   a chat of its own, so its row opens that chat. Open and edit sit on the row
   you point at. */
const TICK_SVG = `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 5 8.6l4.5-5"/></svg>`;
function brainRow(b){
  const self = b.type === "personal";
  const on = self ? S.scope === b.slug : S.picks.includes(b.slug);
  const home = b.space || "octopus", label = x => x.charAt(0).toUpperCase() + x.slice(1);
  const out = [...(b.shared || []), ...(b.viewers || [])].map(label), from = home !== S.space ? label(home) : "";
  const row = el("button","brain-row" + (on ? " on" : "") + (self ? " self" : "") + (out.length || from ? " shared" : ""));
  if (!self) row.setAttribute("aria-pressed", String(on));

  row.append(tick, el("span","nm",b.name));

  row.append(el("span","cnt", self ? "" : String(ideas)));

  if (h) row.append(healthRing(h, b));
  row.title = b.type === "personal" ? `Personal, alpha: it files what you say in its chat, dated. Only that chat reads it.\n${ideas} notes`
    : `${b.scope || "no scope line"}\n${ideas} concepts, ${read} sources` +
      (from ? `\nShared with this workspace from ${from}${readOnly(b) ? ". Read only here" : ""}` : out.length ? `\nShared with ${out.join(", ")}` : "");
  row.onclick = () => {
    if (S.concept) newChat();
    if (self){
      crossing(on ? "all" : b.slug);
      if (on) setPicks([]); else { S.picks = []; S.scope = b.slug; S.into = []; }
      /* A personal chat is one folder, so on a phone the drawer closes on it. */
      if (!on) closeSide();
    } else {
      crossing("all");
      setPicks(on ? S.picks.filter(x => x !== b.slug) : [...S.picks, b.slug]);
    }

    S.folder = null;

  /* One control on the row, so a click anywhere else ticks it. Its name and

/**
 * The menu behind a chat's one button: pin or unpin, rename, delete. Delete
 * asks once more in the menu itself, then goes.
 */
var chatMenu = null;
function closeChatMenu(){
  if (!chatMenu) return;
  chatMenu.anchor.setAttribute("aria-expanded","false");
  document.removeEventListener("pointerdown", chatMenu.outside, true);
  document.removeEventListener("keydown", chatMenu.key, true);
  chatMenu.box.remove(); chatMenu = null;

/** A menu under its button, kept on screen, closed by a click outside or Escape. */
function placeMenu(box, anchor){
  document.body.append(box);
  const r = anchor.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
  box.style.top = (r.bottom + 4 + h > innerHeight - 8 ? Math.max(8, r.top - h - 4) : r.bottom + 4) + "px";
  const outside = e => { if (!box.contains(e.target) && e.target !== anchor) closeChatMenu(); };
  const key = e => { if (e.key === "Escape"){ e.stopPropagation(); closeChatMenu(); anchor.focus(); } };

  chatMenu = { box, anchor, outside, key };
  box.querySelector(".cm-it").focus();
}
function openChatMenu(c, anchor){
  closeChatMenu();
  const box = el("div","chat-menu"); box.setAttribute("role","menu");
  const item = (label, cls, fn) => {
    const b = el("button","cm-it" + (cls ? " " + cls : ""), label);
    b.setAttribute("role","menuitem");
    b.onclick = e => { e.stopPropagation(); fn(b); };
    box.append(b); return b;
  };
  item(c.pinned ? "Unpin" : "Pin", "", async () => {
    closeChatMenu();
    try {
      const r = await api("/api/chats/edit", { id: c.id, pinned: !c.pinned });
      if (r.error) throw new Error(r.error);
      loadChats();
    } catch (e) { chatMsg(e.message); }
  });
  item("Rename", "", () => { closeChatMenu(); renameChat(c); });
  item("Delete", "del", async b => {
    if (!b.classList.contains("sure")){ b.classList.add("sure"); b.textContent = "Sure? Delete"; return; }
    closeChatMenu();
    try {
      const r = await api("/api/chats/edit", { id: c.id, remove: true });
      if (r.error) throw new Error(r.error);
      if (S.chatId === c.id) newChat();
      loadChats();
    } catch (e) { chatMsg(e.message); }
  });
  placeMenu(box, anchor);
}

function renderChats(){
  closeChatMenu();

/** A clean screen, and the next question starts a new chat. */
function newChat(){
  S.thread = []; S.chatId = null; S.mode = "ask"; S.folder = null; S.concept = null;
  /* A question still on its way in the chat left behind lands there, unread. */
  S.draft = "d" + (++draftSeq);
  $("thread").innerHTML = "";
  render(); renderChats();
}
var draftSeq = 0;

/** A saved chat back on screen, ready to continue on the brain it asked. */
async function openChat(id){
  closeSide();
  let c;
  try { c = (await api("/api/chats/get", { id })).chat; }
  catch (e) { chatMsg(e.message); loadChats(); return; }
  if (!c) return;
  S.chatId = c.id;
  const asked = String(c.brain || "").split(",").filter(x => S.brains.some(b => b.slug === x));
  if (asked.length === 1 && isPersonal(asked[0])){ S.picks = []; S.scope = asked[0]; S.into = []; }
  else setPicks(asked);
  S.mode = "ask"; S.folder = null;
  /* A chat about one concept reads that concept again. */
  S.concept = c.concept ? aboutOf(c.concept, c.title) : null;
  $("thread").innerHTML = "";
  for (const t of c.turns || []){
    /* An interview opens on its question: that turn has no message before it. */
    if (t.q) says(t.q);
    push("ai", body => showAnswer(body, t, t.q, t.concept ? t.concept.split("/")[0] : asked.join(",") || "all"));
  }
  S.thread = (c.turns || []).slice(-6).map(t => ({ q: t.q, a: String(t.a ?? "") }));
  /* A question still on its way here gets its waiting line back, and lands in it. */
  for (const j of S.jobs) if (j.status === "running" && j.key === c.id){ if (j.q) says(j.q); j.body = thinking(j.label); }
  render(); renderChats(); bottom();
}

/* ---- health ---- */
function healthTone(x){ return x >= 7 ? "h-hi" : x >= 4 ? "h-mid" : "h-lo"; }
function fmtScore(x){ return Number.isInteger(x) ? String(x) : x.toFixed(1); }
/** The ring on a brain row: it fills with the score, and opens the breakdown. */
function healthRing(h, b){
  const r = el("span","hring");
  const C = 2 * Math.PI * 9, fill = Math.max(0, Math.min(1, h.score / 10)) * C;
  r.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><circle class="tr" cx="12" cy="12" r="9"/>
    <circle class="ar ${healthTone(h.score)}" cx="12" cy="12" r="9" stroke-dasharray="${fill.toFixed(2)} ${C.toFixed(2)}"/>
    <text x="12" y="12.4">${fmtScore(h.score)}</text></svg>`;
  r.title = `Health ${fmtScore(h.score)}/10 against the best brain. ${h.best}`;
  r.setAttribute("role","button"); r.setAttribute("aria-label", `Health of ${b.name}: ${fmtScore(h.score)} out of 10`);
  r.onclick = e => { e.stopPropagation(); openHealthSheet(b); };
  return r;
}

/**
 * The four parts of a brain's score, each against the best brain on it, and
 * the move that closes the widest gap.
 */
function openHealthSheet(b){
  const h = S.health[b.slug]; if (!h) return;
  closeSide();
  const veil = el("div","veil");
  const NAMES = { variety: "Variety", depth: "Depth", fresh: "Freshness", conflicts: "Conflicts", tidy: "Tidiness" };
  const messy = !!h.parts.tidy && /to tidy/.test(h.parts.tidy.say);
  const lead = Object.values(S.health).find(x => x.top);
  const leadName = lead ? (S.brains.find(x => x.slug === lead.slug)?.name || lead.slug) : "";
  veil.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <header><h3>${esc(b.name)}: ${fmtScore(h.score)}/10</h3>
        <p>${h.top ? "The best brain here. Every other score is measured against it."
                   : `Measured against the best brain${leadName ? `, ${esc(leadName)},` : ""} which reads 10.`}</p></header>
      <div class="f" id="hbParts"></div>
      <div class="f"><div class="hb-best"><b>Best move</b>${esc(h.best)}</div></div>
      <footer>${h.open ? `<button class="ghost" id="hbSettle">Settle conflicts</button>` : ""}${messy && !S.demo ? `<button class="ghost" id="hbTidy">Tidy it</button>` : ""}<button class="ghost" id="hbOpen">Open the folder</button><button class="go" id="hbDone">Done</button></footer>
    </div>`;
  document.body.append(veil);
  const parts = veil.querySelector("#hbParts");
  for (const k of ["variety","depth","fresh","conflicts","tidy"]){
    const p = h.parts[k]; if (!p) continue;
    const row = el("div","hb-row");
    row.innerHTML = p.counted
      ? `<div class="hb-top">${NAMES[k]}<span>${p.pct}% of the best</span></div>
         <div class="hb-bar"><i class="${healthTone(p.pct / 10)}" style="width:${p.pct}%"></i></div>
         <div class="hb-say">${esc(p.say)}</div>`
      : `<div class="hb-top">${NAMES[k]}<span>not counted</span></div><div class="hb-say">${esc(p.say)}</div>`;
    parts.append(row);
  }
  const onKey = e => { if (e.key === "Escape" && veil === [...document.querySelectorAll(".veil")].pop()) shut(); };
  const shut = () => { document.removeEventListener("keydown", onKey); veil.remove(); };
  document.addEventListener("keydown", onKey);
  veil.querySelector("#hbDone").onclick = shut;
  veil.onclick = e => { if (e.target === veil) shut(); };
  veil.querySelector("#hbOpen").onclick = () => { shut(); openFolder(b); };
  const st = veil.querySelector("#hbSettle");
  if (st) st.onclick = () => { shut(); settleFrom(null, b.slug); };
  const td = veil.querySelector("#hbTidy");
  if (td) td.onclick = () => { shut(); runAudit(b); };
}

/**
 * The conflict deck, opened from a health sheet or the Decisions: this concept's
 * clashes first, or this brain's.
 */
async function settleFrom(id, brain){
  let r;
  try { r = await api("/api/conflicts", {}); } catch (e) { chatMsg(e.message); return; }
  const list = (r.conflicts || []).slice();
  const rank = c => (id && c.id === id) ? 2 : (brain && c.brain === brain) ? 1 : 0;
  list.sort((x, y) => rank(y) - rank(x));
  if (!list.length){ loadHealth(); return; }
  openConflictDeck(list, r.others || 0);
}

/**
 * Every folder, in three groups: this workspace's own, then the ones another
 * workspace lets you ask and drop into, then the ones you may only ask. A
 * group shows when it holds a folder, and the fullest folder leads each.
 */
function renderSide(){
  paintFolds();
  const box = $("brains"); box.innerHTML = "";
  $("bcount").textContent = S.brains.length || "";
  if (!S.brains.length){
    box.append(el("div","empty-side","None yet. A folder holds one subject or one person's view, with a one line scope."));
  } else {
    /* By type, then the fullest first: what you said, the people, the
       subjects. A folder shared in, or one only asked, says so on its row. */
    const kind = b => b.type === "personal" ? "personal" : b.type === "person" ? "person" : "subject";
    const bySize = (x, y) => conceptsOf(y.slug).length - conceptsOf(x.slug).length || x.name.localeCompare(y.name);
    const groups = [["personal","Personal"], ["person","People"], ["subject","Subjects"]]
      .map(([k, head]) => ({ head, rows: S.brains.filter(b => kind(b) === k).sort(bySize) }))
      .filter(g => g.rows.length);
    for (const g of groups){
      const h = el("div","group-h",g.head); h.dataset.n = g.rows.length;
      box.append(h);
      for (const b of g.rows) box.append(brainRow(b));
    }
  }
  /* On a phone, one button closes the drawer on the ticked folders. */
  const go = $("sideGo");
  go.hidden = !S.picks.length;
  /* It closes the drawer on the folders ticked: New chat, at the top, is the one way to start a chat. */
  go.textContent = S.picks.length ? `Done · ${S.picks.length === 1 ? picksName() : S.picks.length + " folders"} ticked` : "";
}

/**
 * Everything about one brain, in one place: what it is called, and the line
 * that decides what belongs inside.
 *
 * A new name moves the slug, and the slug is how concepts, source rows and
 * counted candidates find their brain. The server moves all three in one write
 * and reports the counts, which is what the receipt below shows.
 */
function openBrainSheet(b){
  closeSide();
  const veil = el("div","veil");
  veil.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <header><h3>${esc(b.name)}</h3>
      <p>The scope line is the only test of what belongs inside. Change it and the next drop is judged
        against the new line.</p></header>
      <div class="f"><label for="rName">Name</label><input id="rName" autocomplete="off"></div>
      <div class="f"><label for="rScope">Scope, in one line</label><textarea id="rScope"></textarea></div>
      <div class="f" id="rMergeF" style="border-top:1px solid var(--line); margin-top:14px; padding-top:14px">
        <label for="rInto">Merge into another folder</label>
        <div class="hint" style="margin:0 0 8px">Every concept, source and link moves there, and this folder goes. A concept with the same title joins its twin.</div>
        <div style="display:flex; gap:8px"><select id="rInto" class="pick" style="flex:1; min-width:0"></select><button class="ghost" id="rMerge" type="button">Merge</button></div></div>

      <footer><button class="ghost" id="rCancel">Cancel</button><button class="go" id="rSave">Save</button></footer>
    </div>`;
  document.body.append(veil);
  const nameI = veil.querySelector("#rName"), scopeI = veil.querySelector("#rScope"),
        msg = veil.querySelector("#rMsg"), save = veil.querySelector("#rSave");
  nameI.value = b.name || ""; scopeI.value = b.scope || "";
  const shut = () => veil.remove();
  veil.querySelector("#rCancel").onclick = shut;

  /* Merge into: only this workspace's own folders, never a personal one. */
  const home = x => (x.space || S.space) === S.space;
  const targets = S.brains.filter(x => x.slug !== b.slug && x.type !== "personal" && home(x) && !readOnly(x))
    .sort((x, y) => x.name.localeCompare(y.name));
  const into = veil.querySelector("#rInto"), merge = veil.querySelector("#rMerge");
  veil.querySelector("#rMergeF").hidden = b.type === "personal" || !home(b) || !targets.length;
  into.innerHTML = `<option value="">Pick a folder</option>` + targets.map(x => `<option value="${esc(x.slug)}">${esc(x.name)}</option>`).join("");
  into.onchange = () => { merge.textContent = "Merge"; merge.classList.remove("sure"); };
  merge.onclick = async () => {
    const t = targets.find(x => x.slug === into.value);
    if (!t){ into.focus(); return; }
    /* A second click goes: the folder cannot come back. */
    if (!merge.classList.contains("sure")){ merge.classList.add("sure"); merge.textContent = `Sure? Into ${t.name}`; return; }
    merge.disabled = true; msg.className = "spin"; msg.textContent = "Merging";
    let r;
    try { r = await api("/api/brain/merge", { from: b.slug, into: t.slug }); }
    catch (e) { merge.disabled = false; msg.className = "bad"; msg.textContent = e.message; return; }
    shut();
    if (S.folder === b.slug) S.folder = null;
    S.picks = S.picks.filter(x => x !== b.slug);
    await refresh();
    openFolder(S.brains.find(x => x.slug === t.slug));
    push("ai", x => { x.innerHTML = rich(`**${esc(r.fromName)}** is now part of **${esc(r.intoName)}**: ${r.moved + r.joined} concepts` +
      `${r.joined ? `, ${r.joined} joined to a twin` : ""}, ${r.sources} source${r.sources === 1 ? "" : "s"}.`); });
  };
  veil.onclick = e => { if(e.target===veil) shut(); };
  setTimeout(()=>nameI.focus(),30);

  save.onclick = async () => {
    const nm = nameI.value.trim(), sc = scopeI.value.trim();
    if (nm.length < 2){ msg.className="bad"; msg.textContent="give a name of at least 2 characters"; nameI.focus(); return; }
    save.disabled = true; msg.className="spin"; msg.textContent = "Saving";
    try {
      const r = await api("/api/brain/rename", { slug: b.slug, name: nm, scope: sc });
      if (r.error) throw new Error(r.error);
      shut(); await refresh();
      if (S.scope === b.slug) S.scope = r.slug;
      S.into = S.into.map(x => x === b.slug ? r.slug : x);
      render();
      const m = r.moved || {};
      push("ai", x => { x.innerHTML = rich(
        (r.name !== b.name
          ? `**${esc(b.name)}** is now **${esc(r.name)}**, at \`${esc(r.slug)}\`.` +
            (r.slug !== b.slug
              ? ` Moved with it: ${m.concepts||0} concepts and ${m.sources||0} sources.`
              : "")
          : `**${esc(r.name)}** saved.`) +
        `\n\nScope: ${esc(r.scope || sc)}`); });
    } catch(e){ save.disabled=false; msg.className="bad"; msg.textContent = e.message; }
  };
}

/** The picker's face: the space's mark, where it goes, and to which brain. */
function renderScope(){
  if (!S.brains.some(b => b.slug === S.scope)) S.scope = "all";
  /* The ticks follow a folder picked anywhere else: a reopened chat, a new
     folder, Ask about it. Two or more ticked ask with the scope at "all". */
  S.picks = S.picks.filter(x => S.brains.some(b => b.slug === x && b.type !== "personal"));
  if (isPersonal(S.scope)) S.picks = [];
  else if (S.scope !== "all") S.picks = [S.scope];
  else if (S.picks.length === 1) S.picks = [];
  S.into = S.into.filter(x => S.brains.some(b => b.slug === x) && !isPersonal(x) && !readOnly(S.brains.find(b => b.slug === x)));
  if (isPersonal(S.scope) && S.mode === "drop") S.mode = "ask";
  const drop = S.mode === "drop";
  const nameOf = x => S.brains.find(b => b.slug === x)?.name || x;
  /* Asking across every brain needs no label: the name says it. */
  $("scopeLabel").textContent = drop ? "Into" : isPersonal(S.scope) ? "Chat with" : "";
  /* A drop can feed several brains: the first by name, then how many more. */
  $("scopeVal").textContent = drop
    ? (!S.into.length ? "Suggest for me" : S.into.length === 1 ? nameOf(S.into[0]) : `${nameOf(S.into[0])} +${S.into.length - 1}`)
    : S.picks.length > 1 ? `${nameOf(S.picks[0])} +${S.picks.length - 1}`
    : S.scope === "all" ? "All folders" : nameOf(S.scope);
  const mark = $("spaceMark")?.getAttribute("src");
  if (mark && $("scopeMark").getAttribute("src") !== mark) $("scopeMark").src = mark;
  if (pickMenu) fillPick();
}

/* The picker's menu, drawn on the page itself so the scrolling bar of a phone
   never clips it, and placed above the button, since the box sits low. */
var pickMenu = null;   // var, not let: render() runs before this line is reached
function fillPick(){
  const m = pickMenu, drop = S.mode === "drop";
  const scroll = m.scrollTop;
  m.innerHTML = "";
  m.classList.toggle("multi", drop);
  m.setAttribute("aria-multiselectable", drop ? "true" : "false");
  /* Asking reads one folder, the ones ticked in the side panel, or all of
     them. Dropping ticks as many as the source belongs in, and the menu stays
     open while they are ticked. */
  const isOn = slug => drop ? (slug === "all" ? !S.into.length : S.into.includes(slug))
    : S.picks.length > 1 ? S.picks.includes(slug) : S.scope === slug;
  const row = (slug, name, sub, count, b) => {
    const on = isOn(slug);
    const r = el("button","pk-row" + (on ? " on" : ""));
    r.setAttribute("role","option"); r.setAttribute("aria-selected", on ? "true" : "false");
    const nm = el("span","pk-nm", name);
    if (sub) nm.append(el("span","pk-sub", sub));
    const mark = el("span", drop && slug !== "all" ? "pk-box" : "pk-dot");
    if (drop && slug !== "all") mark.innerHTML = `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 5 8.6l4.5-5"/></svg>`;
    r.append(mark);
    if (b) r.append(brainIcon(b));
    r.append(nm);
    if (count != null) r.append(el("span","pk-ct", count));
    r.onclick = e => {
      e.stopPropagation();
      if (!drop){
        crossing(slug);
        if (isPersonal(slug)){ S.picks = []; S.scope = slug; S.into = []; } else setPicks(slug === "all" ? [] : [slug]);
        closePick(); render(); $("input").focus(); return;
      }
      if (slug === "all") S.into = [];
      else S.into = S.into.includes(slug) ? S.into.filter(x => x !== slug) : [...S.into, slug];
      S.scope = S.into.length === 1 ? S.into[0] : "all";
      S.picks = S.into.slice();
      render();
    };
    return r;
  };
  const ideas = S.concepts.length;
  m.append(row("all", drop ? "Suggest for me" : "All folders",
    drop ? "The AI picks where it belongs" : `${S.brains.length} folder${S.brains.length===1?"":"s"}, ${ideas} concept${ideas===1?"":"s"}`));
  if (drop) m.append(el("div","pk-h","Or tick the folders to feed"));
  if (!drop) m.append(el("div","pk-h","Or one folder"));
  for (const b of ordered()) if (!drop || (b.type !== "personal" && !readOnly(b))) m.append(row(b.slug, b.name, b.type === "personal" ? "your chat" : "", String(conceptsOf(b.slug).length), b));
  if (drop){
    const done = el("button","pk-done", S.into.length > 1 ? `Feed ${S.into.length} folders` : "Done");
    done.onclick = e => { e.stopPropagation(); closePick(); $("input").focus(); };
    m.append(done);
  }
  m.scrollTop = scroll;
}

/**
 * The chat bar stays a one-line pill, so the thread keeps the page. It opens
 * to its folders, levels and hints when it is wanted: a click in it, text in
 * it, a drop, its folder menu open, or the mic on.
 */
/* A phone's screen: hints are short there. */
function phone(){ return window.matchMedia("(max-width: 700px)").matches; }
var fullPlaceholder = "";   // var: renderComposer runs before this line is reached
/* The folded bar's few words, where the full line would not fit beside the mic. */
var shortPlaceholder = "";
function paintBar(){
  const wrap = document.querySelector(".composer-wrap");
  if (!wrap) return;

function renderComposer(){
  /* A personal brain is a chat: no Drop, no levels, and a way to bring in
     what another assistant already knows about you. */
  const about = S.mode === "ask" ? S.concept : null;
  const mine = S.mode === "ask" && isPersonal(S.scope) && !about;
  const asking = mine && !!S.iv[S.scope]?.on;
  paintAbout(about);
  $("memBtn").hidden = !mine || S.demo;
  /* It appears once there is something to forget. */
  $("freshBtn").hidden = S.mode !== "ask" || !S.thread.length || !!S.folder;
  const drop = S.mode==="drop";
  $("srcLine").hidden = !drop;
  shortPlaceholder = about ? `About ${about.title}` : asking ? "Your answer" : mine ? "Tell it anything" : "";
  fullPlaceholder = drop
    ? "Paste the text or the transcript here, or add a document. Leave it empty when the source is a link."
    : about ? (about.personal ? `Tell or ask anything about ${about.title}. What you say changes it.` : `Ask about ${about.title}.`)
    : asking ? "Your answer, in your own words"
    : mine ? (phone() ? "Tell it anything. @ calls a folder." : "Tell it anything: a plan, a decision, an idea. Or ask what you said. Type @ to call a folder.")
    : S.picks.length > 1 ? `Ask ${picksName()}.`
    : S.scope==="all" ? (phone() ? "Ask your folders. @ names one." : "Ask anything your folders have read. Type @ to name one.")
                      : "Ask " + (S.brains.find(b=>b.slug===S.scope)?.name || "this folder") + ".";
  $("levelWrap").hidden = drop || mine || !!about || isPersonal(S.scope);
  /* A chat about one concept reads that one alone: its chip stands for the folders. */
  $("scopeBtn").hidden = !!about;
  for (const x of $("level").children){
    const on = x.dataset.v === S.level;
    x.classList.toggle("on", on); x.setAttribute("aria-checked", on ? "true" : "false");
  }
  $("fileBtn").hidden = !drop;
  /* The mic is for asking and talking. A drop takes a source, not a voice. */
  $("micBtn").hidden = drop;
  if (drop && S.listening) stopVoice();
  $("footNote").textContent = about
    ? (about.personal ? `This chat reads ${about.title} alone. A fact, a date or a correction you give is written to it at once.`
      : `This chat reads ${about.title} alone. A new chat reads every folder.`)
    : asking
    ? "Interview: one question at a time, each answer filed as dated notes. Say skip to pass, or Stop any time."
    : mine
    ? "Personal, alpha: your words are filed as dated notes. It calls your other folders when they help, and only this chat reads it."
    : drop
    ? "The source gets read once, then you reply to one card."
    : S.level==="educational" ? "Educational: terms defined, mechanism built, one worked example."
    : S.level==="learning" ? "Learning: no answer given. Steps and hints to reach it yourself."
    : "Normal: the answer carries the numbers. Sources sit on one line underneath.";

  const t = $("input").value.trim();
  const src = drop ? $("srcInput").value.trim() : "";
  /* A drop needs something to read: content, a pasted transcript, or a link
     the server can open. A source named with neither is a title and nothing
     else, so the button stays off and the hint says what is missing. */
  const ready = hasContent(src, t);
  const busy = drop ? S.dropBusy : chatBusy();
  $("send").disabled = busy || (drop ? !ready : !t);
  $("tHint").textContent = busy ? (drop ? "reading" : "working") : drop ? dropHint(src, t)
    : S.listening ? `Listening in ${voiceName()}. Tap the mic to stop.` : (S.voiceHint || "");
  paintIv();
  paintBar();
}

/* Declarations, not consts: renderComposer runs once before this line is
   reached, when the shell paints ahead of the first state call. */
function linkIn(s){ return /https?:\/\/\S+/i.test(s || ""); }
function hasContent(src, content){
  return !!(content || linkIn(src) || linkIn(content));
}

/**
 * What the drop still needs, in one line.
 *
 * It says the next move rather than the rule, because the rule only matters at
 * the moment a field is empty.
 */
function dropHint(src, content){
  if (!src && !content) return "";
  if (!src && content) return "name the source, so a repeat is caught later";
  if (hasContent(src, content)) return linkIn(src) && !content
    ? "the link gets opened, video or article" : "";
  return "paste what it says, drop a document, or give a link";
}

/**
 * The octopus's loop, see-through on the page.
 *
 * The WebM carries its transparency in 270 KB. Safari and every iPhone
 * browser play WebM without that transparency, a black square, so they get
 * the animated WebP instead. Asked for less motion, it stays still.
 */
function octopusLoop(){
  const ua = navigator.userAgent;
  const webkit = /iPhone|iPad|iPod/.test(ua) || (/Safari\//.test(ua) && !/Chrome|Chromium|Edg|OPR|Firefox/.test(ua));
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return `<img class="zero-mark" src="/brand/logo-mark.png" alt="">`;
  return webkit
    ? `<img class="zero-loop" src="/brand/octopus-loop.webp" alt="">`
    : `<video class="zero-loop" src="/brand/octopus-loop.webm" autoplay loop muted playsinline disablepictureinpicture aria-hidden="true"></video>`;
}

function renderZero(){
  const th = $("thread");
  /* The shell paints before the state call says which space this is, so an
     empty state drawn for the wrong space is replaced rather than kept. */
  const old = th.querySelector(".zero");
  const mark = markOf(), logo = !!S.logo, ex = examples();
  if (old && (old.dataset.space !== S.space || old.dataset.mark !== mark || old.dataset.ex !== ex.join("|"))) old.remove();
  if (th.children.length) return;
  const z = el("div","zero");
  z.dataset.space = S.space; z.dataset.mark = mark; z.dataset.ex = ex.join("|");
  z.innerHTML = `
    ${S.space === "octopus" && !logo ? octopusLoop() : `<img class="zero-mark" src="${esc(S.space === "squidgy" && !logo ? "/brand/squidgy-mark.png" : mark)}" alt="">`}
    <h2>A folder that gets smarter every time you feed it.</h2>
    <p class="lede">Feed it any source and it reads the whole thing, files each idea under the right subject, flags every claim that clashes with what you already hold, then answers from dated evidence.</p>`;
  if (ex.length){
    const t = el("div","try"); t.append(el("b",null,"Try"));
    for (const q of ex){ const b = el("button",null,q); b.type = "button"; b.onclick = () => { $("input").value = q; go(); }; t.append(b); }
    z.append(t);
  }
  th.append(z);
}

/**
 * Three questions the brains on screen can answer: the concept with the most
 * sources in each of the three fullest shared brains. A personal chat gets none.
 */
function examples(){
  if (S.mode !== "ask" || isPersonal(S.scope)) return [];
  const pool = S.brains.filter(b => b.type !== "personal" && (S.scope === "all" || b.slug === S.scope));
  const out = [];
  for (const b of [...pool].sort((x, y) => conceptsOf(y.slug).length - conceptsOf(x.slug).length)){
    const top = conceptsOf(b.slug).slice().sort((x, y) => (y.src || 0) - (x.src || 0) || (y.ev || 0) - (x.ev || 0))[0];
    if (top) out.push(`What does ${b.name} hold on ${top.title.replace(/\.$/, "").replace(/^[A-Z](?![A-Z])/, m => m.toLowerCase())}?`);
    if (out.length === 3) break;
  }
  return out;
}

/* ============ thread ============ */
const clearZero = () => $("thread").querySelector(".zero")?.remove();
const bottom = (t = $("thread")) => { t.scrollTop = t.scrollHeight; };

/* A message lands in the chat, or, from a drop, on the Drop screen: the chat
   only asks. */
function push(kind, build, where = $("thread")){
  if (where === $("thread")) clearZero(); else where.querySelector(".zero")?.remove();
  const wrap = el("div","msg "+(kind==="me"?"me":"ai"));
  const col = el("div","col");
  if (kind !== "me"){
    const who = el("div","who");
    who.append(el("span",null,S.spaceName));
    const b = S.brains.find(x=>x.slug===S.scope);
    if (b) who.append(el("span","sc","· "+b.name));
    col.append(who);
  }
  const body = el("div","body");
  col.append(body); wrap.append(col); where.append(wrap);
  build(body); bottom(where);
  return body;
}
function says(text, attach, where){
  push("me", b => { b.textContent = text; if (attach) b.append(el("span","attach",attach)); }, where);
}
/* The same three, on the Drop screen. */
const dpush = (kind, build) => push(kind, build, $("dropThread"));
const dsays = (text, attach) => says(text, attach, $("dropThread"));
const dthinking = label => thinking(label, $("dropThread"));
const dbottom = () => bottom($("dropThread"));
/* What the space's mascot is up to while an answer is on its way, with the
   step it stands for in brackets. The lines follow an answer's order, one
   every 2.4 seconds: the titles are searched, matched, the concepts read,
   the evidence weighed, the answer written. A long wait alternates the last
   two, which is where a long answer spends its time. */
const WAITING = {
  octopus: [
    ["Octopus is reaching into every brain...", "searching"],
    ["Octopus is feeling for the right concepts...", "matching"],
    ["Eight arms, sorting the notes...", "reading"],
    ["Octopus is untangling the answer...", "weighing"],
    ["Octopus is inking the key points...", "writing"],
  ],
  squidgy: [
    ["Squidgy is sniffing around...", "searching"],
    ["Squidgy picked up a scent...", "matching"],
    ["Squidgy is digging through the notes...", "reading"],
    ["Squidgy is fetching the best bits...", "weighing"],
    ["Squidgy is wagging, almost there...", "writing"],
  ],
};

/* Any other workspace waits in its own name. */
const waitingFor = name => [
  [`${name} is searching every title...`, "searching"],
  [`${name} is matching the concepts...`, "matching"],
  [`${name} is reading the notes...`, "reading"],
  [`${name} is weighing the evidence...`, "weighing"],
  [`${name} is writing the answer...`, "writing"],
];

/**
 * The turning mark and a line. Without a label, the line is the mascot's,
 * and it changes while the wait lasts. A drop's steps pass their own label,
 * because "part 3 of 8" says more than a joke.
 */
/**
 * The browser tab says what a drop is doing, so a long one can run while
 * another tab is open: "Reading 3 of 8 · Octopus". A card or a store that
 * lands while the tab is hidden says so until the tab is looked at.
 */
function tabTitle(step){ document.title = step ? `${step} \u00b7 ${S.spaceName}` : S.spaceName; }
function tabStep(label){
  const t = String(label || ""), n = t.match(/(\d+) of (\d+)/), of = n ? ` ${n[1]} of ${n[2]}` : "";
  const step = /^Checking for a repeat/.test(t) ? "Checking"
    : /^Opening the link/.test(t) ? "Opening"
    : /^Reading/.test(t) ? "Reading" + of
    : /^Comparing against/.test(t) ? "Filing" + of
    : /^Rewriting the positions/.test(t) ? "Storing" + of : "";
  if (step) tabTitle(step);
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && /^(Card ready|Stored) /.test(document.title)) tabTitle("");
});

function thinking(label, where){
  tabStep(label);
  if (where && where === $("dropThread")) dropStep(label);
  return push("ai", b => thinkInto(b, label), where);
}
/** The turning mark and its line, inside a message already on screen. */
function thinkInto(b, label){
  const t = el("div","thinking"), mark = el("span","spinner");
  mark.setAttribute("aria-hidden", "true");
  t.setAttribute("role", "status");
  const line = el("span","tl",label||"Thinking");
  t.append(mark, line);
  b.append(t);
  const lines = !label && (WAITING[S.space] || waitingFor(S.spaceName));
  if (lines){
    const show = i => { line.textContent = lines[i][0] + " "; line.append(el("span","act",`(${lines[i][1]})`)); };
    let i = 0;
    show(i);
    const timer = setInterval(() => {
      /* The wait ended when the line left the page. */
      if (!line.isConnected || t.dataset.fixed){ clearInterval(timer); return; }
      i = i < lines.length - 1 ? i + 1 : lines.length - 2;
      show(i);
    }, 2400);
  }
}
function setThinking(body, label){
  tabStep(label);
  if (body.closest?.("#dropThread")) dropStep(label);
  const t = body.querySelector(".thinking");
  const s = body.querySelector(".thinking .tl");
  if (t) t.dataset.fixed = "1";
  if (s) s.textContent = label;
}
/* A failure worth trying again as it was: the connection, the clock, a busy model. */
const RETRYABLE = /did not answer|ran past|unreachable|timed out|still\s(thinking|writing)|sent nothing|overloaded|rate limit|429|50[0-9]|busy|temporar/i;
/**
 * The error, and what to do about it: Try again when the failure was the
 * connection or the clock and the caller can send it again, and Send
 * feedback, which mails the error to the people who run Tasu.
 */
function fail(body, msg, o = {}){
  tabTitle("");
  body.innerHTML = "";
  const text = msg || "Something failed on the way. Send it again.";
  const e = el("div","err");
  e.append(el("b",null,"Nothing was stored"), el("span",null,text));
  const acts = el("div","err-acts");
  if (o.retry && RETRYABLE.test(text)){
    const again = el("button","mini err-go","Try again"); again.type = "button";
    again.onclick = () => { if (!again.disabled){ again.disabled = true; o.retry(); } };
    acts.append(again);
  }
  if (text !== "locked") acts.append(feedbackButton(text, { ...o, where: o.where || (body.closest?.("#dropThread") ? "drop" : "chat") }));
  e.append(acts);
  body.append(e);
}
/** Send feedback: the error, where it happened and the message behind it, mailed once. */
function feedbackButton(error, o){
  const b = el("button","mini err-fb","Send feedback"); b.type = "button";
  b.title = "Mails this error to the people who run Tasu";
  b.onclick = async () => {
    b.disabled = true; b.textContent = "Sending";
    try {
      await api("/api/feedback", { error, where: o.where, q: o.q || "", chat: S.chatId || "", personal: isPersonal(o.scope ?? S.scope),
        agent: navigator.userAgent });
      b.textContent = "Sent. Thank you";
    } catch (e) { b.disabled = false; b.textContent = "Send feedback"; b.title = "Not sent: " + e.message; b.after(el("span","err-why", "Not sent: " + e.message)); }
  };
  return b;
}

/* ============ background work and the inbox ============
   A question runs on whatever opens next: another chat, a folder, Drop. It
   lands in the chat it was asked in, and the inbox, top right, lists what is
   on its way, what landed unread, a drop not finished, and the open clashes. */

/** The chat on screen: its saved id, or the draft a new chat is until its first answer. */
function currentKey(){ return S.chatId || S.draft; }
/** A question on its way in the chat on screen. Another chat stays free. */
/* Declarations, not consts: renderComposer reads these before this line runs. */
function chatBusy(){ return S.jobs.some(j => j.status === "running" && j.key === currentKey()); }
var jobSeq = 0;

function addJob(q, about, label){
  const j = { id: ++jobSeq, q, key: currentKey(), chat: S.chatId, status: "running", seen: false, at: Date.now(),
    scope: S.scope, picks: S.picks.slice(), concept: about || null, label: label || "" };
  S.jobs.push(j);
  paintInbox(); renderChats();
  return j;
}
/** The answer names its chat: a draft still on screen becomes that chat. True when it is on screen. */
function landed(j, r){
  const here = currentKey() === j.key;
  if (r && r.chat){ if (here && !S.chatId) S.chatId = r.chat; j.key = j.chat = r.chat; loadChats(); }
  return here;
}
function endJob(j, ok){
  j.status = ok ? "done" : "failed"; j.done = Date.now();
  /* Read when it landed in front of you; otherwise it waits in the inbox. */
  j.seen = !document.hidden && S.mode === "ask" && !S.folder && currentKey() === j.key && !!j.body?.isConnected;
  /* What was read is let go; the list never grows past 30. */
  S.jobs = S.jobs.filter(x => x.status === "running" || !x.seen || Date.now() - x.done < 60000).slice(-30);
  paintInbox(); renderChats();
}
/** What is on screen now counts as read. */
function markSeen(){
  let n = 0;
  if (S.mode === "ask" && !S.folder && !document.hidden)
    for (const j of S.jobs) if (!j.seen && j.status !== "running" && j.key === currentKey()){ j.seen = true; n++; }
  if (S.mode === "drop" && !document.hidden && S.dropJob && !S.dropJob.seen){ S.dropJob.seen = true; n++; }
  const a = S.auditRun;
  if (a && a.state !== "running" && !a.seen && auditShown(a)){ a.seen = true; n++; }
  if (n){ paintInbox(); renderChats(); }
}
document.addEventListener("visibilitychange", markSeen);

/** Where the drop stands: running, a card to review, storing, stored, waiting on a choice, failed. Null when done with. */
function dropState(state, title){
  if (!state){ S.dropJob = null; paintInbox(); return; }
  S.dropJob = { ...(S.dropJob || {}), state, ...(title ? { title: String(title).slice(0, 90) } : {}),
    step: state === "running" ? (S.dropJob?.step || "") : "", seen: S.mode === "drop" && !document.hidden, at: Date.now() };
  paintInbox();
}
function dropStep(label){ if (S.dropJob && label){ S.dropJob.step = String(label); paintInbox(); } }
/** A drop's run is over: a card waits, or the last message says how it ended. */
function dropSettled(){
  if (S.pendingCard){ if (S.dropJob?.state !== "card") dropState("card"); return; }
  if (S.dropJob && !["running", "storing"].includes(S.dropJob.state)) return;
  const last = $("dropThread").lastElementChild;
  dropState(last?.querySelector(".err") ? "failed" : last?.querySelector("button") ? "waiting" : "ended");
}

/** The open clashes across the folders, from the health check. */
function openClashes(){ return Object.values(S.health || {}).reduce((n, h) => n + (Number(h.open) || 0), 0); }
function ago(t){ const s = Math.max(0, Math.round((Date.now() - t) / 1000)); return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)} min` : `${Math.floor(s / 3600)} h`; }

/** The bubble's count, and the panel when it is open. */
function paintInbox(){
  const btn = $("inboxBtn"); if (!btn) return;
  paintStill();
  const unread = S.jobs.filter(j => j.status !== "running" && !j.seen).length;
  const running = S.jobs.filter(j => j.status === "running").length;
  const d = S.dropJob;
  const dropWaits = d && (d.state === "card" || (!d.seen && ["stored", "waiting", "failed", "ended"].includes(d.state))) ? 1 : 0;
  const m = S.memJob;
  const memWaits = m && m.state !== "running" && !m.seen ? 1 : 0;
  const a = S.auditRun, auditing = a?.state === "running";
  const auditWaits = a && !auditing && !a.seen ? 1 : 0;
  const dueAudits = S.demo ? [] : (S.brains || []).filter(b => auditDue(b) && !(auditing && a.slug === b.slug));
  const n = unread + dropWaits + memWaits + auditWaits + dueAudits.length + decisionCount();
  $("inboxN").hidden = !n; $("inboxN").textContent = n > 99 ? "99+" : String(n);
  btn.classList.toggle("run", running > 0 || (!!d && ["running", "storing"].includes(d.state)) || m?.state === "running" || auditing || !!S.dcRun);
  btn.setAttribute("aria-label", n ? `Inbox, ${n} waiting` : "Inbox");
  if (!$("inbox").hidden) paintInboxPanel();
}

function paintInboxPanel(){
  const box = $("inbox"); box.innerHTML = "";
  box.append(el("h3",null,"Inbox"));
  const group = (title, rows) => { if (!rows.length) return; const g = el("section","ib-g"); g.append(el("h4",null,title), ...rows); box.append(g); };
  const item = (cls, title, sub, go) => {
    const b = el("button","ib-it " + cls); b.type = "button";
    b.append(el("i","ib-mark"), el("span","ib-t", title), el("span","ib-s", sub));
    b.onclick = () => { closeInbox(); go(); };
    return b;
  };
  const named = j => j.q ? (j.q.length > 70 ? j.q.slice(0, 67) + "..." : j.q) : (j.label || "Interview");
  const where = j => j.concept ? `About ${j.concept.title}` : brainLabel(j.picks.length > 1 ? j.picks.join(",") : j.scope);
  group("Answers ready", S.jobs.filter(j => j.status !== "running" && !j.seen).reverse()
    .map(j => item(j.status === "failed" ? "bad" : "new", named(j), `${j.status === "failed" ? "Failed" : "Answered"} ${ago(j.done)} ago · ${where(j)}`, () => openJob(j))));
  group("On its way", S.jobs.filter(j => j.status === "running")
    .map(j => item("run", named(j), `Thinking for ${ago(j.at)} · ${where(j)}`, () => openJob(j))));
  const d = S.dropJob;
  if (d){
    const say = { running: d.step || "Reading", storing: "Storing", card: "Card ready to review", stored: "Stored",
      waiting: "Waiting on your choice", failed: "Stopped on an error", ended: "Ended, read why" }[d.state] || "";
    if (["running", "storing", "card"].includes(d.state) || !d.seen)
      group("Drop", [item(["running", "storing"].includes(d.state) ? "run" : d.state === "failed" ? "bad" : "new", d.title || "Your drop", say, () => openDrop())]);
  }
  const m = S.memJob;
  if (m && (m.state === "running" || !m.seen)){
    const n = m.pieces.length;
    group("Memory", [item(m.state === "running" ? "run" : m.state === "failed" ? "bad" : "new", `Add memory to ${m.name}`,
      m.state === "running" ? `Filing piece ${Math.min(m.done + 1, n)} of ${n}` : m.state === "failed" ? `Stopped at piece ${m.done + 1} of ${n}` : "Done: see what it filed",
      () => openMemorySheet(m.brain))]);
  }
  const a = S.auditRun, ab = a && S.brains.find(x => x.slug === a.slug);
  if (ab && (a.state === "running" || !a.seen))
    group("Audit", [item(a.state === "running" ? "run" : a.state === "failed" ? "bad" : "new", `Audit ${a.name}`,
      a.state === "running" ? `${a.step} · ${ago(a.at)}` : a.state === "failed" ? "Stopped on an error" : `Finished · ${a.summary}`, () => runAudit(ab, true))]);
  const due = S.demo ? [] : S.brains.filter(b => auditDue(b) && !(a?.state === "running" && a.slug === b.slug));
  if (due.length) group("Cleaning needed", due.map(b => item("clash", `Audit ${b.name}`, auditDue(b), () => runAudit(b))));
  const clash = openClashes(), dn = decisionCount();
  if (S.demo){ if (clash) group("Conflicts", [item("clash", `${clash} open clash${clash === 1 ? "" : "es"} to settle`, "One card at a time: keep a side, or both", () => settleFrom(null, null))]); }
  else if (dn || S.dcRun) group("Decisions", [item(S.dcRun ? "run" : "clash",
    S.dcRun ? `Applying ${S.dcRun.done} of ${S.dcRun.total}` : `${dn} decision${dn === 1 ? "" : "s"} ready`,
    S.dcRun ? "It goes on while you look elsewhere" : "Each with a suggested call. Accept them all in one tap", () => openDecide())]);
  if (box.children.length === 1) box.append(el("p","ib-none","Nothing waiting. A question you send keeps running here while you look elsewhere."));
}

/** A question from the inbox, back on screen: its chat, or the draft it was asked in. */
function openJob(j){
  j.seen = true; paintInbox();
  if (j.chat){
    if (S.chatId === j.chat && S.mode === "ask" && !S.folder){ markSeen(); paintInbox(); renderChats(); return; }
    openChat(j.chat); return;
  }
  /* A new chat with no answer yet: the draft comes back with its question. */
  S.thread = []; S.chatId = null; S.draft = j.key; S.mode = "ask"; S.folder = null; S.concept = j.concept;
  if (j.concept) setScopeFor(j.concept.brain); else if (isPersonal(j.scope)){ S.picks = []; S.scope = j.scope; S.into = []; } else setPicks(j.picks);
  $("thread").innerHTML = "";
  if (j.q) says(j.q);
  if (j.status === "running") j.body = thinking(j.label);
  else push("ai", b => fail(b, j.error, { q: j.q, scope: j.scope, retry: () => { if (!chatBusy()) doAsk(j.q, b).finally(renderComposer); } }));
  render(); renderChats(); paintInbox(); bottom();
}

var inboxTimer = null;
function openInbox(){
  const box = $("inbox"); box.hidden = false; $("inboxBtn").setAttribute("aria-expanded","true");
  paintInboxPanel();
  clearInterval(inboxTimer); inboxTimer = setInterval(() => { if (box.hidden) clearInterval(inboxTimer); else paintInboxPanel(); }, 1000);
  /* The open clashes are counted again as it opens. */
  loadHealth().then(paintInbox);
}

/* ============ still open: what waits in your people's files ============ */
/**

function personalOfSpace(){ return S.brains.find(b => b.type === "personal" && !readOnly(b) && (b.space || "octopus") === S.space); }
function openLines(pb){ return S.concepts.reduce((n, c) => n + (c.brain === pb.slug && c.tag === "contact" ? (c.open || 0) : 0), 0); }

/* ============ decisions: the self-driving inbox ============ */
/**
 * Everything waiting on a call, each with a suggested one and its reason:
 * the open clashes, what an audit found (concepts filed twice, titles not in
 * English, positions never written), and the people filed twice in the
 * personal folder. Accept one, pick another call, or accept them all.
 */
const DC_TAG = { clash: "Clash", same: "Filed twice", rename: "Title", blank: "No position", person: "Same person" };
const pairsOf = ids => { const k = []; for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) k.push([ids[i], ids[j]].sort().join("|")); return k; };
function decisions(){
  if (S.demo) return [];
  const out = [], have = new Map(S.concepts.map(c => [`${c.brain}/${c.slug}`, c])), later = S.dcLater || new Set();
  for (const c of S.clashes || []){
    const h = c.hint || { pick: "both", why: "" };
    out.push({ key: `clash|${c.id}|${c.a}|${c.b}`, kind: "clash", brain: c.brain, ids: [c.id], title: c.title, c,
      lines: [`A${c.aDate ? `, ${c.aDate}` : ""}: ${c.a}`, `B${c.bDate ? `, ${c.bDate}` : ""}: ${c.b}`],
      pick: h.pick, say: { a: "A holds", b: "B holds", both: "Both hold" }[h.pick] || "Both hold", why: h.why || "" });
  }
  for (const b of S.brains){
    if (!auditable(b)) continue;
    const apart = new Set(b.apart || []);
    if (b.type === "personal"){
      for (const g of samePeople(conceptsOf(b.slug).filter(c => c.tag === "contact"), b.apart || [])){
        const keep = g.slice().sort((x, y) => y.title.length - x.title.length || (y.ev || 0) - (x.ev || 0))[0];
        const n = g.reduce((t, c) => t + (c.ev || 0), 0);
        out.push({ key: `person|${g.map(c => c.slug).sort().join("|")}`, kind: "person", brain: b.slug, ids: g.map(c => `${c.brain}/${c.slug}`),
          title: g.map(c => c.title).join(" and "), lines: [], pick: "merge", say: `Merge into ${keep.title}`,
          why: `the fuller name, ${n} mention${n === 1 ? "" : "s"} together`, keep: `${keep.brain}/${keep.slug}` });
      }
      continue;
    }
    const f = b.findings;
    if (!f) continue;
    for (const g of f.same || []){
      const ids = g.map(x => x.id);
      if (!ids.every(id => have.has(id)) || pairsOf(ids).every(k => apart.has(k))) continue;
      const keep = have.get(ids[0]);
      out.push({ key: `same|${ids.slice().sort().join("|")}`, kind: "same", brain: b.slug, ids, title: ids.map(id => have.get(id).title).join(" and "),
        lines: g.map(x => `${have.get(x.id).title}: ${have.get(x.id).summaryLine || "no position yet"}`), pick: "merge",
        say: `Merge into "${keep.title}"`, why: `one idea filed ${ids.length} times, and this title reads clearest`, keep: ids[0] });
    }
    for (const e of f.english || []){
      const c = have.get(e.id);
      if (!c || c.title !== e.title) continue;
      out.push({ key: `rename|${e.id}`, kind: "rename", brain: b.slug, ids: [e.id], title: c.title, lines: [], pick: "rename",
        say: `Rename to "${e.to}"`, why: "its title is not in English", to: e.to });
    }
    for (const x of f.blank || []){
      const c = have.get(x.id);
      if (!c || (c.summaryLine || "") !== (x.line || "")) continue;
      out.push({ key: `blank|${x.id}`, kind: "blank", brain: b.slug, ids: [x.id], title: c.title, lines: [], pick: "write",
        say: "Write its position", why: `it holds ${c.ev || 0} evidence line${c.ev === 1 ? "" : "s"} and no position` });
    }
  }
  return out.filter(d => !later.has(d.key));
}
function decisionCount(){ return S.demo ? openClashes() : decisions().length + (S.clashes ? 0 : openClashes()); }
/** What waits, by kind: "2 clashes · 3 filed twice". */
function decisionLine(){
  const ds = decisions(), n = k => ds.filter(d => d.kind === k).length;
  const part = (k, one, many) => n(k) ? `${n(k)} ${n(k) === 1 ? one : many}` : "";
  return [part("clash", "clash", "clashes"), part("same", "filed twice", "filed twice"), part("rename", "title", "titles"),
    part("blank", "empty position", "empty positions"), part("person", "same person", "same people")].filter(Boolean).join(" \u00b7 ") || `${decisionCount()} waiting`;
}
function paintDecide(){ if (S.dcPaint) S.dcPaint(); }
/** One decision made: the call it was given, sent. Says what changed, or throws. */
async function applyDecision(d, pick){
  const b = S.brains.find(x => x.slug === d.brain);
  const title = id => S.concepts.find(c => `${c.brain}/${c.slug}` === id)?.title || id;
  if (pick === "later"){ (S.dcLater ||= new Set()).add(d.key); return "Left for later."; }
  if (pick === "apart"){
    const r = await api("/api/brain/audit", { brain: d.brain, action: "apart", ids: d.ids });
    if (r.error) throw new Error(r.error);
    if (b) b.apart = [...new Set([...(b.apart || []), ...pairsOf(d.ids)])];
    return "Kept apart. No audit asks again.";
  }
  if (d.kind === "clash"){
    const r = await api("/api/conflicts/settle", { id: d.c.id, a: d.c.a, b: d.c.b, pick });
    if (r.error || r.ok === false) throw new Error(r.error || r.why);
    S.clashes = (S.clashes || []).filter(c => c !== d.c);
    if (S.health[d.brain]) S.health[d.brain].open = Math.max(0, (S.health[d.brain].open || 0) - 1);
    return { a: "A holds. Position written again.", b: "B holds. Position written again.", both: "Both hold." }[pick] || "Settled.";
  }
  if (d.kind === "same" || d.kind === "person"){
    /* The suggested card keeps its name, unless the call is to merge into another one of them. */
    const keep = String(pick).startsWith("into:") && d.ids.includes(String(pick).slice(5)) ? String(pick).slice(5) : d.keep;
    const from = d.ids.filter(x => x !== keep);
    const r = d.kind === "same" ? await api("/api/concept/merge", { into: keep, from }) : await api("/api/personal/contact", { action: "merge", into: keep, from });
    if (r.error) throw new Error(r.error);
    const kept = title(keep);
    S.concepts = S.concepts.filter(c => !from.includes(`${c.brain}/${c.slug}`));
    if (S.peek) delete S.peek[keep];
    return `Merged into ${kept}.`;
  }
  if (d.kind === "rename"){
    if (pick === "keep"){
      const r = await api("/api/brain/audit", { brain: d.brain, action: "dismiss", kind: "english", id: d.ids[0] });
      if (r.error) throw new Error(r.error);
      if (b?.findings) b.findings.english = (b.findings.english || []).filter(x => x.id !== d.ids[0]);
      return "Title kept.";
    }
    const r = await api("/api/concept/rename", { id: d.ids[0], title: d.to });
    if (r.error) throw new Error(r.error);
    const c = S.concepts.find(x => `${x.brain}/${x.slug}` === d.ids[0]); if (c) c.title = d.to;
    return `Renamed to ${d.to}.`;
  }
  if (d.kind === "blank"){
    const r = await api("/api/concept/rederive", { ids: d.ids });
    if (r.error) throw new Error(r.error);
    if (!(r.written || []).length) throw new Error("its evidence gave no position. Drop a source on it.");
    if (b?.findings) b.findings.blank = (b.findings.blank || []).filter(x => !d.ids.includes(x.id));
    return "Position written from its evidence.";
  }
  throw new Error("nothing to do");
}
/** Every decision waiting, accepted as suggested, one after the other, in the background. */
async function acceptAll(){
  const ds = decisions();
  if (!ds.length || S.dcRun) return;
  S.dcRun = { done: 0, total: ds.length, ok: 0 }; S.dcErr = new Map();
  paintInbox(); paintDecide();
  const gone = new Set(), blanks = [];
  for (const d of ds){
    if (d.ids.some(id => gone.has(id))){ S.dcRun.done++; continue; }
    if (d.kind === "blank"){ blanks.push(d); continue; }
    try { await applyDecision(d, d.pick); S.dcRun.ok++; if (d.keep) d.ids.filter(x => x !== d.keep).forEach(x => gone.add(x)); }
    catch (e) { S.dcErr.set(d.key, e.message); }
    S.dcRun.done++; paintInbox(); paintDecide();
  }
  /* Positions are written 8 to a call. */
  for (let i = 0; i < blanks.length; i += 8){
    const part = blanks.slice(i, i + 8);
    try {
      const r = await api("/api/concept/rederive", { ids: part.map(d => d.ids[0]) });
      const wrote = new Set(r.written || []);
      for (const d of part){
        if (wrote.has(d.ids[0])){ S.dcRun.ok++; const b = S.brains.find(x => x.slug === d.brain); if (b?.findings) b.findings.blank = (b.findings.blank || []).filter(x => x.id !== d.ids[0]); }
        else S.dcErr.set(d.key, "its evidence gave no position. Drop a source on it.");
      }
    } catch (e) { for (const d of part) S.dcErr.set(d.key, e.message); }
    S.dcRun.done += part.length; paintInbox(); paintDecide();
  }
  const ran = S.dcRun; S.dcRun = null;
  S.dcLast = `${ran.ok} of ${ran.total} done${S.dcErr.size ? `, ${S.dcErr.size} need${S.dcErr.size === 1 ? "s" : ""} a look` : ""}.`;
  try { await refresh(); } catch { /* the lists catch up on the next load */ }
  paintInbox(); paintDecide();
}

/** A folder this workspace holds and may change, never one shared in. */
function auditable(b){ return !!b && !S.demo && !readOnly(b) && (b.space || "octopus") === S.space; }
function auditFolders(){
  return S.brains.filter(b => auditable(b) && (b.type === "personal" || conceptsOf(b.slug).length))
    .sort((x, y) => Number(y.type === "personal") - Number(x.type === "personal") || x.name.localeCompare(y.name));

function auditAge(b){ return b.audit?.at ? Math.max(0, Math.floor((Date.now() - Date.parse(b.audit.at)) / 86400000)) : null; }
/** Why a folder needs an audit now, or "". */
function auditDue(b){
  if (!auditable(b)) return "";
  if (b.type === "personal"){
    if (!conceptsOf(b.slug).length) return "";
    const d = auditAge(b);
    return d === null ? "never audited" : d >= 7 ? `last audit ${d} days ago` : "";
  }
  const since = sourcesOf(b.slug).length - (b.audit?.sources || 0);
  return since >= 50 ? `${since} sources dropped since the last audit` : "";
}
/** The last audit in one line: when, and what came since. */
function auditLine(b){
  const since = Math.max(0, sourcesOf(b.slug).length - (b.audit?.sources || 0)), d = auditAge(b);
  const when = d === null ? "Never audited" : `Last audit ${fileDay(b.audit.at)}${d ? `, ${d} day${d === 1 ? "" : "s"} ago` : ", today"}`;
  return b.type === "personal" ? `${when} · due every week` : `${when} · ${since} source${since === 1 ? "" : "s"} since`;
}
/** An audit runs once per folder: asked again while it runs, or once it ended, its pane comes back. */
function runAudit(b, resume){

/** The audit's pane is the one on screen: its folder open, the pane in it, the tab in view. */
function auditShown(a){ return S.folder === a.slug && a.inner.isConnected && !document.hidden; }
function clock(ms){ const s = Math.round(ms / 1000); return s < 60 ? `${s}s` : `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")}s`; }
/**
 * The audit's loader: the turning mark, the step it is on, a bar once the
 * count is known, and the time it has run. It ends as one line that says it
 * finished, and the inbox says so too when you were looking elsewhere.
 */
function auditLoader(inner, b){
  const box = el("div","au-load"); box.setAttribute("role","status");
  const top = el("div","au-top"), mark = el("span","spinner"), line = el("span","au-step","Starting"), time = el("span","au-time","0s");
  mark.setAttribute("aria-hidden","true");
  top.append(mark, line, time);
  const track = el("div","mem-track"), bar = el("i"); track.append(bar); track.hidden = true;
  box.append(top, track); inner.append(box);
  const run = S.auditRun = { slug: b.slug, name: b.name, state: "running", step: "Starting", at: Date.now(), inner, seen: false };
  const timer = setInterval(() => { time.textContent = clock(Date.now() - run.at); }, 1000);
  paintInbox();
  return {
    step(text, done, total){
      line.textContent = run.step = text;
      track.hidden = !total; if (total) bar.style.width = `${Math.min(100, Math.round(done / total * 100))}%`;
      paintInbox();
    },
    end(ok, summary){
      clearInterval(timer);
      const took = clock(Date.now() - run.at);
      box.replaceWith(el("div", ok ? "au-fin" : "au-fin bad", ok ? `Audit finished in ${took}.` : `Audit stopped after ${took}.`));
      Object.assign(run, { state: ok ? "done" : "failed", summary: summary || "", seen: auditShown(run) });
      paintInbox();
    },

}
/** An audit ran: the day and the sources are kept, and the inbox lets go of it. */
async function auditDone(b){

/**
 * The same person on two cards, by their names: one name inside the other
 * ("Marc" and "Marc Dupont"), or one card's other name being the other's
 * title. A pair you kept apart is never proposed again.
 */
function samePeople(people, apart){
  const fold = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").trim();
  const names = c => [c.title, ...(c.aliases || [])].map(fold).filter(Boolean);
  const kept = new Set(apart || []), out = [];
  for (let i = 0; i < people.length; i++) for (let j = i + 1; j < people.length; j++){
    const a = people[i], b = people[j], ida = `${a.brain}/${a.slug}`, idb = `${b.brain}/${b.slug}`;
    if (kept.has([ida, idb].sort().join("|"))) continue;
    const na = names(a), nb = names(b);
    const inside = (x, y) => (` ${y} `).includes(` ${x} `);
    if (na.some(x => nb.some(y => x === y || (x.split(" ").length < y.split(" ").length && inside(x, y)) || (y.split(" ").length < x.split(" ").length && inside(y, x)))))
      out.push((b.ev || 0) > (a.ev || 0) ? [b, a] : [a, b]);
  }
  return out.slice(0, 40);
}

/* ============ @ a folder ============
   Typing @ in a message bar lists the folders that chat may read, and a pick writes the folder's name into the message.
   The message goes out with the slugs of the folders it names: the chat reads those, and no other. */
const MAX_TAGS = 4;   // the most folders one message names, as the server holds it
let atMenu = null, atList = [], atAt = 0, atBox = null;
function closeAt(){ atMenu?.remove(); atMenu = null; atList = []; atAt = 0; atBox = null; }
document.addEventListener("pointerdown", e => { if (atMenu && !atMenu.contains(e.target) && e.target !== atBox) closeAt(); }, true);

/** What a chat may be told to read: the folders, and in the personal chat the projects as well. */
function tagChoices(personal){
  const folders = S.brains.filter(b => b.type !== "personal").map(b => ({ slug: b.slug, name: b.name, tag: "" }));
  return personal ? [...folders, ...(S.projects || []).map(p => ({ slug: p.slug, name: p.name, tag: "project" }))] : folders;
}
/** The slugs a message names with @, each once. The longest names are read first, so "@Pricing review" is not taken for "@Pricing". */
function tagsIn(text, choices){
  let rest = String(text ?? ""); const out = [];
  const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  for (const c of [...choices].sort((a, b) => b.name.length - a.name.length)){
    for (const word of new Set([c.name, c.slug])){
      const re = new RegExp(`(^|[\\s(\\[{"'])@${esc(word)}(?=$|[\\s.,;:!?)\\]}"'])`, "giu");
      if (re.test(rest)){ if (!out.includes(c.slug)) out.push(c.slug); rest = rest.replace(re, "$1 "); }
    }
  }
  return out.slice(0, MAX_TAGS);
}
/**
 * A message bar that lists folders when @ is typed. `choices` is read at each keystroke, and returns nothing where this bar
 * takes no tag. Arrows move, Enter or Tab picks, Escape closes.
 */
function attachMentions(ta, choices){
  const plain = t => String(t ?? "").normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();
  /* The word being typed after an @ at the caret, or nothing. */
  const word = () => {
    if (ta.selectionStart !== ta.selectionEnd) return null;
    const pos = ta.selectionStart, m = /(^|[\s(])@([^@\n]{0,40})$/u.exec(ta.value.slice(0, pos));
    return m ? { from: pos - m[2].length - 1, to: pos, q: plain(m[2]) } : null;
  };
  const choose = c => {
    const w = word(); if (!w){ closeAt(); return; }
    ta.setRangeText(`@${c.name} `, w.from, w.to, "end");
    closeAt(); ta.focus(); ta.dispatchEvent(new Event("input", { bubbles: true }));
  };
  const paint = () => {
    if (!ta.isConnected){ if (atBox === ta) closeAt(); return; }
    const w = word(), all = w ? choices() : [];
    if (!w || !all.length){ if (atBox === ta) closeAt(); return; }
    const named = tagsIn(ta.value, all);
    if (named.length >= MAX_TAGS){ closeAt(); return; }
    const left = all.filter(c => !named.includes(c.slug));
    const first = left.filter(c => plain(c.name).startsWith(w.q));
    const list = [...first, ...left.filter(c => !first.includes(c) && plain(c.name).includes(w.q))].slice(0, 8);
    if (!list.length){ closeAt(); return; }
    if (atBox !== ta) atAt = 0;
    atBox = ta; atList = list; atAt = Math.min(atAt, list.length - 1);
    if (!atMenu){ atMenu = el("div","pick-menu at-menu"); atMenu.setAttribute("role","listbox"); document.body.append(atMenu); }
    atMenu.innerHTML = "";
    list.forEach((c, i) => {
      const b = el("button","pk-row" + (i === atAt ? " on" : "")); b.type = "button"; b.setAttribute("role","option");
      b.append(el("span","pk-nm",c.name)); if (c.tag) b.append(el("span","pk-ct",c.tag));
      /* A press keeps the focus in the field, so the caret stays where the word is. */
      b.onmousedown = e => e.preventDefault();
      b.onclick = () => choose(c);
      atMenu.append(b);
    });
    const r = ta.getBoundingClientRect();
    atMenu.style.left = Math.max(8, Math.min(r.left, innerWidth - 328)) + "px";
    atMenu.style.width = Math.min(320, innerWidth - 16) + "px";
    atMenu.style.bottom = (innerHeight - r.top + 8) + "px";
  };
  ta.addEventListener("input", () => { atAt = 0; paint(); });
  ta.addEventListener("click", paint);
  ta.addEventListener("keyup", e => { if (["ArrowLeft","ArrowRight","Home","End"].includes(e.key)) paint(); });
  ta.addEventListener("blur", () => setTimeout(() => { if (atBox === ta && document.activeElement !== ta) closeAt(); }, 150));
  /* First in line: a key that picks a folder never reaches the bar's own Enter, which sends. */
  ta.addEventListener("keydown", e => {
    if (!atMenu || atBox !== ta || e.isComposing) return;
    const stop = () => { e.preventDefault(); e.stopImmediatePropagation(); };
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      stop(); atAt = (atAt + (e.key === "ArrowDown" ? 1 : atList.length - 1)) % atList.length; paint();
    } else if ((e.key === "Enter" || e.key === "Tab") && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey){
      stop(); choose(atList[atAt]);
    } else if (e.key === "Escape"){ stop(); closeAt(); }
  });
}

/* ============ voice ============ */
/* Talk instead of typing. The browser's own speech service listens: Safari
   on iPhone, iPad and Mac, Chrome and Edge. It is free and needs no key.
   Where a browser has none, the mic says how to dictate with the system's
   own, which every phone and computer carries. */
const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
/* The languages the mic offers: code, chip, name. */
const VOICE_LANGS = [["en-US", "EN", "English"], ["fr-FR", "FR", "French"], ["es-ES", "ES", "Spanish"],
  ["de-DE", "DE", "German"], ["it-IT", "IT", "Italian"], ["pt-PT", "PT", "Portuguese"]];
let rec = null, voiceBase = "";
/* Chrome on Android listens badly in one long run: it hands back every partial of a phrase as a result of its own,
   "my", "my god", "my god is small", and joined they read "mymy godmy god is small". It listens one phrase at a time instead. */
const ANDROID = /Android/i.test(navigator.userAgent);
/**
 * What was heard, from the results of one run. A result that is only the start of the one after it is a partial of
 * it and counts for nothing; a word or a short phrase said over and over, 4 times or more, keeps one.
 */
function heard(results){
  const norm = t => t.toLowerCase().replace(/[^\p{L}\p{N} ]+/gu, "").replace(/\s+/g, " ").trim();
  const said = [...results].map(x => String(x?.[0]?.transcript ?? "").trim()).filter(Boolean);
  const out = [];
  for (let i = 0; i < said.length; i++){
    const next = said[i + 1];
    if (next !== undefined && norm(next).startsWith(norm(said[i]))) continue;
    out.push(said[i]);
  }
  return out.join(" ").replace(/(?<![\p{L}\p{N}])((?:\p{L}+\s+){0,5}\p{L}+)(?:\s+\1(?![\p{L}\p{N}])){3,}/giu, "$1");
}
function systemDictation(){
  const ua = navigator.userAgent;
  if (/iPhone|iPad|iPod|Android/.test(ua)) return "Tap the mic on your keyboard to talk.";
  if (/Mac/.test(ua)) return "No voice input in this browser. Press Fn twice to dictate, or open it in Safari or Chrome.";
  if (/Windows/.test(ua)) return "No voice input in this browser. Press Windows + H to dictate, or open it in Chrome or Edge.";
  return "No voice input in this browser. Open it in Chrome or Safari.";
}
function renderMic(){
  const m = $("micBtn");
  m.classList.toggle("on", !!S.listening);
  m.setAttribute("aria-pressed", S.listening ? "true" : "false");
  m.setAttribute("aria-label", S.listening ? "Stop talking" : "Talk");
}
function startVoice(){
  if (!Speech){ S.voiceHint = systemDictation(); renderComposer(); $("input").focus(); return; }
  /* No language picked yet: Settings opens on it. */
  if (!voiceLang()){ S.voiceHint = "Pick the language the mic listens in, then tap the mic."; renderComposer(); openSetupSheet({ voice: true }); return; }
  const r = new Speech();
  r.lang = voiceLang();
  r.interimResults = true;
  r.continuous = !ANDROID;
  /* What was typed stays; the words spoken follow it. */
  const typed = $("input").value.replace(/\s+$/, "");
  voiceBase = typed ? typed + " " : "";
  /* On Android each run ends after a phrase and starts again while the mic is on; two runs in a row with nothing heard end it. */
  let quiet = 0, spoke = false, broke = false;
  r.onresult = e => {
    if (!S.listening) return;
    spoke = true;
    $("input").value = voiceBase + heard(e.results).replace(/^\s+/, "");
    sizeBox(); renderComposer();
  };
  r.onerror = e => {
    const why = e.error;
    if (why !== "no-speech" && why !== "aborted") broke = true;
    S.voiceHint = why === "not-allowed" || why === "service-not-allowed" ? "Allow the microphone for this site, then tap the mic again."
      : why === "language-not-supported" ? `This browser cannot listen in ${voiceName()}. Pick another in Settings, Languages, or open it in Chrome.`
      : why === "network" ? "Voice input needs a connection."
      : why === "no-speech" || why === "aborted" ? "" : "Voice input stopped. Tap the mic to try again.";
  };
  r.onend = () => {
    if (ANDROID && S.listening && rec === r && !r.userStopped && !broke){
      quiet = spoke ? 0 : quiet + 1; spoke = false;
      if (quiet < 2){
        const typedNow = $("input").value.replace(/\s+$/, "");
        voiceBase = typedNow ? typedNow + " " : "";
        try { r.start(); return; } catch { /* the mic ends below */ }
      }
    }
    if (rec === r) rec = null;
    if (S.listening){ S.listening = false; renderMic(); renderComposer(); $("input").focus(); }
  };
  try { r.start(); } catch { return; }
  rec = r; S.listening = true; S.voiceHint = ""; renderMic(); renderComposer();
}
function stopVoice(){ if (rec) rec.userStopped = true; try { rec?.stop(); } catch { /* it had stopped already */ } }
/* The language the mic listens in, picked in Settings: the speech service
   hears one language at a time and cannot tell French from English by
   itself, so nothing is guessed. With none picked, the mic asks for one. The
   demo keeps the pick in this browser. */
function voiceLang(){
  const set = S.demo ? localVoice() : S.models?.voice;
  return VOICE_LANGS.some(x => x[0] === set) ? set : "";
}
function voiceName(){ return (VOICE_LANGS.find(x => x[0] === voiceLang()) || ["", "", ""])[2]; }
function localVoice(){ try { return localStorage.getItem("octopus.voice") || ""; } catch { return ""; } }
function setLocalVoice(v){ try { localStorage.setItem("octopus.voice", v); } catch { /* kept for this visit only */ } S.models = { ...(S.models || {}), voice: v }; }

$("level").onclick = e => {
