/* ---- health ---- */
function healthTone(x){ return x >= 7 ? "h-hi" : x >= 4 ? "h-mid" : "h-lo"; }
function fmtScore(x){ return Number.isInteger(x) ? String(x) : x.toFixed(1); }
/** The ring on a brain row: it fills with the score, and opens the breakdown. */
function healthRing(h, b){
  const r = el("span","hring");
  const C = 2 * Math.PI * 9, fill = Math.max(0, Math.min(1, h.score / 10)) * C;
  r.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><circle class="tr" cx="12" cy="12" r="9"/>
    <circle class="ar ${healthTone(h.score)}" cx="12" cy="12" r="9" stroke-dasharray="${fill.toFixed(2)} ${C.toFixed(2)}"/>
    <text x="12" y="12.4">${fmtScore(h.score)}</text></svg>`;
  r.title = `Health ${fmtScore(h.score)}/10 against the best brain. ${h.best}`;
  r.setAttribute("role","button"); r.setAttribute("aria-label", `Health of ${b.name}: ${fmtScore(h.score)} out of 10`);
  r.onclick = e => { e.stopPropagation(); openHealthSheet(b); };
  return r;
}

/**
 * The four parts of a brain's score, each against the best brain on it, and
 * the move that closes the widest gap.
 */
function openHealthSheet(b){
  const h = S.health[b.slug]; if (!h) return;
  closeSide();
  const veil = el("div","veil");
  const NAMES = { variety: "Variety", depth: "Depth", fresh: "Freshness", conflicts: "Conflicts", tidy: "Tidiness" };
  const messy = !!h.parts.tidy && /to tidy/.test(h.parts.tidy.say);
  const lead = Object.values(S.health).find(x => x.top);
  const leadName = lead ? (S.brains.find(x => x.slug === lead.slug)?.name || lead.slug) : "";
  veil.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <header><h3>${esc(b.name)}: ${fmtScore(h.score)}/10</h3>
        <p>${h.top ? "The best brain here. Every other score is measured against it."
                   : `Measured against the best brain${leadName ? `, ${esc(leadName)},` : ""} which reads 10.`}</p></header>
      <div class="f" id="hbParts"></div>
      <div class="f"><div class="hb-best"><b>Best move</b>${esc(h.best)}</div></div>
      <footer>${h.open ? `<button class="ghost" id="hbSettle">Settle conflicts</button>` : ""}${messy && !S.demo ? `<button class="ghost" id="hbTidy">Tidy it</button>` : ""}<button class="ghost" id="hbOpen">Open the folder</button><button class="go" id="hbDone">Done</button></footer>
    </div>`;
  document.body.append(veil);
  const parts = veil.querySelector("#hbParts");
  for (const k of ["variety","depth","fresh","conflicts","tidy"]){
    const p = h.parts[k]; if (!p) continue;
    const row = el("div","hb-row");
    row.innerHTML = p.counted
      ? `<div class="hb-top">${NAMES[k]}<span>${p.pct}% of the best</span></div>
         <div class="hb-bar"><i class="${healthTone(p.pct / 10)}" style="width:${p.pct}%"></i></div>
         <div class="hb-say">${esc(p.say)}</div>`
      : `<div class="hb-top">${NAMES[k]}<span>not counted</span></div><div class="hb-say">${esc(p.say)}</div>`;
    parts.append(row);
  }
  const onKey = e => { if (e.key === "Escape" && veil === [...document.querySelectorAll(".veil")].pop()) shut(); };
  const shut = () => { document.removeEventListener("keydown", onKey); veil.remove(); };
  document.addEventListener("keydown", onKey);
  veil.querySelector("#hbDone").onclick = shut;
  veil.onclick = e => { if (e.target === veil) shut(); };
  veil.querySelector("#hbOpen").onclick = () => { shut(); openFolder(b); };
  const st = veil.querySelector("#hbSettle");
  if (st) st.onclick = () => { shut(); settleFrom(null, b.slug); };
  const td = veil.querySelector("#hbTidy");
  if (td) td.onclick = () => { shut(); openFolder(b); document.querySelector("#fvTidy")?.click(); };
}

/**
 * The conflict deck, opened from the map or a health sheet: this concept's
 * clashes first, or this brain's.
 */
async function settleFrom(id, brain){
  let r;
  try { r = await api("/api/conflicts", {}); } catch (e) { chatMsg(e.message); return; }
  const list = (r.conflicts || []).slice();
  const rank = c => (id && c.id === id) ? 2 : (brain && c.brain === brain) ? 1 : 0;
  list.sort((x, y) => rank(y) - rank(x));
  if (!list.length){ loadHealth(); return; }
  openConflictDeck(list, r.others || 0);
}

/**
 * Every folder, in three groups: this workspace's own, then the ones another
 * workspace lets you ask and drop into, then the ones you may only ask. A
 * group shows when it holds a folder, and the fullest folder leads each.
 */
function renderSide(){
  paintFolds();
  const box = $("brains"); box.innerHTML = "";
  $("bcount").textContent = S.brains.length || "";
  if (!S.brains.length){
    box.append(el("div","empty-side","None yet. A folder holds one subject or one person's view, with a one line scope."));
  } else {
    /* By type, then the fullest first: what you said, the people, the
       subjects. A folder shared in, or one only asked, says so on its row. */
    const kind = b => b.type === "personal" ? "personal" : b.type === "person" ? "person" : "subject";
    const bySize = (x, y) => conceptsOf(y.slug).length - conceptsOf(x.slug).length || x.name.localeCompare(y.name);
    const groups = [["personal","Personal"], ["person","People"], ["subject","Subjects"]]
      .map(([k, head]) => ({ head, rows: S.brains.filter(b => kind(b) === k).sort(bySize) }))
      .filter(g => g.rows.length);
    for (const g of groups){
      const h = el("div","group-h",g.head); h.dataset.n = g.rows.length;
      box.append(h);
      for (const b of g.rows) box.append(brainRow(b));
    }
  }
  /* On a phone, one button closes the drawer on the ticked folders. */
  const go = $("sideGo");
  go.hidden = !S.picks.length;
  /* It closes the drawer on the folders ticked: New chat, at the top, is the one way to start a chat. */
  go.textContent = S.picks.length ? `Done · ${S.picks.length === 1 ? picksName() : S.picks.length + " folders"} ticked` : "";
}

/** A model in use, as Settings names it: short on the button, whole in its title. */
function modelLabel(which = "chat"){
  const m = S.models || {}, live = m[which] || (which === "chat" ? S.model : ""), def = m[which + "Default"] || "";
  const picked = !!live && !!def && live !== def;
  return {
    val: live ? live.split("/").pop() : "default", picked,
    title: `${live || "the server default"}${picked ? ", picked for this workspace" : ", the default"}. Click to change it. Build ${window.OCTOPUS_BUILD}.`,
  };
}

/**
 * Everything about one brain, in one place: what it is called, and the line
 * that decides what belongs inside.
 *
 * A new name moves the slug, and the slug is how concepts, source rows and
 * counted candidates find their brain. The server moves all three in one write
 * and reports the counts, which is what the receipt below shows.
 */
function openBrainSheet(b){
  closeSide();
  const veil = el("div","veil");
  veil.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true">
      <header><h3>${esc(b.name)}</h3>
      <p>The scope line is the only test of what belongs inside. Change it and the next drop is judged
        against the new line.</p></header>
      <div class="f"><label for="rName">Name</label><input id="rName" autocomplete="off"></div>
      <div class="f"><label for="rScope">Scope, in one line</label><textarea id="rScope"></textarea></div>
      <div class="f" id="rMergeF" style="border-top:1px solid var(--line); margin-top:14px; padding-top:14px">
        <label for="rInto">Merge into another folder</label>
        <div class="hint" style="margin:0 0 8px">Every concept, source and link moves there, and this folder goes. A concept with the same title joins its twin.</div>
        <div style="display:flex; gap:8px"><select id="rInto" class="pick" style="flex:1; min-width:0"></select><button class="ghost" id="rMerge" type="button">Merge</button></div></div>
      <div class="f"><div id="rMsg" class="bad" role="alert"></div></div>
      <footer><button class="ghost" id="rCancel">Cancel</button><button class="go" id="rSave">Save</button></footer>
    </div>`;
  document.body.append(veil);
  const nameI = veil.querySelector("#rName"), scopeI = veil.querySelector("#rScope"),
        msg = veil.querySelector("#rMsg"), save = veil.querySelector("#rSave");
  nameI.value = b.name || ""; scopeI.value = b.scope || "";
  const shut = () => veil.remove();
  veil.querySelector("#rCancel").onclick = shut;

  /* Merge into: only this workspace's own folders, never a personal one. */
  const home = x => (x.space || S.space) === S.space;
  const targets = S.brains.filter(x => x.slug !== b.slug && x.type !== "personal" && home(x) && !readOnly(x))
    .sort((x, y) => x.name.localeCompare(y.name));
  const into = veil.querySelector("#rInto"), merge = veil.querySelector("#rMerge");
  veil.querySelector("#rMergeF").hidden = b.type === "personal" || !home(b) || !targets.length;
  into.innerHTML = `<option value="">Pick a folder</option>` + targets.map(x => `<option value="${esc(x.slug)}">${esc(x.name)}</option>`).join("");
  into.onchange = () => { merge.textContent = "Merge"; merge.classList.remove("sure"); };
  merge.onclick = async () => {
    const t = targets.find(x => x.slug === into.value);
    if (!t){ into.focus(); return; }
    /* A second click goes: the folder cannot come back. */
    if (!merge.classList.contains("sure")){ merge.classList.add("sure"); merge.textContent = `Sure? Into ${t.name}`; return; }
    merge.disabled = true; msg.className = "spin"; msg.textContent = "Merging";
    let r;
    try { r = await api("/api/brain/merge", { from: b.slug, into: t.slug }); }
    catch (e) { merge.disabled = false; msg.className = "bad"; msg.textContent = e.message; return; }
    shut();
    if (S.folder === b.slug) S.folder = null;
    S.picks = S.picks.filter(x => x !== b.slug);
    await refresh();
    openFolder(S.brains.find(x => x.slug === t.slug));
    push("ai", x => { x.innerHTML = rich(`**${esc(r.fromName)}** is now part of **${esc(r.intoName)}**: ${r.moved + r.joined} concepts` +
      `${r.joined ? `, ${r.joined} joined to a twin` : ""}, ${r.sources} source${r.sources === 1 ? "" : "s"}.`); });
  };
  veil.onclick = e => { if(e.target===veil) shut(); };
  setTimeout(()=>nameI.focus(),30);

  save.onclick = async () => {
    const nm = nameI.value.trim(), sc = scopeI.value.trim();
    if (nm.length < 2){ msg.className="bad"; msg.textContent="give a name of at least 2 characters"; nameI.focus(); return; }
    save.disabled = true; msg.className="spin"; msg.textContent = "Saving";
    try {
      const r = await api("/api/brain/rename", { slug: b.slug, name: nm, scope: sc });
      if (r.error) throw new Error(r.error);
      shut(); await refresh();
      if (S.scope === b.slug) S.scope = r.slug;
      S.into = S.into.map(x => x === b.slug ? r.slug : x);
      render();
      const m = r.moved || {};
      push("ai", x => { x.innerHTML = rich(
        (r.name !== b.name
          ? `**${esc(b.name)}** is now **${esc(r.name)}**, at \`${esc(r.slug)}\`.` +
            (r.slug !== b.slug
              ? ` Moved with it: ${m.concepts||0} concepts and ${m.sources||0} sources.`
              : "")
          : `**${esc(r.name)}** saved.`) +
        `\n\nScope: ${esc(r.scope || sc)}`); });
    } catch(e){ save.disabled=false; msg.className="bad"; msg.textContent = e.message; }
  };
}

/** The picker's face: the space's mark, where it goes, and to which brain. */
function renderScope(){
  if (!S.brains.some(b => b.slug === S.scope)) S.scope = "all";
  /* The ticks follow a folder picked anywhere else: a reopened chat, a new
     folder, Ask about it. Two or more ticked ask with the scope at "all". */
  S.picks = S.picks.filter(x => S.brains.some(b => b.slug === x && b.type !== "personal"));
  if (isPersonal(S.scope)) S.picks = [];
  else if (S.scope !== "all") S.picks = [S.scope];
  else if (S.picks.length === 1) S.picks = [];
  S.into = S.into.filter(x => S.brains.some(b => b.slug === x) && !isPersonal(x) && !readOnly(S.brains.find(b => b.slug === x)));
  if (isPersonal(S.scope) && S.mode === "drop") S.mode = "ask";
  const drop = S.mode === "drop";
  const nameOf = x => S.brains.find(b => b.slug === x)?.name || x;
  /* Asking across every brain needs no label: the name says it. */
  $("scopeLabel").textContent = drop ? "Into" : isPersonal(S.scope) ? "Chat with" : "";
  /* A drop can feed several brains: the first by name, then how many more. */
  $("scopeVal").textContent = drop
    ? (!S.into.length ? "Suggest for me" : S.into.length === 1 ? nameOf(S.into[0]) : `${nameOf(S.into[0])} +${S.into.length - 1}`)
    : S.picks.length > 1 ? `${nameOf(S.picks[0])} +${S.picks.length - 1}`
    : S.scope === "all" ? "All folders" : nameOf(S.scope);
  const mark = $("spaceMark")?.getAttribute("src");
  if (mark && $("scopeMark").getAttribute("src") !== mark) $("scopeMark").src = mark;
  if (pickMenu) fillPick();
}

/* The picker's menu, drawn on the page itself so the scrolling bar of a phone
   never clips it, and placed above the button, since the box sits low. */
var pickMenu = null;   // var, not let: render() runs before this line is reached
function fillPick(){
  const m = pickMenu, drop = S.mode === "drop";
  const scroll = m.scrollTop;
  m.innerHTML = "";
  m.classList.toggle("multi", drop);
  m.setAttribute("aria-multiselectable", drop ? "true" : "false");
  /* Asking reads one folder, the ones ticked in the side panel, or all of
     them. Dropping ticks as many as the source belongs in, and the menu stays
     open while they are ticked. */
  const isOn = slug => drop ? (slug === "all" ? !S.into.length : S.into.includes(slug))
    : S.picks.length > 1 ? S.picks.includes(slug) : S.scope === slug;
  const row = (slug, name, sub, count, b) => {
    const on = isOn(slug);
    const r = el("button","pk-row" + (on ? " on" : ""));
    r.setAttribute("role","option"); r.setAttribute("aria-selected", on ? "true" : "false");
    const nm = el("span","pk-nm", name);
    if (sub) nm.append(el("span","pk-sub", sub));
    const mark = el("span", drop && slug !== "all" ? "pk-box" : "pk-dot");
    if (drop && slug !== "all") mark.innerHTML = `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 5 8.6l4.5-5"/></svg>`;
    r.append(mark);
    if (b) r.append(brainIcon(b));
    r.append(nm);
    if (count != null) r.append(el("span","pk-ct", count));
    r.onclick = e => {
      e.stopPropagation();
      if (!drop){
        crossing(slug);
        if (isPersonal(slug)){ S.picks = []; S.scope = slug; S.into = []; } else setPicks(slug === "all" ? [] : [slug]);
        closePick(); render(); $("input").focus(); return;
      }
      if (slug === "all") S.into = [];
      else S.into = S.into.includes(slug) ? S.into.filter(x => x !== slug) : [...S.into, slug];
      S.scope = S.into.length === 1 ? S.into[0] : "all";
      S.picks = S.into.slice();
      render();
    };
    return r;
  };
  const ideas = S.concepts.length;
  m.append(row("all", drop ? "Suggest for me" : "All folders",
    drop ? "The AI picks where it belongs" : `${S.brains.length} folder${S.brains.length===1?"":"s"}, ${ideas} concept${ideas===1?"":"s"}`));
  if (drop) m.append(el("div","pk-h","Or tick the folders to feed"));
  if (!drop) m.append(el("div","pk-h","Or one folder"));
  for (const b of ordered()) if (!drop || (b.type !== "personal" && !readOnly(b))) m.append(row(b.slug, b.name, b.type === "personal" ? "your chat" : "", String(conceptsOf(b.slug).length), b));
  if (drop){
    const done = el("button","pk-done", S.into.length > 1 ? `Feed ${S.into.length} folders` : "Done");
    done.onclick = e => { e.stopPropagation(); closePick(); $("input").focus(); };
    m.append(done);
  }
  m.scrollTop = scroll;
}
function placePick(){
  const r = $("scopeBtn").getBoundingClientRect(), w = pickMenu.offsetWidth;
  pickMenu.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + "px";
  pickMenu.style.bottom = (innerHeight - r.top + 8) + "px";
}
function openPick(){
  if (pickMenu) return closePick();
  pickMenu = el("div","pick-menu");
  pickMenu.setAttribute("role","listbox");
  fillPick();
  document.body.append(pickMenu);
  placePick();
  $("scopeBtn").setAttribute("aria-expanded","true");
  (pickMenu.querySelector(".pk-row.on") || pickMenu.querySelector(".pk-row"))?.focus();
}
function closePick(){
  if (!pickMenu) return;
  pickMenu.remove(); pickMenu = null;
  $("scopeBtn").setAttribute("aria-expanded","false");
  paintBar();
}

/**
 * The chat bar stays a one-line pill, so the thread keeps the page. It opens
 * to its folders, levels and hints when it is wanted: a click in it, text in
 * it, a drop, its folder menu open, or the mic on.
 */
var fullPlaceholder = "";   // var: renderComposer runs before this line is reached
/* The folded bar's few words, where the full line would not fit beside the mic. */
var shortPlaceholder = "";
function paintBar(){
  const wrap = document.querySelector(".composer-wrap");
  if (!wrap) return;
  const drop = S.mode === "drop";
  const open = wrap.contains(document.activeElement) || !!$("input").value.trim()
    || (drop && !!$("srcInput").value.trim()) || !!pickMenu || !!S.listening;
  wrap.classList.toggle("compact", !open);
  /* Folded, a drop says what it takes in a few words; open, it says it in full. */
  $("input").placeholder = !open && drop ? "Drop a link, a text or a document" : !open && shortPlaceholder ? shortPlaceholder : fullPlaceholder;
}

function renderComposer(){
  /* A personal brain is a chat: no Drop, no levels, and a way to bring in
     what another assistant already knows about you. */
  const about = S.mode === "ask" ? S.concept : null;
  const mine = S.mode === "ask" && isPersonal(S.scope) && !about;
  const asking = mine && !!S.iv[S.scope]?.on;
  paintAbout(about);
  $("memBtn").hidden = !mine || S.demo || asking;
  /* It appears once there is something to forget. */
  $("freshBtn").hidden = S.mode !== "ask" || !S.thread.length || !!S.folder;
  const drop = S.mode==="drop";
  $("srcLine").hidden = !drop;
  shortPlaceholder = about ? `About ${about.title}` : asking ? "Your answer" : mine ? "Tell it anything" : "";
  fullPlaceholder = drop
    ? "Paste the text or the transcript here, or add a document. Leave it empty when the source is a link."
    : about ? (about.personal ? `Tell or ask anything about ${about.title}. What you say changes it.` : `Ask about ${about.title}.`)
    : asking ? "Your answer, in your own words"
    : mine ? "Tell it anything: a plan, a decision, an idea. Or ask what you said."
    : S.picks.length > 1 ? `Ask ${picksName()}.`
    : S.scope==="all" ? "Ask anything your folders have read."
                      : "Ask " + (S.brains.find(b=>b.slug===S.scope)?.name || "this folder") + ".";
  $("levelWrap").hidden = drop || mine || !!about || isPersonal(S.scope);
  /* A chat about one concept reads that one alone: its chip stands for the folders. */
  $("scopeBtn").hidden = !!about;
  for (const x of $("level").children){
    const on = x.dataset.v === S.level;
    x.classList.toggle("on", on); x.setAttribute("aria-checked", on ? "true" : "false");
  }
  $("fileBtn").hidden = !drop;
  /* The mic is for asking and talking. A drop takes a source, not a voice. */
  $("micBtn").hidden = drop;
  if (drop && S.listening) stopVoice();
  $("footNote").textContent = about
    ? (about.personal ? `This chat reads ${about.title} alone. A fact, a date or a correction you give is written to it at once.`
      : `This chat reads ${about.title} alone. A new chat reads every folder.`)
    : asking
    ? "Interview: one question at a time, each answer filed as dated notes. Say skip to pass, or Stop any time."
    : mine
    ? "Personal, alpha: your words are filed as dated notes. It calls your other folders when they help, and only this chat reads it."
    : drop
    ? "The source gets read once, then you reply to one card."
    : S.level==="educational" ? "Educational: terms defined, mechanism built, one worked example."
    : S.level==="learning" ? "Learning: no answer given. Steps and hints to reach it yourself."
    : "Normal: the answer carries the numbers. Sources sit on one line underneath.";

  const t = $("input").value.trim();
  const src = drop ? $("srcInput").value.trim() : "";
  /* A drop needs something to read: content, a pasted transcript, or a link
     the server can open. A source named with neither is a title and nothing
     else, so the button stays off and the hint says what is missing. */
  const ready = hasContent(src, t);
  const busy = drop ? S.dropBusy : chatBusy();
  $("send").disabled = busy || (drop ? !ready : !t);
  $("tHint").textContent = busy ? (drop ? "reading" : "working") : drop ? dropHint(src, t)
    : S.listening ? `Listening in ${voiceName()}. Tap the mic to stop.` : (S.voiceHint || "");
  paintIv();
  paintBar();
}

/* Declarations, not consts: renderComposer runs once before this line is
   reached, when the shell paints ahead of the first state call. */
function linkIn(s){ return /https?:\/\/\S+/i.test(s || ""); }
function hasContent(src, content){
  return !!(content || linkIn(src) || linkIn(content));
}

/**
 * What the drop still needs, in one line.
 *
 * It says the next move rather than the rule, because the rule only matters at
 * the moment a field is empty.
 */
function dropHint(src, content){
  if (!src && !content) return "";
  if (!src && content) return "name the source, so a repeat is caught later";
  if (hasContent(src, content)) return linkIn(src) && !content
    ? "the link gets opened, video or article" : "";
  return "paste what it says, drop a document, or give a link";
}

/**
 * The octopus's loop, see-through on the page.
 *
 * The WebM carries its transparency in 270 KB. Safari and every iPhone
 * browser play WebM without that transparency, a black square, so they get
 * the animated WebP instead. Asked for less motion, it stays still.
 */
function octopusLoop(){
  const ua = navigator.userAgent;
  const webkit = /iPhone|iPad|iPod/.test(ua) || (/Safari\//.test(ua) && !/Chrome|Chromium|Edg|OPR|Firefox/.test(ua));
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return `<img class="zero-mark" src="/brand/logo-mark.png" alt="">`;
  return webkit
    ? `<img class="zero-loop" src="/brand/octopus-loop.webp" alt="">`
    : `<video class="zero-loop" src="/brand/octopus-loop.webm" autoplay loop muted playsinline disablepictureinpicture aria-hidden="true"></video>`;
}

function renderZero(){
  const th = $("thread");
  /* The shell paints before the state call says which space this is, so an
     empty state drawn for the wrong space is replaced rather than kept. */
  const old = th.querySelector(".zero");
  const mark = markOf(), logo = !!S.logo, ex = examples();
  if (old && (old.dataset.space !== S.space || old.dataset.mark !== mark || old.dataset.ex !== ex.join("|"))) old.remove();
  if (th.children.length) return;
  const z = el("div","zero");
  z.dataset.space = S.space; z.dataset.mark = mark; z.dataset.ex = ex.join("|");
  z.innerHTML = `
    ${S.space === "octopus" && !logo ? octopusLoop() : `<img class="zero-mark" src="${esc(S.space === "squidgy" && !logo ? "/brand/squidgy-mark.png" : mark)}" alt="">`}
    <h2>A folder that gets smarter every time you feed it.</h2>
    <p class="lede">Feed it any source and it reads the whole thing, files each idea under the right subject, flags every claim that clashes with what you already hold, then answers from dated evidence.</p>`;
  if (ex.length){
    const t = el("div","try"); t.append(el("b",null,"Try"));
    for (const q of ex){ const b = el("button",null,q); b.type = "button"; b.onclick = () => { $("input").value = q; go(); }; t.append(b); }
    z.append(t);
  }
  th.append(z);
}

/**
 * Three questions the brains on screen can answer: the concept with the most
 * sources in each of the three fullest shared brains. A personal chat gets none.
 */
function examples(){
  if (S.mode !== "ask" || isPersonal(S.scope)) return [];
  const pool = S.brains.filter(b => b.type !== "personal" && (S.scope === "all" || b.slug === S.scope));
  const out = [];
  for (const b of [...pool].sort((x, y) => conceptsOf(y.slug).length - conceptsOf(x.slug).length)){
    const top = conceptsOf(b.slug).slice().sort((x, y) => (y.src || 0) - (x.src || 0) || (y.ev || 0) - (x.ev || 0))[0];
    if (top) out.push(`What does ${b.name} hold on ${top.title.replace(/\.$/, "").replace(/^[A-Z](?![A-Z])/, m => m.toLowerCase())}?`);
    if (out.length === 3) break;
  }
  return out;
}

/* ============ thread ============ */
const clearZero = () => $("thread").querySelector(".zero")?.remove();
const bottom = (t = $("thread")) => { t.scrollTop = t.scrollHeight; };

/* A message lands in the chat, or, from a drop, on the Drop screen: the chat
   only asks. */
function push(kind, build, where = $("thread")){
  if (where === $("thread")) clearZero(); else where.querySelector(".zero")?.remove();
  const wrap = el("div","msg "+(kind==="me"?"me":"ai"));
  const col = el("div","col");
  if (kind !== "me"){
    const who = el("div","who");
    who.append(el("span",null,S.spaceName));
    const b = S.brains.find(x=>x.slug===S.scope);
    if (b) who.append(el("span","sc","· "+b.name));
    col.append(who);
  }
  const body = el("div","body");
  col.append(body); wrap.append(col); where.append(wrap);
  build(body); bottom(where);
  return body;
}
function says(text, attach, where){
  push("me", b => { b.textContent = text; if (attach) b.append(el("span","attach",attach)); }, where);
}
/* The same three, on the Drop screen. */
const dpush = (kind, build) => push(kind, build, $("dropThread"));
const dsays = (text, attach) => says(text, attach, $("dropThread"));
const dthinking = label => thinking(label, $("dropThread"));
const dbottom = () => bottom($("dropThread"));
/* What the space's mascot is up to while an answer is on its way, with the
   step it stands for in brackets. The lines follow an answer's order, one
   every 2.4 seconds: the titles are searched, matched, the concepts read,
   the evidence weighed, the answer written. A long wait alternates the last
   two, which is where a long answer spends its time. */
const WAITING = {
  octopus: [
    ["Octopus is reaching into every brain...", "searching"],
    ["Octopus is feeling for the right concepts...", "matching"],
    ["Eight arms, sorting the notes...", "reading"],
    ["Octopus is untangling the answer...", "weighing"],
    ["Octopus is inking the key points...", "writing"],
  ],
  squidgy: [
    ["Squidgy is sniffing around...", "searching"],
    ["Squidgy picked up a scent...", "matching"],
    ["Squidgy is digging through the notes...", "reading"],
    ["Squidgy is fetching the best bits...", "weighing"],
    ["Squidgy is wagging, almost there...", "writing"],
  ],
};

/* Any other workspace waits in its own name. */
const waitingFor = name => [
  [`${name} is searching every title...`, "searching"],
  [`${name} is matching the concepts...`, "matching"],
  [`${name} is reading the notes...`, "reading"],
  [`${name} is weighing the evidence...`, "weighing"],
  [`${name} is writing the answer...`, "writing"],
];

/**
 * The turning mark and a line. Without a label, the line is the mascot's,
 * and it changes while the wait lasts. A drop's steps pass their own label,
 * because "part 3 of 8" says more than a joke.
 */
/**
 * The browser tab says what a drop is doing, so a long one can run while
 * another tab is open: "Reading 3 of 8 · Octopus". A card or a store that
 * lands while the tab is hidden says so until the tab is looked at.
 */
function tabTitle(step){ document.title = step ? `${step} \u00b7 ${S.spaceName}` : S.spaceName; }
function tabStep(label){
  const t = String(label || ""), n = t.match(/(\d+) of (\d+)/), of = n ? ` ${n[1]} of ${n[2]}` : "";
  const step = /^Checking for a repeat/.test(t) ? "Checking"
    : /^Opening the link/.test(t) ? "Opening"
    : /^Reading/.test(t) ? "Reading" + of
    : /^Comparing against/.test(t) ? "Filing" + of
    : /^Rewriting the positions/.test(t) ? "Storing" + of : "";
  if (step) tabTitle(step);
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && /^(Card ready|Stored) /.test(document.title)) tabTitle("");
});

function thinking(label, where){
  tabStep(label);
  if (where && where === $("dropThread")) dropStep(label);
  return push("ai", b => thinkInto(b, label), where);
}
/** The turning mark and its line, inside a message already on screen. */
function thinkInto(b, label){
  const t = el("div","thinking"), mark = el("span","spinner");
  mark.setAttribute("aria-hidden", "true");
  t.setAttribute("role", "status");
  const line = el("span","tl",label||"Thinking");
  t.append(mark, line);
  b.append(t);
  const lines = !label && (WAITING[S.space] || waitingFor(S.spaceName));
  if (lines){
    const show = i => { line.textContent = lines[i][0] + " "; line.append(el("span","act",`(${lines[i][1]})`)); };
    let i = 0;
    show(i);
    const timer = setInterval(() => {
      /* The wait ended when the line left the page. */
      if (!line.isConnected || t.dataset.fixed){ clearInterval(timer); return; }
      i = i < lines.length - 1 ? i + 1 : lines.length - 2;
      show(i);
    }, 2400);
  }
}
function setThinking(body, label){
  tabStep(label);
  if (body.closest?.("#dropThread")) dropStep(label);
  const t = body.querySelector(".thinking");
  const s = body.querySelector(".thinking .tl");
  if (t) t.dataset.fixed = "1";
  if (s) s.textContent = label;
}
/* A failure worth trying again as it was: the connection, the clock, a busy model. */
const RETRYABLE = /did not answer|ran past|unreachable|timed out|still\s(thinking|writing)|sent nothing|overloaded|rate limit|429|50[0-9]|busy|temporar/i;
/**
 * The error, and what to do about it: Try again when the failure was the
 * connection or the clock and the caller can send it again, and Send
 * feedback, which mails the error to the people who run Tasu.
 */
function fail(body, msg, o = {}){
  tabTitle("");
  body.innerHTML = "";
  const text = msg || "Something failed on the way. Send it again.";
  const e = el("div","err");
  e.append(el("b",null,"Nothing was stored"), el("span",null,text));
  const acts = el("div","err-acts");
  if (o.retry && RETRYABLE.test(text)){
    const again = el("button","mini err-go","Try again"); again.type = "button";
    again.onclick = () => { if (!again.disabled){ again.disabled = true; o.retry(); } };
    acts.append(again);
  }
  if (text !== "locked") acts.append(feedbackButton(text, { ...o, where: o.where || (body.closest?.("#dropThread") ? "drop" : "chat") }));
  e.append(acts);
  body.append(e);
}
/** Send feedback: the error, where it happened and the message behind it, mailed once. */
function feedbackButton(error, o){
  const b = el("button","mini err-fb","Send feedback"); b.type = "button";
  b.title = "Mails this error to the people who run Tasu";
  b.onclick = async () => {
    b.disabled = true; b.textContent = "Sending";
    try {
      await api("/api/feedback", { error, where: o.where, q: o.q || "", chat: S.chatId || "", personal: isPersonal(o.scope ?? S.scope),
        agent: navigator.userAgent });
      b.textContent = "Sent. Thank you";
    } catch (e) { b.disabled = false; b.textContent = "Send feedback"; b.title = "Not sent: " + e.message; b.after(el("span","err-why", "Not sent: " + e.message)); }
  };
  return b;
}

/* ============ background work and the inbox ============
   A question runs on whatever opens next: another chat, a folder, Drop. It
   lands in the chat it was asked in, and the inbox, top right, lists what is
   on its way, what landed unread, a drop not finished, and the open clashes. */

/** The chat on screen: its saved id, or the draft a new chat is until its first answer. */
function currentKey(){ return S.chatId || S.draft; }
/** A question on its way in the chat on screen. Another chat stays free. */
/* Declarations, not consts: renderComposer reads these before this line runs. */
function chatBusy(){ return S.jobs.some(j => j.status === "running" && j.key === currentKey()); }
var jobSeq = 0;

function addJob(q, about, label){
  const j = { id: ++jobSeq, q, key: currentKey(), chat: S.chatId, status: "running", seen: false, at: Date.now(),
    scope: S.scope, picks: S.picks.slice(), concept: about || null, label: label || "" };
  S.jobs.push(j);
  paintInbox(); renderChats();
  return j;
}
/** The answer names its chat: a draft still on screen becomes that chat. True when it is on screen. */
function landed(j, r){
  const here = currentKey() === j.key;
  if (r && r.chat){ if (here && !S.chatId) S.chatId = r.chat; j.key = j.chat = r.chat; loadChats(); }
  return here;
}
function endJob(j, ok){
  j.status = ok ? "done" : "failed"; j.done = Date.now();
  /* Read when it landed in front of you; otherwise it waits in the inbox. */
  j.seen = !document.hidden && S.mode === "ask" && !S.folder && currentKey() === j.key && !!j.body?.isConnected;
  /* What was read is let go; the list never grows past 30. */
  S.jobs = S.jobs.filter(x => x.status === "running" || !x.seen || Date.now() - x.done < 60000).slice(-30);
  paintInbox(); renderChats();
}
/** What is on screen now counts as read. */
function markSeen(){
  let n = 0;
  if (S.mode === "ask" && !S.folder && !document.hidden)
    for (const j of S.jobs) if (!j.seen && j.status !== "running" && j.key === currentKey()){ j.seen = true; n++; }
  if (S.mode === "drop" && !document.hidden && S.dropJob && !S.dropJob.seen){ S.dropJob.seen = true; n++; }
  if (n){ paintInbox(); renderChats(); }
}
document.addEventListener("visibilitychange", markSeen);

/** Where the drop stands: running, a card to review, storing, stored, waiting on a choice, failed. Null when done with. */
function dropState(state, title){
  if (!state){ S.dropJob = null; paintInbox(); return; }
  S.dropJob = { ...(S.dropJob || {}), state, ...(title ? { title: String(title).slice(0, 90) } : {}),
    step: state === "running" ? (S.dropJob?.step || "") : "", seen: S.mode === "drop" && !document.hidden, at: Date.now() };
  paintInbox();
}
function dropStep(label){ if (S.dropJob && label){ S.dropJob.step = String(label); paintInbox(); } }
/** A drop's run is over: a card waits, or the last message says how it ended. */
function dropSettled(){
  if (S.pendingCard){ if (S.dropJob?.state !== "card") dropState("card"); return; }
  if (S.dropJob && !["running", "storing"].includes(S.dropJob.state)) return;
  const last = $("dropThread").lastElementChild;
  dropState(last?.querySelector(".err") ? "failed" : last?.querySelector("button") ? "waiting" : "ended");
}

/** The open clashes across the folders, from the health check. */
function openClashes(){ return Object.values(S.health || {}).reduce((n, h) => n + (Number(h.open) || 0), 0); }
function ago(t){ const s = Math.max(0, Math.round((Date.now() - t) / 1000)); return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)} min` : `${Math.floor(s / 3600)} h`; }

/** The bubble's count, and the panel when it is open. */
function paintInbox(){
  const btn = $("inboxBtn"); if (!btn) return;
  const unread = S.jobs.filter(j => j.status !== "running" && !j.seen).length;
  const running = S.jobs.filter(j => j.status === "running").length;
  const d = S.dropJob;
  const dropWaits = d && (d.state === "card" || (!d.seen && ["stored", "waiting", "failed", "ended"].includes(d.state))) ? 1 : 0;
  const n = unread + dropWaits + openClashes();
  $("inboxN").hidden = !n; $("inboxN").textContent = n > 99 ? "99+" : String(n);
  btn.classList.toggle("run", running > 0 || (!!d && ["running", "storing"].includes(d.state)));
  btn.setAttribute("aria-label", n ? `Inbox, ${n} waiting` : "Inbox");
  if (!$("inbox").hidden) paintInboxPanel();
}

function paintInboxPanel(){
  const box = $("inbox"); box.innerHTML = "";
  box.append(el("h3",null,"Inbox"));
  const group = (title, rows) => { if (!rows.length) return; const g = el("section","ib-g"); g.append(el("h4",null,title), ...rows); box.append(g); };
  const item = (cls, title, sub, go) => {
    const b = el("button","ib-it " + cls); b.type = "button";
    b.append(el("i","ib-mark"), el("span","ib-t", title), el("span","ib-s", sub));
    b.onclick = () => { closeInbox(); go(); };
    return b;
  };
  const named = j => j.q ? (j.q.length > 70 ? j.q.slice(0, 67) + "..." : j.q) : (j.label || "Interview");
  const where = j => j.concept ? `About ${j.concept.title}` : brainLabel(j.picks.length > 1 ? j.picks.join(",") : j.scope);
  group("Answers ready", S.jobs.filter(j => j.status !== "running" && !j.seen).reverse()
    .map(j => item(j.status === "failed" ? "bad" : "new", named(j), `${j.status === "failed" ? "Failed" : "Answered"} ${ago(j.done)} ago · ${where(j)}`, () => openJob(j))));
  group("On its way", S.jobs.filter(j => j.status === "running")
    .map(j => item("run", named(j), `Thinking for ${ago(j.at)} · ${where(j)}`, () => openJob(j))));
  const d = S.dropJob;
  if (d){
    const say = { running: d.step || "Reading", storing: "Storing", card: "Card ready to review", stored: "Stored",
      waiting: "Waiting on your choice", failed: "Stopped on an error", ended: "Ended, read why" }[d.state] || "";
    if (["running", "storing", "card"].includes(d.state) || !d.seen)
      group("Drop", [item(["running", "storing"].includes(d.state) ? "run" : d.state === "failed" ? "bad" : "new", d.title || "Your drop", say, () => openDrop())]);
  }
  const clash = openClashes();
  if (clash) group("Conflicts", [item("clash", `${clash} open clash${clash === 1 ? "" : "es"} to settle`, "One card at a time: keep a side, or both", () => settleFrom(null, null))]);
  if (box.children.length === 1) box.append(el("p","ib-none","Nothing waiting. A question you send keeps running here while you look elsewhere."));
}

/** A question from the inbox, back on screen: its chat, or the draft it was asked in. */
function openJob(j){
  j.seen = true; paintInbox();
  if (j.chat){
    if (S.chatId === j.chat && S.mode === "ask" && !S.folder){ markSeen(); paintInbox(); renderChats(); return; }
    openChat(j.chat); return;
  }
  /* A new chat with no answer yet: the draft comes back with its question. */
  S.thread = []; S.chatId = null; S.draft = j.key; S.mode = "ask"; S.folder = null; S.concept = j.concept;
  if (j.concept) setScopeFor(j.concept.brain); else if (isPersonal(j.scope)){ S.picks = []; S.scope = j.scope; S.into = []; } else setPicks(j.picks);
  $("thread").innerHTML = "";
  if (j.q) says(j.q);
  if (j.status === "running") j.body = thinking(j.label);
  else push("ai", b => fail(b, j.error, { q: j.q, scope: j.scope, retry: () => { if (!chatBusy()) doAsk(j.q, b).finally(renderComposer); } }));
  render(); renderChats(); paintInbox(); bottom();
}

var inboxTimer = null;
function openInbox(){

function closeInbox(){ $("inbox").hidden = true; $("inboxBtn").setAttribute("aria-expanded","false"); clearInterval(inboxTimer); }
$("inboxBtn").onclick = e => { e.stopPropagation(); $("inbox").hidden ? openInbox() : closeInbox(); };
document.addEventListener("pointerdown", e => { if (!$("inbox").hidden && !$("inbox").contains(e.target) && !$("inboxBtn").contains(e.target)) closeInbox(); }, true);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("inbox").hidden){ closeInbox(); $("inboxBtn").focus(); } });

/* ============ a chat about one concept ============ */

function setScopeFor(slug){ if (isPersonal(slug)){ S.picks = []; S.scope = slug; S.into = []; } else setPicks([slug]); }

/* ============ input ============ */
function sizeBox(){ const t=$("input"); t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,210)+"px"; }
$("input").addEventListener("input", () => { S.voiceHint = ""; sizeBox(); renderComposer(); });
$("srcInput").addEventListener("input", renderComposer);

/* ============ voice ============ */
/* Talk instead of typing. The browser's own speech service listens: Safari
   on iPhone, iPad and Mac, Chrome and Edge. It is free and needs no key.
   Where a browser has none, the mic says how to dictate with the system's
   own, which every phone and computer carries. */
const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
/* The languages the mic offers: code, chip, name. */
const VOICE_LANGS = [["en-US", "EN", "English"], ["fr-FR", "FR", "French"], ["es-ES", "ES", "Spanish"],
  ["de-DE", "DE", "German"], ["it-IT", "IT", "Italian"], ["pt-PT", "PT", "Portuguese"]];
let rec = null, voiceBase = "";
function systemDictation(){
  const ua = navigator.userAgent;
  if (/iPhone|iPad|iPod|Android/.test(ua)) return "Tap the mic on your keyboard to talk.";
  if (/Mac/.test(ua)) return "No voice input in this browser. Press Fn twice to dictate, or open it in Safari or Chrome.";
  if (/Windows/.test(ua)) return "No voice input in this browser. Press Windows + H to dictate, or open it in Chrome or Edge.";
  return "No voice input in this browser. Open it in Chrome or Safari.";
}
function renderMic(){
  const m = $("micBtn");
  m.classList.toggle("on", !!S.listening);
  m.setAttribute("aria-pressed", S.listening ? "true" : "false");
  m.setAttribute("aria-label", S.listening ? "Stop talking" : "Talk");
}
function startVoice(){
  if (!Speech){ S.voiceHint = systemDictation(); renderComposer(); $("input").focus(); return; }
  const r = new Speech();
  r.lang = voiceLang();
  r.interimResults = true;
  r.continuous = true;
  /* What was typed stays; the words spoken follow it. */
  const typed = $("input").value.replace(/\s+$/, "");
  voiceBase = typed ? typed + " " : "";
  r.onresult = e => {
    if (!S.listening) return;
    let said = "";
    for (const x of e.results) said += x[0].transcript;
    $("input").value = voiceBase + said.replace(/^\s+/, "");
    sizeBox(); renderComposer();
  };
  r.onerror = e => {
    const why = e.error;
    S.voiceHint = why === "not-allowed" || why === "service-not-allowed" ? "Allow the microphone for this site, then tap the mic again."
      : why === "language-not-supported" ? `This browser cannot listen in ${voiceName()}. Pick another in Settings, Languages, or open it in Chrome.`
      : why === "network" ? "Voice input needs a connection."
      : why === "no-speech" || why === "aborted" ? "" : "Voice input stopped. Tap the mic to try again.";
  };
  r.onend = () => {
    if (rec === r) rec = null;
    if (S.listening){ S.listening = false; renderMic(); renderComposer(); $("input").focus(); }
  };
  try { r.start(); } catch { return; }
  rec = r; S.listening = true; S.voiceHint = ""; renderMic(); renderComposer();
}

/**
 * The map: every folder and every concept as one graph, the way Obsidian
 * draws a vault. A folder is a large node carrying its health, a concept a
 * dot in its folder's colour, bigger with more sources, and a line a link
 * between two concepts. The layout settles by itself and stays live: drag a
 * dot and the graph follows.
 *
 * Point at a dot to light it and its neighbours. Click it to read it, or to
 * settle its open conflict, ringed in red. Drag the background to move, and
 * the wheel, two fingers or the buttons to zoom. The search lights matches.
 *
 * Drawn on a canvas, so a workspace of a thousand concepts stays smooth. The
 * stage keeps a small handle on the graph, which the checks read.
 */
async function openMap(){
  const veil = el("div","veil map-veil");
  veil.innerHTML = `
    <div class="mapbox" role="dialog" aria-modal="true" aria-label="Map of the folders">
      <header class="mp-h"><b>Map</b><span class="mp-n" id="mpN"></span>
        <input class="mp-find" id="mpFind" type="search" placeholder="Find a concept" autocomplete="off" spellcheck="false" aria-label="Find a concept">
        <div class="mp-zoom"><button id="mpIn" aria-label="Zoom in">+</button><button id="mpOut" aria-label="Zoom out">&minus;</button><button id="mpFit">Fit</button></div>
        <button class="dk-x" id="mpX" aria-label="Close">&times;</button></header>
      <div class="mp-stage" id="mpStage"><canvas id="mpCanvas" aria-label="The folders and their concepts, as a graph"></canvas>
        <div class="mp-card" id="mpCard" hidden></div></div>
      <div class="mp-key">Big node: a folder, its health around it. Dot: a concept, bigger with more sources. Red ring: an open conflict. Point to light the links: <b style="color:#f2c46b">needs</b> · <b style="color:#c4b5fd">causes</b> · <b style="color:#6fcf97">supports</b> · <b style="color:#f87171">contradicts</b> · <b style="color:#7dd3fc">example</b>.</div>
    </div>`;
  document.body.append(veil);
  const stage = veil.querySelector("#mpStage"), cv = veil.querySelector("#mpCanvas"), card = veil.querySelector("#mpCard");
  const g = cv.getContext("2d");
  let alive = true, raf = 0;
  const onKey = e => {
    if (e.key !== "Escape" || veil !== [...document.querySelectorAll(".veil")].pop()) return;
    if (!card.hidden){ pick(null); return; }
    shut();
  };
  const shut = () => { alive = false; window.cancelAnimationFrame(raf); ro.disconnect(); document.removeEventListener("keydown", onKey); mapRepaint = null; veil.remove(); };
  document.addEventListener("keydown", onKey);
  veil.querySelector("#mpX").onclick = shut;

  let links = [];
  try { links = (await api("/api/map", {})).links || []; } catch { links = []; }
  if (!veil.isConnected) return;

  /* A lit link takes its kind's colour: what to read first, what it drives,
     what backs it, what disagrees, what it is a case of. */
  const LINK_INK = { needs: "#f2c46b", causes: "#c4b5fd", supports: "#6fcf97", contradicts: "#f87171", example: "#7dd3fc", related: "rgba(167,139,250,.85)" };
  /* Folder colours: muted, distinct on the dark ground, one per folder. */
  const HUES = ["#8b9cf7", "#6fcf97", "#f2a65a", "#e07ab8", "#56ccf2", "#c9a7f5", "#f2d16b", "#7fd6c2", "#f28b82", "#a5b4c8", "#b5d66f", "#f5a3c7"];
  const N = [], byId = new Map(), E = [];
  let W = 0, H = 0, dpr = 1;
  const view = { x: 0, y: 0, k: 1 }, goal = { x: 0, y: 0, k: 1 };
  let heat = 1, hover = null, sel = null, drag = null, query = "";

  const build = () => {
    const keep = new Map(N.map(n => [n.id, n]));
    N.length = 0; byId.clear(); E.length = 0;
    const folders = ordered().filter(b => b.type !== "personal");
    const R = 120 + 26 * folders.length;
    folders.forEach((b, i) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / Math.max(1, folders.length);
      const old = keep.get("@" + b.slug);
      const hub = { id: "@" + b.slug, hub: true, b, color: HUES[i % HUES.length], r: 13 + Math.min(10, Math.sqrt(conceptsOf(b.slug).length) * 1.4),
        x: old?.x ?? Math.cos(a) * R, y: old?.y ?? Math.sin(a) * R, vx: 0, vy: 0, label: b.name, deg: 0 };
      N.push(hub); byId.set(hub.id, hub);
      for (const c of conceptsOf(b.slug)){
        const id = `${c.brain}/${c.slug}`, was = keep.get(id);
        const n = { id, c, b, color: hub.color, r: 2.6 + 1.5 * Math.sqrt(Math.max(1, c.src || 0)), label: c.title,
          x: was?.x ?? hub.x + (Math.random() - .5) * 90, y: was?.y ?? hub.y + (Math.random() - .5) * 90, vx: 0, vy: 0,
          bad: S.conflicted.has(id), deg: 0 };
        N.push(n); byId.set(id, n);
        E.push({ a: hub, b: n, hub: true });
      }
    });
    for (const [a, b, type] of links){
      const p = byId.get(a), q = byId.get(b);
      if (p && q && p !== q){ E.push({ a: p, b: q, cross: p.b !== q.b, type: type || "related" }); p.deg++; q.deg++; }
    }
    const cross = E.filter(e => e.cross).length, bad = N.filter(n => n.bad).length, nc = N.filter(n => !n.hub).length;
    veil.querySelector("#mpN").textContent = `${folders.length} folder${folders.length === 1 ? "" : "s"} · ${nc} concepts · ` +
      `${E.filter(e => !e.hub).length} links, ${cross} between folders · ${bad} with an open conflict`;
  };

  /* ---- the physics: links pull, dots push apart, all drift to the middle ---- */
  const CELL = 90;
  const tick = () => {
    const a = heat;
    /* Repulsion on a grid, so a thousand dots cost what forty would. */
    const grid = new Map();
    for (const n of N){ const k = `${Math.floor(n.x / CELL)},${Math.floor(n.y / CELL)}`; (grid.get(k) || grid.set(k, []).get(k)).push(n); }
    for (const n of N){
      const cx = Math.floor(n.x / CELL), cy = Math.floor(n.y / CELL);
      for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++){
        for (const m of grid.get(`${cx + i},${cy + j}`) || []){
          if (m === n) continue;
          let dx = n.x - m.x, dy = n.y - m.y, d2 = dx * dx + dy * dy;
          if (d2 > CELL * CELL) continue;
          if (d2 < .01){ dx = Math.random() - .5; dy = Math.random() - .5; d2 = .25; }
          const f = (n.hub || m.hub ? 900 : 260) * a / d2;
          n.vx += dx * f; n.vy += dy * f;
        }
      }
    }
    /* Folders keep their distance from each other at any range. */
    const hubs = N.filter(n => n.hub);
    for (let i = 0; i < hubs.length; i++) for (let j = i + 1; j < hubs.length; j++){
      const p = hubs[i], q = hubs[j], dx = p.x - q.x, dy = p.y - q.y, d2 = Math.max(100, dx * dx + dy * dy), f = 26000 * a / d2;
      p.vx += dx * f / Math.sqrt(d2); p.vy += dy * f / Math.sqrt(d2); q.vx -= dx * f / Math.sqrt(d2); q.vy -= dy * f / Math.sqrt(d2);
    }
    for (const e of E){
      const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y, d = Math.hypot(dx, dy) || 1;
      const rest = e.hub ? 46 + e.a.r * 2 : e.cross ? 150 : 60, k = (e.hub ? .05 : e.cross ? .012 : .03) * a;
      const f = (d - rest) * k / d;
      e.a.vx += dx * f; e.a.vy += dy * f; e.b.vx -= dx * f; e.b.vy -= dy * f;
    }
    for (const n of N){
      n.vx -= n.x * .0016 * a; n.vy -= n.y * .0016 * a;
      if (n === drag?.n){ n.vx = n.vy = 0; continue; }
      n.vx *= .82; n.vy *= .82;
      n.x += Math.max(-30, Math.min(30, n.vx)); n.y += Math.max(-30, Math.min(30, n.vy));
    }
    heat = Math.max(.012, heat * .985);
  };

  /* ---- the camera ---- */
  const bounds = () => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of N){ x0 = Math.min(x0, n.x - n.r); y0 = Math.min(y0, n.y - n.r); x1 = Math.max(x1, n.x + n.r); y1 = Math.max(y1, n.y + n.r); }
    return N.length ? { x0, y0, x1, y1 } : { x0: -100, y0: -100, x1: 100, y1: 100 };
  };
  const fitGoal = () => {
    const b = bounds(), pad = 60;
    goal.k = Math.max(.15, Math.min(2.2, Math.min(W / (b.x1 - b.x0 + pad * 2), H / (b.y1 - b.y0 + pad * 2))));
    goal.x = (b.x0 + b.x1) / 2; goal.y = (b.y0 + b.y1) / 2;
  };
  const toWorld = (sx, sy) => [(sx - W / 2) / view.k + view.x, (sy - H / 2) / view.k + view.y];
  const toScreen = (x, y) => [(x - view.x) * view.k + W / 2, (y - view.y) * view.k + H / 2];
  const zoomAt = (f, sx = W / 2, sy = H / 2) => {
    const [wx, wy] = toWorld(sx, sy);
    goal.k = Math.max(.12, Math.min(6, goal.k * f));
    /* The point under the pointer stays under it. */
    goal.x = wx - (sx - W / 2) / goal.k; goal.y = wy - (sy - H / 2) / goal.k;
  };
  const at = (sx, sy) => {
    const [wx, wy] = toWorld(sx, sy);
    let best = null, bd = Infinity;
    for (const n of N){
      const d = Math.hypot(n.x - wx, n.y - wy), reach = n.r + 6 / view.k;
      if (d < reach && d < bd){ best = n; bd = d; }
    }
    return best;
  };

  /* ---- what is lit: the pointed or picked dot and its neighbours, or matches ---- */
  const near = n => {
    const s = new Set([n]);
    for (const e of E) if (e.a === n) s.add(e.b); else if (e.b === n) s.add(e.a);
    return s;
  };
  const litSet = () => {
    const focus = hover || sel;
    if (focus) return near(focus);
    if (query) return new Set(N.filter(n => n.label.toLowerCase().includes(query)));
    return null;
  };

  /* ---- drawing ---- */
  const draw = () => {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    g.save();
    g.translate(W / 2, H / 2); g.scale(view.k, view.k); g.translate(-view.x, -view.y);
    const lit = litSet();
    const dim = n => lit && !lit.has(n);
    /* Lines first, faint, then the lit ones on top in the accent. */
    g.lineWidth = 1 / view.k;
    for (const e of E){
      if (lit && (lit.has(e.a) && lit.has(e.b) && (e.a === (hover || sel) || e.b === (hover || sel) || query))) continue;
      g.strokeStyle = e.hub ? "rgba(255,255,255,.05)" : e.cross ? "rgba(255,255,255,.16)" : "rgba(255,255,255,.10)";
      if (lit) g.strokeStyle = "rgba(255,255,255,.03)";
      g.beginPath(); g.moveTo(e.a.x, e.a.y); g.lineTo(e.b.x, e.b.y); g.stroke();
    }
    if (lit){
      g.lineWidth = 1.6 / view.k;
      for (const e of E){
        if (!(lit.has(e.a) && lit.has(e.b))) continue;
        if (!query && e.a !== (hover || sel) && e.b !== (hover || sel)) continue;
        g.strokeStyle = e.hub ? "rgba(255,255,255,.28)" : (LINK_INK[e.type] || "rgba(167,139,250,.85)");
        g.beginPath(); g.moveTo(e.a.x, e.a.y); g.lineTo(e.b.x, e.b.y); g.stroke();
      }
    }
    for (const n of N){
      g.globalAlpha = dim(n) ? .14 : 1;
      if (n.hub){
        /* A folder: a soft halo, the node, its health as an arc around it. */
        const h = S.health[n.b.slug];
        g.fillStyle = n.color + "22"; g.beginPath(); g.arc(n.x, n.y, n.r + 9, 0, 7); g.fill();
        g.fillStyle = n.color; g.beginPath(); g.arc(n.x, n.y, n.r, 0, 7); g.fill();
        g.lineWidth = 3 / Math.max(.6, view.k); g.strokeStyle = "rgba(255,255,255,.12)";
        g.beginPath(); g.arc(n.x, n.y, n.r + 5, 0, 7); g.stroke();
        if (h){ g.strokeStyle = "rgba(255,255,255,.85)"; g.beginPath(); g.arc(n.x, n.y, n.r + 5, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * h.score / 10); g.stroke(); }
      } else {
        g.fillStyle = n === hover || n === sel ? "#ffffff" : n.color;
        g.beginPath(); g.arc(n.x, n.y, n.r, 0, 7); g.fill();
        if (n.bad){ g.lineWidth = 1.8 / Math.max(.7, view.k); g.strokeStyle = "#f87171"; g.beginPath(); g.arc(n.x, n.y, n.r + 2.6, 0, 7); g.stroke(); }
      }
    }
    g.globalAlpha = 1;
    /* Labels: folders always, concepts once close enough, and whatever is lit. */
    g.textAlign = "center"; g.textBaseline = "top";
    const fz = 11 / view.k;
    for (const n of N){
      const show = n.hub || (lit ? lit.has(n) : view.k > 1.5);
      if (!show) continue;
      const big = n.hub;
      /* The same size on screen at any zoom, the way Obsidian keeps them. */
      const size = big ? 13 / view.k : fz;
      g.font = `${big ? 600 : 400} ${size}px Geist, ui-sans-serif, system-ui, sans-serif`;
      const t = n.label.length > 42 && !big ? n.label.slice(0, 40) + "…" : n.label;
      const ty = n.y + n.r + (big ? 10 : 4) / view.k;
      /* A dark halo under each label, so it reads over dots and lines. */
      if (!dim(n)){ g.lineWidth = 3.5 / view.k; g.strokeStyle = "rgba(20,20,22,.9)"; g.lineJoin = "round"; g.strokeText(t, n.x, ty); }
      g.fillStyle = dim(n) ? "rgba(255,255,255,.18)" : big ? "rgba(255,255,255,.95)" : "rgba(255,255,255,.78)";
      g.fillText(t, n.x, ty);
    }
    g.restore();
  };

  /* ---- the loop: settle, ease the camera, draw ---- */
  /* Drawn only while something moves or changed, so a still map costs nothing. */
  let dirty = true, seen = "";
  const frame = () => {
    if (!alive) return;
    const settling = heat > .013 || !!drag;
    if (settling) tick();
    const e = .18, moving = Math.abs(goal.x - view.x) + Math.abs(goal.y - view.y) > .05 / view.k || Math.abs(goal.k - view.k) > .0005;
    view.x += (goal.x - view.x) * e; view.y += (goal.y - view.y) * e; view.k += (goal.k - view.k) * e;
    const now = `${hover?.id}|${sel?.id}|${query}|${W}x${H}`;
    if (settling || moving || dirty || now !== seen){ draw(); dirty = false; seen = now; }
    raf = window.requestAnimationFrame(frame);
  };

  /* ---- the card: what a click picked ---- */
  const pick = n => {
    sel = n;
    card.hidden = !n; card.innerHTML = "";
    if (!n) return;
    const h = n.hub ? S.health[n.b.slug] : null;
    const top = el("div","mp-c-top");
    const dot = el("i"); dot.style.background = n.color;
    top.append(dot, el("span",null, n.hub ? (n.b.type === "person" ? "Person" : "Folder") : n.b.name));
    card.append(top, el("b",null, n.label));
    if (n.hub) card.append(el("p",null, `${conceptsOf(n.b.slug).length} concepts${h ? ` · health ${fmtScore(h.score)}/10` : ""}${n.b.scope ? ` · ${n.b.scope}` : ""}`));
    else card.append(el("p",null, `${n.c.summaryLine || "No position yet."} · ${n.c.src || 0} source${n.c.src === 1 ? "" : "s"} · ${n.deg} link${n.deg === 1 ? "" : "s"}`));
    const acts = el("div","mp-c-acts");
    const btn = (t, fn, cls = "") => { const x = el("button", cls, t); x.type = "button"; x.onclick = fn; acts.append(x); return x; };
    if (n.hub){
      btn("Open the folder", () => { shut(); openFolder(n.b); });
      if (h) btn("Health", () => openHealthSheet(n.b));
    } else {
      btn("Read it", () => openBrainView(n.b, n.id));
      if (n.bad) btn("Settle the conflict", () => settleFrom(n.id, n.b.slug), "bad");
    }
    card.append(acts);
  };

  /* ---- pointer: hover, drag a dot, pan, pinch, click ---- */
  const pts = new Map(); let pinch = null, down = null;
  const local = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener("pointerdown", e => {
    cv.setPointerCapture(e.pointerId);
    const p = local(e); pts.set(e.pointerId, p);
    if (pts.size === 2){ const [a, b] = [...pts.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); drag = null; return; }
    const n = at(...p);
    down = { p, t: Date.now(), n, moved: false };
    drag = n ? { n } : { pan: true, last: p };
    cv.classList.add("grabbing");
  });
  cv.addEventListener("pointermove", e => {
    const p = local(e);
    if (!pts.has(e.pointerId)){
      const n = at(...p);
      if (n !== hover){ hover = n; cv.style.cursor = n ? "pointer" : "grab"; }
      return;
    }
    pts.set(e.pointerId, p);
    if (pts.size === 2 && pinch){
      const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      zoomAt(d / pinch, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); view.k = goal.k; view.x = goal.x; view.y = goal.y; pinch = d; return;
    }
    if (down && Math.hypot(p[0] - down.p[0], p[1] - down.p[1]) > 4) down.moved = true;
    if (drag?.n){
      const [wx, wy] = toWorld(...p); drag.n.x = wx; drag.n.y = wy; heat = Math.max(heat, .3);
    } else if (drag?.pan){
      goal.x -= (p[0] - drag.last[0]) / view.k; goal.y -= (p[1] - drag.last[1]) / view.k;
      view.x = goal.x; view.y = goal.y; drag.last = p;
    }
  });
  const up = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
    if (pts.size) return;
    cv.classList.remove("grabbing");
    if (e.type === "pointerup" && down && !down.moved) pick(down.n);
    drag = null; down = null;
  };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("pointerleave", () => { if (!pts.size) hover = null; });
  cv.addEventListener("wheel", e => { e.preventDefault(); const p = local(e); zoomAt(Math.exp(-e.deltaY * .0015), ...p); }, { passive: false });
  cv.addEventListener("dblclick", e => { const n = at(...local(e)); if (n && !n.hub) openBrainView(n.b, n.id); else if (n) { shut(); openFolder(n.b); } });

  veil.querySelector("#mpIn").onclick = () => zoomAt(1.35);
  veil.querySelector("#mpOut").onclick = () => zoomAt(1 / 1.35);
  veil.querySelector("#mpFit").onclick = () => fitGoal();
  const find = veil.querySelector("#mpFind");
  find.oninput = () => { query = find.value.trim().toLowerCase(); };
  find.onkeydown = e => {
    if (e.key !== "Enter") return;
    const n = N.find(x => query && x.label.toLowerCase().includes(query));
    if (n){ goal.x = n.x; goal.y = n.y; goal.k = Math.max(goal.k, 1.8); pick(n); }
  };

  /* ---- size ---- */
  const size = () => {
    const r = stage.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1); W = Math.max(1, r.width); H = Math.max(1, r.height);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + "px"; cv.style.height = H + "px";
  };
  const ro = new ResizeObserver(() => { size(); dirty = true; });
  ro.observe(stage);
  size();

  build();
  /* A first settle before the first frame, so the map opens near its shape. */
  for (let i = 0; i < 120; i++) tick();
  fitGoal(); Object.assign(view, goal);
  raf = window.requestAnimationFrame(frame);

  /* What the checks read: the nodes, where one sits on screen, and the camera. */
  stage.graph = {
    nodes: () => N.map(n => ({ id: n.id, hub: !!n.hub, r: n.r, bad: !!n.bad, label: n.label })),
    links: () => E.filter(e => !e.hub).map(e => [e.a.id, e.b.id, e.type]),
    screen: id => { const n = byId.get(id); return n ? toScreen(n.x, n.y) : null; },
    lit: () => [...(litSet() || [])].map(n => n.id),
    zoom: () => goal.k,
  };

  /* A settled conflict or a new ring redraws the map where it stands. */
  mapRepaint = () => { if (veil.isConnected){ build(); heat = Math.max(heat, .2); dirty = true; } };
}

/**
 * The conflict deck: one open clash at a time, settled with a swipe.
 *
 * Left keeps A, right keeps B, up says both hold, down leaves it for later.
 * The arrow keys and the four buttons do the same. A ruling waits 4 seconds
 * before it is sent, so Undo can take it back; closing the deck sends what is
 * waiting at once. A ruling rewrites the position, which takes a model call,
 * so rewrites run behind the next card. Two rulings on one concept run one
 * after the other, each on the position the one before it wrote.
 */
function openConflictDeck(list, others){
  const UNDO_MS = 4000;
  const brainName = slug => S.brains.find(x => x.slug === slug)?.name || slug;
  const veil = el("div","veil deck-veil");
  veil.innerHTML = `
    <div class="deck" role="dialog" aria-modal="true" aria-label="Open conflicts">
      <header class="dk-h"><b>Open conflicts</b><span class="dk-n" id="dkN"></span>
        <button class="dk-x" id="dkX" aria-label="Close">&times;</button></header>
      <div class="dk-stage" id="dkStage"></div>
      <div class="dk-acts" id="dkActs">
        <button class="ghost" data-p="a">&larr; A holds</button>
        <button class="ghost" data-p="both">&uarr; Both hold</button>
        <button class="ghost" data-p="later">&darr; Later</button>
        <button class="ghost" data-p="b">B holds &rarr;</button>
      </div>
      <div class="dk-foot"><span class="dk-toast" id="dkToast">Swipe toward the side that holds. Up: both hold. Down: later.</span>
        <button class="mini" id="dkUndo" hidden>Undo</button><span class="dk-state" id="dkState"></span></div>
    </div>`;
  document.body.append(veil);
  const $d = id => veil.querySelector("#" + id);
  const stage = $d("dkStage"), toast = $d("dkToast"), undoB = $d("dkUndo"), stateL = $d("dkState");

  let pile = list.slice(), later = [], done = 0, total = list.length;
  let running = 0, card = null, closed = false;
  const waiting = [];            // rulings inside their undo window
  const chains = new Map();      // one rewrite at a time per concept

  const say = (t, bad) => { toast.textContent = t; toast.className = "dk-toast" + (bad ? " bad" : ""); };
  const paintState = () => {
    stateL.textContent = [done ? `${done} settled` : "", running ? `${running} rewriting` : ""].filter(Boolean).join(" \u00b7 ");
  };

  /* ---- sending a ruling ---- */
  const send = r => {
    running++; paintState();
    const prev = chains.get(r.c.id) || Promise.resolve();
    const next = prev.then(async () => {
      try {
        const x = await api("/api/conflicts/settle", { id: r.c.id, a: r.c.a, b: r.c.b, pick: r.pick });
        if (x.error || x.ok === false) throw new Error(x.error || x.why);
        done++;
      } catch (e) {
        /* Back in the pile, so a failed ruling is never lost. */
        pile.push(r.c); total++;
        if (!closed){ say(`Not settled: ${e.message}. "${r.c.title}" is back in the pile.`, true); if (!card) show(); }
      } finally { running--; paintState(); if (!closed && !card && !pile.length) show(); }
    });
    chains.set(r.c.id, next);
  };
  const flush = () => { while (waiting.length){ const r = waiting.shift(); clearTimeout(r.t); send(r); } undoB.hidden = true; };

  const LABEL = { a: "A holds", b: "B holds", both: "Both hold", later: "Later" };
  const rule = pick => {
    if (!card) return;
    const c = pile.shift();
    fly(pick);
    if (pick === "later"){
      later.push(c);
      say(`"${c.title}" is left for later.`);
    } else {
      const r = { c, pick };
      r.t = setTimeout(() => {
        const i = waiting.indexOf(r); if (i < 0) return;
        waiting.splice(i, 1); send(r);
        if (!waiting.length) undoB.hidden = true;
      }, UNDO_MS);
      waiting.push(r);
      say(`${LABEL[pick]}: ${c.title}.`);
      undoB.hidden = false;
    }
    setTimeout(show, 180);
  };
  undoB.onclick = () => {
    const r = waiting.pop(); if (!r) return;
    clearTimeout(r.t);
    pile.unshift(r.c);
    if (card){ card.remove(); card = null; }
    undoB.hidden = !waiting.length;
    say(`Taken back: ${r.c.title}.`);
    show();
  };

  /* ---- the card ---- */
  const fly = pick => {
    if (!card) return;
    const c = card; card = null;
    c.classList.add("gone");
    const [x, y] = { a: [-1, 0], b: [1, 0], both: [0, -1], later: [0, 1] }[pick];
    c.style.transform = `translate(${x * 120}%, ${y * 120}%) rotate(${x * 14}deg)`;
    c.style.opacity = "0";
    setTimeout(() => c.remove(), 260);
  };
  const show = () => {
    if (closed) return;
    stage.querySelectorAll(".dk-card:not(.gone), .dk-done").forEach(n => { if (n !== card) n.remove(); });
    if (card) return;
    const c = pile[0];
    $d("dkActs").hidden = !c;
    $d("dkN").textContent = c ? `${total - pile.length - later.length + 1} of ${total}` : "";
    if (!c){
      const end = el("div","dk-done");
      end.append(el("b",null, running ? "Rewriting the last ones" : later.length ? "The rest is for later" : "All settled"));
      end.append(el("p",null, [done ? `${done} settled.` : "", running ? `${running} still rewriting: they finish on their own.` : "",
        later.length ? `${later.length} left for later.` : "", others ? `${others} more add detail rather than contradict.` : ""].filter(Boolean).join(" ")));
      if (later.length){
        const again = el("button","go", `Go through the ${later.length} again`);
        again.id = "dkAgain";
        again.onclick = () => { pile = later; later = []; total = pile.length; show(); };
        end.append(again);
      }
      const close = el("button","ghost","Close"); close.style.marginLeft = "8px";
      close.onclick = shut;
      end.append(close);
      stage.append(end);
      return;
    }
    const n = el("div","dk-card");
    n.innerHTML = `<span class="dk-brain">${esc(brainName(c.brain))}</span><h4>${esc(c.title)}</h4>
      <div class="dk-sides">
        <div class="dk-side" data-s="a"><span class="dk-tag">&larr; A</span><p>${esc(c.a)}</p><time>${esc(c.aDate || "undated")}</time></div>
        <div class="dk-side" data-s="b"><span class="dk-tag">B &rarr;</span><p>${esc(c.b)}</p><time>${esc(c.bDate || "undated")}</time></div>
      </div>
      ${c.why ? `<div class="dk-why">They differ because ${esc(c.why.replace(/^[A-Z]/, m => m.toLowerCase()))}</div>` : ""}
      <div class="dk-stamp"></div>`;
    drag(n);
    stage.append(n); card = n;
  };

  /* ---- the swipe ---- */
  const intent = (dx, dy) => Math.abs(dx) > Math.abs(dy)
    ? (dx < -30 ? "a" : dx > 30 ? "b" : "")
    : (dy < -30 ? "both" : dy > 30 ? "later" : "");
  const drag = n => {
    let x0 = 0, y0 = 0, on = false;
    const lit = p => {
      n.querySelectorAll(".dk-side").forEach(s => s.classList.toggle("lit", s.dataset.s === p || p === "both"));
      const st = n.querySelector(".dk-stamp");
      st.textContent = p ? LABEL[p] : ""; st.style.opacity = p ? "1" : "0";
    };
    n.addEventListener("pointerdown", e => {
      if (e.button) return;
      on = true; x0 = e.clientX; y0 = e.clientY;
      n.setPointerCapture(e.pointerId); n.classList.add("drag");
    });
    n.addEventListener("pointermove", e => {
      if (!on) return;
      const dx = e.clientX - x0, dy = e.clientY - y0;
      n.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 22}deg)`;
      lit(intent(dx, dy));
    });
    const end = e => {
      if (!on) return;
      on = false; n.classList.remove("drag");
      const dx = e.clientX - x0, dy = e.clientY - y0, p = intent(dx, dy);
      const far = Math.abs(dx) > 90 || Math.abs(dy) > 80;
      if (p && far && card === n) rule(p);
      else { n.style.transform = ""; lit(""); }
    };
    n.addEventListener("pointerup", end);
    n.addEventListener("pointercancel", end);
  };

  /* ---- keys, buttons, closing ---- */
  $d("dkActs").onclick = e => { const b = e.target.closest("button[data-p]"); if (b) rule(b.dataset.p); };
  const KEYS = { ArrowLeft: "a", ArrowRight: "b", ArrowUp: "both", ArrowDown: "later" };
  const onKey = e => {
    if (e.key === "Escape"){ shut(); return; }
    if ((e.key === "z" || e.key === "Z") && !undoB.hidden){ undoB.click(); return; }
    if (KEYS[e.key]){ e.preventDefault(); rule(KEYS[e.key]); }
  };
  function shut(){
    if (closed) return;
    flush(); closed = true;
    document.removeEventListener("keydown", onKey);
    veil.remove();
    Promise.all([...chains.values()]).then(() => { if (done) refresh(); });
  }
  document.addEventListener("keydown", onKey);
  $d("dkX").onclick = shut;
  paintState(); show();
}
