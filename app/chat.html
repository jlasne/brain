<link rel="apple-touch-icon" href="/brand/tasu-180.png">

<script>
  /* The workspace's colours before anything paints: the one the address asks
     for, or else the one this tab last opened. An address with an empty w asks
     for a workspace by name, in Tasu's own greys. */
  try {
    const q = new URLSearchParams(location.search);
    const s = (q.has("w") ? q.get("w") : sessionStorage.getItem("octopus.space") || "").toLowerCase();
    if (/^[a-z0-9][a-z0-9-]{1,31}$/.test(s)) {
      document.documentElement.dataset.space = s;
      /* A workspace with a look of its own: the colours it last wore here. */
      const look = JSON.parse(localStorage.getItem("octopus.look." + s) || "null");
      if (look) for (const k in look) document.documentElement.style.setProperty(k, look[k]);
    }
  } catch {}
</script>

<script>
  /* The deployment this app talks to. Public by design: the OpenRouter key
     lives on the server and never reaches a browser. */
  window.OCTOPUS_API = "https://uncommon-wolf-174.eu-west-1.convex.site";
  window.OCTOPUS_BUILD = "2026-09-15a";
</script>

<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  /* ======================================================================
     TASU

     Greys, white and near-black, the way the landing reads. A workspace
     keeps its own accent: Octopus its orange, Squidgy its brown, and any
     workspace the colours it sets in Settings.

       --side          the side panel, a step off white
       --accent-solid  the one filled button: near-black, or the workspace's
       --serif         titles; --sans for everything read
     ====================================================================== */
  :root{
    /* The mark the loader turns. */
    --mark:url("/brand/tasu.svg");
    --bg:#ffffff; --side:#f7f7f8; --surface:#ffffff; --surface-2:#f4f4f5; --surface-3:#e9e9ec;
    --ink:#09090b; --ink-2:#27272a; --ink-3:#52525b; --ink-4:#6b6b74;
    --line:#ececef; --line-2:#e1e1e5;
    --accent:#18181b; --accent-fill:#3f3f46; --accent-solid:#18181b; --accent-on:#ffffff;
    --accent-soft:rgba(24,24,27,.05); --accent-line:rgba(24,24,27,.16);
    --good:#3f7d5c; --warn:#94650f; --bad:#b3372a;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 1px 6px rgba(0,0,0,.03);
    --shadow-lift:0 8px 30px -4px rgba(0,0,0,.09), 0 4px 10px rgba(0,0,0,.03);

    --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    --serif:"Frank Ruhl Libre","Iowan Old Style","Apple Garamond",Georgia,serif;
    --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ease:cubic-bezier(.22,1,.36,1);
    color-scheme:light;
  }
  /* Octopus keeps its orange, as its accent only. */
  :root[data-space="octopus"]{
    --mark:url("/brand/logo-mark.png");
    --accent:#a54b2f; --accent-fill:#d97757; --accent-solid:#d97757; --accent-on:#ffffff;
    --accent-soft:rgba(217,119,87,.09); --accent-line:rgba(217,119,87,.34);
  }


  /* Squidgy keeps its brown, as its accent only. */
  :root[data-space="squidgy"]{
    --mark:url("/brand/squidgy-mark.png");
    --accent:#7a4e36; --accent-fill:#A8704E; --accent-solid:#9c6849; --accent-on:#ffffff;
    --accent-soft:rgba(168,112,78,.09); --accent-line:rgba(168,112,78,.36);
  }

  /* The dog greets an empty thread. */
  .zero-mark{ display:block; height:92px; width:auto; margin-bottom:22px; }
  /* The octopus's loop, on the empty chat. Its frame holds the sparkles and
     the landing ring, so it runs larger than a still mark. */
  .zero-loop{ display:block; width:150px; height:150px; margin:-18px 0 6px -24px; pointer-events:none; }

  html{ background:var(--bg); }
  body{
    background:var(--bg); color:var(--ink-2);
    font:400 16px/1.62 var(--sans);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    height:100dvh; overflow:hidden;
  }
  ::selection{ background:var(--accent-soft); color:var(--ink); }

  button,input,textarea,select{ font:inherit; color:inherit; background:none; border:none; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--accent-fill); outline-offset:2px; border-radius:4px; }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--line-2); border-radius:10px; border:3px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--surface-3); background-clip:content-box; }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* ============ shell ============ */
  .app{
    display:grid; grid-template-columns:264px 1fr; height:100dvh;
    transition:grid-template-columns .2s var(--ease);
  }

  /* Folding the nav is a desktop affair. Narrow screens already slide it in
     and out as a drawer, so these rules must not reach them. */
  .navtoggle{
    margin-left:auto; flex-shrink:0; width:24px; height:24px; border-radius:6px;
    display:grid; place-items:center; color:var(--ink-3);
    font:400 15px/1 var(--sans);
    transition:color .15s var(--ease), background .15s var(--ease);
  }
  .navtoggle:hover{ color:var(--accent); background:var(--surface-3); }
  .navopen{
    display:none; position:fixed; top:13px; left:13px; z-index:30;
    place-items:center; width:30px; height:30px; border-radius:7px;
    border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink-3);
  }
  .navopen:hover{ color:var(--accent); border-color:var(--accent-fill); }
  @media (min-width:861px){
    .app.nav-closed{ grid-template-columns:0 1fr; }
    .app.nav-closed aside{ opacity:0; pointer-events:none; }
    .app.nav-closed .navopen{ display:grid; }
    aside{ transition:opacity .15s var(--ease); }
  }
  @media (max-width:860px){ .navtoggle{ display:none; } }

  /* ============ sidebar ============ */
  aside{
    background:var(--surface-2); border-right:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0;
  }
  .brand{
    padding:18px 18px 15px;
    display:flex; align-items:center; gap:9px;
  }
  .brand .mark{ width:24px; height:24px; flex-shrink:0; color:var(--accent-fill); }
  .brand .mark svg, .brand .mark img{ width:100%; height:100%; display:block; }
  .brand h1{ font:600 18px/1 var(--sans); letter-spacing:-.015em; color:var(--ink); }
  .brand h1 a, .topbar h1 a{ color:inherit; text-decoration:none; }
  .brand h1 a:hover, .topbar h1 a:hover{ color:var(--accent); }

  .side-scroll{ flex:1; overflow-y:auto; padding:16px 12px; min-height:0; }

  /* People, then Subjects. Quieter than the panel header above it, because it
     divides a list rather than naming the panel. */
  .group-h{
    margin:11px 0 5px; padding:0 3px;
    font:500 10px/1.6 var(--mono); letter-spacing:.09em; text-transform:uppercase;
    color:var(--ink-4);
  }
  .group-h:first-child{ margin-top:0; }

  /* The drop's source line. It shares the composer box with the content, divided by one
     rule, so the two read as halves of one drop rather than two forms. */
  /* A chat about one concept: its chip over the field, and the × that leaves it. */
  .about{ display:flex; align-items:center; gap:8px; min-width:0; padding:9px 10px 9px 15px; border-bottom:1px solid var(--line); }
  .about[hidden]{ display:none; }
  .ab-k{ flex:none; font:500 11px/1 var(--mono); letter-spacing:.07em; text-transform:uppercase; color:var(--ink-4); }
  .about b{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:600 13.5px/1.3 var(--sans); color:var(--accent); }
  .ab-x{ flex:none; margin-left:auto; width:26px; height:26px; border-radius:7px; font:400 16px/1 var(--sans); color:var(--ink-4); cursor:pointer; }
  .ab-x:hover{ background:var(--surface-2); color:var(--ink); }
  .composer-wrap.compact .about{ flex:0 1 auto; max-width:42%; padding:0 0 0 16px; border:0; }

  /* The inbox: a bubble top right, with what waits for you counted on it. */
  .inbox-btn{ position:fixed; top:13px; right:16px; z-index:31; display:grid; place-items:center; width:34px; height:34px; border-radius:50%;
    border:1px solid var(--line-2); background:var(--surface); color:var(--ink-3); cursor:pointer;
    box-shadow:0 2px 8px -2px rgba(0,0,0,.12); transition:color .15s var(--ease), border-color .15s var(--ease); }
  .inbox-btn:hover, .inbox-btn[aria-expanded="true"]{ color:var(--accent); border-color:var(--accent-fill); }
  .inbox-btn svg{ width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linejoin:round; stroke-linecap:round; }
  /* Something on its way: a ring turns around the bubble. */
  .inbox-btn.run::after{ content:""; position:absolute; inset:-4px; border-radius:50%; border:2px solid transparent;
    border-top-color:var(--accent-solid); animation:turn 1s linear infinite; }
  .ib-n{ position:absolute; top:-5px; right:-6px; min-width:18px; height:18px; padding:0 5px; border-radius:9px;
    background:var(--accent-solid); color:var(--accent-on); font:600 11px/18px var(--sans); text-align:center; font-variant-numeric:tabular-nums; }
  .ib-n[hidden]{ display:none; }
  .still-btn{ right:58px; }
  .still-btn[hidden]{ display:none; }
  .inbox{ position:fixed; top:56px; right:16px; z-index:45; width:min(360px, calc(100vw - 32px)); max-height:min(70vh, 560px); overflow-y:auto;
    padding:14px 8px 8px; border:1px solid var(--line-2); border-radius:14px; background:var(--surface);
    box-shadow:0 18px 50px -12px rgba(0,0,0,.25), 0 2px 6px rgba(0,0,0,.06); animation:pbOpen .18s ease both; }
  .inbox[hidden]{ display:none; }
  .inbox h3{ padding:0 8px 6px; font:600 15px/1.2 var(--sans); color:var(--ink); }
  .ib-g{ padding-top:6px; }
  .ib-g h4{ padding:6px 8px 4px; font:500 10.5px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-4); }
  .ib-it{ display:grid; grid-template-columns:14px minmax(0,1fr); gap:2px 8px; width:100%; padding:8px; border-radius:9px; text-align:left; cursor:pointer; }
  .ib-it:hover, .ib-it:focus-visible{ background:var(--surface-2); }
  .ib-mark{ grid-row:1 / 3; align-self:start; margin-top:5px; width:8px; height:8px; border-radius:50%; background:var(--accent-solid); }
  .ib-it.run .ib-mark{ background:none; border:2px solid var(--line-2); border-top-color:var(--accent-solid); width:10px; height:10px; margin-top:4px; animation:turn 1s linear infinite; }
  .ib-it.bad .ib-mark{ background:var(--bad); }
  .ib-it.clash .ib-mark{ background:var(--warn); }
  .ib-t{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:500 14px/1.35 var(--sans); color:var(--ink); }
  .ib-s{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:400 12.5px/1.35 var(--sans); color:var(--ink-4); }
  .ib-none{ padding:4px 8px 10px; font:400 13.5px/1.5 var(--sans); color:var(--ink-3); }
  /* A chat row with an answer unread, or one on its way. */
  .cr-dot{ flex:none; width:8px; height:8px; border-radius:50%; background:var(--accent-solid); }
  .cr-dot.run{ background:none; width:10px; height:10px; border:2px solid var(--line-2); border-top-color:var(--accent-solid); animation:turn 1s linear infinite; }
  /* The bubble keeps the folder and Drop headers clear of it. */
  @media (min-width:861px){ main .fv-h, main .drop-head .col{ padding-right:64px; } body.has-still main .fv-h, body.has-still main .drop-head .col{ padding-right:106px; } }
  @media (max-width:860px){ .inbox-btn{ top:4px; right:10px; width:40px; height:40px; } .still-btn{ right:56px; } .inbox{ top:50px; right:12px; } }

  .dropsrc{
    display:flex; align-items:center; gap:10px;
    padding:9px 14px 9px 15px; border-bottom:1px solid var(--line);
  }
  .dropsrc label{
    font:500 11px/1 var(--mono); letter-spacing:.07em; text-transform:uppercase;
    color:var(--ink-4); flex-shrink:0;
  }
  .dropsrc input{
    flex:1; min-width:0; border:none; background:none; padding:0;
    font:400 14px/1.5 var(--sans); color:var(--ink);
  }
  .dropsrc input:focus{ outline:none; }
  .dropsrc input::placeholder{ color:var(--ink-4); }

  /* One line per brain: the name, and what it holds. The scope line and the
     controls live above the composer, next to the choice they belong to, so a
     row here stays a row. */
  .brain-row{
    display:flex; align-items:baseline; gap:8px; width:100%; text-align:left;
    padding:5px 8px; border-radius:8px; border:1px solid transparent;
    transition:background .15s var(--ease), border-color .15s var(--ease);
  }
  .brain-row + .brain-row{ margin-top:2px; }
  /* A person or a subject, told apart by one small mark. */
  .b-ic{ width:15px; height:15px; flex:none; align-self:center; fill:none; stroke:currentColor;
         stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; color:var(--ink-4); }
  .brain-row.on .b-ic, .pk-row.on .b-ic{ color:var(--accent); }
  .brain-row .nm{
    flex:1; min-width:0;
    font:500 13.5px/1.35 var(--sans); color:var(--ink-2);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .brain-row .ct{ margin-left:auto; font:400 10.5px/1 var(--mono); color:var(--ink-4); white-space:nowrap; }
  /* The one control a row carries, on the row you are pointing at. */
  /* Hidden, they take no room, so a long name shows whole until the row is
     pointed at. */
  .brain-row .ed{
    display:none; font:500 10.5px/1 var(--sans); color:var(--ink-4); padding:3px 5px; border-radius:5px;
    transition:color .12s var(--ease), background .12s var(--ease);
  }
  .brain-row:hover .ed, .brain-row:focus-visible .ed, .brain-row.on .ed{ display:inline-block; }
  /* A touch screen has no hover, so its row shows the controls. */
  @media (hover:none){ .brain-row .ed{ display:inline-block; } }
  .brain-row .ed:hover{ color:var(--accent); background:var(--accent-soft); }
  .brain-row:hover{ background:var(--surface); }
  .brain-row:hover .nm{ color:var(--ink); }
  .brain-row.on{ background:var(--surface); border-color:var(--accent-line); }
  .brain-row.on .nm, .brain-row.on .ct{ color:var(--accent); }
  .empty-side{ padding:6px 3px; font:400 12.5px/1.55 var(--sans); color:var(--ink-4); }

  /* The demo says what it is, above the thread. */
  .demo-bar{ margin:12px auto 0; width:min(760px, calc(100% - 32px)); padding:10px 14px; border-radius:10px;
    border:1px solid var(--accent-line); background:var(--accent-soft); font:400 13.5px/1.55 var(--sans); color:var(--ink-2); }
  .demo-bar{ display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; }
  .demo-bar b{ color:var(--accent); }
  .demo-bar .db-t{ flex:1 1 280px; }
  .demo-bar .db-acts{ display:flex; gap:6px; flex-wrap:wrap; }
  .demo-bar .db-b{ font:500 12.5px/1 var(--sans); padding:8px 11px; border-radius:999px; border:1px solid var(--accent-line);
    background:var(--surface); color:var(--accent); cursor:pointer; text-decoration:none; transition:border-color .15s var(--ease), background .15s var(--ease); }
  .demo-bar .db-b:hover{ border-color:var(--accent-fill); }
  .demo-bar .db-b.main{ background:var(--accent-solid); border-color:var(--accent-solid); color:var(--accent-on); }

  /* The empty chat offers three questions its brains can answer. */
  .zero .try{ margin-top:22px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
  .zero .try b{ font:600 11px/1 var(--sans); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-4); margin-bottom:2px; }
  .zero .try button{ text-align:left; font:400 14.5px/1.4 var(--sans); color:var(--ink); padding:9px 14px; border-radius:14px 14px 14px 4px;
    border:1px solid var(--accent-line); background:var(--surface); box-shadow:var(--shadow); transition:border-color .15s var(--ease), transform .15s var(--ease); }
  .zero .try button:hover{ border-color:var(--accent-fill); transform:translateY(-1px); }

  /* Chats and Brains, each a group that folds, remembered per browser. */
  .fold-t{ display:flex; align-items:center; gap:6px; flex:1; min-width:0; padding:3px 0; text-align:left;
    font:inherit; letter-spacing:inherit; text-transform:inherit; color:inherit; }
  .fold-t:hover{ color:var(--ink-2); }
  .fold-t b{ color:var(--accent); font-weight:500; margin-left:auto; }
  .chev{ width:0; height:0; border-left:4px solid currentColor; border-top:3.5px solid transparent; border-bottom:3.5px solid transparent;
    transform:rotate(90deg); transition:transform .15s var(--ease); flex:none; }
  .fold-t[aria-expanded="false"] .chev{ transform:rotate(0deg); }
  .side-plus{ flex:none; padding:3px 7px; border-radius:6px; font:500 11px/1.2 var(--sans); letter-spacing:0; text-transform:none; color:var(--accent); }
  .side-plus:hover{ background:var(--accent-soft); }
  .side-note{ padding:2px 3px 6px; font:400 11.5px/1.5 var(--sans); color:var(--accent); }

  /* One line per chat: its first question, and the brain it asked. */
  .chat-row{ display:flex; align-items:center; gap:6px; width:100%; text-align:left; padding:7px 10px; border-radius:8px;
    border:1px solid transparent; transition:background .15s var(--ease), border-color .15s var(--ease); }
  .chat-row + .chat-row{ margin-top:2px; }
  .chat-row .cm{ flex:1; min-width:0; }
  .chat-row .nm{ display:block; font:500 13px/1.35 var(--sans); color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chat-row .cb{ display:block; margin-top:2px; font:400 10.5px/1.3 var(--mono); color:var(--ink-4); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chat-row .pin{ flex:none; width:12px; height:12px; fill:var(--accent-fill); }
  /* One button per row holds pin, rename and delete. */
  .chat-row .more{ flex:none; display:none; width:26px; height:26px; border-radius:6px; text-align:center;
    font:700 14px/26px var(--sans); letter-spacing:.05em; color:var(--ink-4); }
  .chat-row:hover .more, .chat-row:focus-within .more, .chat-row.on .more, .chat-row .more[aria-expanded="true"]{ display:inline-block; }
  @media (hover:none){ .chat-row .more{ display:inline-block; } }
  .chat-row .more:hover, .chat-row .more[aria-expanded="true"]{ color:var(--accent); background:var(--accent-soft); }
  .chat-menu{ position:fixed; z-index:70; min-width:160px; padding:5px; background:var(--surface);
    border:1px solid var(--line-2); border-radius:10px; box-shadow:var(--shadow-lift); }
  .cm-it{ display:block; width:100%; text-align:left; padding:9px 11px; border-radius:7px; font:500 13px/1.2 var(--sans); color:var(--ink-2); }
  .cm-it:hover, .cm-it:focus-visible{ background:var(--surface-2); color:var(--ink); outline:none; }
  .cm-it.del{ color:var(--bad); }
  .cm-it.sure, .cm-it.sure:hover{ background:var(--bad); color:var(--accent-on); }
  .chat-row:hover{ background:var(--surface); }
  .chat-row.on{ background:var(--surface); border-color:var(--accent-line); }
  .chat-row.on .nm{ color:var(--accent); }

  /* A brain's health, out of 10: a ring that fills, green, amber or red. */
  .hring{ flex:none; align-self:center; width:24px; height:24px; cursor:pointer; border-radius:50%; margin-left:auto; }
  .hring:hover{ background:var(--accent-soft); }
  .hring svg{ width:24px; height:24px; display:block; }
  .hring .tr{ fill:none; stroke:var(--line-2); stroke-width:2.6; }
  .hring .ar{ fill:none; stroke-width:2.6; stroke-linecap:round; transform:rotate(-90deg); transform-origin:12px 12px; }
  .hring text{ font:600 6.8px var(--mono); letter-spacing:-.03em; fill:var(--ink-2); text-anchor:middle; dominant-baseline:central; }
  .h-hi{ stroke:var(--good); } .h-mid{ stroke:var(--warn); } .h-lo{ stroke:var(--bad); }
  .hb-row{ padding:10px 0; border-top:1px solid var(--line); }
  .hb-row:first-child{ border-top:none; padding-top:0; }
  .hb-top{ display:flex; align-items:baseline; gap:8px; font:500 13.5px/1.3 var(--sans); color:var(--ink); }
  .hb-top span{ margin-left:auto; font:400 12px/1 var(--mono); color:var(--ink-3); }
  .hb-bar{ margin-top:7px; height:6px; border-radius:3px; background:var(--surface-2); overflow:hidden; }
  .hb-bar i{ display:block; height:100%; border-radius:3px; }
  .hb-bar .h-hi{ background:var(--good); } .hb-bar .h-mid{ background:var(--warn); } .hb-bar .h-lo{ background:var(--bad); }
  .hb-say{ margin-top:6px; font:400 12.5px/1.5 var(--sans); color:var(--ink-3); }
  .hb-best{ padding:11px 13px; border-radius:10px; background:var(--accent-soft); border:1px solid var(--accent-line);
    font:400 14px/1.5 var(--sans); color:var(--ink); }
  .hb-best b{ display:block; font:600 11px/1.4 var(--sans); letter-spacing:.04em; text-transform:uppercase; color:var(--accent); margin-bottom:3px; }

  /* A link to another concept, as a chip. */
  .fv-links .vw-link{ padding:6px 10px; border:1px solid var(--line-2); border-radius:999px; background:var(--surface);
                    font:500 12.5px/1.2 var(--sans); color:var(--accent); }
  .fv-links .vw-link:hover{ border-color:var(--accent-fill); }

  /* The side panel: three things to do, then Chats and Folders,
     each a card of its own that folds. */
  .side-acts{ display:grid; gap:4px; margin:0 0 10px; }
  .side-acts .sa{
    display:flex; align-items:center; gap:10px; width:100%; min-height:38px; padding:0 12px; text-align:left;
    border:1px solid var(--line); border-radius:10px; background:var(--surface);
    font:500 14px/1 var(--sans); color:var(--ink-2);
    transition:border-color .15s var(--ease), color .15s var(--ease);
  }
  .side-acts .sa:hover{ border-color:var(--accent-fill); color:var(--accent); }
  .side-acts .sa.go{ background:var(--accent-solid); border-color:var(--accent-solid); color:var(--accent-on); }
  .side-acts .sa.go:hover{ color:var(--accent-on); filter:brightness(1.06); }
  .side-acts svg{ width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .side-acts .sa.on{ border-color:var(--accent-line); color:var(--accent); }

  /* Drop has a screen of its own: the chat only asks. */
  .drop-head[hidden]{ display:none; }
  .drop-head .col{ display:flex; align-items:flex-start; gap:14px; padding-top:22px; padding-bottom:4px; }
  .drop-head h2{ font:600 20px/1.2 var(--sans); color:var(--ink); letter-spacing:-.01em; }
  .drop-head p{ margin-top:5px; font:400 14px/1.55 var(--sans); color:var(--ink-3); max-width:56ch; }
  .drop-head .mini{ margin-left:auto; flex:none; }
  /* On a phone the screen is the log and the bar: the title stays, the line under it goes. */
  @media (max-width:520px){
    .drop-head p{ display:none; }
    .drop-head .col{ align-items:center; padding-top:14px; }
  }
  .side-acts .sa.go.on{ box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent-line); }

  /* A folder, open in the main area: its head and health, then its concepts
     on the left and the one open on the right. The bar below asks it. */
  .folder-view{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .folder-view[hidden]{ display:none; }
  .fv-h{ display:flex; align-items:flex-start; flex-wrap:wrap; gap:14px 18px; padding:20px 24px 16px; border-bottom:1px solid var(--line); }
  .fv-t{ flex:1 1 280px; min-width:0; }
  .fv-t h2{ font:700 24px/1.15 var(--sans); letter-spacing:-.02em; color:var(--ink); text-wrap:balance; }
  .fv-t p{ margin-top:5px; font:400 14px/1.45 var(--sans); color:var(--ink-3); max-width:62ch; }
  .fv-t .fv-n{ margin-top:3px; font-variant-numeric:tabular-nums; }
  .fv-hl{ display:flex; align-items:center; gap:11px; padding:8px 14px 8px 9px; text-align:left; max-width:330px;
    border:1px solid var(--line); border-radius:12px; background:var(--surface); cursor:pointer; }
  .fv-hl:hover{ border-color:var(--accent-line); }
  .fv-hl .hring{ width:40px; height:40px; margin:0; }
  .fv-hl .hring svg{ width:40px; height:40px; }
  .fv-hl b{ display:block; font:600 14px/1.25 var(--sans); color:var(--ink); }
  .fv-hl span.say{ display:block; margin-top:2px; font:400 12.5px/1.4 var(--sans); color:var(--ink-3); }
  .fv-acts{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding-top:4px; }
  .fv-b{ display:inline-flex; align-items:center; gap:7px; min-height:36px; padding:0 13px; border:1px solid var(--line-2);
    border-radius:9px; background:var(--surface); font:500 13.5px/1 var(--sans); color:var(--ink-2); cursor:pointer; }
  .fv-b:hover{ border-color:var(--accent-fill); color:var(--accent); }
  .fv-b svg{ width:15px; height:15px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .fv-x{ width:36px; padding:0; justify-content:center; font-size:18px; }
  .fv-cols{ flex:1; min-height:0; display:flex; }
  .fv-list{ width:340px; flex:none; display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line); }
  .fv-filter{ margin:12px 16px 8px; padding:9px 12px; border:1px solid var(--line-2); border-radius:9px; background:var(--surface);
    font:400 14px/1.2 var(--sans); color:var(--ink); }
  .fv-rows{ flex:1; overflow-y:auto; min-height:0; }
  .fv-row{ display:block; width:100%; text-align:left; padding:11px 20px; border-bottom:1px solid var(--line); cursor:pointer; }
  .fv-row:hover{ background:var(--surface); }
  .fv-row.on{ background:var(--surface); box-shadow:inset 3px 0 0 var(--accent-fill); }
  .fv-row b{ display:block; font:600 14.5px/1.3 var(--sans); color:var(--ink); }
  .fv-row span{ display:block; margin-top:2px; font:400 13px/1.45 var(--sans); color:var(--ink-3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fv-row small{ display:block; margin-top:4px; font:400 11px/1 var(--mono); color:var(--ink-4); font-variant-numeric:tabular-nums; }
  .fv-none{ padding:18px 20px; font:400 14px/1.5 var(--sans); color:var(--ink-3); }
  .fv-doc{ flex:1; min-width:0; overflow-y:auto; background:var(--surface); }
  .fv-in{ max-width:700px; margin:0 auto; padding:24px 36px 40px; }
  .fv-back{ display:none; margin-bottom:10px; font:500 13px/1 var(--sans); color:var(--accent); }
  .fv-eye{ font:500 11px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink-4); }
  .fv-in h1{ margin-top:8px; font:700 27px/1.15 var(--sans); letter-spacing:-.02em; color:var(--ink); text-wrap:balance; }
  .fv-pos{ margin-top:14px; font:400 15.5px/1.65 var(--sans); color:var(--ink-2); }
  .fv-in h4{ margin:22px 0 8px; font:600 13px/1 var(--sans); color:var(--ink-3); }
  .fv-ev{ display:grid; grid-template-columns:96px minmax(0,1fr); gap:4px 14px; padding:9px 0; border-top:1px solid var(--line); }
  .fv-ev time{ font:400 12px/1.6 var(--mono); color:var(--ink-4); font-variant-numeric:tabular-nums; }
  .fv-ev div{ font:400 14px/1.5 var(--sans); color:var(--ink-2); }
  .fv-ev div b{ color:var(--ink); font-weight:600; }
  .fv-li{ padding:7px 0; border-top:1px solid var(--line); font:400 14px/1.5 var(--sans); color:var(--ink-2); }
  .fv-links{ display:flex; flex-wrap:wrap; gap:6px; }
  .fv-acts2{ display:flex; align-items:center; gap:12px; margin-top:22px; }
  /* Tidy: findings as cards, each waiting for its own click. */
  .tidy .td-sub{ margin:-2px 0 10px; font:400 13.5px/1.5 var(--sans); color:var(--ink-3); }
  .td-card{ display:grid; gap:8px; padding:12px; border:1px solid var(--line); border-radius:14px; background:var(--surface);
    margin-bottom:10px; transition:opacity .35s ease, transform .35s ease, max-height .45s ease; animation:tdIn .35s ease both; }
  .td-card.done{ opacity:.55; }
  .td-card.gone{ opacity:0; transform:translateX(16px); pointer-events:none; max-height:0; padding:0; margin:0; border-width:0; overflow:hidden; }
  @keyframes tdIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  .td-opt{ display:flex; gap:10px; align-items:flex-start; padding:8px 10px; border-radius:10px; cursor:pointer; }
  .td-opt:hover{ background:var(--side); }
  .td-opt input{ margin-top:3px; accent-color:var(--accent-solid); }
  .td-opt div{ display:grid; gap:2px; min-width:0; }
  .td-opt b{ font:600 14.5px/1.35 var(--sans); color:var(--ink); }
  .td-opt span{ font:400 13.5px/1.45 var(--sans); color:var(--ink-2); }
  .td-opt small{ font:400 12px/1.3 var(--mono); color:var(--ink-4); }
  .td-acts{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:2px 10px 4px; }
  .td-go, .td-no{ min-height:34px; padding:0 14px; border-radius:999px; font:600 13px/1 var(--sans); cursor:pointer; }
  .td-go{ border:1px solid var(--accent-solid); background:var(--accent-solid); color:var(--accent-on); }
  .td-no{ border:1px solid var(--line); background:transparent; color:var(--ink-2); }
  .td-go:disabled, .td-no:disabled{ opacity:.5; cursor:default; }
  .td-all{ justify-self:start; margin:2px 10px 4px; }
  .td-say{ font:400 13px/1.4 var(--sans); color:var(--ink-3); }
  /* The graph in a concept: kinds of link, what to read first, what follows. */
  .vw-link i{ font-style:normal; margin-right:6px; padding:1px 5px; border-radius:5px; font:600 10px/1.4 var(--mono); letter-spacing:.04em; text-transform:uppercase;
    background:var(--side); color:var(--ink-3); }
  .vw-link i.lk-needs{ background:rgba(217,152,38,.14); color:#a16207; }
  .vw-link i.lk-causes{ background:rgba(124,58,237,.12); color:#6d28d9; }
  .vw-link i.lk-supports{ background:rgba(22,163,74,.12); color:#15803d; }
  .vw-link i.lk-contradicts{ background:rgba(220,38,38,.12); color:#b91c1c; }
  .vw-link i.lk-example{ background:rgba(2,132,199,.12); color:#0369a1; }
  .fv-first{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:12px; }
  .fv-first > span{ font:600 11px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-4); margin-right:4px; }
  .ins-list{ display:grid; gap:8px; }
  .ins{ display:grid; gap:6px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:linear-gradient(135deg, var(--surface), var(--side)); }
  .ins b{ font:600 14.5px/1.35 var(--sans); color:var(--ink); }
  .ins p{ font:400 14px/1.55 var(--sans); color:var(--ink-2); }
  .ins .vw-link{ justify-self:start; }
  .ins-note{ font:400 12px/1.4 var(--sans); color:var(--ink-4); }
  /* A folder's topics, above its list. */
  .fv-topics{ display:flex; gap:6px; overflow-x:auto; padding:0 16px 8px; scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent); }
  .fv-topics::-webkit-scrollbar{ display:none; }
  .fv-top{ flex:none; display:inline-flex; align-items:center; gap:6px; min-height:30px; padding:0 11px; border-radius:999px; border:1px solid var(--line-2);
    background:var(--surface); font:500 12.5px/1 var(--sans); color:var(--ink-2); cursor:pointer; white-space:nowrap; transition:background .15s ease, color .15s ease; }
  .fv-top i{ font-style:normal; font:500 11px/1 var(--mono); color:var(--ink-4); }
  .fv-top.on{ background:var(--accent-solid); border-color:var(--accent-solid); color:var(--accent-on); }
  .fv-top.on i{ color:var(--accent-on); opacity:.75; }
  .fv-topline{ margin:0 16px 8px; font:400 13px/1.45 var(--sans); color:var(--ink-3); }
  .filed .keep{ margin-left:8px; min-height:24px; padding:2px 9px; font-size:11.5px; }
  /* A personal folder's two lists: notes, and one card per person. */
  .fv-tabs{ display:flex; gap:4px; margin:12px 16px 0; padding:3px; border-radius:10px; background:var(--surface-2); }
  .fv-tabs[hidden]{ display:none; }
  .fv-tab{ flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:32px; border-radius:8px;
    font:500 13.5px/1 var(--sans); color:var(--ink-3); cursor:pointer; transition:background .2s ease, color .2s ease; }
  .fv-tab i{ font-style:normal; font:500 11px/1 var(--mono); color:var(--ink-4); }
  .fv-tab.on{ background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .fv-scan{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 16px 8px; }
  .fv-scan[hidden]{ display:none; }
  .fv-aka{ margin-top:6px; font:400 13.5px/1.45 var(--sans); color:var(--ink-3); }
  .ev-orig{ display:block; margin-top:3px; font:italic 400 13px/1.45 var(--sans); color:var(--ink-4); }
  .lang-row{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 14px; padding:6px 0; }
  .lang-row > span{ font:500 14px/1.4 var(--sans); color:var(--ink-2); }
  .lang-row .seg button{ padding:7px 12px; font:500 13px/1 var(--sans); }
  .lang-row[hidden]{ display:none; }
  .mem-run{ display:grid; gap:10px; }
  .mem-run[hidden]{ display:none; }
  .mem-track{ height:6px; border-radius:3px; background:var(--surface-3); overflow:hidden; }
  .mem-track i{ display:block; height:100%; border-radius:3px; background:var(--accent-solid); transition:width .4s var(--ease); }
  .mem-say{ font:400 14.5px/1.55 var(--sans); color:var(--ink-2); font-variant-numeric:tabular-nums; }
  .au-row{ display:flex; align-items:center; gap:10px 14px; padding:9px 0; border-top:1px solid var(--line); }
  .au-row:first-child{ border-top:0; }
  .au-t{ flex:1; min-width:0; display:grid; gap:2px; }
  .au-t b{ font:500 14px/1.35 var(--sans); color:var(--ink); }
  .au-t span{ font:400 12.5px/1.4 var(--sans); color:var(--ink-3); }
  .mini.au-due{ background:var(--accent-solid); border-color:var(--accent-solid); color:var(--accent-on); }
  .au-row.run .au-t span{ color:var(--ink-2); }
  .ts-m{ justify-self:start; padding:4px 10px; border-radius:999px; font:600 12px/1 var(--sans); background:var(--side); color:var(--ink-3); }
  .ts-m.m2{ background:color-mix(in srgb, var(--good) 14%, transparent); color:var(--good); }
  .ts-m.m0{ background:color-mix(in srgb, var(--bad) 12%, transparent); color:var(--bad); }
  .ts-m.m1{ background:var(--accent-soft); color:var(--accent); }
  /* Decisions: grouped by folder and topic, each with its suggested call. */
  .sheet.dc-sheet{ max-width:700px; }
  .dc-top{ display:flex; align-items:center; flex-wrap:wrap; gap:8px 12px; margin-top:12px; }
  .dc-top .go{ min-height:38px; padding:0 18px; }
  .dc-top .ghost{ min-height:38px; padding:0 16px; }
  .dc-state{ font:400 13px/1.4 var(--sans); color:var(--ink-3); }
  .dc-g{ padding:6px 0 10px; }
  .dc-g + .dc-g{ border-top:1px solid var(--line); padding-top:14px; }
  .dc-g h4{ margin:0 0 8px; font:600 11.5px/1.3 var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); }
  .dc-row{ display:grid; gap:5px; padding:11px 0 13px; border-top:1px solid var(--line); }
  .dc-g h4 + .dc-row{ border-top:0; padding-top:2px; }
  .dc-head{ display:flex; align-items:baseline; gap:8px; min-width:0; }
  .dc-tag{ flex:none; font:500 10.5px/1 var(--mono); letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); padding:4px 6px; border-radius:6px; background:var(--side); }
  .dc-row[data-kind="clash"] .dc-tag{ color:var(--bad); }
  .dc-t{ font:600 14.5px/1.35 var(--sans); color:var(--ink); overflow-wrap:anywhere; }
  .dc-l{ font:400 13.5px/1.5 var(--sans); color:var(--ink-2); padding-left:10px; border-left:2px solid var(--line-2); overflow-wrap:anywhere; }
  .dc-hint{ font:400 13.5px/1.5 var(--sans); color:var(--ink-3); }
  .dc-hint b{ font-weight:600; color:var(--accent); }
  .dc-msg{ font:400 13px/1.4 var(--sans); color:var(--ink-3); }
  .dc-msg:empty{ display:none; }
  .dc-msg.bad{ color:var(--bad); }
  .dc-acts{ display:flex; flex-wrap:wrap; gap:6px; margin-top:3px; }
  .dc-acts button{ min-height:34px; padding:0 14px; font-size:13.5px; }
  .dc-done{ font:400 13.5px/1.5 var(--sans); color:var(--good); padding:3px 0; }
  /* The cards of a "same person" call, side by side, so the call is made by looking. */
  .dc-who{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:10px; margin:6px 0 4px; }
  .dc-p{ min-width:0; display:flex; flex-direction:column; gap:4px; padding:11px 12px 12px; border:1px solid var(--line-2); border-radius:11px; background:var(--surface-2); }
  .dc-ph{ display:flex; align-items:baseline; flex-wrap:wrap; gap:2px 8px; }
  .dc-ph b{ min-width:0; font:600 14.5px/1.3 var(--sans); color:var(--ink); overflow-wrap:anywhere; }
  .dc-keep{ font:500 10px/1 var(--mono); letter-spacing:.05em; text-transform:uppercase; color:var(--accent); }
  .dc-open{ margin-left:auto; min-height:32px; padding:0 4px; font:500 12.5px/1 var(--sans); color:var(--ink-4); cursor:pointer; }
  .dc-open:hover{ color:var(--accent); }
  .dc-pm{ font:400 12.5px/1.4 var(--sans); color:var(--ink-4); font-variant-numeric:tabular-nums; }
  .dc-pa{ font:400 12.5px/1.4 var(--sans); color:var(--ink-3); overflow-wrap:anywhere; }
  .dc-pl{ font:500 13.5px/1.45 var(--sans); color:var(--ink-2); overflow-wrap:anywhere; }
  .dc-ps{ font:400 13px/1.5 var(--sans); color:var(--ink-3); overflow-wrap:anywhere; }
  .dc-pf{ display:grid; gap:2px; margin:2px 0 0; padding:0; list-style:none; font:400 13px/1.45 var(--sans); color:var(--ink-2); overflow-wrap:anywhere; }
  .dc-pf li span{ color:var(--ink-4); }
  .dc-pmo{ padding-left:8px; border-left:2px solid var(--line-2); font:400 12.5px/1.45 var(--sans); color:var(--ink-3); overflow-wrap:anywhere; }
  .dc-pw{ font:400 12.5px/1.4 var(--sans); color:var(--ink-4); }
  @media (max-width:560px){ .dc-open{ min-height:40px; } }
  .dk-hint{ margin-top:10px; font:500 13.5px/1.45 var(--sans); color:var(--accent); }
  /* A running audit: the turning mark, the step, a bar when the count is known, the time it has run. */
  .au-load{ display:grid; gap:10px; margin-top:18px; padding:14px 16px; border-radius:14px; background:var(--side); }
  .au-top{ display:flex; align-items:center; gap:10px; min-width:0; }
  .au-step{ flex:1; min-width:0; font:500 14.5px/1.45 var(--sans); color:var(--ink-2); font-variant-numeric:tabular-nums; }
  .au-time{ flex:none; font:400 12px/1 var(--mono); color:var(--ink-4); font-variant-numeric:tabular-nums; }
  .au-fin{ display:flex; align-items:center; gap:8px; margin-top:14px; font:500 13.5px/1.4 var(--sans); color:var(--good); }
  .au-fin::before{ content:""; flex:none; width:8px; height:8px; border-radius:50%; background:currentColor; }
  .au-fin.bad{ color:var(--bad); }
  .lang-row.ask{ margin:0 -10px; padding:8px 10px; border-radius:10px; background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent-line); }
  .seg.seg-wrap{ flex-wrap:wrap; }
  /* A person's file: the summary, then what is open, facts, their people and the history. */
  .pf-meta{ margin-top:6px; font:500 12px/1.4 var(--mono); color:var(--ink-4); }
  .pf-open{ margin-top:18px; padding:12px 14px; border-radius:12px; background:var(--side); }
  .pf-open h4{ margin-top:0; }
  .pf-orow{ display:flex; align-items:center; gap:10px; padding:5px 0; font:400 14.5px/1.45 var(--sans); color:var(--ink); }
  .pf-orow span{ flex:1; min-width:0; }
  .pf-orow time{ font:400 11.5px/1 var(--mono); color:var(--ink-4); white-space:nowrap; }
  .pf-tick{ flex:none; width:18px; height:18px; border:1.5px solid var(--ink-4); border-radius:5px; background:var(--surface); cursor:pointer; }
  .pf-tick:hover{ border-color:var(--accent-solid); background:var(--accent-soft); }
  .pf-sec{ margin-top:4px; }
  .pf-fact{ position:relative; display:grid; grid-template-columns:minmax(0,150px) minmax(0,1fr) 22px; gap:4px 14px; align-items:baseline; padding:7px 0; border-top:1px solid var(--line); }
  .pf-fact:first-of-type{ border-top:0; }
  .pf-l{ font:500 13px/1.4 var(--sans); color:var(--ink-3); }
  .pf-v{ font:400 14.5px/1.5 var(--sans); color:var(--ink); overflow-wrap:anywhere; }
  .pf-was{ grid-column:2 / 3; font:400 12.5px/1.45 var(--sans); color:var(--ink-4); }
  .pf-fact.gone .pf-v{ color:var(--ink-4); }
  .pf-x{ width:22px; height:22px; border-radius:6px; font:400 15px/1 var(--sans); color:var(--ink-4); opacity:0; cursor:pointer; transition:opacity .15s ease; }
  .pf-fact:hover .pf-x, .pf-ev:hover .pf-x, .pf-x:focus-visible{ opacity:1; }
  .pf-x:hover{ background:var(--surface-2); color:var(--bad); }
