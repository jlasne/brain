<meta charset="utf-8">
<title>Octopus and Squidgy</title>
<meta name="description" content="Two knowledge bases, one door each. A passphrase opens one of them.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="icon" href="/brand/logo-mark.png">
<link rel="stylesheet" href="/octopus.css">

<script>window.OCTOPUS_API = "https://uncommon-wolf-174.eu-west-1.convex.site";</script>

<style>
  /* ======================================================================
     THE TWO COLOURS

     One block, five values per door. Swap them and both doors, both buttons
     and both focus rings follow, because nothing below names a colour directly.

       --tint       the brand colour: the rule under the name, the focus ring
       --tint-btn   the button, which carries a label, so it has to reach 4.5:1
                    against --tint-on
       --tint-deep  the button on hover
       --tint-on    the button label
       --tint-wash  the panel behind the door

     Squidgy is brown #A8704E and pink #F5C9D1. White on the brown reads at
     4.12:1, under the 4.5:1 a 15px label needs, so its button runs 7% darker at
     #9c6849 (4.68:1) and the brand brown carries everything that holds no text.
     ====================================================================== */
  .door.octopus{
    --tint:#d97757; --tint-btn:#d97757; --tint-deep:#bf5a3c; --tint-on:#ffffff;
    --tint-wash:rgba(217,119,87,.07);
  }
  .door.squidgy{
    --tint:#A8704E; --tint-btn:#9c6849; --tint-deep:#8b5d41; --tint-on:#ffffff;
    --tint-wash:rgba(245,201,209,.42);
  }
  @media (prefers-color-scheme:dark){
    .door.octopus{ --tint:#e79173; --tint-btn:#e79173; --tint-deep:#d97757; --tint-on:#1a1a18; --tint-wash:rgba(217,119,87,.10); }
    .door.squidgy{ --tint:#C48A66; --tint-btn:#C48A66; --tint-deep:#D09A77; --tint-on:#1a1a18; --tint-wash:rgba(245,201,209,.08); }
  }

  /* ---------------------------------------------------------------- frame */
  main.doors{
    flex:1; padding:0; display:grid; grid-template-columns:1fr 1fr;
    align-items:stretch;
  }
  /* A deep link shows one door, so /squidgy is a door rather than a choice.
     Centred, because a single column against a whole screen reads adrift. */
  main.doors.one{ grid-template-columns:1fr; }
  main.doors.one .door{ align-items:center; }

  .door{
    background:var(--tint-wash);
    display:flex; flex-direction:column; justify-content:center; align-items:flex-start;
    padding:clamp(30px,5vw,68px); transition:background .2s var(--ease);
  }
  .door + .door{ border-left:1px solid var(--line); }
  .door:focus-within{ background:color-mix(in srgb, var(--tint) 11%, transparent); }
  .door > *{ width:100%; max-width:340px; }

  /* Both marks sit straight on the panel. Each file is transparent around its
     animal, and a tile in the brand colour behind an animal in the same colour
     left the octopus orange on orange. Both run 56 pixels tall so the doors line
     up; the dachshund runs at its own length. */
  .mk{ display:block; height:56px; margin-bottom:20px; color:var(--tint); }
  .mk img{ height:56px; width:auto; display:block; }
  .mk b{ font:600 40px/56px var(--sans); letter-spacing:-.02em; }

  .door h1{
    font-size:clamp(27px,3.3vw,36px); line-height:1.04; letter-spacing:-.032em;
    font-weight:600; color:var(--ink);
  }
  .door h1::after{
    content:""; display:block; width:34px; height:2px; background:var(--tint);
    margin-top:14px;
  }
  .door .one{ margin-top:14px; font-size:15px; line-height:1.55; color:var(--ink-2); }
  .door .tally{
    margin-top:7px; font:400 12px/1.6 var(--mono); color:var(--ink-4); min-height:1.6em;
  }

  .door label{
    display:block; margin:26px 0 7px;
    font:500 12.5px/1 var(--sans); color:var(--ink-3);
  }
  .door input{
    width:100%; border:1px solid var(--line-2); border-radius:10px;
    background:var(--surface); padding:12px 14px;
    font:400 15px/1.4 var(--sans); color:var(--ink);
    transition:border-color .15s var(--ease);
  }
  .door input:focus{ border-color:var(--tint); outline:none; }
  .door .go{
    margin-top:12px; width:100%; border-radius:10px; padding:12px 16px;
    background:var(--tint-btn); color:var(--tint-on);
    font:500 15px/1 var(--sans); text-align:center;
    transition:background .15s var(--ease);
  }
  .door .go:hover{ background:var(--tint-deep); }
  .door .go:disabled{ opacity:.55; cursor:default; }
  .door .msg{
    margin-top:11px; font:400 13px/1.5 var(--sans); color:var(--tint); min-height:1.5em;
  }
  .door .msg.set{ color:var(--ink-3); }

  footer.bot .wrap{
    max-width:none; justify-content:space-between; gap:14px; flex-wrap:wrap; font-size:12.5px;
  }

  @media (max-width:760px){
    main.doors{ grid-template-columns:1fr; }
    .door + .door{ border-left:none; border-top:1px solid var(--line); }
    .door{ padding-block:44px; }
    .door > *{ max-width:none; }
  }
</style>

<main class="doors" id="doors">

  <form class="door octopus" id="dOctopus">
    <span class="mk" aria-hidden="true">
      <img id="imgOctopus" src="/brand/octopus-door.png" alt="" width="75" height="56">
      <b id="letterOctopus" hidden>O</b>
    </span>
    <h1>Octopus</h1>
    <p class="one">One brain per subject. Each holds a position, the evidence under it,
      and a date on every claim.</p>
    <p class="tally" id="tallyOctopus"></p>
    <label for="passOctopus">Passphrase</label>
    <input type="password" id="passOctopus" autocomplete="current-password" spellcheck="false">
    <button type="submit" class="go" id="goOctopus">Enter</button>
    <p class="msg" id="msgOctopus" role="alert"></p>
  </form>

  <form class="door squidgy" id="dSquidgy">
    <span class="mk" aria-hidden="true">
      <!-- The whole dog, cut from brand/squidgy-logo.png. The letter below
           only shows if the file fails to load. -->
      <img id="imgSquidgy" src="/brand/squidgy-mark.png" alt="" width="89" height="56">
      <b id="letterSquidgy" hidden>S</b>
    </span>
    <h1>Squidgy</h1>
    <p class="one">One brain, no subjects to split. Every source lands in the same
      place, and it gets bigger each time.</p>
    <p class="tally" id="tallySquidgy"></p>
    <label for="passSquidgy">Passphrase</label>
    <input type="password" id="passSquidgy" autocomplete="current-password" spellcheck="false">
    <button type="submit" class="go" id="goSquidgy">Enter</button>
    <p class="msg" id="msgSquidgy" role="alert"></p>
  </form>

</main>

<footer class="bot"><div class="wrap">
  <span style="margin:0">MIT licensed &middot; <a href="https://github.com/jlasne/brain">jlasne/brain</a></span>
  <span><a href="/about">How it works</a></span>
</div></footer>

<script>
  /**
   * The door.
   *
   * Two spaces share one deployment and see none of each other. The passphrase
   * decides which one the session reads, so this page is the whole sign-in: it
   * takes a passphrase, gets a token back, and hands the app a session already
   * pointed at one space.
   *
   * The token lives in sessionStorage, which is per tab, so closing the tab ends
   * the session and a second tab starts here again.
   */
  const API = window.OCTOPUS_API;
  const TOKEN_KEY = "octopus.token.v1";
  const $ = id => document.getElementById(id);
  const SPACES = ["octopus", "squidgy"];

  /* One capitalisation, so an id in the markup and a name in a message agree. */
  const nameOf = s => s === "squidgy" ? "Squidgy" : "Octopus";

  const post = async (path, body) => {
    let r;
    try {
      r = await fetch(API + path, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
    } catch {
      /* fetch throws before any status when the deployment is unreachable, and
         its own message names the browser rather than the problem. */
      throw new Error("the server did not answer. Check your connection.");
    }
    const d = await r.json().catch(() => ({ error: "the server sent something unreadable" }));
    if (d.error) throw new Error(d.error);
    return d;
  };

  /* A mark with no file yet falls back to its letter, so the door still reads. */
  function markFallback(space){
    const img = $("img" + nameOf(space)), letter = $("letter" + nameOf(space));
    const swap = () => { img.hidden = true; letter.hidden = false; };
    img.onerror = swap;
    /* A cached failure fires no event, so the natural size settles it. */
    if (img.complete && !img.naturalWidth) swap();
  }

  /**
   * One door, wired.
   *
   * A space with no passphrase takes the first one offered, which is how Octopus
   * was opened. The button says so, because setting a passphrase and entering
   * with one are different acts.
   */
  function wire(space){
    const form = $("d" + nameOf(space));
    const field = $("pass" + nameOf(space));
    const btn = $("go" + nameOf(space));
    const msg = $("msg" + nameOf(space));

    form.addEventListener("submit", async ev => {
      ev.preventDefault();
      const pass = field.value;
      msg.classList.remove("set");
      if (pass.length < 8) {
        msg.textContent = "a passphrase runs 8 characters or more";
        field.focus();
        return;
      }
      btn.disabled = true;
      msg.textContent = "Checking";
      try {
        const r = await post("/api/unlock", { space, pass });
        sessionStorage.setItem(TOKEN_KEY, r.token);
        msg.textContent = r.created ? "Passphrase set. Opening" : "Opening";
        location.assign("/chat");
      } catch (e) {
        btn.disabled = false;
        field.value = ""; field.focus();
        msg.textContent = e.message;
      }
    });
  }

  /** Which door a path asks for, or null for the choice. */
  function asked(){
    const p = location.pathname.replace(/\/+$/, "").split("/").pop().toLowerCase();
    return SPACES.includes(p) ? p : null;
  }

  /* One door on a deep link, both on the landing. The tab takes that door's
     name and icon, so /squidgy reads as Squidgy from the tab bar too. */
  function focusOne(space){
    if (!space) return;
    $("doors").classList.add("one");
    for (const s of SPACES) if (s !== space) $("d" + nameOf(s)).hidden = true;
    document.title = nameOf(space);
    if (space === "squidgy") {
      const icon = document.querySelector('link[rel="icon"]');
      if (icon) icon.href = "/brand/squidgy-icon.png";
    }
  }

  /**
   * Octopus publishes its brain list, so its line carries the real counts.
   * Squidgy publishes nothing, so it shows nothing rather than a guess.
   */
  async function paintTally(){
    try {
      const r = await fetch(API + "/api/public/brains");
      if (!r.ok) return;
      const d = await r.json();
      const brains = d.brains || [];
      if (!brains.length) return;
      const sources = brains.reduce((n, b) => n + (b.sources || 0), 0);
      $("tallyOctopus").textContent =
        brains.length + " brains · " + (d.concepts || []).length + " ideas · " + sources + " sources read";
    } catch {}
  }

  /** A door with no passphrase yet says the first one typed sets it. */
  async function paintDoors(){
    try {
      const st = await post("/api/status");
      /* Only an explicit false claims a door is unset. A deployment that has not
         picked up this code yet sends no gates at all, and a wrong "no
         passphrase yet" would invite someone to set one that already exists. */
      const gates = st.gates || {};
      for (const s of SPACES) {
        if (gates[s] !== false) continue;
        $("msg" + nameOf(s)).classList.add("set");
        $("msg" + nameOf(s)).textContent = "No passphrase yet. The first one typed becomes it.";
        $("go" + nameOf(s)).textContent = "Set it and enter";
      }
    } catch (e) {
      for (const s of SPACES) $("msg" + nameOf(s)).textContent = e.message;
    }
  }

  /**
   * Every door part exists.
   *
   * The ids are built by joining a prefix to a space name, so the page checker
   * cannot see which ones are asked for. A renamed id would leave a dead button
   * and no error. This says so instead, on the door itself.
   */
  function missing(){
    const want = ["d", "img", "letter", "pass", "go", "msg"];
    const gone = [];
    for (const s of SPACES) for (const w of want) if (!$(w + nameOf(s))) gone.push(w + nameOf(s));
    return gone;
  }

  (() => {
    const gone = missing();
    if (gone.length) {
      document.getElementById("doors").innerHTML =
        "<p style=\"padding:40px\">This page is missing " + gone.join(", ") + ".</p>";
      return;
    }
    for (const s of SPACES) { markFallback(s); wire(s); }
    const one = asked();
    focusOne(one);
    paintDoors();
    paintTally();
    setTimeout(() => $("pass" + nameOf(one || "octopus")).focus(), 40);
  })();
</script>
